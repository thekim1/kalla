# Renderer spike (A-9, to-verify #29). Throwaway. See README.md.
#
# render  (internal): renderer, lightpanda, spike         -- the browser reaches only the spike ("worker")
# fixture (internal): fixture, spike                      -- the fixture sites, reachable only by the spike's guarded fetch
# Subnets 10.213.0.0/26 and 10.213.0.64/26 (172.30.0.0/16 is taken on the dev machine).
name: rag-renderer-spike

networks:
  render:
    internal: true
    ipam:
      config:
        - subnet: 10.213.0.0/26
  fixture:
    internal: true
    ipam:
      config:
        - subnet: 10.213.0.64/26

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  init: true

services:
  renderer:
    <<: *hardened
    build: renderer
    image: rag-renderer-spike:1.64.1
    user: "10002:10002"
    security_opt:
      - no-new-privileges:true
      - seccomp=${RENDER_SECCOMP:-./seccomp/chrome-sandbox.json}
    tmpfs:
      - /tmp:size=512m
    environment:
      RENDER_TOKEN: ${RENDER_TOKEN:-spike-7f3c9a}
      RENDER_MODE: ${RENDER_MODE:-run-server}
      RENDER_UNSAFE: ${RENDER_UNSAFE:-true}
      RENDER_SANDBOX: ${RENDER_SANDBOX:-true}
    mem_limit: 2g
    cpus: 2
    pids_limit: 512
    networks:
      render:
        ipv4_address: 10.213.0.10

  lightpanda:
    <<: *hardened
    profiles: [lightpanda]
    image: lightpanda/browser:1.0.3@sha256:d901cf2374b8372935f690da1db896b8c1d5317022d462fdceeaf4813e8be724
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    command: ["/bin/lightpanda", "serve", "--host", "0.0.0.0", "--port", "9222", "--advertise-host", "lightpanda", "--log_level", "warn"]
    networks:
      render:
        ipv4_address: 10.213.0.11

  fixture:
    <<: *hardened
    build: fixture
    image: rag-renderer-spike-fixture:1
    security_opt:
      - no-new-privileges:true
    environment:
      LATENCY_MS: ${FIXTURE_LATENCY_MS:-100}
    networks:
      fixture:
        ipv4_address: 10.213.0.70
        aliases: [site.test, api.test, cdn.test, tracker.test]

  # The "worker": the published spike on the worker's base image (chiseled, no shell), on both networks.
  spike:
    <<: *hardened
    profiles: [run]
    image: mcr.microsoft.com/dotnet/aspnet:10.0.13-noble-chiseled-extra@sha256:3ed6558056b54d5c9dfefb7ff473728e022ff2bf1d976cbf8ee07b05ec594374
    user: "1654:1654"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=256m
    working_dir: /app
    entrypoint: ["dotnet", "/app/RendererSpike.dll"]
    environment:
      RENDER_ENDPOINT: ws://renderer:3000/${RENDER_TOKEN:-spike-7f3c9a}
      LIGHTPANDA_ENDPOINT: ws://lightpanda:9222/
      SPIKE_ALLOWED_RANGES: 10.213.0.64/26
      HOME: /tmp
    volumes:
      - ./out:/app:ro
      - ./results:/results
    networks:
      render:
        ipv4_address: 10.213.0.20
      fixture:
        ipv4_address: 10.213.0.80
