# nginx for the R1 page copy (repo-and-deployment §8.3): static files only, the way a municipal web server answers a
# crawler (Last-Modified and ETag from the files, gzip for HTML), access log on so the crawl can be followed.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    gzip on;
    gzip_types text/html application/xml text/plain;
    access_log /dev/stdout;
    location / {
        try_files $uri $uri/index.html =404;
    }
}
