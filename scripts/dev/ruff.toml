# Lint for the dev scripts, the parser's rules (src/parser/pyproject.toml) and its pinned ruff:
#   uvx ruff@0.17.2 check scripts/dev && uvx ruff@0.17.2 format --check scripts/dev
line-length = 120
target-version = "py312"

[lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[lint.isort]
known-first-party = ["seed_url_list"]
