#   uvx ruff@0.17.2 check scripts/audit && uvx ruff@0.17.2 format --check scripts/audit
line-length = 120
target-version = "py312"

[lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[lint.isort]
known-first-party = ["audit"]
