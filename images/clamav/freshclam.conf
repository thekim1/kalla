# freshclam for the ClamAV image (plans/platform/repo-and-deployment.md §5.5). Replaces the image's
# /etc/clamav/freshclam.conf; anything not set here keeps freshclam's default. Decided: no internal mirror, signatures
# come straight from database.clamav.net into the /var/lib/clamav volume.
# Checks per day: FRESHCLAM_CHECKS in the Dockerfile. /init-unprivileged always starts the daemon with
# --checks=${FRESHCLAM_CHECKS:-1}, which overrides a Checks line here.

DatabaseDirectory /var/lib/clamav
DatabaseMirror database.clamav.net

# After an update, clamd (through the socket in this file) reloads the new signatures.
NotifyClamd /etc/clamav/clamd.conf

# "no" for the 16 GB pilot host (mem_limit 1.5g, §6.2): test-loading a downloaded update took the container from
# 1.15 GiB to 1.9 GiB next to the running clamd (measured, ClamAV 1.4.5). The digital signature of a downloaded CVD is
# still checked. The cost: an update that verifies but does not load is caught only by clamd's reload, which with
# ConcurrentDatabaseReload no leaves clamd without an engine (every scan ERROR, fail closed, health check unhealthy)
# until it is restarted on good signatures. A 24 GB host (mem_limit 3g) mounts a copy of this file with "yes", next to
# clamd.conf with ConcurrentDatabaseReload yes.
TestDatabases no
