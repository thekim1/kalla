# clamd for the worker's malware scan (plans/platform/repo-and-deployment.md §5.5; the client's side is
# plans/ingestion-worker/design-connectors.md §11). Replaces the image's /etc/clamav/clamd.conf; anything not set here
# keeps clamd's default. clamd runs in the foreground under /init-unprivileged as the image's clamav user and logs to
# stdout. It writes only to /tmp (socket, scan temporaries) and reads /var/lib/clamav, so the root file system can be
# read-only.

DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp

# /init-unprivileged waits for this socket before it reports clamd as started; the health check (clamdscan --ping)
# uses it too.
LocalSocket /tmp/clamd.sock

# The worker's INSTREAM port. No TCPAddr, so clamd listens on every interface of the container; clamd has no TLS or
# authentication, so the network keeps it host-local (connectors design §11), never a published port.
TCPSocket 3310

# Uploads are at most 50 MB. A longer stream is refused with "INSTREAM size limit exceeded. ERROR".
StreamMaxLength 60M
MaxFileSize 60M
MaxScanSize 200M
# A file or archive member over MaxFileSize, MaxScanSize or MaxRecursion is reported as
# "Heuristics.Limits.Exceeded.<limit> FOUND" instead of an unscanned "OK": a limit is never "clean" (connectors §11).
AlertExceedsMax yes

# "no" for the 16 GB pilot host (mem_limit 1.5g, §6.2): a reload blocks scans for its duration instead of holding a
# second engine in memory. A 24 GB host (mem_limit 3g) mounts a copy of this file with "yes".
ConcurrentDatabaseReload no
