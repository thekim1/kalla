name: Release
# Push a tag vX.Y.Z (or vX.Y.Z-pre) to release (plans/platform/repo-and-deployment.md §7.2, §8.1; as the gateway's):
#   1. verify.yml and parser.yml run in full, beside build (2-3); e2e.yml (called) only when asked, after build: the
#      repository variable RELEASE_E2E is 'true' for a tag push, or the dry run's input e2e is ticked (Decisions "E2E
#      optional on release");
#   2. every image is pushed to ghcr.io/<owner>/kalla/<service>:X.Y.Z (and :latest unless X.Y.Z is a pre-release):
#      api, admin (with the admin UI), worker and migrations by `dotnet publish -t:PublishContainer`, postgres, clamav,
#      renderer and parser from their Dockerfiles; an SPDX SBOM per image (Microsoft.Sbom.DotNetTool for the .NET
#      services, Syft for the other four);
#   3. deploy/build-release-bundle.sh pins the bundle's Compose defaults and the Portainer stack to those digests;
#      deploy/tests/release-smoke.sh boots the bundle and runs the smoke test, and deploy/tests/portainer-boot.sh
#      boots the Portainer stack (the gateway from the release it pins, the profiles clamav, openwebui and proxy;
#      kalla-admin without a client secret, so its setup wizard opens and is checked up to a setup session);
#   4. once 1-3 are green: :latest moves to the images (not for a pre-release), a GitHub release is created with the
#      bundle, the Portainer stack, the SBOMs and SHA256SUMS, and a pull request pins deploy/portainer/ to the release's
#      images (not for a pre-release).
# build doesn't wait for verify and parser (about 8 minutes on both runners): a red test stops publish, so only the
# version's images (never :latest) can reach ghcr.io from a commit whose tests fail, as when a boot test fails.
# A release starts with a dry run (Decisions "CI on the self-hosted runner", #1084): the gate job finds a green dry run
# of the tag's commit, and then verify and parser are skipped, and e2e too when that dry run ran it. The images are
# still built, boot-tested and published. Without such a dry run everything runs (scripts/ci/release-gate.sh).
# A manual run (workflow_dispatch) is a dry run of 1-3: the images go to a registry inside the job (localhost:5000), so
# nothing reaches ghcr.io and no release or tag is created.
# A manual run with the input portainer_boot (X.Y.Z) runs only deploy/tests/portainer-boot.sh, in minutes: this ref's
# compose.portainer.yaml pinned to that version's images already on ghcr.io (a tag run pushes them before its boot
# tests), so a fix to the stack file or the boot test is tested without building anything (handbook, "Release dry runs").
# With portainer_upgrade_from (X.Y.Z) beside it, the run does deploy/tests/portainer-upgrade-boot.sh instead: that
# release's stack is booted with its variables and this ref's stack file applied over it.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for the dry run (X.Y.Z or X.Y.Z-pre); nothing is pushed or released
        type: string
        default: 0.0.0-dryrun
      e2e:
        description: Run the browser tests (e2e.yml) first; they take about 10 minutes and load the runner
        type: boolean
        default: false
      portainer_boot:
        description: Only boot the Portainer stack against this version's images on ghcr.io (X.Y.Z); skips everything else
        type: string
        default: ''
      portainer_upgrade_from:
        description: With portainer_boot, boot this earlier release's stack first (X.Y.Z) and upgrade it, instead of a first boot
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  # Both self-hosted runners share one machine and user: MSBuild's reused worker nodes and build servers would be shared
  # between concurrent jobs, and the runner's end-of-job cleanup kills them under the other job (MSB4166).
  MSBUILDDISABLENODEREUSE: "1"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  UseSharedCompilation: "false"
  # Syft for the non-.NET images' SBOMs (to-verify #91): v1.55.0 (2026-10-19), sha256 of syft_1.55.0_linux_amd64.tar.gz
  # from the release's syft_1.55.0_checksums.txt.
  SYFT_VERSION: 1.55.0
  SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
  # GitHub CLI for the publish job (the self-hosted runner has none): v2.103.3 (2026-10-26), sha256 of
  # gh_2.103.3_linux_amd64.tar.gz from the release's gh_2.103.3_checksums.txt.
  GH_CLI_VERSION: 2.103.3
  GH_CLI_SHA256: 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
  # Microsoft.Sbom.DotNetTool 4.1.13 (NuGet, 2026-09-22), the gateway's.
  SBOM_TOOL: Microsoft.Sbom.DotNetTool@4.1.13
  # The oldest release an upgrade in one step is tested from (deploy/tests/portainer-upgrade-boot.sh). 0.6.0: v0.5.1's
  # stack asset pins an admin image digest ghcr.io no longer has, and 0.5.0's asset does not pin the gateway's images.
  UPGRADE_FROM: 0.6.0
  # The dry run's registry: distribution 3.1.1 (Docker Hub image pushed 2026-09-21).
  DRY_RUN_REGISTRY_IMAGE: registry:3.1.1@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
jobs:
  gate:
    # Whether this tag's commit has a green dry run (header). Seconds; false for anything but a tag push.
    runs-on: [self-hosted, linux, x64]
    permissions:
      actions: read
    outputs:
      skip_tests: ${{ steps.gate.outputs.skip_tests }}
      skip_e2e: ${{ steps.gate.outputs.skip_e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/release-gate.sh

  verify:
    needs: gate
    if: inputs.portainer_boot == '' && needs.gate.outputs.skip_tests != 'true'
    uses: ./.github/workflows/verify.yml
    with:
      # verify's renderer job leaves out the worker image's Playwright driver check: build runs it on the pushed image.
      release: true

  parser:
    needs: gate
    if: inputs.portainer_boot == '' && needs.gate.outputs.skip_tests != 'true'
    uses: ./.github/workflows/parser.yml

  portainer-boot:
    # Only with the input portainer_boot (header). verify, parser, e2e and build are skipped, so publish is too.
    if: github.event_name == 'workflow_dispatch' && inputs.portainer_boot != ''
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A Docker client config of this job's own
        # As in build: the login below must not outlive the job in the runner user's shared ~/.docker/config.json.
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: The stack pinned to the version's images
        # images.env as build writes it (each image by digest), then the pins build-release-bundle.sh applies to the
        # release's compose.portainer.yaml asset.
        env:
          VERSION: ${{ inputs.portainer_boot }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$VERSION' is not X.Y.Z[-pre]"; exit 1; }
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kalla"
          : > images.env
          for name in api admin worker migrations postgres clamav renderer parser; do
            ref="$prefix/$name:$VERSION"
            digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)" || true
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no image $ref on ghcr.io"; exit 1; }
            echo "KALLA_${name^^}_IMAGE=$ref@$digest" | tee -a images.env
          done
          mkdir -p dist
          sed 's/\r$//' deploy/portainer/compose.portainer.yaml > dist/compose.portainer.yaml
          while IFS='=' read -r var ref; do
            grep -qF "\${${var}:-" dist/compose.portainer.yaml || { echo "::error::$var is not used in the stack"; exit 1; }
            sed -i -E "s#\\\$\\{${var}:-[^}]*\\}#\${${var}:-${ref}}#g" dist/compose.portainer.yaml
          done < images.env
          grep -oE 'kalla/[a-z]+:[^@]+@sha256:[0-9a-f]{12}' dist/compose.portainer.yaml | sort -u
      - name: Boot the Portainer stack
        if: inputs.portainer_upgrade_from == ''
        env:
          VERSION: ${{ inputs.portainer_boot }}
        run: bash deploy/tests/portainer-boot.sh dist/compose.portainer.yaml --version "$VERSION"
      - name: Upgrade an earlier release's Portainer stack
        # No --expect-fenced: the images of a published version may predate the migrator's fence (data-model §10).
        if: inputs.portainer_upgrade_from != ''
        env:
          VERSION: ${{ inputs.portainer_boot }}
          FROM: ${{ inputs.portainer_upgrade_from }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$FROM" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::'$FROM' is not X.Y.Z"; exit 1; }
          bash scripts/ci/release-asset.sh "v$FROM" compose.portainer.yaml "dist/from-$FROM/compose.portainer.yaml"
          # Before 0.9.0, the upgrade is 0.9.0's steps (the upgrade job below).
          rename=(); [ "$(printf '%s\n' "$FROM" 0.9.0 | sort -V | head -n1)" = 0.9.0 ] || rename=(--rename-0.9)
          bash deploy/tests/portainer-upgrade-boot.sh "dist/from-$FROM/compose.portainer.yaml" dist/compose.portainer.yaml \
            --from-env "deploy/tests/fixtures/stack-$FROM.env" --version "$VERSION" ${rename[@]+"${rename[@]}"}

  e2e:
    # Optional (Decisions "E2E optional on release (user, 2026-11-06)"): a tag push runs them when the repository
    # variable RELEASE_E2E is 'true', a dry run when its e2e input is ticked. Skipped otherwise; a failed run still stops
    # the release. After verify, parser and build, never beside them: both runners share one machine, and with verify's
    # backend and renderer jobs running next to it the browser's requests to the admin UI failed (run 42469437132; alone,
    # run 42471519711 passed on the same commit).
    # verify and parser are skipped when the gate found a green dry run, and e2e too when that dry run ran it.
    needs: [gate, verify, parser, build]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      ((github.event_name == 'push' && vars.RELEASE_E2E == 'true' && needs.gate.outputs.skip_e2e != 'true') ||
       (github.event_name == 'workflow_dispatch' && inputs.e2e)) &&
      (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && needs.gate.outputs.skip_tests == 'true')) &&
      (needs.parser.result == 'success' || (needs.parser.result == 'skipped' && needs.gate.outputs.skip_tests == 'true'))
    uses: ./.github/workflows/e2e.yml

  build:
    # Images, SBOMs, bundle and smoke test in one job: the dry run's registry lives only as long as the job. Beside
    # verify and parser, not after them (header); publish waits for all three.
    if: inputs.portainer_boot == ''
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A Docker client config of this job's own
        # The runners share one user's ~/.docker/config.json, where a tag release's `docker login ghcr.io` used to leave
        # its GITHUB_TOKEN behind. Once expired, buildx still sent it for ghcr.io and the dry run of 0.4.0 failed pulling
        # the public ghcr.io/astral-sh/uv ("failed to fetch oauth token: denied"). A config in RUNNER_TEMP is this
        # job's alone and goes with it, so a login never outlives the job; anonymous pulls stay anonymous.
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - name: Resolve version and registry
        id: version
        env:
          DRY_RUN_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            registry_host=ghcr.io; repository="${GITHUB_REPOSITORY_OWNER,,}/kalla"
          else
            version="$DRY_RUN_VERSION"
            registry_host=localhost:5000; repository=kalla
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$version' is not X.Y.Z[-pre]"; exit 1; }
          { echo "version=$version"; echo "registry_host=$registry_host"; echo "repository=$repository"; } \
            | tee -a "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Start the dry run's registry
        if: github.event_name != 'push'
        # Both runners share one Docker daemon: remove a registry an earlier, cancelled or failed dry run left behind.
        run: |
          docker rm -f kalla-dryrun-registry >/dev/null 2>&1 || true
          # Before this step had a cleanup the container was called "registry": remove it only if it runs our image.
          if [ "$(docker inspect -f '{{.Config.Image}}' registry 2>/dev/null)" = "$DRY_RUN_REGISTRY_IMAGE" ]; then docker rm -f registry; fi
          docker run -d --name kalla-dryrun-registry -p 127.0.0.1:5000:5000 "$DRY_RUN_REGISTRY_IMAGE"
      - name: A tag release reads no shared cache
        # Pull-request jobs run as the same user on these runners and could rewrite the caches in its home (#704,
        # Decisions "CI on the self-hosted runner"). A tag release therefore restores NuGet and npm packages into empty
        # directories of its own, and its image builds read no local build cache, only the registry cache that release
        # jobs alone write (below). A dry run keeps the caches. Before go-live releases move to a runner of their own
        # under a separate user.
        if: github.event_name == 'push'
        run: |
          {
            echo "NUGET_PACKAGES=$RUNNER_TEMP/nuget-packages"
            echo "NUGET_HTTP_CACHE_PATH=$RUNNER_TEMP/nuget-http-cache"
            echo "npm_config_cache=$RUNNER_TEMP/npm-cache"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No npm cache for a tag release (#704, above).
          cache: ${{ github.event_name == 'push' && '' || 'npm' }}
          cache-dependency-path: src/admin-ui/package-lock.json
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # The builder pushes to localhost:5000 in a dry run.
          driver-opts: network=host
      - name: Build cache
        # The buildx builder above starts empty in every run, so each image would build from scratch and, with new layer
        # digests, push every layer again. A cache per image, read by each build and replaced after it (mode=max keeps
        # the build stages' layers too), so an unchanged Dockerfile and context rebuild in seconds and push only the new
        # layers. A tag release uses a registry cache, ghcr.io/<owner>/kalla/buildcache:<image>, that only release jobs
        # (packages: write) can write: pull-request jobs share the runner user's home, so a tag release never reads the
        # local cache (#704, #1084 R4a). A dry run uses the local one in the runner user's home (both runners share it;
        # releases don't run in parallel).
        env:
          REPOSITORY: ${{ steps.version.outputs.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "CACHE_REGISTRY=ghcr.io/$REPOSITORY/buildcache" >> "$GITHUB_ENV"
          else
            echo "BUILD_CACHE=$HOME/.cache/kalla-release-buildx" >> "$GITHUB_ENV"
          fi
      - name: Install Syft
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v$SYFT_VERSION/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "$SYFT_SHA256  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP/bin" syft
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Disk left
        # The self-hosted runner has room for the 3 GB parser image twice (built, then pulled for the smoke test); no
        # cleanup of GitHub-hosted toolchains (the runner user has no sudo).
        run: df -h / | tail -1

      - name: Start the Dockerfile images' builds
        # kalla/postgres, clamav, renderer and parser, all four at once in the background (scripts/ci/release-images.sh,
        # #1084): one after another they took 10.6 to 12.2 minutes of a tag run. "The Dockerfile images" below waits for
        # them. The build cache is the step's above.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREFIX: ${{ steps.version.outputs.registry_host }}/${{ steps.version.outputs.repository }}
          REVISION: ${{ github.sha }}
        run: bash scripts/ci/release-images.sh start
      - name: Build the admin UI
        # Built from the lock only (src/admin-ui/.npmrc), as in verify.yml. The admin publish below adds dist/ as
        # wwwroot/ with -p:PublishAdminUi=true (the gateway's switch, #66); Kalla.AdminApi serves it.
        working-directory: src/admin-ui
        run: |
          npm ci
          npm run build
      - name: .NET service images and their SBOMs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY_HOST: ${{ steps.version.outputs.registry_host }}
          REPOSITORY: ${{ steps.version.outputs.repository }}
          # The SBOM tool ships only tools/net8.0 (4.1.13 is the latest); the runner host has .NET 10 runtimes only.
          DOTNET_ROLL_FORWARD: Major
        run: |
          mkdir -p sbom
          for entry in api:Api admin:AdminApi worker:Worker migrations:MigrationService; do
            name="${entry%%:*}"; project="src/Kalla.${entry#*:}"
            ui=(); [ "$name" = admin ] && ui=(-p:PublishAdminUi=true)
            dotnet publish "$project" -c Release -t:PublishContainer --os linux --arch x64 --nologo "${ui[@]}" \
              -p:Version="$VERSION" -p:ContainerImageTag="$VERSION" \
              -p:ContainerRegistry="$REGISTRY_HOST" -p:ContainerRepository="$REPOSITORY/$name" -p:PublishRepositoryUrl=true
            ref="$REGISTRY_HOST/$REPOSITORY/$name:$VERSION"
            digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "KALLA_${name^^}_IMAGE=$ref@$digest" | tee -a images.env
            # The worker's Playwright driver must start inside the pushed image (libatomic.so.1, #927).
            if [ "$name" = worker ]; then
              docker run --rm --entrypoint /app/.playwright/node/linux-x64/node "$ref@$digest" /app/.playwright/package/cli.js --version
            fi
            # The SBOM of exactly what the image holds: the files of the publish directory PublishContainer packed, and
            # the NuGet packages of the project and every project it references. The detector reads each project's own
            # obj/project.assets.json and does not follow project references, so those files are gathered first (-bc
            # src would also list the admin UI's and the parser's development packages).
            publish="$project/bin/Release/net10.0/linux-x64/publish"
            components="$RUNNER_TEMP/sbom-components/$name"
            for p in "$project" $(jq -r --arg p "$project" '.libraries[] | select(.type == "project") | "\($p)/\(.path)"' \
                "$project/obj/project.assets.json" | xargs -n1 dirname); do
              mkdir -p "$components/$(basename "$p")/obj"
              cp "$p/obj/project.assets.json" "$components/$(basename "$p")/obj/"
            done
            dotnet dnx "$SBOM_TOOL" -y -- generate -b "$publish" -bc "$components" -pn "kalla-$name" -pv "$VERSION" \
              -ps "Umea kommun" -nsb https://www.umea.se/kalla -V Warning
            mv "$publish/_manifest/spdx_2.2/manifest.spdx.json" "sbom/kalla-$name-$VERSION.spdx.json"
            rm -rf "$publish/_manifest"
          done
      - name: The Dockerfile images
        # Started above, beside the admin UI and the .NET publishes; prints each build's log and gives each digest.
        id: images
        run: bash scripts/ci/release-images.sh wait
      - name: Rotate the build cache
        # A local cache only grows when written over itself: keep each image's new cache and drop the old one. A tag
        # release's registry cache is replaced by its push.
        if: github.event_name != 'push'
        run: |
          for name in postgres clamav renderer parser; do
            if [ -d "$BUILD_CACHE/$name-new" ]; then rm -rf "${BUILD_CACHE:?}/$name"; mv "$BUILD_CACHE/$name-new" "$BUILD_CACHE/$name"; fi
          done
          du -sh "$BUILD_CACHE"/* 2>/dev/null || true
      - name: Image pins of the other images, and their SBOMs in the background
        # Syft takes about two minutes for the four images (the parser's is 3 GB): it runs beside the smoke test and the
        # Portainer boot, and "The other images' SBOMs" below waits for it. Each image is pulled once (#1084 R7): into
        # the Docker daemon, which shares the download with the boot tests' pull of the same image, and Syft reads it
        # from there (docker:) instead of pulling it from the registry a second time.
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREFIX: ${{ steps.version.outputs.registry_host }}/${{ steps.version.outputs.repository }}
          POSTGRES_DIGEST: ${{ steps.images.outputs.postgres }}
          CLAMAV_DIGEST: ${{ steps.images.outputs.clamav }}
          RENDERER_DIGEST: ${{ steps.images.outputs.renderer }}
          PARSER_DIGEST: ${{ steps.images.outputs.parser }}
        run: |
          # A scan a cancelled attempt left behind still holds its unpacked image (#1069): stop it first. The match is on
          # this runner's workspace, which is in every scan's output path, so the other runner's scans are left alone.
          pkill -f "spdx-json=$GITHUB_WORKSPACE/sbom/" || true
          # Syft unpacks each image under TMPDIR (the parser's needs about 3 GB). The runner host's /tmp is a tmpfs of
          # half the RAM, so it goes to RUNNER_TEMP on disk, which the runner also empties after the job (#1069).
          syft_dir="$RUNNER_TEMP/syft"; mkdir -p "$syft_dir/tmp"; : > "$syft_dir/refs"
          for name in postgres clamav renderer parser; do
            digest_var="${name^^}_DIGEST"; ref="$PREFIX/$name:$VERSION@${!digest_var}"
            echo "KALLA_${name^^}_IMAGE=$ref" | tee -a images.env
            echo "$name $ref $PREFIX/$name@${!digest_var}" >> "$syft_dir/refs"
          done
          # The exit code goes to a file: a later step can't `wait` for a process this step started. Every stream of the
          # background part is redirected, or the runner would wait for it before ending the step.
          # shellcheck disable=SC2016 # the inner script's variables expand in the inner shell
          (
            # No -q: Syft's own messages (a full disk, a refused pull) go to the log the step below prints (#1069).
            TMPDIR="$syft_dir/tmp" bash -c 'set -e
              while read -r name ref by_digest; do
                echo "== $name"
                docker pull -q -- "$ref"
                syft scan "docker:$by_digest" -o "spdx-json=$PWD/sbom/kalla-$name-$VERSION.spdx.json"
              done < "$1/refs"' _ "$syft_dir" > "$syft_dir/log" 2>&1 || rc=$?
            echo "${rc:-0}" > "$syft_dir/exit"
          ) < /dev/null > /dev/null 2>&1 &
      - name: Pull the oldest supported release's images, in the background
        # The upgrade test below boots UPGRADE_FROM's stack: its images (the 3 GB parser among them) are pulled while the
        # smoke test and the Portainer boot run, not after them (#1084). Best effort: the upgrade test pulls what is
        # missing. The ghcr.io login is in a Docker config of this pull's own, so a dry run's other steps stay anonymous.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/ci/release-asset.sh "v$UPGRADE_FROM" compose.portainer.yaml "dist-from/$UPGRADE_FROM/compose.portainer.yaml"
          pull="$RUNNER_TEMP/prepull"; mkdir -p "$pull/docker-config"
          echo "$GH_TOKEN" | docker --config "$pull/docker-config" login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          grep -oE '[a-z0-9.-]+(/[a-z0-9._-]+)+(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}' \
            "dist-from/$UPGRADE_FROM/compose.portainer.yaml" | sort -u > "$pull/refs"
          cat "$pull/refs"
          # Every stream redirected and the exit code in a file, as the Syft step's.
          (
            while read -r ref; do docker --config "$pull/docker-config" pull -q "$ref" || echo "not pulled: $ref"; done < "$pull/refs"
            docker --config "$pull/docker-config" logout ghcr.io
            echo 0 > "$pull/exit"
          ) < /dev/null > "$pull/log" 2>&1 &
      - name: Build the release bundle
        run: |
          set -a; . ./images.env; set +a
          bash deploy/build-release-bundle.sh "${{ steps.version.outputs.version }}" dist
      - name: Smoke test the bundle and boot the Portainer stack, side by side
        # release-smoke.sh: deploy/compose.rag.yaml with the backup overlay; no sudo needed (kalla-bootstrap owns the files
        # inside the volumes). --render boots with the renderer, then switches it off, so one boot covers both (#505).
        # portainer-boot.sh: the release's compose.portainer.yaml asset, started as Portainer starts it: the stack file
        # and variables only, the gateway's images from the release it pins, Källa's from this run, with clamav and
        # openwebui (deploy-configuration plan, step C0). The two ran one after the other (#1084); their Compose projects
        # (kalla-smoke, kalla-portainer-boot), ports and work directories differ. Each log is printed when both are done,
        # and the host's memory every 30 seconds, to see whether a third test fits beside them.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          logs="$RUNNER_TEMP/boot"; mkdir -p "$logs"
          (while true; do echo "$(date -u +%T) $(free -m | awk 'NR == 2 { print "used " $3 " MiB, available " $7 " MiB" }')"; sleep 30; done) > "$logs/memory.log" 2>&1 &
          memory=$!
          bash deploy/tests/release-smoke.sh "dist/kalla-$VERSION.tar.gz" --work-dir "$RUNNER_TEMP/smoke" --render > "$logs/smoke.log" 2>&1 &
          smoke=$!
          bash deploy/tests/portainer-boot.sh dist/compose.portainer.yaml --version "$VERSION" > "$logs/portainer.log" 2>&1 &
          portainer=$!
          failed=0
          for test in smoke:$smoke portainer:$portainer; do
            status=0; wait "${test#*:}" || status=$?
            echo "::group::${test%%:*} (exit $status)"; cat "$logs/${test%%:*}.log"; echo "::endgroup::"
            if [ "$status" != 0 ]; then echo "::error::the ${test%%:*} test failed (exit $status)"; failed=1; fi
          done
          kill "$memory" 2>/dev/null || true
          echo "::group::memory"; cat "$logs/memory.log"; echo "::endgroup::"
          exit "$failed"
      - name: Upgrade the oldest supported release's Portainer stack
        # docs/portainer.md, "Upgrade": the UPGRADE_FROM stack (its release asset, its variables) is booted, then this
        # release's file is applied over it. From before 0.9.0 that is the rename's steps (--rename-0.9: the variables
        # renamed, the stack updated once; kalla-roles renames Källa's roles, and the gateway's are renamed by hand until
        # the stack is built on Fors 0.12.2), so nothing is fenced, the new database being a copy; the one-step upgrade
        # with nothing added, changed or stopped by hand (and --expect-fenced kalla_api --expect-fenced kalla_admin, as
        # from 0.6.0 across DropMessageParentId) applies again once UPGRADE_FROM is 0.9.0 or later.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The earlier release's images are on ghcr.io; a dry run has not logged in there (its own images go to the
          # job's registry). The login lives in this job's own Docker config and is removed again.
          if [ "$GITHUB_EVENT_NAME" != push ]; then echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin; fi
          # The stack file and its images came with the background pull above; wait for it so the logs don't interleave.
          pull="$RUNNER_TEMP/prepull"; deadline=$((SECONDS + 600))
          until [ -s "$pull/exit" ] || [ "$SECONDS" -ge "$deadline" ]; do sleep 5; done
          cat "$pull/log"
          bash deploy/tests/portainer-upgrade-boot.sh "dist-from/$UPGRADE_FROM/compose.portainer.yaml" dist/compose.portainer.yaml \
            --from-env "deploy/tests/fixtures/stack-$UPGRADE_FROM.env" \
            --version "${{ steps.version.outputs.version }}" --rename-0.9
          if [ "$GITHUB_EVENT_NAME" != push ]; then docker logout ghcr.io; fi
      - name: The other images' SBOMs
        # Started above, beside the boot tests; normally done by now.
        run: |
          syft_dir="$RUNNER_TEMP/syft"; deadline=$((SECONDS + 900))
          until [ -s "$syft_dir/exit" ]; do
            [ "$SECONDS" -lt "$deadline" ] || { cat "$syft_dir/log"; echo "::error::Syft did not finish within 15 minutes"; exit 1; }
            sleep 5
          done
          cat "$syft_dir/log"
          [ "$(cat "$syft_dir/exit")" = 0 ] || { echo "::error::Syft failed (exit $(cat "$syft_dir/exit"))"; exit 1; }
          ls -l sbom
      - name: Stop a Syft scan, an image build or a pull still running
        # The background scan outlives a failed or cancelled job otherwise, with gigabytes unpacked and its memory (#1069);
        # so do the image builds and the pull of UPGRADE_FROM's images (#1084) when the job fails before waiting for them.
        if: always()
        run: |
          pkill -f "spdx-json=$GITHUB_WORKSPACE/sbom/" || true
          pkill -f "metadata-file $RUNNER_TEMP/release-images/" || true
          pkill -f "$RUNNER_TEMP/prepull/docker-config" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/
            sbom/
            images.env
          if-no-files-found: error
      - name: Remove the dry run's registry
        if: always() && github.event_name != 'push'
        run: docker rm -f kalla-dryrun-registry >/dev/null 2>&1 || true

  publish:
    # Only for a pushed tag, once verify, parser, build and (when asked) e2e are green; a dry run ends after build.
    # verify and parser may be skipped only because the gate found a green dry run of this commit (header).
    needs: [gate, verify, parser, build, e2e]
    if: >-
      !cancelled() && github.event_name == 'push' && needs.gate.result == 'success' &&
      (needs.verify.result == 'success' || (needs.verify.result == 'skipped' && needs.gate.outputs.skip_tests == 'true')) &&
      (needs.parser.result == 'success' || (needs.parser.result == 'skipped' && needs.gate.outputs.skip_tests == 'true')) &&
      needs.build.result == 'success' && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A Docker client config of this job's own
        # As in build: the ghcr.io login for :latest must not outlive the job.
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - name: GitHub CLI
        # v0.2.0's publish failed with "gh: command not found" on the self-hosted runner.
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" \
            "https://github.com/cli/cli/releases/download/v$GH_CLI_VERSION/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          echo "$GH_CLI_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=2 "gh_${GH_CLI_VERSION}_linux_amd64/bin/gh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Tag latest
        # Here, not in build: only once every test is green (header). Not for a pre-release.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          while IFS='=' read -r _ ref; do
            repo="${ref%%@*}"; repo="${repo%:*}"
            docker buildx imagetools create -t "$repo:latest" "$ref"
          done < release/images.env
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp release/sbom/*.spdx.json release/dist/
          (cd release/dist && sha256sum -- * > SHA256SUMS)
          {
            notes="$(awk -v v="$version" '$0 ~ "^## \\[?" v "\\]?( |$)" {f=1; next} /^## / && f {exit} f' CHANGELOG.md)"
            if [ -n "$notes" ]; then echo "$notes"; else echo "See CHANGELOG.md."; fi
            echo
            echo "## Images"
            echo
            echo '```'
            cat release/images.env
            echo '```'
            echo
            echo "The bundle's Compose files default to these digests. SBOMs: \`kalla-<image>-$version.spdx.json\`."
            echo
            echo "## Deploy with Docker Compose"
            echo
            echo '```bash'
            echo "curl -fsSLO https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/kalla-$version.tar.gz"
            echo "tar -xzf kalla-$version.tar.gz && cd kalla-$version"
            echo "./deploy/init-deployment.sh"
            echo "docker compose --env-file deploy/.env up -d --wait"
            echo '```'
            echo
            echo "Then docs/production-setup.md in the bundle (stanza, escrow, host units) and docs/upgrade-guide.md."
          } > notes.md
          prerelease=""; case "$version" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Källa $version" --notes-file notes.md $prerelease \
            release/dist/*
      - name: Open the pull request that pins the Portainer stack to this release
        # deploy/compose.rag.yaml and deploy/portainer/ on main then name this release's images, as the release's
        # compose.portainer.yaml asset and bundle do (build-stack.sh --images; the gateway release stays the one the
        # committed file names), so Compose from the repository runs the latest release too. Never fails the
        # release: the asset is published either way, and the same command works by hand. Checks do not start on a pull
        # request opened with the workflow's token: close and reopen it to run them. Needs the repository setting
        # "Allow GitHub Actions to create and approve pull requests".
        if: ${{ !contains(github.ref_name, '-') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"; branch="a/pin-portainer-$version"
          git fetch --depth 1 origin main
          git switch -c "$branch" FETCH_HEAD
          sh deploy/portainer/build-stack.sh --images release/images.env current
          if git diff --quiet -- deploy/compose.rag.yaml deploy/portainer; then echo "deploy/ already names $version"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Portainer stack pinned to Källa $version's images" -- deploy/compose.rag.yaml deploy/portainer
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "Portainer stack pinned to Källa $version's images" \
            --body "Opened by the release of \`$GITHUB_REF_NAME\`: \`deploy/portainer/build-stack.sh --images images.env current\`, so \`deploy/compose.rag.yaml\` and \`compose.portainer.yaml\` name the release's images, as the release's \`compose.portainer.yaml\` asset does. Close and reopen this pull request to start its checks."
