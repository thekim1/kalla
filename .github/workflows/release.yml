name: Release
# Push a tag vX.Y.Z (or vX.Y.Z-pre) to release (plans/platform/repo-and-deployment.md §7.2, §8.1; as the gateway's):
#   1. verify.yml and parser.yml run in full; e2e.yml (called) only when asked: the repository variable RELEASE_E2E is
#      'true' for a tag push, or the dry run's input e2e is ticked (Decisions "E2E optional on release");
#   2. every image is pushed to ghcr.io/<owner>/ume-rag/<service>:X.Y.Z (and :latest unless X.Y.Z is a pre-release):
#      api, admin (with the admin UI), worker and migrations by `dotnet publish -t:PublishContainer`, postgres, clamav,
#      renderer and parser from their Dockerfiles; an SPDX SBOM per image (Microsoft.Sbom.DotNetTool for the .NET
#      services, Syft for the other four);
#   3. deploy/build-release-bundle.sh pins the bundle's Compose defaults to those digests, and
#      deploy/tests/release-smoke.sh boots the bundle and runs the smoke test;
#   4. a GitHub release is created with the bundle, the SBOMs and SHA256SUMS.
# A manual run (workflow_dispatch) is a dry run of 1-3: the images go to a registry inside the job (localhost:5000), so
# nothing reaches ghcr.io and no release or tag is created.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for the dry run (X.Y.Z or X.Y.Z-pre); nothing is pushed or released
        type: string
        default: 0.0.0-dryrun
      e2e:
        description: Run the browser tests (e2e.yml) first; they take about 10 minutes and load the runner
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  # Both self-hosted runners share one machine and user: MSBuild's reused worker nodes and build servers would be shared
  # between concurrent jobs, and the runner's end-of-job cleanup kills them under the other job (MSB4166).
  MSBUILDDISABLENODEREUSE: "1"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  UseSharedCompilation: "false"
  # Syft for the non-.NET images' SBOMs (to-verify #91): v1.55.0 (2026-10-19), sha256 of syft_1.55.0_linux_amd64.tar.gz
  # from the release's syft_1.55.0_checksums.txt.
  SYFT_VERSION: 1.55.0
  SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
  # GitHub CLI for the publish job (the self-hosted runner has none): v2.103.3 (2026-10-26), sha256 of
  # gh_2.103.3_linux_amd64.tar.gz from the release's gh_2.103.3_checksums.txt.
  GH_CLI_VERSION: 2.103.3
  GH_CLI_SHA256: 4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d
  # Microsoft.Sbom.DotNetTool 4.1.13 (NuGet, 2026-09-22), the gateway's.
  SBOM_TOOL: Microsoft.Sbom.DotNetTool@4.1.13
  # The dry run's registry: distribution 3.1.1 (Docker Hub image pushed 2026-09-21).
  DRY_RUN_REGISTRY_IMAGE: registry:3.1.1@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  parser:
    uses: ./.github/workflows/parser.yml

  e2e:
    # Optional (Decisions "E2E optional on release (user, 2026-11-06)"): a tag push runs them when the repository
    # variable RELEASE_E2E is 'true', a dry run when its e2e input is ticked. Skipped otherwise; a failed run still stops
    # the release. After verify and parser, never beside them: both runners share one machine, and with verify's backend
    # and renderer jobs running next to it the browser's requests to the admin UI failed (run 42469437132; alone, run
    # 42471519711 passed on the same commit).
    needs: [verify, parser]
    if: (github.event_name == 'push' && vars.RELEASE_E2E == 'true') || (github.event_name == 'workflow_dispatch' && inputs.e2e)
    uses: ./.github/workflows/e2e.yml

  build:
    # Images, SBOMs, bundle and smoke test in one job: the dry run's registry lives only as long as the job.
    needs: [verify, parser, e2e]
    # A skipped e2e (not asked for) lets the build go on; a failed or cancelled one does not.
    if: >-
      !cancelled() && needs.verify.result == 'success' && needs.parser.result == 'success' &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: A Docker client config of this job's own
        # The runners share one user's ~/.docker/config.json, where a tag release's `docker login ghcr.io` used to leave
        # its GITHUB_TOKEN behind. Once expired, buildx still sent it for ghcr.io and the dry run of 0.4.0 failed pulling
        # the public ghcr.io/astral-sh/uv ("failed to fetch oauth token: denied"). A config in RUNNER_TEMP is this
        # job's alone and goes with it, so a login never outlives the job; anonymous pulls stay anonymous.
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
          # No build-record artifact per image (docker/build-push-action's post step): nothing reads them, and during
          # GitHub's artifact outage of 2026-11-11 each upload retried for ten minutes (40 minutes for the four images).
          echo "DOCKER_BUILD_RECORD_UPLOAD=false" >> "$GITHUB_ENV"
      - name: Resolve version and registry
        id: version
        env:
          DRY_RUN_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
            registry_host=ghcr.io; repository="${GITHUB_REPOSITORY_OWNER,,}/ume-rag"
          else
            version="$DRY_RUN_VERSION"
            registry_host=localhost:5000; repository=ume-rag
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$version' is not X.Y.Z[-pre]"; exit 1; }
          # :latest follows the newest release, never a pre-release or a dry run.
          latest=false
          if [ "$GITHUB_EVENT_NAME" = push ]; then case "$version" in *-*) ;; *) latest=true;; esac; fi
          { echo "version=$version"; echo "registry_host=$registry_host"; echo "repository=$repository"
            echo "latest=$latest"; } | tee -a "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Start the dry run's registry
        if: github.event_name != 'push'
        # Both runners share one Docker daemon: remove a registry an earlier, cancelled or failed dry run left behind.
        run: |
          docker rm -f ume-rag-dryrun-registry >/dev/null 2>&1 || true
          # Before this step had a cleanup the container was called "registry": remove it only if it runs our image.
          if [ "$(docker inspect -f '{{.Config.Image}}' registry 2>/dev/null)" = "$DRY_RUN_REGISTRY_IMAGE" ]; then docker rm -f registry; fi
          docker run -d --name ume-rag-dryrun-registry -p 127.0.0.1:5000:5000 "$DRY_RUN_REGISTRY_IMAGE"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/admin-ui/package-lock.json
      - uses: docker/setup-buildx-action@v4
        with:
          # The builder pushes to localhost:5000 in a dry run.
          driver-opts: network=host
      - name: Build cache on the runner's disk
        # The buildx builder above starts empty in every run, so each image would build from scratch and, with new layer
        # digests, push every layer again. One local cache per image, kept in the runner user's home (both runners share
        # it; releases don't run in parallel), read by each build and replaced after it (mode=max keeps the build
        # stages' layers too), so an unchanged Dockerfile and context rebuild in seconds and push only the new layers.
        run: echo "BUILD_CACHE=$HOME/.cache/ume-rag-release-buildx" >> "$GITHUB_ENV"
      - name: Install Syft
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/syft.tar.gz" \
            "https://github.com/anchore/syft/releases/download/v$SYFT_VERSION/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          echo "$SYFT_SHA256  $RUNNER_TEMP/syft.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/syft.tar.gz" -C "$RUNNER_TEMP/bin" syft
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Disk left
        # The self-hosted runner has room for the 3 GB parser image twice (built, then pulled for the smoke test); no
        # cleanup of GitHub-hosted toolchains (the runner user has no sudo).
        run: df -h / | tail -1

      - name: Build the admin UI
        # Built from the lock only (src/admin-ui/.npmrc), as in verify.yml. The admin publish below adds dist/ as
        # wwwroot/ with -p:PublishAdminUi=true (the gateway's switch, #66); Ume.Rag.AdminApi serves it.
        working-directory: src/admin-ui
        run: |
          npm ci
          npm run build
      - name: .NET service images and their SBOMs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY_HOST: ${{ steps.version.outputs.registry_host }}
          REPOSITORY: ${{ steps.version.outputs.repository }}
          # The SBOM tool ships only tools/net8.0 (4.1.13 is the latest); the runner host has .NET 10 runtimes only.
          DOTNET_ROLL_FORWARD: Major
        run: |
          mkdir -p sbom
          for entry in api:Api admin:AdminApi worker:Worker migrations:MigrationService; do
            name="${entry%%:*}"; project="src/Ume.Rag.${entry#*:}"
            ui=(); [ "$name" = admin ] && ui=(-p:PublishAdminUi=true)
            dotnet publish "$project" -c Release -t:PublishContainer --os linux --arch x64 --nologo "${ui[@]}" \
              -p:Version="$VERSION" -p:ContainerImageTag="$VERSION" \
              -p:ContainerRegistry="$REGISTRY_HOST" -p:ContainerRepository="$REPOSITORY/$name" -p:PublishRepositoryUrl=true
            ref="$REGISTRY_HOST/$REPOSITORY/$name:$VERSION"
            digest="$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' | jq -r .digest)"
            echo "${name^^}_IMAGE=$ref@$digest" | tee -a images.env
            # The SBOM of exactly what the image holds: the files of the publish directory PublishContainer packed, and
            # the NuGet packages of the project and every project it references. The detector reads each project's own
            # obj/project.assets.json and does not follow project references, so those files are gathered first (-bc
            # src would also list the admin UI's and the parser's development packages).
            publish="$project/bin/Release/net10.0/linux-x64/publish"
            components="$RUNNER_TEMP/sbom-components/$name"
            for p in "$project" $(jq -r --arg p "$project" '.libraries[] | select(.type == "project") | "\($p)/\(.path)"' \
                "$project/obj/project.assets.json" | xargs -n1 dirname); do
              mkdir -p "$components/$(basename "$p")/obj"
              cp "$p/obj/project.assets.json" "$components/$(basename "$p")/obj/"
            done
            dotnet dnx "$SBOM_TOOL" -y -- generate -b "$publish" -bc "$components" -pn "ume-rag-$name" -pv "$VERSION" \
              -ps "Umea kommun" -nsb https://www.umea.se/ume-rag -V Warning
            mv "$publish/_manifest/spdx_2.2/manifest.spdx.json" "sbom/ume-rag-$name-$VERSION.spdx.json"
            rm -rf "$publish/_manifest"
          done
      - name: Build and push ume-rag/postgres
        id: postgres
        uses: docker/build-push-action@v7
        with:
          context: .
          file: images/postgres/Dockerfile
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.version.outputs.registry_host }}/${{ steps.version.outputs.repository }}/postgres:${{ steps.version.outputs.version }}
          push: true
          provenance: false
          cache-from: type=local,src=${{ env.BUILD_CACHE }}/postgres
          cache-to: type=local,dest=${{ env.BUILD_CACHE }}/postgres-new,mode=max
      - name: Build and push ume-rag/clamav
        id: clamav
        uses: docker/build-push-action@v7
        with:
          context: images/clamav
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.version.outputs.registry_host }}/${{ steps.version.outputs.repository }}/clamav:${{ steps.version.outputs.version }}
          push: true
          provenance: false
          cache-from: type=local,src=${{ env.BUILD_CACHE }}/clamav
          cache-to: type=local,dest=${{ env.BUILD_CACHE }}/clamav-new,mode=max
      - name: Build and push ume-rag/renderer
        id: renderer
        uses: docker/build-push-action@v7
        with:
          context: images/renderer
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.version.outputs.registry_host }}/${{ steps.version.outputs.repository }}/renderer:${{ steps.version.outputs.version }}
          push: true
          provenance: false
          cache-from: type=local,src=${{ env.BUILD_CACHE }}/renderer
          cache-to: type=local,dest=${{ env.BUILD_CACHE }}/renderer-new,mode=max
      - name: Build and push ume-rag/parser
        id: parser
        uses: docker/build-push-action@v7
        with:
          context: src/parser
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          tags: ${{ steps.version.outputs.registry_host }}/${{ steps.version.outputs.repository }}/parser:${{ steps.version.outputs.version }}
          push: true
          provenance: false
          cache-from: type=local,src=${{ env.BUILD_CACHE }}/parser
          cache-to: type=local,dest=${{ env.BUILD_CACHE }}/parser-new,mode=max
      - name: Rotate the build cache
        # A local cache only grows when written over itself: keep each image's new cache and drop the old one.
        run: |
          for name in postgres clamav renderer parser; do
            if [ -d "$BUILD_CACHE/$name-new" ]; then rm -rf "$BUILD_CACHE/$name"; mv "$BUILD_CACHE/$name-new" "$BUILD_CACHE/$name"; fi
          done
          du -sh "$BUILD_CACHE"/* 2>/dev/null || true
      - name: Image pins and SBOMs of the other images
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREFIX: ${{ steps.version.outputs.registry_host }}/${{ steps.version.outputs.repository }}
          POSTGRES_DIGEST: ${{ steps.postgres.outputs.digest }}
          CLAMAV_DIGEST: ${{ steps.clamav.outputs.digest }}
          RENDERER_DIGEST: ${{ steps.renderer.outputs.digest }}
          PARSER_DIGEST: ${{ steps.parser.outputs.digest }}
          # The dry run's registry speaks plain HTTP.
          SYFT_REGISTRY_INSECURE_USE_HTTP: ${{ github.event_name != 'push' }}
        run: |
          for name in postgres clamav renderer parser; do
            digest_var="${name^^}_DIGEST"; ref="$PREFIX/$name:$VERSION@${!digest_var}"
            echo "${name^^}_IMAGE=$ref" | tee -a images.env
            syft scan "registry:$ref" -o "spdx-json=sbom/ume-rag-$name-$VERSION.spdx.json" -q
          done
          ls -l sbom
      - name: Tag latest
        if: steps.version.outputs.latest == 'true'
        run: |
          while IFS='=' read -r _ ref; do
            repo="${ref%%@*}"; repo="${repo%:*}"
            docker buildx imagetools create -t "$repo:latest" "$ref"
          done < images.env
      - name: Build the release bundle
        run: |
          set -a; . ./images.env; set +a
          bash deploy/build-release-bundle.sh "${{ steps.version.outputs.version }}" dist
      - name: Smoke test the bundle
        # The self-hosted runner has no sudo (docs/ci-runner.md): init-deployment.sh's chown runs as root in a
        # throwaway container of the bundle's postgres image. --render boots with the renderer, then switches it off as
        # the upgrade guide says, so one boot covers both (#505).
        run: |
          bash deploy/tests/release-smoke.sh "dist/ume-rag-${{ steps.version.outputs.version }}.tar.gz" \
            --work-dir "$RUNNER_TEMP/smoke" --chown-with-docker --render
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/
            sbom/
            images.env
          if-no-files-found: error
      - name: Remove the dry run's registry
        if: always() && github.event_name != 'push'
        run: docker rm -f ume-rag-dryrun-registry >/dev/null 2>&1 || true

  publish:
    # Only for a pushed tag; a dry run ends after the smoke test.
    needs: build
    if: ${{ !cancelled() && github.event_name == 'push' && needs.build.result == 'success' }}
    runs-on: [self-hosted, linux, x64]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: GitHub CLI
        # v0.2.0's publish failed with "gh: command not found" on the self-hosted runner.
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/gh.tar.gz" \
            "https://github.com/cli/cli/releases/download/v$GH_CLI_VERSION/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          echo "$GH_CLI_SHA256  $RUNNER_TEMP/gh.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gh.tar.gz" -C "$RUNNER_TEMP/bin" --strip-components=2 "gh_${GH_CLI_VERSION}_linux_amd64/bin/gh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp release/sbom/*.spdx.json release/dist/
          (cd release/dist && sha256sum -- * > SHA256SUMS)
          {
            notes="$(awk -v v="$version" '$0 ~ "^## \\[?" v "\\]?( |$)" {f=1; next} /^## / && f {exit} f' CHANGELOG.md)"
            if [ -n "$notes" ]; then echo "$notes"; else echo "See CHANGELOG.md."; fi
            echo
            echo "## Images"
            echo
            echo '```'
            cat release/images.env
            echo '```'
            echo
            echo "The bundle's Compose files default to these digests. SBOMs: \`ume-rag-<image>-$version.spdx.json\`."
            echo
            echo "## Deploy with Docker Compose"
            echo
            echo '```bash'
            echo "curl -fsSLO https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/ume-rag-$version.tar.gz"
            echo "tar -xzf ume-rag-$version.tar.gz && cd ume-rag-$version"
            echo "./deploy/init-deployment.sh"
            echo "docker compose --env-file deploy/.env up -d --wait"
            echo '```'
            echo
            echo "Then docs/production-setup.md in the bundle (stanza, escrow, host units) and docs/upgrade-guide.md."
          } > notes.md
          prerelease=""; case "$version" in *-*) prerelease="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Ume Rag $version" --notes-file notes.md $prerelease \
            release/dist/*
