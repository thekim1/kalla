name: Audit
# Daily dependency audit of main (plans/platform/repo-and-deployment.md §8.4). verify.yml and parser.yml audit the
# dependencies only when a pull request changes code, so a new advisory against an unchanged main would go unnoticed
# until the next such pull request; this workflow runs the same checks every morning and from the Actions tab
# (workflow_dispatch). No push or pull request trigger. The checks are shared, not copied: scripts/audit/audit.py reads
# the .NET and npm reports in both places, and the parser job repeats parser.yml's two pip-audit commands (pip-audit
# itself decides; there is nothing to extract). The npm exceptions live in scripts/audit/npm-audit-exceptions.txt
# (dated, dev-only) and npm-production-exceptions.txt (dated, only for a package the bundle doesn't contain), the image
# scan's (dated, for code the image cannot reach) in
# scripts/audit/image-scan-exceptions.txt; .NET and Python have none. Every job runs on the self-hosted runner (labels
# self-hosted, linux, x64) and writes what it audited and what it found to the run summary. The images job scans the
# last release's images for known vulnerabilities (Grype).
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit
  cancel-in-progress: false
env:
  # Both self-hosted runners share one machine and user: MSBuild's reused worker nodes and build servers would be shared
  # between concurrent jobs, and the runner's end-of-job cleanup kills them under the other job (MSB4166).
  MSBUILDDISABLENODEREUSE: "1"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  UseSharedCompilation: "false"
jobs:
  dotnet:
    # As the backend job in verify.yml: restore, then every project's top-level and transitive packages against the
    # NuGet vulnerability data.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.401
      - name: Restore
        run: dotnet restore Kalla.slnx --nologo
      - name: Audit .NET packages
        run: |
          dotnet list Kalla.slnx package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/ume-package-audit.json"
          python3 -I scripts/audit/audit.py dotnet "$RUNNER_TEMP/ume-package-audit.json" --summary "$GITHUB_STEP_SUMMARY"

  admin-ui:
    # As the admin-ui job in verify.yml: npm ci from the lock only (src/admin-ui/.npmrc: ignore-scripts,
    # min-release-age, allow-git=none), then npm audit: the production dependencies against the bundle's packages (a
    # build with source maps; production exceptions only for a package the bundle doesn't contain), then all of them.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/admin-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/admin-ui/package-lock.json
      - name: Install from the lock
        run: npm ci
      - name: Audit npm packages
        # Both checks run and are summarised; the step fails if either fails.
        run: |
          status=0
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-production.json" || true
          npx vite build --sourcemap hidden --outDir "$RUNNER_TEMP/bundle-modules" --emptyOutDir --logLevel warn
          if ! python3 -I ../../scripts/audit/audit.py npm-production "$RUNNER_TEMP/audit-production.json" \
              --modules "$RUNNER_TEMP/bundle-modules" --summary "$GITHUB_STEP_SUMMARY"; then
            status=1
          fi
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          if ! python3 -I ../../scripts/audit/audit.py npm "$RUNNER_TEMP/audit.json" --summary "$GITHUB_STEP_SUMMARY"; then
            status=1
          fi
          exit "$status"

  parser:
    # As the parser job in parser.yml: uv from the image the parser's Dockerfile pins, then pip-audit against the
    # locked export (torch and torchvision come from the PyTorch CPU index, which pip-audit cannot look up; it lists
    # them as skipped).
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A Docker client config of this job's own
        # The runners share one user's ~/.docker/config.json, which can hold an expired ghcr.io login from a tag release;
        # Docker then sends it for this public image and the pull fails ("error from registry: denied", 0.4.0 dry run 3).
        # A config in RUNNER_TEMP is this job's alone, so the pull stays anonymous (as release.yml's build job).
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - name: Install uv from the image the Dockerfile pins
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cid="$(docker create ghcr.io/astral-sh/uv:0.13.8@sha256:5cc1805e2426484abca4ad46ea783bab281fdb225fd82d8ce6d66a81254bac85 x)"
          docker cp "$cid:/uv" "$RUNNER_TEMP/bin/uv"
          docker rm "$cid"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install from the lock
        run: uv sync --frozen
      - name: pip-audit against the locked export
        run: |
          uv export --frozen --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          if uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip --progress-spinner off \
            > "$RUNNER_TEMP/pip-audit.txt" 2>&1; then
            status=0
          else
            status=$?
          fi
          cat "$RUNNER_TEMP/pip-audit.txt"
          { echo "### pip-audit, src/parser locked export"; echo; echo '```'; cat "$RUNNER_TEMP/pip-audit.txt"; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  images:
    # The last release's eight images on ghcr.io, scanned for known vulnerabilities in their OS and language packages
    # (A-27, #507): the base images are pinned by digest, so nothing else reports a CVE in an unchanged image. Grype
    # reads each image from the registry; scripts/audit/audit.py reads the reports. The job fails on a High or Critical
    # finding that has a fix, unless scripts/audit/image-scan-exceptions.txt lists it until a day not yet passed;
    # findings without a fix are counted in the summary only. Grype v0.121.3 (2026-11-09), sha256 of
    # grype_0.121.3_linux_amd64.tar.gz from the release's grype_0.121.3_checksums.txt.
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      GRYPE_VERSION: 0.121.3
      GRYPE_SHA256: e9da18cc1429e786722e32161288103600efffd8e483c90761f90485bd1bec85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Grype
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/grype.tar.gz" \
            "https://github.com/anchore/grype/releases/download/v$GRYPE_VERSION/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "$GRYPE_SHA256  $RUNNER_TEMP/grype.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP/bin" grype
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: A Docker client config of this job's own
        # As in release.yml: the login below must not outlive the job in the runner user's shared ~/.docker/config.json.
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Scan the last release's images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" | jq -r '.tag_name | ltrimstr("v")')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::no latest release found ('$version')"; exit 1; }
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ume-rag"
          grype db update
          reports=()
          for name in api admin worker migrations postgres clamav renderer parser; do
            grype "registry:$prefix/$name:$version" -o json --file "$RUNNER_TEMP/grype-$name.json" -q
            reports+=("$name=$RUNNER_TEMP/grype-$name.json")
          done
          python3 -I scripts/audit/audit.py grype "${reports[@]}" --title ", release $version" --summary "$GITHUB_STEP_SUMMARY"
