name: Parser
# The parser sidecar and its contract (P0 checklist #13; plans/parser/design.md §15.1, §15.2), out of verify.yml so
# that only a change to the parser, its contract, the parser contract tests and fixtures, the worker's parser client or
# this workflow builds the 3 GB parser image. Like verify.yml it runs on every pull request that is not a draft,
# never on a push to main, and from the Actions tab (workflow_dispatch) or release.yml. The jobs skip
# when nothing of that changed: a skipped job counts as passed for a required check, while a workflow left out by an
# `on.*.paths` filter never reports and would block a pull request that requires it.
# Jobs: parser (lock, lint, unit tests, schemas, pip-audit on the runner), parser-image (the image's test target, whose
# tests run during the build with no network) and contract (Kalla.ContractTests against the runtime image).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: parser-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  # Both self-hosted runners share one machine and user: MSBuild's reused worker nodes and build servers would be shared
  # between concurrent jobs, and the runner's end-of-job cleanup kills them under the other job (MSB4166).
  MSBUILDDISABLENODEREUSE: "1"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  UseSharedCompilation: "false"
jobs:
  changes:
    # On a pull request only when it is not a draft; the other jobs need this one, so they skip with it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, linux, x64]
    outputs:
      parser: ${{ steps.filter.outputs.parser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        name: The parser or its contract changed
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then range="$BEFORE...HEAD"; else range="$BEFORE..HEAD"; fi
          # Everything for a tag (release.yml), a moved one too: its push's "before" is the old tag, which exists, and
          # would otherwise filter the release down to what changed since the old tag (0.6.0's second tag run).
          if [ "${{ github.event_name }}" != pull_request ] && [ "${{ github.event_name }}" != push ] \
            || [ "$REF_TYPE" = tag ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "parser=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The parser, its contract, the parser contract tests (the files at the top of tests/Kalla.ContractTests/,
          # its project file included; Blobs/ holds the blob store tests, which the backend job runs), the fixtures and
          # goldens, the worker's parser client, or this workflow.
          parser="$(git diff --name-only "$range" | grep -E '^(src/parser/|contracts/parser/|tests/Kalla\.ContractTests/[^/]+$|tests/fixtures/parser/|src/Kalla\.Worker/Parsing/|\.github/workflows/parser\.yml$)' || true)"
          if [ -n "$parser" ]; then echo "parser=true"; else echo "parser=false"; fi >> "$GITHUB_OUTPUT"

  parser:
    # Lock, lint, unit and supervisor tests and the schema export on the runner (repo-and-deployment §8.2). The tests
    # that need the models and Tesseract skip here and run in parser-image.
    needs: changes
    if: needs.changes.outputs.parser == 'true'
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: src/parser
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A Docker client config of this job's own
        # The runners share one user's ~/.docker/config.json, which can hold an expired ghcr.io login from a tag release;
        # Docker then sends it for this public image and the pull fails ("error from registry: denied", 0.4.0 dry run 3).
        # A config in RUNNER_TEMP is this job's alone, so the pull stays anonymous (as release.yml's build job).
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - name: Install uv from the image the Dockerfile pins
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cid="$(docker create ghcr.io/astral-sh/uv:0.13.9@sha256:d3b601f0c7b118bc1753febf7c41cc80981df678445e0254284eecf84db79a7d x)"
          docker cp "$cid:/uv" "$RUNNER_TEMP/bin/uv"
          docker rm "$cid"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lock, lint and tests
        run: |
          uv lock --check
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Committed schemas match the models
        run: |
          uv run python -m scripts.export_schema
          git diff --exit-code -- ../../contracts/
          test -z "$(git status --porcelain --untracked-files=all -- ../../contracts/)"
      - name: pip-audit against the locked export
        # torch and torchvision come from the PyTorch CPU index, which pip-audit cannot look up; it lists them as skipped.
        run: |
          uv export --frozen --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip --progress-spinner off

  parser-image:
    # The image's test target: real Docling, models and Tesseract, test_offline.py included. The Dockerfile runs pytest
    # in a `RUN --network=none` step, so a failing test fails the build. No REVISION build argument: the tests do not
    # read it, and without it an unchanged parser hits the cached test layer. Built by the Docker daemon's own BuildKit on
    # the self-hosted runner, whose layer cache stays on its disk between jobs and is shared with the contract job (no
    # throwaway buildx builder, no GitHub Actions cache to download).
    needs: changes
    if: needs.changes.outputs.parser == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A Docker client config of this job's own
        # The Dockerfile starts FROM ghcr.io/astral-sh/uv: as in the parser job, no shared ghcr.io login may reach it.
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - name: Build the image's test target (runs the tests without network)
        run: docker build --target test -t kalla.local/parser-test:ci src/parser
      - name: Disk left
        if: always()
        run: df -h / | tail -1

  contract:
    # Kalla.ContractTests (parser design §15.2): the worker's parser client against the parser image built from this
    # commit; responses and error cases validated against contracts/parser/v1/ and compared with the goldens. Same
    # trigger and cache as parser-image. The backend job (verify.yml) runs the same project without the image, so there
    # the image tests skip and the blob store tests run.
    needs: changes
    if: needs.changes.outputs.parser == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.401
      - name: A Docker client config of this job's own
        # The Dockerfile starts FROM ghcr.io/astral-sh/uv: as in the parser job, no shared ghcr.io login may reach it.
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"
      - name: Build the parser image
        # Straight into the Docker daemon that Testcontainers uses, from the runner's local layer cache (see parser-image).
        # The name has a registry part with a dot, so Testcontainers does not prefix it with the Docker Hub mirror below.
        run: docker build -t kalla.local/parser:ci --build-arg REVISION=${{ github.sha }} src/parser
      - name: Contract tests
        env:
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
          KALLA_TEST_PARSER_IMAGE: kalla.local/parser:ci
        run: |
          df -h / | tail -1
          dotnet test --project tests/Kalla.ContractTests/Kalla.ContractTests.csproj -c Release
