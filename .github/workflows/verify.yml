name: Verify
# Every job runs on the self-hosted runner (labels self-hosted, linux, x64; GitHub-hosted minutes are used up). Every
# pull request that is not a draft is verified on the merge with main (pull_request) on open, on each push and when it
# leaves draft; a newer push cancels the older run of the same pull request. Merge only on a green run (private repo on
# the free plan: GitHub cannot enforce required checks). Nothing runs on a push to main; main or any branch can be
# verified from the Actions tab (workflow_dispatch), and release.yml calls this workflow in full.
# Jobs: ownership and backend (Stage 0), doc-refs (plans/archive/doc-restructure.md), evaluation-smoke (P1 item 17), images (P0 checklist #5), renderer
# (connectors design §8.3), deploy-checks (P0 checklist #14), admin-ui (P0 checklist #3,
# plans/platform/repo-and-deployment.md §2.3, §8.2). The parser and contract
# jobs (P0 checklist #13) are in parser.yml, which runs them only when the parser changed. The dependency audits of the
# backend and admin-ui jobs (scripts/audit/) also run daily against main in audit.yml.
# Lean pull requests (user, 2026-11-05): backend skips docs- and deploy-only changes; images, renderer and evaluation-smoke run only when their paths changed; a dispatch and
# release.yml run every job. The browser tests (e2e.yml) run only before a release (called by release.yml) or by hand.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  # Both self-hosted runners share one machine and user: MSBuild's reused worker nodes and build servers would be shared
  # between concurrent jobs, and the runner's end-of-job cleanup kills them under the other job (MSB4166).
  MSBUILDDISABLENODEREUSE: "1"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  UseSharedCompilation: "false"
jobs:
  ownership:
    # Every pull request that is not a draft, design-only ones included: a stream branch may change only its own and the
    # shared paths.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed paths belong to the branch's stream
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" | python3 -I scripts/check-ownership.py "$HEAD_REF"

  doc-refs:
    # Every design-section citation ("engine design §9.6") in code, tests and documents names a section that exists,
    # and every relative Markdown link resolves (scripts/check-doc-refs.py). Design-only pull requests included.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Section citations and links resolve
        run: python3 -I scripts/check-doc-refs.py

  changes:
    # Design documents (plans/**, platforms/**, root *.md) do not build anything (repo-and-deployment §1). On a pull
    # request only when it is not a draft (see the top); the other jobs need this one, so they skip with it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, linux, x64]
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deploy: ${{ steps.filter.outputs.deploy }}
      adminui: ${{ steps.filter.outputs.adminui }}
      images: ${{ steps.filter.outputs.images }}
      renderer: ${{ steps.filter.outputs.renderer }}
      smoke: ${{ steps.filter.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Anything besides design documents changed
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then range="$BEFORE...HEAD"; else range="$BEFORE..HEAD"; fi
          # The admin UI job has nothing to build in a tree without src/admin-ui (main before stream B's #45), even when
          # contracts/admin/ or this workflow changed.
          ui=false; [ -f src/admin-ui/package-lock.json ] && ui=true
          # Everything for a tag (release.yml), a moved one too: its push's "before" is the old tag, which exists, and
          # would otherwise filter the release down to what changed since the old tag (0.6.0's second tag run).
          if [ "${{ github.event_name }}" != pull_request ] && [ "${{ github.event_name }}" != push ] \
            || [ "$REF_TYPE" = tag ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            printf 'code=true\ndeploy=true\nadminui=%s\nimages=true\nrenderer=true\nsmoke=true\n' "$ui" >> "$GITHUB_OUTPUT"; exit 0
          fi
          flag() { [ -n "$1" ] && echo true || echo false; }
          # The backend job: anything besides the design documents, docs/ and deploy/, except the files of docs/ and deploy/
          # that the backend tests read (the Postgres init and role scripts and postgresql.conf, the Keycloak realm files,
          # docs/security-events.md, docs/openapi/). deploy-checks covers the rest of deploy/, doc-refs the documents.
          changed="$(git diff --name-only "$range")"
          code="$(grep -vE '^(plans/|platforms/|docs/|deploy/)|^[^/]+\.md$' <<< "$changed" || true)"
          code="$code$(grep -E '^(deploy/postgres/|deploy/keycloak/|docs/security-events\.md$|docs/openapi/)' <<< "$changed" || true)"
          # The production Compose files and init-deployment.sh, or this workflow.
          deploy="$(git diff --name-only "$range" | grep -E '^(deploy/|\.github/workflows/verify\.yml$)' || true)"
          # The admin UI, the error codes its Swedish texts are checked against, its size budget or audit script, its browser
          # tests, or this workflow.
          adminui="$(git diff --name-only "$range" | grep -E '^(src/admin-ui/|tests/e2e/|contracts/admin/|scripts/admin-ui-size-budget\.mjs$|scripts/audit/|\.github/workflows/verify\.yml$)' || true)"
          [ "$ui" = true ] || adminui=""
          # Lean pull requests (repo-and-deployment §8.2): the image tests only when an image or its test changed, the
          # renderer's image and container tests when the image, the worker's render code (or the Playwright pin, which
          # moves with the image) or the container test changed, the evaluation smoke only when the code on its path
          # (ingestion, retrieval, answering) or the smoke set changed. A dispatch and release.yml run everything.
          images="$(git diff --name-only "$range" | grep -E '^(images/postgres/|images/clamav/|deploy/postgres/|\.github/workflows/verify\.yml$)' || true)"
          renderer="$(git diff --name-only "$range" | grep -E '^(images/renderer/|src/Ume\.Rag\.Worker/Connectors/Render/|src/Ume\.Rag\.Worker/Connectors/Http/PageFetcher\.cs$|tests/Ume\.Rag\.Worker\.Tests/Connectors/RendererContainerTests\.cs$|Directory\.Packages\.props$|\.github/workflows/verify\.yml$)' || true)"
          smoke="$(git diff --name-only "$range" | grep -E '^(src/Ume\.Rag\.(Worker|Retrieval|Answering|Api|Infrastructure|Pipelines|Domain)/|tests/evaluation/|tests/Ume\.Rag\.Worker\.Tests/Evaluation|images/postgres/|Directory\.(Packages|Build)\.(props|targets)$|global\.json$|\.github/workflows/verify\.yml$)' || true)"
          { echo "code=$(flag "$code")"; echo "deploy=$(flag "$deploy")"; echo "adminui=$(flag "$adminui")"
            echo "images=$(flag "$images")"; echo "renderer=$(flag "$renderer")"; echo "smoke=$(flag "$smoke")"; } >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - name: Build the Postgres image
        # The integration tests run against ume-rag/postgres as built from this commit, not only the stock base (hand-off
        # H3). The name has a registry part with a dot, so Testcontainers does not prefix it with the Docker Hub mirror
        # below (it would then pull mirror.gcr.io/ume-rag/postgres) and uses the local image.
        run: docker build -f images/postgres/Dockerfile -t ume-rag.local/postgres:ci --build-arg REVISION=${{ github.sha }} .
      - name: Build the ClamAV image
        # The worker's ClamAV client test (tests/Ume.Rag.Worker.Tests, connectors design §18) talks to clamd as built from
        # this commit, with an offline test signature; the dotted registry part keeps Testcontainers on the local image.
        run: docker build -t ume-rag.local/clamav:ci --build-arg REVISION=${{ github.sha }} images/clamav
      - name: Build and test backend
        env:
          # Testcontainers pulls Postgres and its Ryuk image from Docker Hub, whose anonymous pull limit is shared by every
          # job on the runner's address; Google's mirror of Docker Hub is not subject to it (as the gateway).
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
          UME_RAG_TEST_POSTGRES_IMAGE: ume-rag.local/postgres:ci
          UME_RAG_TEST_CLAMAV_IMAGE: ume-rag.local/clamav:ci
        run: |
          dotnet build UmeRag.slnx -c Release --nologo
          # Tests marked [Trait(TestCategory.Name, TestCategory.Flaky)] run locally and in the weekly flake hunt, not here;
          # the evaluation smoke test has a job of its own (evaluation-smoke).
          dotnet test --solution UmeRag.slnx -c Release --no-build --filter-not-trait "Category=Flaky" --filter-not-trait "Category=EvaluationSmoke"
          dotnet list UmeRag.slnx package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/ume-package-audit.json"
          # The same check runs daily against main in audit.yml.
          python3 -I scripts/audit/audit.py dotnet "$RUNNER_TEMP/ume-package-audit.json"

  evaluation-smoke:
    # Knowledge design §16.4, repo-and-deployment §8.2: without the AppHost, the 13 pages of tests/evaluation/smoke go
    # through the worker (an upload batch; Markdown is parsed in the worker, so no parser or ClamAV image) into
    # ume-rag/postgres as built from this commit, then the 30 questions through rag-api in process on the FakeGateway:
    # recall@10 >= 0.8 on POST /v1/retrieve and a citation on every chat answer (EvaluationSmokeTests in
    # tests/Ume.Rag.Worker.Tests, trait Category=EvaluationSmoke, which the backend job leaves out). Detailed output
    # prints the recall numbers.
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - name: Build the Postgres image
        # As in the backend job: the dotted registry part keeps Testcontainers on the local image.
        run: docker build -f images/postgres/Dockerfile -t ume-rag.local/postgres:ci --build-arg REVISION=${{ github.sha }} .
      - name: Ingest the smoke set and run its 30 questions
        env:
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
          UME_RAG_TEST_POSTGRES_IMAGE: ume-rag.local/postgres:ci
        run: |
          dotnet build tests/Ume.Rag.Worker.Tests -c Release --nologo
          dotnet test --project tests/Ume.Rag.Worker.Tests -c Release --no-build --filter-trait "Category=EvaluationSmoke" --output Detailed

  images:
    # ume-rag/postgres: the image test of repo-and-deployment §5.2 (pgvector version, HNSW build, pg_stat_statements,
    # wal_compression=lz4, TLS, archive-push, backup and restore from inside the image, read-only root, uid 999);
    # ume-rag/clamav (§5.5) with its own test; ume-rag/renderer (§5.4) is in the renderer job. The images are pushed to
    # ghcr only by release.yml (§8.1).
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Build ume-rag/postgres
        run: |
          docker build -f images/postgres/Dockerfile -t ume-rag/postgres:ci --build-arg REVISION=${{ github.sha }} .
          docker image ls ume-rag/postgres:ci
      - name: Image test
        run: bash deploy/postgres/test.sh ume-rag/postgres:ci
      - name: Build ume-rag/clamav
        run: |
          docker build -t ume-rag/clamav:ci --build-arg REVISION=${{ github.sha }} images/clamav
          docker image ls ume-rag/clamav:ci
      - name: ClamAV image test
        # Offline: a one-line EICAR test signature in a fresh volume, no download from database.clamav.net
        # (images/clamav/test.sh --online exercises freshclam locally).
        run: bash images/clamav/test.sh ume-rag/clamav:ci

  renderer:
    # ume-rag/renderer (repo-and-deployment §5.4) with its image test, then the worker rendering a fixture SPA through
    # that image (RendererContainerTests in tests/Ume.Rag.Worker.Tests, connectors design §8.3), which the backend job
    # skips because it does not set UME_RAG_TEST_RENDERER_IMAGE.
    needs: changes
    if: needs.changes.outputs.renderer == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - name: Build ume-rag/renderer
        # The dotted registry part keeps Testcontainers on the local image (as the backend job's images).
        run: |
          docker build -t ume-rag/renderer:ci -t ume-rag.local/renderer:ci --build-arg REVISION=${{ github.sha }} images/renderer
          docker image ls ume-rag/renderer:ci
      - name: Renderer image test
        # Hardened as in Compose with images/renderer/seccomp.json on an internal network of its own: refuses to start
        # without its secret path, Chromium's sandbox on, a routed page renders, no WebRTC candidate, and nothing outside
        # the network resolves or connects from inside the renderer (connectors design §8.3).
        run: bash images/renderer/test.sh ume-rag/renderer:ci
      - name: Worker renders through the image
        # The image as Compose runs it, on a network of its own (10.215.0.0/24). --fail-skips and
        # --minimum-expected-tests turn a skip (no image variable) or a filter that matches nothing into a failure.
        env:
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
          UME_RAG_TEST_RENDERER_IMAGE: ume-rag.local/renderer:ci
        run: |
          dotnet build tests/Ume.Rag.Worker.Tests -c Release --nologo
          dotnet test --project tests/Ume.Rag.Worker.Tests -c Release --no-build \
            --filter-class "Ume.Rag.Worker.Tests.Connectors.RendererContainerTests" --fail-skips on --minimum-expected-tests 1

  deploy-checks:
    # Production Compose (P0 checklist #14, repo-and-deployment §8.2): every supported combination of the files renders
    # with `docker compose config` against placeholder settings, the image defaults stay the local :latest dev images
    # (a release bundle pins the pushed ones by digest, §7.2, checked here with placeholder digests), the host firewall's
    # subnets are the Compose networks', the Portainer stack's rag-bootstrap keeps its secrets on a re-run, the deployment
    # scripts pass shellcheck and the host units pass systemd-analyze verify (deploy/host/).
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Local image defaults are untagged dev images
        run: |
          stale="$(grep -Hn 'ume-rag/[a-z]*:' deploy/compose*.yaml | grep -v ':latest}' || true)"
          [ -z "$stale" ] || { echo "Local image defaults must stay ume-rag/<service>:latest:"; echo "$stale"; exit 1; }
      - name: Production Compose files are valid
        env:
          UME_RAG_CERTS_DIR: /certs
          UME_RAG_SECRETS_DIR: ${{ runner.temp }}/secrets
          UME_RAG_OIDC_AUTHORITY: https://keycloak.example.se/realms/ume
          UME_RAG_GATEWAY_URL: https://llm.example.se
          UME_RAG_API_PUBLIC_URL: https://rag-api.example.se
          UME_RAG_OPENWEBUI_HOST: chat.example.se
          UME_RAG_OPENWEBUI_OIDC_CLIENT_ID: open-webui
          UME_RAG_OPENWEBUI_OIDC_PROVIDER_URL: https://keycloak.example.se/realms/ume/.well-known/openid-configuration
          UME_RAG_OPENWEBUI_DATA_DIR: /openwebui-data
        run: |
          # compose.openwebui.yaml reads its env_file while rendering.
          mkdir -p "$UME_RAG_SECRETS_DIR" && touch "$UME_RAG_SECRETS_DIR/openwebui.env"
          for files in "compose.prod.yaml" \
                       "compose.prod.yaml compose.ingestion.yaml" \
                       "compose.prod.yaml compose.ingestion.yaml compose.clamav-conf.yaml" \
                       "compose.prod.yaml compose.ingestion.yaml compose.host-24g.yaml compose.clamav-conf.yaml" \
                       "compose.prod.yaml compose.ingestion.yaml compose.rolling.yaml" \
                       "compose.openwebui.yaml"; do
            args=(); for f in $files; do args+=(-f "deploy/$f"); done
            echo "docker compose ${args[*]} config --quiet"
            docker compose "${args[@]}" config --quiet
          done
          # The upload copy job (profile backup).
          docker compose -f deploy/compose.prod.yaml --profile backup config --quiet
          # The renderer only with its profile (#505); the worker's dependency on it is optional.
          docker compose -f deploy/compose.prod.yaml -f deploy/compose.ingestion.yaml --profile render config --quiet
          if docker compose -f deploy/compose.prod.yaml -f deploy/compose.ingestion.yaml config --services | grep -qx rag-renderer; then
            echo "rag-renderer runs without the render profile"; exit 1
          fi
          # ClamAV only with its profile (#535; init-deployment.sh adds it unless --clamav off), alone, with the renderer
          # and with the ClamAV overlays; the worker's dependency on it is optional and its mode follows UME_RAG_CLAMAV_MODE.
          ingestion=(-f deploy/compose.prod.yaml -f deploy/compose.ingestion.yaml)
          for profiles in "clamav" "clamav render"; do
            args=(); for p in $profiles; do args+=(--profile "$p"); done
            docker compose "${ingestion[@]}" "${args[@]}" config --services | grep -qx rag-clamav
          done
          docker compose "${ingestion[@]}" -f deploy/compose.host-24g.yaml -f deploy/compose.clamav-conf.yaml \
            --profile clamav --profile render config --quiet
          if docker compose "${ingestion[@]}" --profile render config --services | grep -qx rag-clamav; then
            echo "rag-clamav runs without the clamav profile"; exit 1
          fi
          docker compose "${ingestion[@]}" config --format json | jq -e '.services["rag-worker"]
            | .environment.ClamAv__Mode == "on" and .depends_on["rag-clamav"].required == false' >/dev/null
          UME_RAG_CLAMAV_MODE=off docker compose "${ingestion[@]}" config --format json \
            | jq -e '.services["rag-worker"].environment.ClamAv__Mode == "off"' >/dev/null
          # deploy/host/docker-user-firewall.sh targets each network by its subnet (mirror is ClamAV's, so its profile on).
          { docker compose -f deploy/compose.prod.yaml -f deploy/compose.ingestion.yaml --profile clamav config --format json
            docker compose -f deploy/compose.openwebui.yaml config --format json; } \
            | jq -r '.networks | to_entries[] | "\(.key) \(.value.ipam.config[0].subnet)"' | sort > "$RUNNER_TEMP/subnets"
          bash deploy/host/docker-user-firewall.sh --print-subnets | sort | diff -u "$RUNNER_TEMP/subnets" -
          # The renderer is on the internal render network only, which it shares with the worker (§5.4, §6.1).
          docker compose -f deploy/compose.prod.yaml -f deploy/compose.ingestion.yaml --profile render config --format json | jq -e '
            (.services["rag-renderer"].networks | keys) == ["render"] and .networks.render.internal == true
            and ([.services | to_entries[] | select(.value.networks | has("render")) | .key] | sort) == ["rag-renderer", "rag-worker"]' >/dev/null
      - name: Kubernetes manifests are up to date and render
        # docs/kubernetes.md: the config copies match deploy/postgres, and the base, the example overlay and the overlay
        # with every optional component render. The bundle step below checks they get pinned images.
        # Kustomize from its pinned image: the self-hosted runner has no kubectl (Kustomize v5.7.1, as in kubectl 1.34).
        run: |
          kustomize() { docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/tmp/runner:ro" -w /repo \
            registry.k8s.io/kustomize/kustomize:v5.7.1@sha256:937e7832dc0b09288b1398399dadb97382a27bbc35bee8fdcac47c7de4fff14d \
            build "${1/#$RUNNER_TEMP//tmp/runner}"; }
          sh deploy/kubernetes/sync-config.sh
          git diff --exit-code -- deploy/kubernetes || { echo "Run deploy/kubernetes/sync-config.sh and commit the copies"; exit 1; }
          # A NetworkPolicy by name from a rendered file.
          np() { awk -v n="$2" '/^---$/ { if (f) exit; d = ""; next } { d = d $0 "\n" } $0 == "  name: " n { f = 1 } END { if (f) printf "%s", d }' "$1"; }
          kustomize deploy/kubernetes/base > "$RUNNER_TEMP/k8s-base.yaml"
          # The base denies all traffic to and from the stack's pods (#706); the policies after it allow the flows.
          diff -u - <(np "$RUNNER_TEMP/k8s-base.yaml" ume-rag-default-deny) <<'EOF'
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            labels:
              app.kubernetes.io/part-of: ume-rag
            name: ume-rag-default-deny
          spec:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: ume-rag
            policyTypes:
            - Ingress
            - Egress
          EOF
          kustomize deploy/kubernetes/example > "$RUNNER_TEMP/k8s-example.yaml"
          # ClamAV is its own component, in the example by default with the worker's ClamAv__Mode on (#535); without it
          # the overlay sets off, and nothing of rag-clamav is left but the worker's unused ClamAv__Host.
          awk '/^---/ { k = "" } /^kind: / { k = $2 } k == "Deployment" && /^  name: rag-clamav$/ { f = 1 } END { exit !f }' \
            "$RUNNER_TEMP/k8s-example.yaml"
          grep -qx '  ClamAv__Mode: "on"' "$RUNNER_TEMP/k8s-example.yaml"
          cp -R deploy/kubernetes "$RUNNER_TEMP/k8s-noclamav"
          sed -i -e 's|^  - \.\./components/clamav$|  # - ../components/clamav|' -e 's|# - ClamAv__Mode=off|- ClamAv__Mode=off|' \
            "$RUNNER_TEMP/k8s-noclamav/example/kustomization.yaml"
          kustomize "$RUNNER_TEMP/k8s-noclamav/example" > "$RUNNER_TEMP/k8s-noclamav.yaml"
          grep -qx '  ClamAv__Mode: "off"' "$RUNNER_TEMP/k8s-noclamav.yaml"
          if grep -v -x '  ClamAv__Host: rag-clamav' "$RUNNER_TEMP/k8s-noclamav.yaml" | grep -q rag-clamav; then
            echo "rag-clamav is rendered without components/clamav"; exit 1
          fi
          cp -R deploy/kubernetes "$RUNNER_TEMP/k8s"
          sed -i -e 's|# - \.\./components/renderer|- ../components/renderer|' "$RUNNER_TEMP/k8s/example/kustomization.yaml"
          kustomize "$RUNNER_TEMP/k8s/example" > "$RUNNER_TEMP/k8s.yaml"
          for kind in NetworkPolicy Deployment StatefulSet Job; do printf '%s ' "$kind"; grep -c "^kind: $kind$" "$RUNNER_TEMP/k8s.yaml"; done
          grep -q 'name: rag-renderer' "$RUNNER_TEMP/k8s.yaml"
          # Each NetworkPolicy once, the Ingress controller's among them.
          awk '/^---$/ { k = "" } /^kind: / { k = $2 } k == "NetworkPolicy" && /^  name: / { print $2 }' "$RUNNER_TEMP/k8s.yaml" \
            | sort | uniq -d | grep . && { echo "a NetworkPolicy is rendered twice"; exit 1; }
          np "$RUNNER_TEMP/k8s.yaml" ume-rag-ingress-controller | grep -q 'kubernetes.io/metadata.name: ingress-nginx'
          # The worker's crawl and freshclam reach public addresses only on 80 and 443 (#706): every egress rule has a
          # destination, and the one with 80 or 443 is 0.0.0.0/0 without the link-local range (cloud metadata), among
          # the private ones.
          for p in ume-rag-worker ume-rag-clamav; do
            np "$RUNNER_TEMP/k8s.yaml" "$p" | awk '
              /^  egress:/ { e = 1; next } e && /^  [a-z]/ { e = 0 } e && /^  - / { i++ }
              e && /- port: (80|443)$/ { web[i] = 1 } e && /^  [- ] to:$/ { to[i] = 1 }
              e && /cidr: 0\.0\.0\.0\/0$/ { any[i] = 1 } e && /- 169\.254\.0\.0\/16$/ { meta[i] = 1 }
              END { for (j = 1; j <= i; j++) { if (!to[j] || web[j] && !(any[j] && meta[j])) bad = 1; if (web[j]) w = 1 }
                exit bad || !w }' || { echo "$p: an egress rule has no destination, or 80/443 is not limited to public addresses"; exit 1; }
          done
      - name: The Portainer stack is what its template gives
        # deploy/portainer/compose.portainer.yaml is generated (build-stack.sh): a change to the template, to
        # bootstrap.sh or to a file it includes that was not followed by a rebuild fails here, not at a deploy. Built
        # from the gateway release the committed file names (a download from the gateway's public repository).
        run: sh deploy/portainer/build-stack.sh --check
      - name: Release bundle pins every image
        # deploy/build-release-bundle.sh (§7.2) with placeholder digests: every image of the bundled Compose files is
        # pinned by digest and they render; an unpinned image is refused. release.yml runs it with the pushed digests.
        env:
          UME_RAG_CERTS_DIR: /certs
          UME_RAG_SECRETS_DIR: /secrets
          UME_RAG_OIDC_AUTHORITY: https://keycloak.example.se/realms/ume
          UME_RAG_GATEWAY_URL: https://llm.example.se
          UME_RAG_API_PUBLIC_URL: https://rag-api.example.se
        run: |
          digest="sha256:$(printf '0%.0s' $(seq 64))"
          for v in API ADMIN WORKER MIGRATIONS PARSER CLAMAV RENDERER POSTGRES; do
            export "${v}_IMAGE=ghcr.io/example/ume-rag/${v,,}:0.0.0@$digest"
          done
          if out="$(PARSER_IMAGE=ume-rag/parser:latest bash deploy/build-release-bundle.sh 0.0.0 "$RUNNER_TEMP/unpinned" 2>&1)"; then
            echo "an unpinned image was accepted"; exit 1
          fi
          echo "$out"
          grep -q 'PARSER_IMAGE=ume-rag/parser:latest is not pinned' <<< "$out"
          bash deploy/build-release-bundle.sh 0.0.0 "$RUNNER_TEMP/bundle"
          tar -xzf "$RUNNER_TEMP/bundle/ume-rag-0.0.0.tar.gz" -C "$RUNNER_TEMP/bundle"
          b="$RUNNER_TEMP/bundle/ume-rag-0.0.0/deploy"
          # The bundle's defaults, not these variables, must carry the pins.
          for v in API ADMIN WORKER MIGRATIONS PARSER CLAMAV RENDERER POSTGRES; do unset "${v}_IMAGE"; done
          images="$(docker compose -f "$b/compose.prod.yaml" -f "$b/compose.ingestion.yaml" -f "$b/compose.rolling.yaml" --profile backup --profile clamav --profile render config --images)"
          echo "$images"
          if echo "$images" | grep -vE '@sha256:[0-9a-f]{64}$'; then echo "unpinned images in the bundle"; exit 1; fi
          # Kubernetes: every image of the example overlay with every component is pinned by digest.
          sed -i -e 's|# - \.\./components/renderer|- ../components/renderer|' "$b/kubernetes/example/kustomization.yaml"
          k8s_images="$(docker run --rm -u "$(id -u):$(id -g)" -v "$b/kubernetes:/k:ro" \
            registry.k8s.io/kustomize/kustomize:v5.7.1@sha256:937e7832dc0b09288b1398399dadb97382a27bbc35bee8fdcac47c7de4fff14d \
            build /k/example | sed -n 's/^ *-\{0,1\} *image: //p' | sort -u)"
          echo "$k8s_images"
          if echo "$k8s_images" | grep -vE '@sha256:[0-9a-f]{64}$'; then echo "unpinned Kubernetes images in the bundle"; exit 1; fi
          # The Portainer stack asset: RAG's images pinned to the release.
          grep -q "RAG_API_IMAGE:-ghcr.io/example/ume-rag/api:0.0.0@$digest" "$RUNNER_TEMP/bundle/compose.portainer.yaml"
      - name: init-deployment.sh keeps its secrets on a re-run
        # Two non-interactive runs into a copy of deploy/ (it writes next to itself): every generated secret, the worker's
        # crawl key pepper, rag-admin's setup secret and the renderer's WebSocket path among them, is unchanged by the
        # second run, and the deployer's UME_RAG_SETUP_REOPEN in deploy/.env is kept; the
        # gateway credential keys land one per service (a per-level key file or the Data API key left from before is
        # deleted, and the Data API options are refused); the Open WebUI files render with the generated deploy/.env;
        # --render turns the renderer's profile and the worker's endpoint on together; --clamav on|off sets the malware
        # scan's profile, mode and confs, and a re-run keeps it.
        run: |
          d="$RUNNER_TEMP/init"; mkdir -p "$d/keys"; cp -r deploy "$d/deploy"
          for k in api admin worker owui-secret; do printf '%s-placeholder\n' "$k" > "$d/keys/$k"; done
          init() {
            bash "$d/deploy/init-deployment.sh" --oidc-authority https://keycloak.example.se/realms/ume \
              --gateway-url https://llm.example.se --api-host rag-api.example.se --admin-host rag-admin.example.se \
              --gateway-credential-key-file api="$d/keys/api" --gateway-credential-key-file admin="$d/keys/admin" \
              --gateway-credential-key-file worker="$d/keys/worker" --openwebui-host chat.example.se \
              --openwebui-oidc-client-secret-file "$d/keys/owui-secret" \
              --proxy-address 10.1.2.3 --backup-target local --allow-file-keys --no-chown --yes "$@"
          }
          generated() {
            s="$d/deploy/secrets"
            sha256sum "$s"/.pepper "$s"/.openwebui-jwt-secret "$s"/postgres/*_password "$s"/api/Security__* \
              "$s"/admin/Setup__Secret "$s"/worker/Security__CrawlKeyPepper "$s"/.render-ws-path \
              "$s"/worker/Render__Endpoint "$s"/renderer.env \
              "$s"/keys/rag-blob-internal "$s"/pgbackrest/cipher-pass \
              "$s"/openwebui/webui_secret_key "$s"/.openwebui-rag-api-key "$d"/deploy/certs/data-protection.pfx
          }
          init --render > "$d/init.log"; generated > "$d/first"
          init --render > "$d/init.log"; generated > "$d/second"
          diff -u "$d/first" "$d/second"
          s="$d/deploy/secrets"
          [ "$(wc -c < "$s/worker/Security__CrawlKeyPepper")" = 64 ]
          # rag-admin's setup secret (M-20 S3): 32 random bytes, hex, in rag-admin's directory only; a re-run keeps the
          # deployer's re-open value, which reaches rag-admin as Setup__Reopen.
          grep -qxE '[0-9a-f]{64}' "$s/admin/Setup__Secret"
          [ -z "$(find "$s" -name Setup__Secret ! -path "$s/admin/*")" ]
          grep -qx 'UME_RAG_SETUP_REOPEN=' "$d/deploy/.env"
          sed -i 's/^UME_RAG_SETUP_REOPEN=.*/UME_RAG_SETUP_REOPEN=2026-11-15/' "$d/deploy/.env"
          init --render > "$d/init.log"
          grep -qx 'UME_RAG_SETUP_REOPEN=2026-11-15' "$d/deploy/.env"
          docker compose --env-file "$d/deploy/.env" config --format json \
            | jq -e '.services["rag-admin"].environment.Setup__Reopen == "2026-11-15"' >/dev/null
          # The renderer's secret path: the same in the worker's endpoint and the renderer's environment.
          grep -qxE 'UME_RAG_RENDER_WS_PATH=/[0-9a-f]{64}' "$s/renderer.env"
          [ "$(cat "$s/worker/Render__Endpoint")" = "ws://rag-renderer:3000$(sed -n 's/^UME_RAG_RENDER_WS_PATH=//p' "$s/renderer.env")" ]
          # One gateway credential key per service (#580); a per-level key file of before is deleted and named.
          for svc in api admin worker; do [ "$(cat "$s/$svc/Gateway__Key")" = "$svc-placeholder" ]; done
          printf 'old\n' > "$s/worker/Gateway__Keys__Eu"
          init --render > "$d/init.log"
          [ ! -e "$s/worker/Gateway__Keys__Eu" ]
          grep -q 'deleted the per-level key files worker/Gateway__Keys__Eu' "$d/init.log"
          # Open WebUI's key for rag-api (M-17 C4): generated once (kept above on a re-run), in Open WebUI's environment and
          # in rag-migrate's secret file OpenWebUi__ApiKey, which registers it as the deployment's own client.
          key="$(cat "$s/.openwebui-rag-api-key")"
          grep -qxE 'ume-rag-sk-[A-Za-z0-9]{43}' <<< "$key"
          grep -qx "OPENAI_API_KEYS='$key'" "$s/openwebui.env"
          [ "$(cat "$s/migrations/OpenWebUi__ApiKey")" = "$key" ]
          # Open WebUI's sign-in settings are rag-api's and rag-admin's deployment values (identity design §19): its client
          # secret in their secret files, not in Open WebUI's env file; without --openwebui-oidc-provider-url the provider
          # is no deployment value (rag-admin's authority's discovery document is the code's default).
          [ "$(cat "$s/api/OpenWebUi__Oidc__ClientSecret")" = "$(tr -d '\r\n' < "$d/keys/owui-secret")" ]
          [ "$(cat "$s/admin/OpenWebUi__Oidc__ClientSecret")" = "$(tr -d '\r\n' < "$d/keys/owui-secret")" ]
          if grep -q '^OAUTH_' "$s/openwebui.env"; then echo "openwebui.env still holds OAuth settings"; exit 1; fi
          grep -qx 'UME_RAG_OPENWEBUI_OIDC_PROVIDER_URL=' "$d/deploy/.env"
          if out="$(init --gateway-credential-key-file parser="$d/keys/api" 2>&1)"; then
            echo "a credential key for parser was accepted"; exit 1
          fi
          grep -q 'SERVICE is api, admin or worker' <<< "$out"
          # The Data API is gone (#580): the admin syncs with its credential key. A Data API key file of before is deleted
          # and named, the old options are refused, and nothing in .env or the admin's environment points at it.
          printf 'old\n' > "$s/admin/OrgSync__DataApiKey"
          init --render > "$d/init.log"
          [ ! -e "$s/admin/OrgSync__DataApiKey" ]
          grep -q 'deleted the Data API key file admin/OrgSync__DataApiKey' "$d/init.log"
          if out="$(init --org-sync-key-file "$d/keys/admin" 2>&1)"; then echo "--org-sync-key-file was accepted"; exit 1; fi
          grep -q -- '--org-sync-key-file is gone' <<< "$out"
          if grep -q ORG_SYNC "$d/deploy/.env"; then echo "deploy/.env still has a Data API setting"; exit 1; fi
          docker compose --env-file "$d/deploy/.env" config --format json \
            | jq -e '.services["rag-admin"].environment | has("OrgSync__BaseUrl") | not' >/dev/null
          # The published ports admit only the proxy (#453): --proxy-address lands in .env, the firewall rejects the rest.
          grep -qx 'UME_RAG_PROXY_SOURCES=10.1.2.3' "$d/deploy/.env"
          if out="$(init --proxy-address proxy.example.se 2>&1)"; then echo "a host name was accepted as --proxy-address"; exit 1; fi
          printf 'UME_RAG_API_PORT=8543\nUME_RAG_ADMIN_PORT=9543\nUME_RAG_PROXY_SOURCES=10.1.2.3\n' > "$d/proxy.env"
          rules="$(bash deploy/host/docker-user-firewall.sh --dry-run --env-file "$d/proxy.env" --dns 192.0.2.53)"
          grep -qF -- '-A UME-RAG-EGRESS -s 10.1.2.3 -p tcp -m conntrack --ctstate DNAT --ctorigdstport 8543 -j RETURN' <<< "$rules"
          grep -qF -- '-A UME-RAG-EGRESS -p tcp -m conntrack --ctstate DNAT --ctorigdstport 9543 -j REJECT' <<< "$rules"
          # Item 3: Open WebUI without --proxy says it can't reach rag-api.
          grep -q "Without --proxy, Open WebUI can't reach rag-api" "$d/init.log"
          docker compose -f "$d/deploy/compose.openwebui.yaml" --env-file "$d/deploy/.env" config --quiet
          docker compose --env-file "$d/deploy/.env" config --quiet
          # The renderer (#505): with --render its profile is in deploy/.env and the worker has the endpoint; without, neither.
          # The malware scan's profile clamav is on by default (#535), next to render.
          grep -qx 'COMPOSE_PROFILES=clamav,render' "$d/deploy/.env"
          grep -qx 'UME_RAG_CLAMAV_MODE=on' "$d/deploy/.env"
          docker compose --env-file "$d/deploy/.env" config --services | grep -qx rag-renderer
          docker compose --env-file "$d/deploy/.env" config --services | grep -qx rag-clamav
          init > "$d/init.log"
          [ ! -e "$s/worker/Render__Endpoint" ]
          grep -qx 'COMPOSE_PROFILES=clamav' "$d/deploy/.env"
          grep -q 'Renderer: off' "$d/init.log"
          if docker compose --env-file "$d/deploy/.env" config --services | grep -qx rag-renderer; then
            echo "rag-renderer runs without --render"; exit 1
          fi
          if grep -q 'Malware scan' "$d/init.log"; then echo "the malware scan is named off by default"; exit 1; fi
          # --clamav off (#535): UME_RAG_CLAMAV_MODE=off, no clamav profile (render stays as asked), no ClamAV confs or
          # their overlay even with --host-memory 24 and --freshclam-proxy, and a note; a re-run without the option keeps
          # off; --clamav on turns it on again. The 24 GB confs come from ../images/clamav, as in the repository.
          mkdir -p "$d/images" && cp -r images/clamav "$d/images/"
          init --host-memory 24 > "$d/init.log"
          [ -e "$s/clamav/clamd.conf" ]
          grep -q 'compose.clamav-conf.yaml' "$d/deploy/.env"
          init --clamav off --render --host-memory 24 --freshclam-proxy proxy.example.se:3128 > "$d/init.log"
          grep -qx 'UME_RAG_CLAMAV_MODE=off' "$d/deploy/.env"
          grep -qx 'COMPOSE_PROFILES=render' "$d/deploy/.env"
          [ ! -e "$s/clamav" ]
          if grep -q 'compose.clamav-conf.yaml' "$d/deploy/.env"; then echo "the ClamAV overlay is listed with --clamav off"; exit 1; fi
          grep -q 'Malware scan: off' "$d/init.log"
          docker compose --env-file "$d/deploy/.env" config --format json | jq -e '(.services | has("rag-clamav") | not)
            and .services["rag-worker"].environment.ClamAv__Mode == "off" and (.services | has("rag-renderer"))' >/dev/null
          init > "$d/init.log"
          grep -qx 'UME_RAG_CLAMAV_MODE=off' "$d/deploy/.env"
          grep -qx 'COMPOSE_PROFILES=' "$d/deploy/.env"
          grep -q 'Malware scan: off' "$d/init.log"
          init --clamav on > "$d/init.log"
          grep -qx 'UME_RAG_CLAMAV_MODE=on' "$d/deploy/.env"
          grep -qx 'COMPOSE_PROFILES=clamav' "$d/deploy/.env"
          docker compose --env-file "$d/deploy/.env" config --services | grep -qx rag-clamav
          if out="$(init --clamav maybe 2>&1)"; then echo "--clamav maybe was accepted"; exit 1; fi
          grep -q -- '--clamav must be on or off' <<< "$out"
          # --renew-certs reads deploy/.env, never runs it (#711): a value with a space and a ;-list, valid in Compose's
          # .env, don't stop the renewal, and rag-api's certificate keeps its public host name.
          printf 'UME_RAG_EXAMPLE_NAME=Umeå kommun\nUME_RAG_EXAMPLE_GROUPS=a;b;c\n' >> "$d/deploy/.env"
          bash "$d/deploy/init-deployment.sh" --renew-certs --yes > "$d/init.log"
          openssl x509 -in "$d/deploy/certs/api/api.crt" -noout -ext subjectAltName | grep -q 'DNS:rag-api.example.se'
      - name: init-deployment.sh --proxy writes an nginx config that nginx accepts
        # deploy/proxy/nginx.conf.example in the gateway's shape (#468): rendered for rag-api, rag-admin and Open WebUI,
        # then nginx -t with throwaway certificates (the pinned image of the AppHost's fixture site).
        run: |
          d="$RUNNER_TEMP/proxy"; mkdir -p "$d/keys" "$d/certs"; cp -r deploy "$d/deploy"; printf 'k\n' > "$d/keys/api"
          bash "$d/deploy/init-deployment.sh" --oidc-authority https://keycloak.example.se/realms/ume --gateway-url https://llm.example.se \
            --api-host rag-api.example.se --admin-host rag-admin.example.se --upstream-host 127.0.0.1 --proxy \
            --openwebui-host chat.example.se --gateway-credential-key-file api="$d/keys/api" --backup-target local --allow-file-keys --no-chown --yes > "$d/init.log"
          conf="$d/deploy/proxy/nginx.conf"
          if grep -n '@[A-Z_]*@' "$conf"; then echo "placeholders left in nginx.conf"; exit 1; fi
          grep -q 'server_name chat.example.se;' "$conf"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$d/certs/k.pem" -out "$d/certs/c.pem" -days 1 -subj /CN=ci >/dev/null 2>&1
          chmod 644 "$d/certs/k.pem"
          sed -e 's|# ssl_certificate     /etc/ssl/[^;]*;|ssl_certificate /certs/c.pem;|' -e 's|# ssl_certificate_key /etc/ssl/[^;]*;|ssl_certificate_key /certs/k.pem;|' \
            "$conf" > "$d/test.conf"
          docker run --rm -v "$d/test.conf:/etc/nginx/conf.d/default.conf:ro" -v "$d/certs:/certs:ro" \
            docker.io/nginxinc/nginx-unprivileged:1.31.6-alpine@sha256:884e0b7f42f303641b0f4e78755aea647521dca0b89ca3be7992ad78b5c07434 nginx -t
      - name: init-deployment.sh --domain gives the host names their defaults
        # Setup wizard S0: rag., rag-admin. and chat.<domain> in deploy/.env, the proxy's nginx.conf and rag-admin's
        # certificate; a host option given wins; a name that is not a domain is refused.
        run: |
          d="$RUNNER_TEMP/domain"; mkdir -p "$d/keys"; cp -r deploy "$d/deploy"; printf 'k\n' > "$d/keys/api"
          init() {
            bash "$d/deploy/init-deployment.sh" --oidc-authority https://keycloak.example.se/realms/ume \
              --gateway-url https://llm.example.se --gateway-credential-key-file api="$d/keys/api" --backup-target local \
              --allow-file-keys --no-chown --yes "$@" > "$d/init.log"
          }
          init --domain example.se
          if grep -q '^UME_RAG_OPENWEBUI_HOST=.' "$d/deploy/.env"; then echo '--domain alone set up Open WebUI'; exit 1; fi
          init --domain example.se --openwebui-oidc-client-id open-webui --proxy --upstream-host 127.0.0.1
          grep -qx 'UME_RAG_API_PUBLIC_URL=https://rag.example.se' "$d/deploy/.env"
          grep -qx 'UME_RAG_ADMIN_PUBLIC_HOST=rag-admin.example.se' "$d/deploy/.env"
          grep -qx 'UME_RAG_OPENWEBUI_HOST=chat.example.se' "$d/deploy/.env"
          for h in rag rag-admin chat; do grep -q "server_name $h.example.se;" "$d/deploy/proxy/nginx.conf"; done
          openssl x509 -in "$d/deploy/certs/admin/admin.crt" -noout -ext subjectAltName | grep -q 'DNS:rag-admin.example.se'
          init --domain example.se --admin-host admin.kommun.se
          grep -qx 'UME_RAG_API_PUBLIC_URL=https://rag.example.se:8543' "$d/deploy/.env"
          grep -qx 'UME_RAG_ADMIN_PUBLIC_HOST=admin.kommun.se' "$d/deploy/.env"
          if out="$(init --domain .example.se 2>&1)"; then echo "--domain .example.se was accepted"; exit 1; fi
          grep -q -- '--domain takes a domain name' <<< "$out"
      - name: init-deployment.sh without sign-in options leaves sign-in to the setup wizard
        # Setup wizard S6: no --oidc-* option is required or prompted. Without them nothing declares sign-in (no client
        # secret file, an empty authority and client id) and rag-admin renders without a non-empty Oidc__* value, so the
        # wizard's fields are free; the closing notes point at the wizard. --oidc-authority and --oidc-refuse-guests are
        # kept by a later re-run without them.
        run: |
          d="$RUNNER_TEMP/wizard"; mkdir -p "$d/keys"; cp -r deploy "$d/deploy"; printf 'k\n' > "$d/keys/api"
          s="$d/deploy/secrets/admin"
          init() {
            bash "$d/deploy/init-deployment.sh" --domain example.se --gateway-url https://llm.example.se \
              --gateway-credential-key-file api="$d/keys/api" --backup-target local --allow-file-keys --no-chown "$@" \
              < /dev/null > "$d/init.log"
          }
          init
          [ ! -e "$s/Oidc__ClientSecret" ] && [ ! -e "$s/Oidc__RefuseGuests" ]
          grep -qx 'UME_RAG_OIDC_AUTHORITY=' "$d/deploy/.env"
          grep -qx 'UME_RAG_OIDC_CLIENT_ID=' "$d/deploy/.env"
          grep -q 'Set up sign-in in the setup wizard' "$d/init.log"
          grep -q "logs rag-admin | grep 'Setup code'" "$d/init.log"
          docker compose --env-file "$d/deploy/.env" config --format json | jq -e '.services["rag-admin"].environment
            | (has("Oidc__RefuseGuests") | not)
              and ([to_entries[] | select((.key | startswith("Oidc__")) and (.value // "") != "")] | length == 0)' >/dev/null
          init --yes --oidc-authority https://keycloak.example.se/realms/ume --oidc-refuse-guests false
          init --yes
          grep -qx 'UME_RAG_OIDC_AUTHORITY=https://keycloak.example.se/realms/ume' "$d/deploy/.env"
          [ "$(cat "$s/Oidc__RefuseGuests")" = false ]
          docker compose --env-file "$d/deploy/.env" config --format json \
            | jq -e '.services["rag-admin"].environment.Oidc__Authority == "https://keycloak.example.se/realms/ume"' >/dev/null
          if out="$(init --yes --oidc-refuse-guests maybe 2>&1)"; then echo "--oidc-refuse-guests maybe was accepted"; exit 1; fi
          grep -q -- '--oidc-refuse-guests must be true or false' <<< "$out"
      - name: Pilot caps, Open WebUI key restriction and the feedback service account
        # Offline: docker compose config over the base files, the 24 GB overlay and the Open WebUI file (P1b item 17).
        run: bash deploy/tests/pilot-stack.sh
      - name: The Portainer stack's rag-bootstrap keeps its secrets on a re-run
        # rag-bootstrap alone, twice on the same throwaway volumes (#697): every secret existing data depends on, and every
        # owner and mode, is unchanged by the second run; the gateway credential keys follow the variable, else the
        # manifest's file.
        run: bash deploy/tests/portainer-rerun.sh
      - name: Open WebUI's settings match in Compose and the Portainer stack
        # #707: open-webui (compose.openwebui.yaml) and rag-openwebui (the generated compose.portainer.yaml) have the same
        # environment keys and values, apart from the deployment-specific ones the script lists.
        run: bash deploy/tests/openwebui-parity.sh
      - name: The Portainer stack's host names default under UME_DOMAIN
        # Setup wizard S0: offline, every place a host name is used renders rag., rag-admin. and chat.<domain> from
        # UME_DOMAIN, each UME_RAG_*_HOST overrides its own, the names alone work as before (never a name ending in a dot),
        # and with neither the stack refuses to render, naming both.
        run: bash deploy/tests/portainer-hosts.sh
      - name: The certificate expiry check warns 60 days ahead
        # #705: deploy/host/cert-expiry.sh (rag-cert-expiry.timer) passes on fresh certificates, writes certs.prom, and
        # fails naming the certificate that expires within 60 days.
        run: |
          c="$RUNNER_TEMP/cert-expiry"; mkdir -p "$c/postgres"
          cert() { openssl req -x509 -newkey rsa:2048 -nodes -keyout "$c/$1.key" -out "$c/$1.$2" -days "$3" -subj /CN=ci >/dev/null 2>&1; }
          cert ca pem 3650; cert postgres/postgres crt 825
          bash deploy/host/cert-expiry.sh --certs-dir "$c" --state-dir "$c/state"
          grep -q '^rag_cert_expiry_timestamp_seconds{file="postgres/postgres.crt"} [0-9]*$' "$c/state/certs.prom"
          cert postgres/postgres crt 30
          if out="$(bash deploy/host/cert-expiry.sh --certs-dir "$c" --state-dir "$c/state")"; then
            echo "a certificate 30 days from expiry passed"; exit 1
          fi
          echo "$out"
          grep -q '^warning: postgres/postgres.crt expires .* --renew-certs' <<< "$out"
      - name: Deployment scripts pass shellcheck
        run: shellcheck deploy/*.sh deploy/postgres/*.sh deploy/host/*.sh deploy/tests/*.sh deploy/portainer/*.sh deploy/kubernetes/*.sh
      - name: Host units pass systemd-analyze verify
        run: |
          units="$RUNNER_TEMP/units"
          bash deploy/host/install.sh --unit-dir "$units" --host-memory 24 --no-enable
          systemd-analyze verify "$units"/rag-*.slice "$units"/rag-*.service "$units"/rag-*.timer

  admin-ui:
    # The admin UI (repo-and-deployment §2.3, §8.2; admin design §10.2), as the gateway's "Verify UI" step: npm ci from
    # the lock only (src/admin-ui/.npmrc: ignore-scripts, min-release-age, allow-git=none; never npm install), npm audit
    # failing on any advisory (dated, dev-only exceptions in scripts/audit/), lint, typecheck, unit tests, build, then the gzip size budget and the design-system drift
    # report, which only warns. Node 24 as every gateway workflow; package.json engines asks for >= 22.
    needs: changes
    if: needs.changes.outputs.adminui == 'true'
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: src/admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/admin-ui/package-lock.json
      - name: Install from the lock
        run: npm ci
      - name: Audit dependencies
        # Production dependencies: any advisory fails. All dependencies: any advisory fails, except the dated, dev-only
        # exceptions in scripts/audit/npm-audit-exceptions.txt (e.g. lint toolchain fixes not yet 7 days old; issue
        # #61). An exception stops applying after its date, so the job turns red again unless the fix has landed. The
        # same check runs daily against main in audit.yml.
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          python3 -I ../../scripts/audit/audit.py npm "$RUNNER_TEMP/audit.json"
      - name: Lint, typecheck, test and build
        # messages.spec.ts checks every code in contracts/admin/v1/error-codes.json has a Swedish text.
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Size budget
        # Initial JS (shell + Översikt) <= 200 kB gzip, each lazy route <= 100 kB gzip (admin design §10.2).
        run: node ../../scripts/admin-ui-size-budget.mjs dist --landing OverviewView --initial-kb 200 --lazy-kb 100
      - name: Design-system drift (warning only)
        # Without a gateway checkout it compares the copies with design-system.lock only; it always exits 0.
        run: node scripts/design-system-drift.mjs
      - name: Browser tests (tests/e2e) audit and typecheck
        # The specs themselves run in e2e.yml against a running stack; here only their packages and types.
        working-directory: tests/e2e
        run: |
          npm ci
          npm audit --audit-level=low
          npm run typecheck
