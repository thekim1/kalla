name: Verify
# A pull request is verified on the merge with main (pull_request); a push only verifies main, so a branch with a pull
# request is not built twice. A branch without one can be verified from the Actions tab (workflow_dispatch).
# Jobs: ownership and backend (Stage 0), images (P0 checklist #5), parser and contract (P0 checklist #13), deploy-checks
# (P0 checklist #14), admin-ui (P0 checklist #3, plans/platform/repo-and-deployment.md §2.3, §8.2).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  ownership:
    # Every pull request, design-only ones included: a stream branch may change only its own and the shared paths.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Changed paths belong to the branch's stream
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" | python3 -I scripts/check-ownership.py "$HEAD_REF"

  changes:
    # Design documents (plans/**, platforms/**, root *.md) do not build anything (repo-and-deployment §1).
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      parser: ${{ steps.filter.outputs.parser }}
      deploy: ${{ steps.filter.outputs.deploy }}
      adminui: ${{ steps.filter.outputs.adminui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Anything besides design documents changed
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then range="$BEFORE...HEAD"; else range="$BEFORE..HEAD"; fi
          # The admin UI job has nothing to build in a tree without src/admin-ui (main before stream B's #45), even when
          # contracts/admin/ or this workflow changed.
          ui=false; [ -f src/admin-ui/package-lock.json ] && ui=true
          if [ "${{ github.event_name }}" != pull_request ] && [ "${{ github.event_name }}" != push ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            printf 'code=true\nparser=true\ndeploy=true\nadminui=%s\n' "$ui" >> "$GITHUB_OUTPUT"; exit 0
          fi
          flag() { [ -n "$1" ] && echo true || echo false; }
          code="$(git diff --name-only "$range" | grep -vE '^(plans/|platforms/)|^[^/]+\.md$' || true)"
          # The parser, its contract, the contract tests and fixtures, the worker's parser client, or this workflow.
          parser="$(git diff --name-only "$range" | grep -E '^(src/parser/|contracts/parser/|tests/Ume\.Rag\.ContractTests/|tests/fixtures/parser/|src/Ume\.Rag\.Worker/Parsing/|\.github/workflows/verify\.yml$)' || true)"
          # The production Compose files and init-deployment.sh, or this workflow.
          deploy="$(git diff --name-only "$range" | grep -E '^(deploy/|\.github/workflows/verify\.yml$)' || true)"
          # The admin UI, the error codes its Swedish texts are checked against, its size budget script, or this workflow.
          adminui="$(git diff --name-only "$range" | grep -E '^(src/admin-ui/|contracts/admin/|scripts/admin-ui-size-budget\.mjs$|\.github/workflows/verify\.yml$)' || true)"
          [ "$ui" = true ] || adminui=""
          { echo "code=$(flag "$code")"; echo "parser=$(flag "$parser")"; echo "deploy=$(flag "$deploy")"; echo "adminui=$(flag "$adminui")"; } >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - name: Build the Postgres image
        # The integration tests run against ume-rag/postgres as built from this commit, not only the stock base (hand-off
        # H3). The name has a registry part with a dot, so Testcontainers does not prefix it with the Docker Hub mirror
        # below (it would then pull mirror.gcr.io/ume-rag/postgres) and uses the local image.
        run: docker build -f images/postgres/Dockerfile -t ume-rag.local/postgres:ci --build-arg REVISION=${{ github.sha }} .
      - name: Build and test backend
        env:
          # Testcontainers pulls Postgres and its Ryuk image from Docker Hub, whose anonymous pull limit is shared by every
          # job on the runner's address; Google's mirror of Docker Hub is not subject to it (as the gateway).
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
          UME_RAG_TEST_POSTGRES_IMAGE: ume-rag.local/postgres:ci
        run: |
          dotnet build UmeRag.slnx -c Release --nologo
          # Tests marked [Trait(TestCategory.Name, TestCategory.Flaky)] run locally and in the weekly flake hunt, not here.
          dotnet test --solution UmeRag.slnx -c Release --no-build --filter-not-trait "Category=Flaky"
          dotnet list UmeRag.slnx package --vulnerable --include-transitive --format json > /tmp/ume-package-audit.json
          python -c "import json; d=json.load(open('/tmp/ume-package-audit.json')); p=[p for x in d.get('projects',[]) for f in x.get('frameworks',[]) for k in ('topLevelPackages','transitivePackages') for p in f.get(k,[]) if p.get('vulnerabilities')]; assert not p, 'Vulnerable .NET dependencies detected'"

  images:
    # ume-rag/postgres: the image test of repo-and-deployment §5.2 (pgvector version, HNSW build, pg_stat_statements,
    # wal_compression=lz4, TLS, archive-push, backup and restore from inside the image, read-only root, uid 999). The
    # image is pushed to ghcr only by release.yml (§8.1).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ume-rag/postgres
        run: |
          docker build -f images/postgres/Dockerfile -t ume-rag/postgres:ci --build-arg REVISION=${{ github.sha }} .
          docker image ls ume-rag/postgres:ci
      - name: Image test
        run: bash deploy/postgres/test.sh ume-rag/postgres:ci
      - name: Build ume-rag/clamav
        run: |
          docker build -t ume-rag/clamav:ci --build-arg REVISION=${{ github.sha }} images/clamav
          docker image ls ume-rag/clamav:ci
      - name: ClamAV image test
        # Offline: a one-line EICAR test signature in a fresh volume, no download from database.clamav.net
        # (images/clamav/test.sh --online exercises freshclam locally).
        run: bash images/clamav/test.sh ume-rag/clamav:ci

  deploy-checks:
    # Production Compose (P0 checklist #14, repo-and-deployment §8.2): every supported combination of the files renders
    # with `docker compose config` against placeholder settings, the image defaults stay the local :latest dev images
    # (a release bundle pins the pushed ones by digest, §7.2), the host firewall's subnets are the Compose networks', the
    # deployment scripts pass shellcheck and the host units pass systemd-analyze verify (deploy/host/).
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Local image defaults are untagged dev images
        run: |
          stale="$(grep -Hn 'ume-rag/[a-z]*:' deploy/compose*.yaml | grep -v ':latest}' || true)"
          [ -z "$stale" ] || { echo "Local image defaults must stay ume-rag/<service>:latest:"; echo "$stale"; exit 1; }
      - name: Production Compose files are valid
        env:
          UME_RAG_CERTS_DIR: /certs
          UME_RAG_SECRETS_DIR: ${{ runner.temp }}/secrets
          UME_RAG_OIDC_AUTHORITY: https://idp.example.se
          UME_RAG_GATEWAY_URL: https://llm.example.se
          UME_RAG_API_PUBLIC_URL: https://rag-api.example.se
          UME_RAG_OPENWEBUI_HOST: chat.example.se
          UME_RAG_OPENWEBUI_OIDC_CLIENT_ID: open-webui
          UME_RAG_OPENWEBUI_OIDC_PROVIDER_URL: https://idp.example.se/.well-known/openid-configuration
          UME_RAG_OPENWEBUI_DATA_DIR: /openwebui-data
        run: |
          # compose.openwebui.yaml reads its env_file while rendering.
          mkdir -p "$UME_RAG_SECRETS_DIR" && touch "$UME_RAG_SECRETS_DIR/openwebui.env"
          for files in "compose.prod.yaml" \
                       "compose.prod.yaml compose.ingestion.yaml" \
                       "compose.prod.yaml compose.ingestion.yaml compose.clamav-conf.yaml" \
                       "compose.prod.yaml compose.ingestion.yaml compose.host-24g.yaml compose.clamav-conf.yaml" \
                       "compose.openwebui.yaml"; do
            args=(); for f in $files; do args+=(-f "deploy/$f"); done
            echo "docker compose ${args[*]} config --quiet"
            docker compose "${args[@]}" config --quiet
          done
          # The upload copy job (profile backup).
          docker compose -f deploy/compose.prod.yaml --profile backup config --quiet
          # deploy/host/docker-user-firewall.sh targets each network by its subnet.
          { docker compose -f deploy/compose.prod.yaml -f deploy/compose.ingestion.yaml config --format json
            docker compose -f deploy/compose.openwebui.yaml config --format json; } \
            | jq -r '.networks | to_entries[] | "\(.key) \(.value.ipam.config[0].subnet)"' | sort > "$RUNNER_TEMP/subnets"
          bash deploy/host/docker-user-firewall.sh --print-subnets | sort | diff -u "$RUNNER_TEMP/subnets" -
      - name: Deployment scripts pass shellcheck
        run: shellcheck deploy/*.sh deploy/postgres/*.sh deploy/host/*.sh
      - name: Host units pass systemd-analyze verify
        run: |
          units="$RUNNER_TEMP/units"
          bash deploy/host/install.sh --unit-dir "$units" --host-memory 24 --no-enable
          systemd-analyze verify "$units"/rag-*.slice "$units"/rag-*.service "$units"/rag-*.timer

  admin-ui:
    # The admin UI (repo-and-deployment §2.3, §8.2; admin design §10.2), as the gateway's "Verify UI" step: npm ci from
    # the lock only (src/admin-ui/.npmrc: ignore-scripts, min-release-age, allow-git=none; never npm install), npm audit
    # failing on any advisory, lint, typecheck, unit tests, build, then the gzip size budget and the design-system drift
    # report, which only warns. Node 24 as every gateway workflow; package.json engines asks for >= 22.
    needs: changes
    if: needs.changes.outputs.adminui == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/admin-ui/package-lock.json
      - name: Install from the lock
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Lint, typecheck, test and build
        # messages.spec.ts checks every code in contracts/admin/v1/error-codes.json has a Swedish text.
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Size budget
        # Initial JS (shell + Översikt) <= 200 kB gzip, each lazy route <= 100 kB gzip (admin design §10.2).
        run: node ../../scripts/admin-ui-size-budget.mjs dist --landing OverviewView --initial-kb 200 --lazy-kb 100
      - name: Design-system drift (warning only)
        # Without a gateway checkout it compares the copies with design-system.lock only; it always exits 0.
        run: node scripts/design-system-drift.mjs

  parser:
    # The parser sidecar (plans/parser/design.md §15.1, repo-and-deployment §8.2): lock, lint, unit and supervisor tests
    # and the schema export on the runner; then the image's test target (real Docling, models and Tesseract, including
    # test_offline.py) with no network at all. Runs only when the parser or its contract changed (changes.parser); a
    # skipped job counts as passed for required checks. The image layers come from the GitHub Actions cache, shared with
    # the contract job (the blobs are content-addressed, so the two scopes store them once).
    needs: changes
    if: needs.changes.outputs.parser == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/parser
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        # The parser image is about 3 GB and buildx keeps a second copy while loading it; the hosted runner's free space
        # is not enough without removing preinstalled toolchains this job does not use.
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h / | tail -1
      - name: Install uv from the image the Dockerfile pins
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cid="$(docker create ghcr.io/astral-sh/uv:0.13.5@sha256:32a7bb39b496babbd997b0a39a4d66c126bdaf5661b302bf6f06abda8deca6ff x)"
          docker cp "$cid:/uv" "$RUNNER_TEMP/bin/uv"
          docker rm "$cid"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lock, lint and tests
        run: |
          uv lock --check
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest
      - name: Committed schemas match the models
        run: |
          uv run python -m scripts.export_schema
          git diff --exit-code -- ../../contracts/
          test -z "$(git status --porcelain --untracked-files=all -- ../../contracts/)"
      - name: pip-audit against the locked export
        # torch and torchvision come from the PyTorch CPU index, which pip-audit cannot look up; it lists them as skipped.
        run: |
          uv export --frozen --no-emit-project --format requirements.txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/requirements.txt" --require-hashes --disable-pip --progress-spinner off
      - uses: docker/setup-buildx-action@v4
      - name: Build the image's test target
        uses: docker/build-push-action@v7
        with:
          context: src/parser
          target: test
          build-args: REVISION=${{ github.sha }}
          tags: ume-rag/parser:test
          load: true
          cache-from: |
            type=gha,scope=parser-test
            type=gha,scope=parser-runtime
          cache-to: type=gha,scope=parser-test,mode=max
      - name: Tests in the image without network
        run: docker run --rm --network none ume-rag/parser:test

  contract:
    # Ume.Rag.ContractTests (parser design §15.2): the worker's parser client against the parser image built from this
    # commit; responses and error cases validated against contracts/parser/v1/ and compared with the goldens. Same
    # trigger and cache as the parser job. The backend job runs the same project without the image, so there the
    # image tests skip.
    needs: changes
    if: needs.changes.outputs.parser == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        # The parser image is about 3 GB and buildx keeps a second copy while loading it; the hosted runner's free space
        # is not enough without removing preinstalled toolchains this job does not use.
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h / | tail -1
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401
      - uses: docker/setup-buildx-action@v4
      - name: Build the parser image
        # The name has a registry part with a dot, so Testcontainers does not prefix it with the Docker Hub mirror below.
        uses: docker/build-push-action@v7
        with:
          context: src/parser
          build-args: REVISION=${{ github.sha }}
          tags: ume-rag.local/parser:ci
          load: true
          cache-from: |
            type=gha,scope=parser-runtime
            type=gha,scope=parser-test
          cache-to: type=gha,scope=parser-runtime,mode=max
      - name: Contract tests
        env:
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
          UME_RAG_TEST_PARSER_IMAGE: ume-rag.local/parser:ci
        run: dotnet test --project tests/Ume.Rag.ContractTests/Ume.Rag.ContractTests.csproj -c Release
