name: Verify
# Every job runs on the self-hosted runner (labels self-hosted, linux, x64; GitHub-hosted minutes are used up). Every
# pull request that is not a draft is verified on the merge with main (pull_request) on open, on each push and when it
# leaves draft; a newer push cancels the older run of the same pull request. Merge only on a green run (private repo on
# the free plan: GitHub cannot enforce required checks). Nothing runs on a push to main; main or any branch can be
# verified from the Actions tab (workflow_dispatch), and release.yml calls this workflow in full.
# Jobs: ownership and backend (Stage 0), doc-refs (plans/archive/doc-restructure.md), evaluation-smoke (P1 item 17), images (P0 checklist #5), renderer
# (connectors design §8.3), deploy-checks (P0 checklist #14), admin-ui (P0 checklist #3,
# plans/platform/repo-and-deployment.md §2.3, §8.2). The parser and contract
# jobs (P0 checklist #13) are in parser.yml, which runs them only when the parser changed. The dependency audits of the
# backend and admin-ui jobs (scripts/audit/) also run daily against main in audit.yml.
# Lean pull requests (user, 2026-11-05, 2026-11-17): backend skips a change that touches only paths it never reads (docs,
# deploy, admin UI, parser, renderer image, infra, other workflows, scripts it does not run); images, renderer and
# evaluation-smoke run only when their paths changed; a dispatch and release.yml run every job. The browser tests (e2e.yml) run only before a release (called by release.yml) or by hand.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  # Both self-hosted runners share one machine and user: MSBuild's reused worker nodes and build servers would be shared
  # between concurrent jobs, and the runner's end-of-job cleanup kills them under the other job (MSB4166).
  MSBUILDDISABLENODEREUSE: "1"
  DOTNET_CLI_USE_MSBUILD_SERVER: "0"
  UseSharedCompilation: "false"
jobs:
  ownership:
    # Every pull request that is not a draft, design-only ones included: a stream branch may change only its own and the
    # shared paths.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Changed paths belong to the branch's stream
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" | python3 -I scripts/check-ownership.py "$HEAD_REF"

  doc-refs:
    # Every design-section citation ("engine design §9.6") in code, tests and documents names a section that exists,
    # and every relative Markdown link resolves (scripts/check-doc-refs.py). Design-only pull requests included.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Section citations and links resolve
        run: python3 -I scripts/check-doc-refs.py
      - name: Unreleased change notes are well-formed
        # changes/README.md: one file per pull request instead of appending to CHANGELOG.md's Unreleased.
        run: python3 -I scripts/unreleased.py check
      - name: Every action is pinned by commit SHA
        # A tag can be moved to other code; the runners hold the release's and Azure's secrets (#506). The version is the
        # comment after the SHA. Local reusable workflows (./.github/...) are this repository's own.
        run: |
          unpinned="$(grep -rnE '^\s*(- )?uses:' .github/workflows | grep -vE 'uses: \./' \
            | grep -vE 'uses: [A-Za-z0-9._/-]+@[0-9a-f]{40} # v[0-9]+\.[0-9]+\.[0-9]+$' || true)"
          if [ -n "$unpinned" ]; then echo "$unpinned"; echo "::error::pin each action as owner/name@<40-hex commit> # vX.Y.Z"; exit 1; fi

  changes:
    # Design documents (plans/**, platforms/**, root *.md) do not build anything (repo-and-deployment §1). On a pull
    # request only when it is not a draft (see the top); the other jobs need this one, so they skip with it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: [self-hosted, linux, x64]
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deploy: ${{ steps.filter.outputs.deploy }}
      adminui: ${{ steps.filter.outputs.adminui }}
      images: ${{ steps.filter.outputs.images }}
      renderer: ${{ steps.filter.outputs.renderer }}
      smoke: ${{ steps.filter.outputs.smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        name: Anything besides design documents changed
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then range="$BEFORE...HEAD"; else range="$BEFORE..HEAD"; fi
          # The admin UI job has nothing to build in a tree without src/admin-ui (main before stream B's #45), even when
          # contracts/admin/ or this workflow changed.
          ui=false; [ -f src/admin-ui/package-lock.json ] && ui=true
          # Everything for a tag (release.yml), a moved one too: its push's "before" is the old tag, which exists, and
          # would otherwise filter the release down to what changed since the old tag (0.6.0's second tag run).
          if [ "${{ github.event_name }}" != pull_request ] && [ "${{ github.event_name }}" != push ] \
            || [ "$REF_TYPE" = tag ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            printf 'code=true\ndeploy=true\nadminui=%s\nimages=true\nrenderer=true\nsmoke=true\n' "$ui" >> "$GITHUB_OUTPUT"; exit 0
          fi
          flag() { [ -n "$1" ] && echo true || echo false; }
          # The backend job: anything besides what its build and tests never read, plus the files of those paths that
          # they do read (the Postgres init and role scripts and postgresql.conf, the Keycloak realm files,
          # docs/security-events.md, docs/openapi/, the test runner script, the dev seed SQL, the audit script, this
          # workflow). Left out: the design documents, docs/, deploy/ (deploy-checks), the admin UI and the browser
          # tests (admin-ui; contracts/admin/ stays here), the parser (parser.yml; its fixtures and contract stay
          # here), the renderer image (renderer), infra/ (entra.yml), the other workflows and .github files,
          # unreleased change notes, benchmarks/ and the other scripts. A dispatch and release.yml run everything.
          changed="$(git diff --name-only "$range")"
          code="$(grep -vE '^(plans/|platforms/|docs/|deploy/|src/admin-ui/|tests/e2e/|src/parser/|images/renderer/|infra/|\.github/|changes/|benchmarks/|scripts/)|^[^/]+\.md$|^(LICENSE|NOTICE)$' <<< "$changed" || true)"
          code="$code$(grep -E '^(deploy/postgres/|deploy/keycloak/|docs/security-events\.md$|docs/openapi/|scripts/ci/backend-tests\.sh$|scripts/dev/|scripts/audit/|\.github/workflows/verify\.yml$)' <<< "$changed" || true)"
          # The production Compose files and init-deployment.sh, or this workflow.
          deploy="$(git diff --name-only "$range" | grep -E '^(deploy/|\.github/workflows/verify\.yml$)' || true)"
          # The admin UI, the error codes its Swedish texts are checked against, its size budget or audit script, its browser
          # tests, or this workflow.
          adminui="$(git diff --name-only "$range" | grep -E '^(src/admin-ui/|tests/e2e/|contracts/admin/|scripts/admin-ui-size-budget\.mjs$|scripts/audit/|\.github/workflows/verify\.yml$)' || true)"
          [ "$ui" = true ] || adminui=""
          # Lean pull requests (repo-and-deployment §8.2): the image tests only when an image or its test changed, the
          # renderer's image and container tests when the image, the worker's render code (or the Playwright pin, which
          # moves with the image) or the container test changed, the evaluation smoke only when the code on its path
          # (ingestion, retrieval, answering) or the smoke set changed. A dispatch and release.yml run everything.
          images="$(git diff --name-only "$range" | grep -E '^(images/postgres/|images/clamav/|deploy/postgres/|\.github/workflows/verify\.yml$)' || true)"
          renderer="$(git diff --name-only "$range" | grep -E '^(images/renderer/|src/Kalla\.Worker/Connectors/Render/|src/Kalla\.Worker/Connectors/Http/PageFetcher\.cs$|tests/Kalla\.Worker\.Tests/Connectors/RendererContainerTests\.cs$|Directory\.Packages\.props$|\.github/workflows/verify\.yml$)' || true)"
          smoke="$(git diff --name-only "$range" | grep -E '^(src/Kalla\.(Worker|Retrieval|Answering|Api|Infrastructure|Pipelines|Domain)/|tests/evaluation/|tests/Kalla\.Worker\.Tests/Evaluation|images/postgres/|Directory\.(Packages|Build)\.(props|targets)$|global\.json$|\.github/workflows/verify\.yml$)' || true)"
          { echo "code=$(flag "$code")"; echo "deploy=$(flag "$deploy")"; echo "adminui=$(flag "$adminui")"
            echo "images=$(flag "$images")"; echo "renderer=$(flag "$renderer")"; echo "smoke=$(flag "$smoke")"; } >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.401
      - name: Build the Postgres image
        # The integration tests run against kalla/postgres as built from this commit, not only the stock base (hand-off
        # H3). The name has a registry part with a dot, so Testcontainers does not prefix it with the Docker Hub mirror
        # below (it would then pull mirror.gcr.io/kalla/postgres) and uses the local image.
        run: docker build -f images/postgres/Dockerfile -t kalla.local/postgres:ci --build-arg REVISION=${{ github.sha }} .
      - name: Build the ClamAV image
        # The worker's ClamAV client test (tests/Kalla.Worker.Tests, connectors design §18) talks to clamd as built from
        # this commit, with an offline test signature; the dotted registry part keeps Testcontainers on the local image.
        run: docker build -t kalla.local/clamav:ci --build-arg REVISION=${{ github.sha }} images/clamav
      - name: Build and test backend
        env:
          # Testcontainers pulls Postgres and its Ryuk image from Docker Hub, whose anonymous pull limit is shared by every
          # job on the runner's address; Google's mirror of Docker Hub is not subject to it (as the gateway).
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
          KALLA_TEST_POSTGRES_IMAGE: kalla.local/postgres:ci
          KALLA_TEST_CLAMAV_IMAGE: kalla.local/clamav:ci
        run: |
          dotnet build Kalla.slnx -c Release --nologo
          # Tests marked [Trait(TestCategory.Name, TestCategory.Flaky)] run locally and in the weekly flake hunt, not here;
          # the evaluation smoke test has a job of its own (evaluation-smoke). The script runs every test project as a
          # process of its own, all at once, and Kalla.AdminApi.Tests as five (its collections wait for one another
          # inside one process and set this job's time); it prints each process's totals and their sum.
          scripts/ci/backend-tests.sh Release
          dotnet list Kalla.slnx package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/kalla-package-audit.json"
          # The same check runs daily against main in audit.yml.
          python3 -I scripts/audit/audit.py dotnet "$RUNNER_TEMP/kalla-package-audit.json"

  evaluation-smoke:
    # Knowledge design §16.4, repo-and-deployment §8.2: without the AppHost, the 13 pages of tests/evaluation/smoke go
    # through the worker (an upload batch; Markdown is parsed in the worker, so no parser or ClamAV image) into
    # kalla/postgres as built from this commit, then the 30 questions through kalla-api in process on the FakeGateway:
    # recall@10 >= 0.8 on POST /v1/retrieve and a citation on every chat answer (EvaluationSmokeTests in
    # tests/Kalla.Worker.Tests, trait Category=EvaluationSmoke, which the backend job leaves out). Detailed output
    # prints the recall numbers.
    needs: changes
    if: needs.changes.outputs.smoke == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.401
      - name: Build the Postgres image
        # As in the backend job: the dotted registry part keeps Testcontainers on the local image.
        run: docker build -f images/postgres/Dockerfile -t kalla.local/postgres:ci --build-arg REVISION=${{ github.sha }} .
      - name: Ingest the smoke set and run its 30 questions
        env:
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
          KALLA_TEST_POSTGRES_IMAGE: kalla.local/postgres:ci
        run: |
          dotnet build tests/Kalla.Worker.Tests -c Release --nologo
          dotnet test --project tests/Kalla.Worker.Tests -c Release --no-build --filter-trait "Category=EvaluationSmoke" --output Detailed

  images:
    # kalla/postgres: the image test of repo-and-deployment §5.2 (pgvector version, HNSW build, pg_stat_statements,
    # wal_compression=lz4, TLS, archive-push, backup and restore from inside the image, read-only root, uid 999);
    # kalla/clamav (§5.5) with its own test; kalla/renderer (§5.4) is in the renderer job. The images are pushed to
    # ghcr only by release.yml (§8.1).
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build kalla/postgres
        run: |
          docker build -f images/postgres/Dockerfile -t kalla/postgres:ci --build-arg REVISION=${{ github.sha }} .
          docker image ls kalla/postgres:ci
      - name: Image test
        run: bash deploy/postgres/test.sh kalla/postgres:ci
      - name: Build kalla/clamav
        run: |
          docker build -t kalla/clamav:ci --build-arg REVISION=${{ github.sha }} images/clamav
          docker image ls kalla/clamav:ci
      - name: ClamAV image test
        # Offline: a one-line EICAR test signature in a fresh volume, no download from database.clamav.net
        # (images/clamav/test.sh --online exercises freshclam locally).
        run: bash images/clamav/test.sh kalla/clamav:ci

  renderer:
    # kalla/renderer (repo-and-deployment §5.4) with its image test, then the worker rendering a fixture SPA through
    # that image (RendererContainerTests in tests/Kalla.Worker.Tests, connectors design §8.3), which the backend job
    # skips because it does not set KALLA_TEST_RENDERER_IMAGE.
    needs: changes
    if: needs.changes.outputs.renderer == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.401
      - name: Build kalla/renderer
        # The dotted registry part keeps Testcontainers on the local image (as the backend job's images).
        run: |
          docker build -t kalla/renderer:ci -t kalla.local/renderer:ci --build-arg REVISION=${{ github.sha }} images/renderer
          docker image ls kalla/renderer:ci
      - name: Renderer image test
        # Hardened as in Compose with images/renderer/seccomp.json on an internal network of its own: refuses to start
        # without its secret path, Chromium's sandbox on, a routed page renders, no WebRTC candidate, and nothing outside
        # the network resolves or connects from inside the renderer (connectors design §8.3).
        run: bash images/renderer/test.sh kalla/renderer:ci
      - name: Worker renders through the image
        # The image as Compose runs it, on a network of its own (10.215.0.0/24). --fail-skips and
        # --minimum-expected-tests turn a skip (no image variable) or a filter that matches nothing into a failure.
        env:
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: mirror.gcr.io/
          KALLA_TEST_RENDERER_IMAGE: kalla.local/renderer:ci
        run: |
          dotnet build tests/Kalla.Worker.Tests -c Release --nologo
          dotnet test --project tests/Kalla.Worker.Tests -c Release --no-build \
            --filter-class "Kalla.Worker.Tests.Connectors.RendererContainerTests" --fail-skips on --minimum-expected-tests 1

  deploy-checks:
    # Production Compose (P0 checklist #14, repo-and-deployment §8.2): deploy/compose.rag.yaml with every supported
    # combination of its overlays and profiles renders with `docker compose config` against placeholder settings, every
    # image is pinned by digest (a release bundle pins the pushed ones, §7.2, checked here with placeholder digests),
    # init-deployment.sh writes deploy/.env and the host firewall's subnets are compose.hardened.yaml's, kalla-bootstrap
    # keeps its secrets on a re-run in the Compose form and in the Portainer stack, the deployment scripts pass
    # shellcheck and the host units pass systemd-analyze verify (deploy/host/).
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose files are valid and pin every image
        env:
          FORS_DOMAIN: example.se
          KALLA_GATEWAY_URL: https://llm.example.se
          KALLA_BACKUP_TARGET: local
        run: |
          profiles=(--profile clamav --profile render --profile openwebui --profile proxy --profile backup)
          for files in "rag" "rag backup" "rag hardened" "rag backup hardened" "rag host-24g clamav-conf" \
                       "rag clamav-conf" "rag rolling" "rag backup hardened host-24g clamav-conf rolling"; do
            args=(); for f in $files; do args+=(-f "deploy/compose.$f.yaml"); done
            echo "docker compose ${args[*]} config --quiet"
            docker compose "${args[@]}" config --quiet
            docker compose "${args[@]}" "${profiles[@]}" config --quiet
          done
          all=(-f deploy/compose.rag.yaml -f deploy/compose.backup.yaml -f deploy/compose.hardened.yaml
            -f deploy/compose.host-24g.yaml -f deploy/compose.clamav-conf.yaml -f deploy/compose.rolling.yaml)
          images="$(docker compose "${all[@]}" "${profiles[@]}" config --images | sort -u)"
          echo "$images"
          if echo "$images" | grep -vE '@sha256:[0-9a-f]{64}$'; then echo "images not pinned by digest"; exit 1; fi
          # Each optional service only with its profile (#505, #535, S3); the worker's dependency on ClamAV is optional.
          base=(-f deploy/compose.rag.yaml)
          for svc in kalla-clamav kalla-renderer kalla-openwebui kalla-openwebui-setup kalla-proxy; do
            if docker compose "${base[@]}" --profile backup config --services | grep -qx "$svc"; then
              echo "$svc runs without its profile"; exit 1
            fi
          done
          docker compose "${base[@]}" config --format json | jq -e '.services["kalla-worker"].depends_on["kalla-clamav"].required == false' >/dev/null
          # The renderer is on the internal render network only, which it shares with the worker (§5.4, §6.1).
          docker compose "${base[@]}" --profile render config --format json | jq -e '
            (.services["kalla-renderer"].networks | keys) == ["kalla-render"] and .networks["kalla-render"].internal == true
            and ([.services | to_entries[] | select(.value.networks | has("kalla-render")) | .key] | sort) == ["kalla-renderer", "kalla-worker"]' >/dev/null
      - name: Kubernetes manifests are up to date and render
        # docs/kubernetes.md: the config copies match deploy/postgres, and the base, the example overlay and the overlay
        # with every optional component render. The bundle step below checks they get pinned images.
        # Kustomize from its pinned image: the self-hosted runner has no kubectl (Kustomize v5.7.1, as in kubectl 1.34).
        run: |
          kustomize() { docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/tmp/runner:ro" -w /repo \
            registry.k8s.io/kustomize/kustomize:v5.7.1@sha256:937e7832dc0b09288b1398399dadb97382a27bbc35bee8fdcac47c7de4fff14d \
            build "${1/#$RUNNER_TEMP//tmp/runner}"; }
          sh deploy/kubernetes/sync-config.sh
          git diff --exit-code -- deploy/kubernetes || { echo "Run deploy/kubernetes/sync-config.sh and commit the copies"; exit 1; }
          # A NetworkPolicy by name from a rendered file.
          np() { awk -v n="$2" '/^---$/ { if (f) exit; d = ""; next } { d = d $0 "\n" } $0 == "  name: " n { f = 1 } END { if (f) printf "%s", d }' "$1"; }
          kustomize deploy/kubernetes/base > "$RUNNER_TEMP/k8s-base.yaml"
          # The base denies all traffic to and from the stack's pods (#706); the policies after it allow the flows.
          diff -u - <(np "$RUNNER_TEMP/k8s-base.yaml" kalla-default-deny) <<'EOF'
          apiVersion: networking.k8s.io/v1
          kind: NetworkPolicy
          metadata:
            labels:
              app.kubernetes.io/part-of: kalla
            name: kalla-default-deny
          spec:
            podSelector:
              matchLabels:
                app.kubernetes.io/name: kalla
            policyTypes:
            - Ingress
            - Egress
          EOF
          kustomize deploy/kubernetes/example > "$RUNNER_TEMP/k8s-example.yaml"
          # ClamAV is its own component, in the example by default with the worker's ClamAv__Mode on (#535); without it
          # the overlay sets off, and nothing of kalla-clamav is left but the worker's unused ClamAv__Host.
          awk '/^---/ { k = "" } /^kind: / { k = $2 } k == "Deployment" && /^  name: kalla-clamav$/ { f = 1 } END { exit !f }' \
            "$RUNNER_TEMP/k8s-example.yaml"
          grep -qx '  ClamAv__Mode: "on"' "$RUNNER_TEMP/k8s-example.yaml"
          cp -R deploy/kubernetes "$RUNNER_TEMP/k8s-noclamav"
          sed -i -e 's|^  - \.\./components/clamav$|  # - ../components/clamav|' -e 's|# - ClamAv__Mode=off|- ClamAv__Mode=off|' \
            "$RUNNER_TEMP/k8s-noclamav/example/kustomization.yaml"
          kustomize "$RUNNER_TEMP/k8s-noclamav/example" > "$RUNNER_TEMP/k8s-noclamav.yaml"
          grep -qx '  ClamAv__Mode: "off"' "$RUNNER_TEMP/k8s-noclamav.yaml"
          if grep -v -x '  ClamAv__Host: kalla-clamav' "$RUNNER_TEMP/k8s-noclamav.yaml" | grep -q kalla-clamav; then
            echo "kalla-clamav is rendered without components/clamav"; exit 1
          fi
          cp -R deploy/kubernetes "$RUNNER_TEMP/k8s"
          sed -i -e 's|# - \.\./components/renderer|- ../components/renderer|' "$RUNNER_TEMP/k8s/example/kustomization.yaml"
          kustomize "$RUNNER_TEMP/k8s/example" > "$RUNNER_TEMP/k8s.yaml"
          for kind in NetworkPolicy Deployment StatefulSet Job; do printf '%s ' "$kind"; grep -c "^kind: $kind$" "$RUNNER_TEMP/k8s.yaml"; done
          grep -q 'name: kalla-renderer' "$RUNNER_TEMP/k8s.yaml"
          # Each NetworkPolicy once, the Ingress controller's among them.
          awk '/^---$/ { k = "" } /^kind: / { k = $2 } k == "NetworkPolicy" && /^  name: / { print $2 }' "$RUNNER_TEMP/k8s.yaml" \
            | sort | uniq -d | grep . && { echo "a NetworkPolicy is rendered twice"; exit 1; }
          np "$RUNNER_TEMP/k8s.yaml" kalla-ingress-controller | grep -q 'kubernetes.io/metadata.name: ingress-nginx'
          # The worker's crawl and freshclam reach public addresses only on 80 and 443 (#706): every egress rule has a
          # destination, and the one with 80 or 443 is 0.0.0.0/0 without the link-local range (cloud metadata), among
          # the private ones.
          for p in kalla-worker kalla-clamav; do
            np "$RUNNER_TEMP/k8s.yaml" "$p" | awk '
              /^  egress:/ { e = 1; next } e && /^  [a-z]/ { e = 0 } e && /^  - / { i++ }
              e && /- port: (80|443)$/ { web[i] = 1 } e && /^  [- ] to:$/ { to[i] = 1 }
              e && /cidr: 0\.0\.0\.0\/0$/ { any[i] = 1 } e && /- 169\.254\.0\.0\/16$/ { meta[i] = 1 }
              END { for (j = 1; j <= i; j++) { if (!to[j] || web[j] && !(any[j] && meta[j])) bad = 1; if (web[j]) w = 1 }
                exit bad || !w }' || { echo "$p: an egress rule has no destination, or 80/443 is not limited to public addresses"; exit 1; }
          done
      - name: The Portainer stack is what deploy/compose.rag.yaml gives
        # deploy/portainer/compose.portainer.yaml is generated (build-stack.sh): a change to compose.rag.yaml, to
        # bootstrap.sh or to a file it names that was not followed by a rebuild fails here, not at a deploy. Built
        # from the gateway release the committed file names (a download from the gateway's public repository).
        run: sh deploy/portainer/build-stack.sh --check
      - name: Release bundle pins every image
        # deploy/build-release-bundle.sh (§7.2) with placeholder digests: every image of the bundled Compose files is
        # pinned by digest and they render; an unpinned image is refused. release.yml runs it with the pushed digests.
        env:
          FORS_DOMAIN: example.se
          KALLA_GATEWAY_URL: https://llm.example.se
          KALLA_BACKUP_TARGET: local
        run: |
          digest="sha256:$(printf '0%.0s' $(seq 64))"
          for v in API ADMIN WORKER MIGRATIONS PARSER CLAMAV RENDERER POSTGRES; do
            export "RAG_${v}_IMAGE=ghcr.io/example/kalla/${v,,}:0.0.0@$digest"
          done
          if out="$(KALLA_PARSER_IMAGE=kalla/parser:latest bash deploy/build-release-bundle.sh 0.0.0 "$RUNNER_TEMP/unpinned" 2>&1)"; then
            echo "an unpinned image was accepted"; exit 1
          fi
          echo "$out"
          grep -q 'KALLA_PARSER_IMAGE=kalla/parser:latest is not pinned' <<< "$out"
          bash deploy/build-release-bundle.sh 0.0.0 "$RUNNER_TEMP/bundle"
          tar -xzf "$RUNNER_TEMP/bundle/kalla-0.0.0.tar.gz" -C "$RUNNER_TEMP/bundle"
          b="$RUNNER_TEMP/bundle/kalla-0.0.0/deploy"
          # The bundle's defaults, not these variables, must carry the pins.
          for v in API ADMIN WORKER MIGRATIONS PARSER CLAMAV RENDERER POSTGRES; do unset "RAG_${v}_IMAGE"; done
          images="$(docker compose -f "$b/compose.rag.yaml" -f "$b/compose.backup.yaml" -f "$b/compose.hardened.yaml" \
            -f "$b/compose.host-24g.yaml" -f "$b/compose.clamav-conf.yaml" -f "$b/compose.rolling.yaml" \
            --profile backup --profile clamav --profile render --profile openwebui --profile proxy config --images)"
          echo "$images"
          if echo "$images" | grep -vE '@sha256:[0-9a-f]{64}$'; then echo "unpinned images in the bundle"; exit 1; fi
          # Kubernetes: every image of the example overlay with every component is pinned by digest.
          sed -i -e 's|# - \.\./components/renderer|- ../components/renderer|' "$b/kubernetes/example/kustomization.yaml"
          k8s_images="$(docker run --rm -u "$(id -u):$(id -g)" -v "$b/kubernetes:/k:ro" \
            registry.k8s.io/kustomize/kustomize:v5.7.1@sha256:937e7832dc0b09288b1398399dadb97382a27bbc35bee8fdcac47c7de4fff14d \
            build /k/example | sed -n 's/^ *-\{0,1\} *image: //p' | sort -u)"
          echo "$k8s_images"
          if echo "$k8s_images" | grep -vE '@sha256:[0-9a-f]{64}$'; then echo "unpinned Kubernetes images in the bundle"; exit 1; fi
          # The Portainer stack asset: RAG's images pinned to the release.
          grep -q "KALLA_API_IMAGE:-ghcr.io/example/kalla/api:0.0.0@$digest" "$RUNNER_TEMP/bundle/compose.portainer.yaml"
      - name: Kubernetes' create-secrets.sh generates with the stacks' bootstrap and keeps its secrets on a re-run
        # Decisions "One deployment bootstrap": create-secrets.sh runs deploy/portainer/bootstrap.sh on the operator's
        # machine. No cluster: --generate-only, twice, then with options that change something.
        run: bash deploy/tests/kubernetes-secrets.sh
      - name: init-deployment.sh writes deploy/.env, and a re-run keeps it
        # Offline in a copy of deploy/: a first run, mode 600, the clamav profile and no sign-in value; a re-run keeps
        # every line (KALLA_SETUP_REOPEN among them); the options and their overlays; the refusals; the host firewall's
        # rules and subnets (deploy/tests/compose-init.sh).
        run: bash deploy/tests/compose-init.sh
      - name: kalla-bootstrap in its Compose form keeps its secrets on a re-run
        # deploy/.env from init-deployment.sh, then kalla-bootstrap alone, twice, on throwaway volumes: the gateway's CA and
        # keys from host directories, no gateway blocks in the proxy, the setup wizard's address, the overlays' inputs,
        # and escrow-keys.sh and cert-expiry.sh reading the volumes (deploy/tests/compose-bootstrap.sh).
        run: bash deploy/tests/compose-bootstrap.sh
      - name: Pilot caps, Open WebUI key restriction and the upload copy
        # Offline: docker compose config over compose.rag.yaml with the hardened, 24 GB and backup overlays and the
        # openwebui profile (P1b item 17).
        run: bash deploy/tests/pilot-stack.sh
      - name: The Portainer stack's kalla-bootstrap keeps its secrets on a re-run
        # kalla-bootstrap alone, twice on the same throwaway volumes (#697): every secret existing data depends on, and every
        # owner and mode, is unchanged by the second run; the gateway credential keys follow the variable, else the
        # manifest's file.
        run: bash deploy/tests/portainer-rerun.sh
      - name: The Portainer stack's host names default under FORS_DOMAIN
        # Setup wizard S0: offline, every place a host name is used renders rag., kalla-admin. and chat.<domain> from
        # FORS_DOMAIN, each KALLA_*_HOST overrides its own, the names alone work as before (never a name ending in a dot),
        # and with neither the stack refuses to render, naming both.
        run: bash deploy/tests/portainer-hosts.sh
      - name: The Portainer stack renders with the previous release's variables
        # docs/portainer.md, "Upgrade": paste the new file, keep your variables. Offline: with v0.6.0's
        # variables the stack renders, the sign-in stays declared (no setup wizard) and every name and URL is unchanged.
        run: bash deploy/tests/portainer-upgrade.sh
      - name: The certificate expiry check warns 60 days ahead
        # #705: deploy/host/cert-expiry.sh (rag-cert-expiry.timer) passes on fresh certificates, writes certs.prom, and
        # fails naming the certificate that expires within 60 days.
        run: |
          c="$RUNNER_TEMP/cert-expiry"; mkdir -p "$c/postgres"
          cert() { openssl req -x509 -newkey rsa:2048 -nodes -keyout "$c/$1.key" -out "$c/$1.$2" -days "$3" -subj /CN=ci >/dev/null 2>&1; }
          cert ca pem 3650; cert postgres/postgres crt 825
          bash deploy/host/cert-expiry.sh --certs-dir "$c" --state-dir "$c/state"
          grep -q '^rag_cert_expiry_timestamp_seconds{file="postgres/postgres.crt"} [0-9]*$' "$c/state/certs.prom"
          cert postgres/postgres crt 30
          if out="$(bash deploy/host/cert-expiry.sh --certs-dir "$c" --state-dir "$c/state")"; then
            echo "a certificate 30 days from expiry passed"; exit 1
          fi
          echo "$out"
          grep -q '^warning: postgres/postgres.crt expires .*: run kalla-bootstrap within 30 days' <<< "$out"
      - name: Deployment scripts pass shellcheck
        run: shellcheck deploy/*.sh deploy/postgres/*.sh deploy/host/*.sh deploy/tests/*.sh deploy/portainer/*.sh deploy/kubernetes/*.sh
      - name: Host units pass systemd-analyze verify
        run: |
          units="$RUNNER_TEMP/units"
          bash deploy/host/install.sh --unit-dir "$units" --host-memory 24 --no-enable
          systemd-analyze verify "$units"/rag-*.slice "$units"/rag-*.service "$units"/rag-*.timer

  admin-ui:
    # The admin UI (repo-and-deployment §2.3, §8.2; admin design §10.2), as the gateway's "Verify UI" step: npm ci from
    # the lock only (src/admin-ui/.npmrc: ignore-scripts, min-release-age, allow-git=none; never npm install), npm audit
    # failing on any advisory (dated exceptions in scripts/audit/: dev-only ones, and production ones only for a package
    # the bundle doesn't contain), lint, typecheck, unit tests, build, then the gzip size budget and the design-system drift
    # report, which only warns. Node 24 as every gateway workflow; package.json engines asks for >= 22.
    needs: changes
    if: needs.changes.outputs.adminui == 'true'
    runs-on: [self-hosted, linux, x64]
    defaults:
      run:
        working-directory: src/admin-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/admin-ui/package-lock.json
      - name: Install from the lock
        run: npm ci
      - name: Audit dependencies
        # All dependencies: any advisory fails, except the dated exceptions in scripts/audit/: dev-only ones
        # (npm-audit-exceptions.txt, e.g. lint toolchain fixes not yet 7 days old; issue #61) and the production ones
        # below. The production report is checked after the build. An exception stops applying after its date, so the
        # job turns red again unless the fix has landed. The same checks run daily against main in audit.yml.
        run: |
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-production.json" || true
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          python3 -I ../../scripts/audit/audit.py npm "$RUNNER_TEMP/audit.json"
      - name: Lint, typecheck, test and build
        # messages.spec.ts checks every code in contracts/admin/v1/error-codes.json has a Swedish text.
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Audit production dependencies against the bundle
        # Any advisory fails, except a dated exception in scripts/audit/npm-production-exceptions.txt for a package the
        # bundle doesn't contain (#853): a second build with source maps lists the bundle's packages.
        run: |
          npx vite build --sourcemap hidden --outDir "$RUNNER_TEMP/bundle-modules" --emptyOutDir --logLevel warn
          python3 -I ../../scripts/audit/audit.py npm-production "$RUNNER_TEMP/audit-production.json" \
            --modules "$RUNNER_TEMP/bundle-modules"
      - name: Size budget
        # Initial JS (shell + Översikt) <= 200 kB gzip, each lazy route <= 100 kB gzip (admin design §10.2).
        run: node ../../scripts/admin-ui-size-budget.mjs dist --landing OverviewView --initial-kb 200 --lazy-kb 100
      - name: Design-system drift (warning only)
        # Without a gateway checkout it compares the copies with design-system.lock only; it always exits 0.
        run: node scripts/design-system-drift.mjs
      - name: Browser tests (tests/e2e) audit and typecheck
        # The specs themselves run in e2e.yml against a running stack; here only their packages and types.
        working-directory: tests/e2e
        run: |
          npm ci
          npm audit --audit-level=low
          npm run typecheck
