# pgBackRest inside the postgres container (ume-rag/postgres, repo-and-deployment §5.2, §7.4). Baked into the image as
# /etc/pgbackrest/pgbackrest.conf. The repository (repo1-type, path or bucket, cipher passphrase) comes from the mounted
# /etc/pgbackrest/conf.d/repo.conf (example: repo.conf.example), which pgBackRest appends to this file.
# Options not listed keep the pgBackRest defaults: synchronous archive-push (no spool), lock path /tmp/pgbackrest on the
# tmpfs /tmp, gz compression.

[global]
# The root file system is read-only: log to the container output only, not to /var/log/pgbackrest.
log-level-file=off

# 35-day point-in-time window: a full backup expires once a newer one is at least 35 days old (§7.4, proposed).
repo1-retention-full-type=time
repo1-retention-full=35

[ragdb]
pg1-path=/var/lib/postgresql/data
