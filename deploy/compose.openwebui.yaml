# Optional Open WebUI pilot stack (plans/platform/repo-and-deployment.md §12 #8, chat-api/plan.md §6, chat-api/design.md
# §4.3). OFF BY DEFAULT: a Compose project of its own, never in COMPOSE_FILE, started only by hand once the DPIA (G1)
# has decided register item W2 (how Open WebUI's own chat copies are pruned; until then they stay unpruned, stated in
# its data-handling profile). On the 24 GB pilot host or its own VM (§6.2: not co-hosted on a 16 GB host).
#
#   ./deploy/init-deployment.sh --oidc-authority https://<keycloak host>/realms/ume ... \
#       --openwebui-host chat.intern.umea.se --openwebui-oidc-client-secret-file open-webui.secret
#   (Open WebUI's key for rag-api is generated there; rag-migrate registers it as the deployment's own client.)
#   docker compose -f deploy/compose.openwebui.yaml --env-file deploy/.env up -d --wait
#   (open-webui-setup then mints the feedback service account's API key for rag-api's importer, M-17 C6.)
#
# Sign-in (chat design §4.3, identity design §5.3): P1 the Keycloak shared with the gateway, client open-webui in realm
# ume (the OIDC provider URL defaults to the admin's authority + /.well-known/openid-configuration); P2 Entra, the
# registration ume-rag-open-webui (--openwebui-oidc-client-id ume-rag-open-webui --openwebui-oidc-provider-url
# https://login.microsoftonline.com/<tenant>/v2.0/.well-known/openid-configuration).
#
# One connection only: our API (no gateway connection), so the signed user JWT goes only to rag-api. Its own task
# models, RAG, web search, tools, code execution, uploads and admin chat access are off. Settings come from this file
# on every start (ENABLE_PERSISTENT_CONFIG=false): an admin edit in Open WebUI lasts until the next restart. It listens
# on plain HTTP on loopback; the reverse proxy terminates TLS.
name: ume-rag-openwebui

services:
  open-webui:
    # v0.12.5, built 2026-10-29 (go-live pin review A-4, 2026-11-07: v0.13.0 is under 7 days old). The index digest.
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    # The image runs as root; any non-root uid works once DATA_DIR is its own (init-deployment.sh chowns it).
    user: "1000:1000"
    restart: unless-stopped
    cpus: 1.0
    cpu_shares: 512
    mem_reservation: 512m
    mem_limit: 1.5g
    pids_limit: 256
    ports: ["${UME_RAG_OPENWEBUI_BIND:-127.0.0.1}:${UME_RAG_OPENWEBUI_PORT:-3000}:8080"]
    # FORWARD_USER_INFO_HEADER_JWT_SECRET, OPENAI_API_KEYS, OAUTH_CLIENT_SECRET: Open WebUI reads them only from its
    # environment, so they come from this file (written by init-deployment.sh, mode 0600), not from deploy/.env.
    env_file: ["${UME_RAG_SECRETS_DIR:?Run deploy/init-deployment.sh first}/openwebui.env"]
    environment:
      HOME: /tmp
      # Its SQLite database and caches, outside the image's /app/backend/data (which keeps the baked models read-only).
      DATA_DIR: /data
      WEBUI_SECRET_KEY_FILE: /run/owui-secrets/webui_secret_key
      WEBUI_URL: https://${UME_RAG_OPENWEBUI_HOST:?Set UME_RAG_OPENWEBUI_HOST in deploy/.env}
      WEBUI_SESSION_COOKIE_SECURE: "true"
      WEBUI_AUTH_COOKIE_SECURE: "true"
      OFFLINE_MODE: "true"
      ENABLE_PERSISTENT_CONFIG: "false"
      # The one connection (chat design §4.3): our API with the client's ume-rag-sk- key (env file), the Open WebUI
      # message ids for feedback mapping and regeneration dedup, and the user as a signed JWT.
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: ${UME_RAG_API_PUBLIC_URL:?Set UME_RAG_API_PUBLIC_URL in deploy/.env}/v1
      OPENAI_API_CONFIGS: '{"0":{"headers":{"X-Rag-Owui-Message-Id":"{{MESSAGE_ID}}","X-Rag-Owui-User-Message-Id":"{{USER_MESSAGE_ID}}"}}}'
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      ENABLE_DIRECT_CONNECTIONS: "false"
      # No task calls (simplification pass §1) and nothing of Open WebUI's own RAG, search, tools or code.
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_CONTEXT_COMPACTION: "false"
      BYPASS_EMBEDDING_AND_RETRIEVAL: "true"
      # Open WebUI adds its builtin tools to every browser chat unless a model's capabilities say otherwise, and rag-api
      # refuses a request with tools (400 tools_not_supported).
      DEFAULT_MODEL_METADATA: '{"capabilities":{"builtin_tools":false}}'
      ENABLE_WEB_SEARCH: "false"
      ENABLE_CODE_EXECUTION: "false"
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_IMAGE_GENERATION: "false"
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: "false"
      USER_PERMISSIONS_FEATURES_CODE_INTERPRETER: "false"
      USER_PERMISSIONS_FEATURES_IMAGE_GENERATION: "false"
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: "false"
      USER_PERMISSIONS_CHAT_WEB_UPLOAD: "false"
      USER_PERMISSIONS_CHAT_SYSTEM_PROMPT: "false"
      USER_PERMISSIONS_CHAT_PARAMS: "false"
      ENABLE_ADMIN_CHAT_ACCESS: "false"
      ENABLE_ADMIN_EXPORT: "false"
      # The fixed input warning (weakness review §4). Change the timestamp with the text.
      WEBUI_BANNERS: '[{"id":"ume-rag-input","type":"warning","content":"Skriv inte in sekretessbelagda uppgifter eller känsliga personuppgifter.","dismissible":false,"timestamp":1793318400}]'
      # Only the feedback service account has a key, and only for the feedback routes (chat design §14.2).
      ENABLE_API_KEYS: "true"
      ENABLE_API_KEYS_ENDPOINT_RESTRICTIONS: "true"
      API_KEYS_ALLOWED_ENDPOINTS: /api/v1/evaluations/feedbacks/list,/api/v1/evaluations/feedback
      USER_PERMISSIONS_FEATURES_API_KEYS: "false"
      # Sign-in only over OIDC through its own client (identity design §5.3): P1 Keycloak, P2 Entra (header above).
      # The feedback service account is the store's first user, so its only admin (WEBUI_ADMIN_EMAIL and
      # WEBUI_ADMIN_PASSWORD in the env file, created on the first start of an empty store). Password sign-in is off:
      # open-webui-setup mints its API key without it.
      ENABLE_LOGIN_FORM: "false"
      ENABLE_PASSWORD_AUTH: "false"
      # No person becomes admin, so nobody could approve a pending account: every OIDC sign-in is a user (who may sign
      # in is identity design §16 question 5).
      DEFAULT_USER_ROLE: user
      ENABLE_SIGNUP: "false"
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "false"
      # The sign-in button's label (--openwebui-oidc-provider-name).
      OAUTH_PROVIDER_NAME: ${UME_RAG_OPENWEBUI_OIDC_PROVIDER_NAME:-Umeå kommun}
      OAUTH_CLIENT_ID: ${UME_RAG_OPENWEBUI_OIDC_CLIENT_ID:?Set UME_RAG_OPENWEBUI_OIDC_CLIENT_ID in deploy/.env}
      OPENID_PROVIDER_URL: ${UME_RAG_OPENWEBUI_OIDC_PROVIDER_URL:?Set UME_RAG_OPENWEBUI_OIDC_PROVIDER_URL in deploy/.env}
      # The current callback path, as the realm additions and the Entra registration register it (identity design
      # §5.3: moved from the legacy /oauth/oidc/callback at the go-live pin bump, A-4/B-6, #452).
      OPENID_REDIRECT_URI: https://${UME_RAG_OPENWEBUI_HOST}/oauth/oidc/login/callback
    volumes:
      # Its own SQLite store, on the host's encrypted disk (§12 #8): never ragdb.
      - ${UME_RAG_OPENWEBUI_DATA_DIR:?Set UME_RAG_OPENWEBUI_DATA_DIR in deploy/.env}:/data
      - ${UME_RAG_SECRETS_DIR}/openwebui:/run/owui-secrets:ro
    networks: [openwebui]

  open-webui-setup:
    # One-shot (M-17 C6): the feedback service account's API key for rag-api's import, minted with a short session token
    # signed with Open WebUI's secret key, since password sign-in is off (openwebui/feedback-key-setup.py). Open WebUI's
    # image as Open WebUI's user; it reads the account from the store and writes only secrets/openwebui-feedback, which
    # rag-api reads (no restart). A key that still works is kept; a new one: delete the file and run `up` again.
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    user: "1000:1000"
    restart: "no"
    entrypoint: [python3, -I, /config/feedback-key-setup.py]
    environment:
      OWUI_URL: http://open-webui:8080
      # The service account init-deployment.sh names in the env file.
      WEBUI_ADMIN_EMAIL: feedback-import@localhost
    volumes:
      # The store's WAL needs its directory writable even for a read-only connection.
      - ${UME_RAG_OPENWEBUI_DATA_DIR:?Set UME_RAG_OPENWEBUI_DATA_DIR in deploy/.env}:/data
      - ${UME_RAG_SECRETS_DIR}/openwebui:/run/owui-secrets:ro
      - ${UME_RAG_SECRETS_DIR}/openwebui-feedback:/run/feedback
      - ./openwebui/feedback-key-setup.py:/config/feedback-key-setup.py:ro
    depends_on:
      open-webui: {condition: service_started}
    networks: [openwebui]

networks:
  # Egress to rag-api and the OIDC authority only (host firewall).
  openwebui: {driver: bridge, ipam: {config: [{subnet: 172.30.17.0/24}]}}
