# Overlay that replaces the ClamAV image's clamd.conf and freshclam.conf with copies kalla-bootstrap writes to
# kalla-config/clamav (repo-and-deployment §5.5). The image's unprivileged entrypoint ignores the CLAMD_CONF_* and
# FRESHCLAM_CONF_* variables, so a setting changes only through a mounted file. init-deployment.sh adds this file to
# COMPOSE_FILE, with the malware scan on (the clamav profile), for either of:
#   --host-memory 24          ConcurrentDatabaseReload yes and TestDatabases yes (with compose.host-24g.yaml's 3g)
#   --freshclam-proxy H:P     HTTPProxyServer/HTTPProxyPort (KALLA_FRESHCLAM_PROXY), when database.clamav.net is
#                             reached through a proxy
# Without either the image's own confs are used (16 GB host, direct egress) and this file is not needed. The copies are
# made from the image's confs in images/clamav/ (the release bundle carries them at the same relative path).

services:
  kalla-bootstrap:
    environment:
      KALLA_FRESHCLAM_PROXY: ${KALLA_FRESHCLAM_PROXY:-}
    configs:
      - {source: kalla-clamd-conf, target: /config/clamd.conf}
      - {source: kalla-freshclam-conf, target: /config/freshclam.conf}

  kalla-clamav:
    volumes:
      - {type: volume, source: kalla-config, target: /etc/clamav, read_only: true, volume: {subpath: clamav}}
    # A volume subpath must exist when the container starts.
    depends_on:
      kalla-bootstrap: {condition: service_completed_successfully}

configs:
  kalla-clamd-conf:
    file: ../images/clamav/clamd.conf
  kalla-freshclam-conf:
    file: ../images/clamav/freshclam.conf
