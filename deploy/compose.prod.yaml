# Production Compose, data plane and control zone (plans/platform/repo-and-deployment.md §6): postgres (pgBackRest
# inside), the one-shot rag-migrate, rag-api and rag-admin. The ingestion zone (rag-worker, rag-parser, rag-clamav) is
# compose.ingestion.yaml; the pilot host runs both:
#
#   1. ./deploy/init-deployment.sh     certificates, secrets, deploy/.env (its COMPOSE_FILE lists the files below)
#   2. docker compose --env-file deploy/.env up -d --wait
#      (same as: docker compose -f deploy/compose.prod.yaml -f deploy/compose.ingestion.yaml --env-file deploy/.env ...)
#   3. docker compose --env-file deploy/.env exec -T postgres pgbackrest --stanza=ragdb stanza-create
#      once per new database or backup repository (idempotent): WAL archiving fails until the stanza exists.
#
# Optional overlays: compose.host-24g.yaml (24 GB host profile), compose.clamav-conf.yaml (ClamAV confs written by
# init-deployment.sh). compose.openwebui.yaml is a separate project. One slot in the pilot (rolling slots from P2).
# Secrets and certificates are files, never environment variables. Every container runs hardened (x-hardened), under a
# numeric user, with the limits of §6.2 for a 16 GB host.
name: ume-rag

# Inside its container every .NET service listens on 8443 and its health check (--health-check) probes
# https://localhost:8443/health/ready; only the host side of a published port is configurable.

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

services:
  postgres:
    <<: *hardened
    image: ${POSTGRES_IMAGE:-ume-rag/postgres:latest}
    user: "999:999"
    restart: unless-stopped
    # A fast shutdown ends with a checkpoint; Docker's default 10 s can cut it short.
    stop_grace_period: 60s
    # /tmp also holds the pgBackRest lock files.
    tmpfs: [/tmp, "/var/run/postgresql:uid=999,gid=999,mode=0700"]
    shm_size: 1g
    # cpus is a cap; development keeps every cap at 2 or less so a 2-core host starts the stack (pilot: 3.0,
    # compose.host-24g.yaml; repo-and-deployment §6.2).
    cpus: 2.0
    cpu_shares: 1024
    mem_reservation: 2g
    mem_limit: 3g
    pids_limit: 512
    environment:
      POSTGRES_PASSWORD_FILE: /run/postgres-secrets/bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
    # postgresql.conf holds the 16 GB profile (compose.host-24g.yaml overrides the memory settings), hba_file and the
    # certificate paths below, and archive_command (pgbackrest archive-push).
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${UME_RAG_CERTS_DIR:?Run deploy/init-deployment.sh first}/postgres:/run/certs:ro
      - ${UME_RAG_SECRETS_DIR:?Run deploy/init-deployment.sh first}/postgres:/run/postgres-secrets:ro
      # pgBackRest repository settings and passphrase (§7.4), appended to the image's /etc/pgbackrest/pgbackrest.conf.
      - ${UME_RAG_SECRETS_DIR}/pgbackrest/repo.conf:/etc/pgbackrest/conf.d/repo.conf:ro
      # A posix repository: the backup share mounted on the host (UME_RAG_BACKUP_DIR), else a local volume (test hosts
      # only: it is not off the host). Unused with an S3 repository.
      - ${UME_RAG_BACKUP_DIR:-pgbackrest-repo}:/var/lib/pgbackrest
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
      - ./postgres/pg_hba.conf:/run/config/pg_hba.conf:ro
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    # backup: pgBackRest archive-push and the host timer's backups reach only the backup target (host firewall).
    networks: [data, backup]
    healthcheck:
      # Over TCP: the entrypoint's temporary server during initdb listens on the socket only, so it never looks ready.
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, ragdb]
      interval: 10s
      timeout: 5s
      retries: 12

  rag-migrate:
    <<: *hardened
    image: ${MIGRATIONS_IMAGE:-ume-rag/migrations:latest}
    user: "1654:1654"
    restart: "no"
    cpus: 1.0
    cpu_shares: 512
    mem_limit: 512m
    pids_limit: 128
    environment:
      DOTNET_ENVIRONMENT: Production
      # GC settings in the environment are hexadecimal: 0x4B = 75 % of mem_limit ("75" would be read as 117 % and
      # ignored).
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Migration__RolesSqlPath: /run/config/app-roles.sql
      Seed__Enabled: "false"
      # The platform embedding profile (Decisions "Pilot embedding model, U-b"): seeded once, insert-if-absent, when
      # GatewayModel is set (stream B's EmbeddingProfileSeeder, #123); RequestDimensions sends OpenAI's dimensions (#142).
      EmbeddingProfile__GatewayModel: ${UME_RAG_EMBEDDING_MODEL:-}
      EmbeddingProfile__Dimensions: ${UME_RAG_EMBEDDING_DIMENSIONS:-1024}
      EmbeddingProfile__RequestDimensions: ${UME_RAG_EMBEDDING_REQUEST_DIMENSIONS:-true}
      EmbeddingProfile__MaxInputTokens: ${UME_RAG_EMBEDDING_MAX_INPUT_TOKENS:-8191}
      EmbeddingProfile__MaxResidency: ${UME_RAG_EMBEDDING_MAX_RESIDENCY:-Eu}
      SSL_CERT_FILE: /run/certs/ca.pem
    volumes:
      - ${UME_RAG_SECRETS_DIR}/migrations:/run/app-secrets:ro
      - ${UME_RAG_CERTS_DIR}/migrations:/run/certs:ro
      - ./postgres/app-roles.sql:/run/config/app-roles.sql:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data]

  # The blob container (issue #41): the rag-blobs volume's root is root:root 0755, so the services (uid 1654) cannot create
  # BlobStore:Root themselves. This one-shot creates /data/blobs/rag owned by 1654:1654, mode 0750 (rag-api and
  # rag-upload-backup read it as the same uid), before any service that mounts the volume starts; it is idempotent and
  # leaves the files below alone. Root with only CAP_CHOWN; the postgres image is used for its coreutils.
  rag-blobs-init:
    <<: *hardened
    image: ${POSTGRES_IMAGE:-ume-rag/postgres:latest}
    user: "0:0"
    # FOWNER: root without it may not chmod a directory it has just given to 1654, nor one that already exists.
    cap_add: [CHOWN, FOWNER]
    restart: "no"
    cpus: 0.1
    mem_limit: 64m
    pids_limit: 16
    entrypoint: [/bin/sh, -c]
    # /data/blobs/spool: the worker's spool for fetched bodies (TMPDIR, compose.ingestion.yaml), on disk.
    command: ["mkdir -p -m 0750 /data/blobs/rag /data/blobs/spool && chown 1654:1654 /data/blobs/rag /data/blobs/spool && chmod 0750 /data/blobs/rag /data/blobs/spool"]
    volumes:
      - rag-blobs:/data/blobs
    network_mode: none

  rag-api:
    <<: *hardened
    image: ${API_IMAGE:-ume-rag/api:latest}
    user: "1654:1654"
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: 2.0
    cpu_shares: 1024
    mem_reservation: 384m
    mem_limit: 1g
    pids_limit: 512
    ports: ["${UME_RAG_API_BIND:-127.0.0.1}:${UME_RAG_API_PORT:-8543}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/api.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/api.key
      Rag__Roles: knowledge,chat,mcp
      # The rag-blobs volume's rag/ container (repo-and-deployment §6.3), as in rag-admin and rag-worker.
      BlobStore__Root: /data/blobs/rag
      # Its gateway credential key is the secret file Gateway__Key (init-deployment.sh --gateway-credential-key-file).
      Gateway__BaseUrl: ${UME_RAG_GATEWAY_URL:?Set the gateway URL in deploy/.env}
      # Caps every model call's ceiling (identity design §4.7): Eu under register M2; empty once External routes exist.
      Gateway__MaxResidency: ${UME_RAG_GATEWAY_MAX_RESIDENCY:-}
      # Open WebUI's client in the registry; the user JWT's key is the secret file OpenWebUi__JwtSecret (identity §5.2).
      OpenWebUi__ClientId: ${UME_RAG_OPENWEBUI_CLIENT_ID:-}
      # The origin staff browsers reach rag-api at (J9, #210): citation links are absolute, so they resolve from Open
      # WebUI too (relative links would resolve against Open WebUI's origin). init-deployment.sh writes it.
      Knowledge__PublicBaseUrl: ${UME_RAG_API_PUBLIC_URL:?Set UME_RAG_API_PUBLIC_URL in deploy/.env}
      # The feedback importer and pruning (chat design §14.2, §13.3): Open WebUI through its reverse proxy, which works
      # whether it runs on this host or its own VM; empty = no import. Its key is the secret file OpenWebUi__AdminApiKey
      # (deploy/openwebui-feedback-key.sh).
      OpenWebUi__BaseUrl: ${UME_RAG_OPENWEBUI_BASE_URL:-}
      OpenWebUi__FeedbackImportInterval: ${UME_RAG_OPENWEBUI_FEEDBACK_IMPORT_INTERVAL:-00:15:00}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UME_RAG_OTEL_ENDPOINT:-}
      # Traces: a share of the requests that start here (#503); a parent's decision wins.
      OTEL_TRACES_SAMPLER: ${UME_RAG_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${UME_RAG_OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_SERVICE_NAME: rag-api
      SSL_CERT_FILE: /run/certs/ca.pem
      DOTNET_SHUTDOWNTIMEOUTSECONDS: "50"
    volumes:
      - ${UME_RAG_SECRETS_DIR}/api:/run/app-secrets:ro
      - ${UME_RAG_CERTS_DIR}/api:/run/certs:ro
      - ${UME_RAG_SECRETS_DIR}/keys/rag-blob-internal:/run/keys/rag-blob-internal:ro
      # Citation downloads only (knowledge design §3.5).
      - rag-blobs:/data/blobs:ro
    depends_on:
      postgres: {condition: service_healthy}
      rag-migrate: {condition: service_completed_successfully}
      rag-blobs-init: {condition: service_completed_successfully}
    # All egress leaves through the network that holds the default route, so gw_priority pins it to llm (gateway, OIDC
    # authority, Open WebUI host: the host firewall's allow-list); edge only carries the published port.
    networks:
      edge: {}
      data: {}
      llm: {gw_priority: 1}
    healthcheck:
      test: [CMD, dotnet, Ume.Rag.Api.dll, --health-check]
      interval: 30s        # a .NET process start each (~80 ms CPU, B-27 / #504)
      timeout: 10s
      start_period: 30s
      start_interval: 5s   # while starting, so up --wait and rolling updates don't wait 30 s
      retries: 3

  rag-admin:
    <<: *hardened
    image: ${ADMIN_IMAGE:-ume-rag/admin:latest}
    user: "1654:1654"
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: 1.0
    cpu_shares: 512
    mem_reservation: 256m
    mem_limit: 512m
    pids_limit: 256
    ports: ["${UME_RAG_ADMIN_BIND:-127.0.0.1}:${UME_RAG_ADMIN_PORT:-9543}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/admin.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/admin.key
      Oidc__Authority: ${UME_RAG_OIDC_AUTHORITY:?Set the HTTPS OIDC authority in deploy/.env}
      Oidc__ClientId: ${UME_RAG_OIDC_CLIENT_ID:-ume-rag-admin}
      # Claims and role groups as the gateway's compose.prod.yaml passes them (identity design §1.5 env table, #468): the
      # same identity provider and the same group names can drive both products. Empty role groups grant nothing.
      Oidc__RoleClaim: ${UME_RAG_OIDC_ROLE_CLAIM:-roles}
      Oidc__DepartmentClaim: ${UME_RAG_OIDC_DEPARTMENT_CLAIM:-departmentCodes}
      Oidc__TeamClaim: ${UME_RAG_OIDC_TEAM_CLAIM:-teamCodes}
      Oidc__GroupClaim: ${UME_RAG_OIDC_GROUP_CLAIM:-groups}
      Oidc__ExtraScopes__0: ${UME_RAG_OIDC_EXTRA_SCOPE:-email}
      Oidc__RoleGroups__rag-platform-admin: ${UME_RAG_OIDC_GROUPS_PLATFORM_ADMIN:-}
      Oidc__RoleGroups__rag-department-admin: ${UME_RAG_OIDC_GROUPS_DEPARTMENT_ADMIN:-}
      Oidc__RoleGroups__rag-pipeline-editor: ${UME_RAG_OIDC_GROUPS_PIPELINE_EDITOR:-}
      Oidc__RoleGroups__rag-reviewer: ${UME_RAG_OIDC_GROUPS_REVIEWER:-}
      Oidc__RoleGroups__rag-viewer: ${UME_RAG_OIDC_GROUPS_VIEWER:-}
      Oidc__TenantId: ${UME_RAG_OIDC_TENANT_ID:-}
      Oidc__RefuseGuests: ${UME_RAG_OIDC_REFUSE_GUESTS:-true}
      BlobStore__Root: /data/blobs/rag
      Gateway__BaseUrl: ${UME_RAG_GATEWAY_URL}
      Gateway__MaxResidency: ${UME_RAG_GATEWAY_MAX_RESIDENCY:-}
      # The gateway Admin API's base URL for its Integration API (/integration/v1): the cost and budget read-back with
      # this service's credential key, which needs the scope usage.read (#580). Empty: no read-back.
      Gateway__IntegrationApiUrl: ${UME_RAG_GATEWAY_INTEGRATION_API_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UME_RAG_OTEL_ENDPOINT:-}
      # Traces: a share of the requests that start here (#503); a parent's decision wins.
      OTEL_TRACES_SAMPLER: ${UME_RAG_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${UME_RAG_OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_SERVICE_NAME: rag-admin
      # The organisation the admin UI names in its header and sign-in texts; empty names none (#544).
      Admin__OrganisationName: ${UME_RAG_ORGANISATION_NAME-Umeå kommun}
      SSL_CERT_FILE: /run/certs/ca.pem
      DOTNET_SHUTDOWNTIMEOUTSECONDS: "50"
    volumes:
      - ${UME_RAG_SECRETS_DIR}/admin:/run/app-secrets:ro
      - ${UME_RAG_CERTS_DIR}/admin:/run/certs:ro
      - ${UME_RAG_SECRETS_DIR}/keys/rag-blob-internal:/run/keys/rag-blob-internal:ro
      # Uploads (admin design §2.2).
      - rag-blobs:/data/blobs
    depends_on:
      postgres: {condition: service_healthy}
      rag-migrate: {condition: service_completed_successfully}
      rag-blobs-init: {condition: service_completed_successfully}
    # All egress leaves through the network that holds the default route, so gw_priority pins it to llm (gateway, OIDC
    # authority, Open WebUI host: the host firewall's allow-list); edge only carries the published port.
    networks:
      edge: {}
      data: {}
      llm: {gw_priority: 1}
    healthcheck:
      test: [CMD, dotnet, Ume.Rag.AdminApi.dll, --health-check]
      interval: 30s        # a .NET process start each (~80 ms CPU, B-27 / #504)
      timeout: 10s
      start_period: 30s
      start_interval: 5s   # while starting, so up --wait and rolling updates don't wait 30 s
      retries: 3

  # The upload copy (§7.4): deploy/backup-uploads.sh runs it from rag-upload-backup.timer with `docker compose run`;
  # the profile keeps `up` from starting it. It copies new files below uploads/ to the backup target and never
  # overwrites one (blob keys are write-once). The postgres image is used for its shell and coreutils only.
  rag-upload-backup:
    <<: *hardened
    image: ${POSTGRES_IMAGE:-ume-rag/postgres:latest}
    profiles: [backup]
    user: "1654:1654"
    restart: "no"
    cpus: 0.5
    cpu_shares: 128
    mem_limit: 256m
    pids_limit: 64
    volumes:
      - rag-blobs:/data/blobs:ro
      # A directory on the backup share (init-deployment.sh), owned by uid 1654; ./upload-backup with --backup-target
      # local (test hosts only: it is not off the host).
      - ${UME_RAG_UPLOAD_BACKUP_DIR:-./upload-backup}:/backup
    # No network: the target is a host directory. An S3 target would join backup, as postgres does.
    network_mode: none

# Fixed subnets, so deploy/host/docker-user-firewall.sh can give each network its egress rule (§6.1). The networks of
# the ingestion zone are in compose.ingestion.yaml.
networks:
  edge: {driver: bridge, ipam: {config: [{subnet: 172.30.1.0/24}]}}
  data: {driver: bridge, internal: true, ipam: {config: [{subnet: 172.30.2.0/24}]}}
  llm: {driver: bridge, ipam: {config: [{subnet: 172.30.3.0/24}]}}
  backup: {driver: bridge, ipam: {config: [{subnet: 172.30.16.0/24}]}}

volumes:
  postgres-data:
  pgbackrest-repo:
  rag-blobs:
