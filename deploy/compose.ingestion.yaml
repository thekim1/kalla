# Production Compose, ingestion zone (plans/platform/repo-and-deployment.md §6.2, §6.4): rag-worker, rag-parser,
# rag-clamav and rag-renderer. On the pilot host it runs together with compose.prod.yaml (one project, see there); from
# P2 a separate ingestion host adds compose.ingestion-remote.yaml instead. The four containers share the
# rag-ingestion.slice cgroup, which caps the whole zone (installed from deploy/host/; cgroup v2 with the systemd driver).
# Where the slice is not installed (a developer machine), set UME_RAG_INGESTION_SLICE to an empty value.
#
# The parser listens with TLS on 8000 with a certificate from the internal CA (init-deployment.sh); the worker trusts
# that CA through SSL_CERT_FILE. clamd has no TLS or authentication, so it stays on the internal ingestion network.
# The renderer (Chromium behind Playwright's launch-server, §5.4) has plain WebSocket on 3000 with a secret path, on
# the internal render network only: the worker fetches every request the browser makes (connectors design §8.3).
# It runs only with the render profile (COMPOSE_PROFILES=render in deploy/.env, from init-deployment.sh --render, which
# also gives the worker its endpoint); without it `browser` sources wait with render.not_configured (#505).

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

services:
  rag-worker:
    <<: *hardened
    image: ${WORKER_IMAGE:-ume-rag/worker:latest}
    user: "1654:1654"
    restart: unless-stopped
    # Running jobs get Worker:StopGraceSeconds (90 s) to finish, then are released; the host waits that plus 15 s.
    stop_grace_period: 120s
    cgroup_parent: ${UME_RAG_INGESTION_SLICE-rag-ingestion.slice}
    cpus: 1.5
    cpu_shares: 256
    mem_reservation: 512m
    mem_limit: 1.5g
    pids_limit: 512
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Hexadecimal, as every GC setting in the environment: 0x4B = 75 % of mem_limit.
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/worker.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/worker.key
      Parser__BaseUrl: https://rag-parser:8000
      ClamAv__Host: rag-clamav
      ClamAv__Port: "3310"
      BlobStore__Root: /data/blobs/rag
      # Fetched bodies spool to disk, not the /tmp tmpfs: a tmpfs counts against mem_limit, and 32 fetches
      # (Worker:Concurrency:fetch) of 50 MB bodies would pass it. rag-blobs-init creates the directory.
      TMPDIR: /data/blobs/spool
      # Its gateway keys (OnPrem and Eu, never External), Security__CrawlKeyPepper and Render__Endpoint (the renderer's
      # ws://rag-renderer:3000/<secret path>) are secret files.
      Gateway__BaseUrl: ${UME_RAG_GATEWAY_URL:?Set the gateway URL in deploy/.env}
      Crawl__AllowedPrivateRanges: ${UME_RAG_CRAWL_ALLOW:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UME_RAG_OTEL_ENDPOINT:-}
      # Traces: a share of the requests that start here (#503); a parent's decision wins.
      OTEL_TRACES_SAMPLER: ${UME_RAG_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${UME_RAG_OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_SERVICE_NAME: rag-worker
      SSL_CERT_FILE: /run/certs/ca.pem
    volumes:
      - ${UME_RAG_SECRETS_DIR:?Run deploy/init-deployment.sh first}/worker:/run/app-secrets:ro
      - ${UME_RAG_CERTS_DIR:?Run deploy/init-deployment.sh first}/worker:/run/certs:ro
      - ${UME_RAG_SECRETS_DIR}/keys/rag-blob-internal:/run/keys/rag-blob-internal:ro
      - rag-blobs:/data/blobs
    depends_on:
      postgres: {condition: service_healthy}
      rag-migrate: {condition: service_completed_successfully}
      rag-blobs-init: {condition: service_completed_successfully}
      # Started, not healthy: the parser warms up for minutes and freshclam's first download takes a while; the worker
      # reports them in its own health and retries.
      rag-parser: {condition: service_started}
      rag-clamav: {condition: service_started}
      # Only with the render profile.
      rag-renderer: {condition: service_started, required: false}
    # crawl: the only network with Internet egress, filtered by the host firewall (§6.1). All egress leaves through the
    # network that holds the default route, so gw_priority pins it to crawl, whose allow-list also has the gateway.
    networks:
      data: {}
      llm: {}
      ingestion: {}
      parser: {}
      render: {}
      crawl: {gw_priority: 1}
    healthcheck:
      test: [CMD, dotnet, Ume.Rag.Worker.dll, --health-check]
      interval: 30s        # a .NET process start each (~80 ms CPU, B-27 / #504)
      timeout: 10s
      start_period: 30s
      start_interval: 5s   # while starting, so up --wait and rolling updates don't wait 30 s
      retries: 3

  rag-parser:
    <<: *hardened
    image: ${PARSER_IMAGE:-ume-rag/parser:latest}
    user: "10001:10001"
    restart: unless-stopped
    cgroup_parent: ${UME_RAG_INGESTION_SLICE-rag-ingestion.slice}
    # Job directories live on /tmp; tmpfs counts against mem_limit.
    tmpfs: ["/tmp:size=1g"]
    # Development: 2 cores (pilot: 4.0, compose.host-24g.yaml; repo-and-deployment §6.2).
    cpus: 2.0
    cpu_shares: 128
    mem_reservation: 2g
    mem_limit: 3.5g
    pids_limit: 256
    environment:
      # PARSER_WORKERS x PARSER_THREADS = cpus (development: 1 x 2; 24 GB pilot host: 2 x 2 on 4 cores, compose.host-24g.yaml).
      PARSER_WORKERS: "1"
      PARSER_THREADS: "2"
      # Slot RSS cap for the 3.5g container with ner-0 (~1 GB) beside it: the watchdog answers 507 resource_limit
      # before the container limit is reached (PR for P1a item 5; the 24 GB overlay sets 2600 for 2 x 2).
      PARSER_SLOT_MAX_RSS_MB: "2200"
      PARSER_TLS_CERT_FILE: /run/certs/parser.crt
      PARSER_TLS_KEY_FILE: /run/certs/parser.key
    volumes:
      - ${UME_RAG_CERTS_DIR}/parser:/run/certs:ro
    # The parser network is internal and the parser is on no other: no egress at all (parser design §11).
    networks: [parser]
    # Health check: the image's own (python -m ume_parser.health, HTTPS once PARSER_TLS_* are set).

  rag-clamav:
    <<: *hardened
    image: ${CLAMAV_IMAGE:-ume-rag/clamav:latest}
    # The image's clamav user (images/clamav/Dockerfile).
    user: "1000:1000"
    restart: unless-stopped
    cgroup_parent: ${UME_RAG_INGESTION_SLICE-rag-ingestion.slice}
    cpus: 1.0
    cpu_shares: 128
    mem_reservation: 1.2g
    mem_limit: 1.5g
    pids_limit: 128
    volumes:
      - clamav-db:/var/lib/clamav
    # An unhealthy clamd is not restarted by Docker (the entrypoint ends in `tail -f`, so the container keeps running):
    # the host's restart-unhealthy timer (deploy/host/) restarts containers with this label. Meanwhile the worker fails
    # closed (connectors design §11).
    labels:
      ume-rag.restart-unhealthy: "true"
    # mirror: freshclam reaches database.clamav.net only (host firewall); ingestion: the worker's INSTREAM on 3310.
    networks: [ingestion, mirror]
    # Health check: the image's own (a real scan through clamd).

  rag-renderer:
    <<: *hardened
    # Off by default: an idle Chromium still holds memory and wakes up, and only `browser` sources need it.
    profiles: [render]
    image: ${RENDERER_IMAGE:-ume-rag/renderer:latest}
    user: "10002:10002"
    restart: unless-stopped
    cgroup_parent: ${UME_RAG_INGESTION_SLICE-rag-ingestion.slice}
    # Chromium's own sandbox needs user namespaces: Moby's default seccomp profile plus clone, unshare and chroot
    # (images/renderer/seccomp.json; the release bundle carries it at the same relative path). Under Docker's default
    # profile Chromium refuses to start, so the renderer fails closed.
    security_opt:
      - no-new-privileges:true
      - seccomp=../images/renderer/seccomp.json
    # Reaps Chromium's exited children (the image's entrypoint execs node).
    init: true
    # Chromium's profile and shared memory (Playwright passes --disable-dev-shm-usage) live on /tmp; tmpfs counts
    # against mem_limit.
    tmpfs: ["/tmp:size=512m"]
    cpus: 2.0
    cpu_shares: 128
    mem_reservation: 256m
    mem_limit: 2g
    pids_limit: 512
    # UME_RAG_RENDER_WS_PATH, the secret WebSocket path (init-deployment.sh). The image reads it only from its
    # environment, so it comes from a file read by `docker compose`, as Open WebUI's secrets. Without it the renderer
    # refuses to start and `up --wait` fails.
    env_file:
      - path: ${UME_RAG_SECRETS_DIR}/renderer.env
        required: false
    # One shared browser: launch-server exits when Chromium does, and Docker restarts it (the recycle). The host's
    # restart-unhealthy timer restarts it when its port stops answering (deploy/host/).
    labels:
      ume-rag.restart-unhealthy: "true"
    # The render network is internal and the renderer is on no other: no route out and no DNS beyond it; the host
    # firewall also rejects the subnet at the host (§6.1).
    networks: [render]
    # Health check: the image's own (port 3000 answers; the secret path is not needed).

networks:
  data: {driver: bridge, internal: true, ipam: {config: [{subnet: 172.30.2.0/24}]}}
  llm: {driver: bridge, ipam: {config: [{subnet: 172.30.3.0/24}]}}
  ingestion: {driver: bridge, internal: true, ipam: {config: [{subnet: 172.30.4.0/24}]}}
  parser: {driver: bridge, internal: true, ipam: {config: [{subnet: 172.30.5.0/24}]}}
  render: {driver: bridge, internal: true, ipam: {config: [{subnet: 172.30.18.0/24}]}}
  crawl: {driver: bridge, ipam: {config: [{subnet: 172.30.6.0/24}]}}
  mirror: {driver: bridge, ipam: {config: [{subnet: 172.30.7.0/24}]}}

volumes:
  rag-blobs:
  clamav-db:
