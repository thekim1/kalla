# rag-parser: Docling, OCR and the NER lane, HTTPS on 8000 with its internal certificate (name rag-parser). Called only
# by rag-worker; it needs no egress (its models are baked into the image). It warms up for minutes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-parser
  labels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-parser}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-parser}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-parser}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: rag-parser
          image: ume-rag/parser:latest
          ports: [{name: https, containerPort: 8000}]
          env:
            - {name: PARSER_WORKERS, value: "1"}
            - {name: PARSER_THREADS, value: "2"}
            - {name: PARSER_SLOT_MAX_RSS_MB, value: "2200"}
            - {name: PARSER_TLS_CERT_FILE, value: /run/certs/parser.crt}
            - {name: PARSER_TLS_KEY_FILE, value: /run/certs/parser.key}
          startupProbe:
            httpGet: {path: /health/live, port: https, scheme: HTTPS}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /health/ready, port: https, scheme: HTTPS}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: https, scheme: HTTPS}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 4
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits: {cpu: "2", memory: 3584Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: certs, mountPath: /run/certs, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: certs
          secret: {secretName: ume-rag-parser-certs, defaultMode: 0440}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: rag-parser
  labels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-parser}
spec:
  selector: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-parser}
  ports: [{name: https, port: 8000, targetPort: https}]
