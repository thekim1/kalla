# rag-worker: one replica, replaced stop-then-start (strategy Recreate): two at once would exceed the ume_rag_worker
# role's connection limit, and its job leases make the pause harmless (repo-and-deployment §7.3). Running jobs get
# Worker:StopGraceSeconds (90 s) to finish, then are released. Its egress is the crawl: keep the destinations in your
# egress firewall or proxy (NetworkPolicy cannot filter by host name).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-worker
  labels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-worker}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-worker}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile: {type: RuntimeDefault}
      # The blob container's directory, as in rag-admin (the volume's root must be writable by group 1654).
      initContainers:
        - name: blobs-init
          image: docker.io/library/alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8
          command: [/bin/sh, -c, "mkdir -p /data/blobs/rag && chmod 0750 /data/blobs/rag"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: blobs, mountPath: /data/blobs}
      containers:
        - name: rag-worker
          image: ume-rag/worker:latest
          ports: [{name: https, containerPort: 8443}]
          envFrom:
            - configMapRef: {name: ume-rag-config}
            - configMapRef: {name: ume-rag-worker-config}
          env:
            - {name: ASPNETCORE_ENVIRONMENT, value: Production}
            - {name: DOTNET_GCHeapHardLimitPercent, value: "0x4B"}
            - {name: Security__SecretsDirectory, value: /run/app-secrets}
            - {name: Kestrel__Endpoints__Https__Url, value: "https://+:8443"}
            - {name: Kestrel__Endpoints__Https__Certificate__Path, value: /run/certs/worker.crt}
            - {name: Kestrel__Endpoints__Https__Certificate__KeyPath, value: /run/certs/worker.key}
            - {name: BlobStore__Root, value: /data/blobs/rag}
            # Fetched bodies spool to disk, not memory (Compose: /data/blobs/spool).
            - {name: TMPDIR, value: /spool}
            - {name: SSL_CERT_FILE, value: /run/certs/ca.pem}
            - {name: OTEL_SERVICE_NAME, value: rag-worker}
          startupProbe:
            httpGet: {path: /health/live, port: https, scheme: HTTPS}
            periodSeconds: 2
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health/ready, port: https, scheme: HTTPS}
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: https, scheme: HTTPS}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: secrets, mountPath: /run/app-secrets, readOnly: true}
            - {name: certs, mountPath: /run/certs, readOnly: true}
            - {name: blob-key, mountPath: /run/keys, readOnly: true}
            - {name: blobs, mountPath: /data/blobs}
            - {name: spool, mountPath: /spool}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: secrets
          secret: {secretName: ume-rag-worker-secrets, defaultMode: 0440}
        - name: certs
          secret: {secretName: ume-rag-worker-certs, defaultMode: 0440}
        - name: blob-key
          secret: {secretName: ume-rag-blob-key, defaultMode: 0440}
        - name: blobs
          persistentVolumeClaim: {claimName: rag-blobs}
        # 32 fetches (Worker:Concurrency:fetch) of up to 50 MB each.
        - name: spool
          emptyDir: {sizeLimit: 4Gi}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
