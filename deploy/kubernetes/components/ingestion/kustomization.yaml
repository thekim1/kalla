# The ingestion zone: kalla-worker (one replica) and kalla-parser. Without it the base answers questions over what is
# already indexed, but nothing is crawled or parsed. Add ../clamav for the malware scan (on by default in the worker)
# and ../renderer for JavaScript-rendered pages.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - worker.yaml
  - parser.yaml
