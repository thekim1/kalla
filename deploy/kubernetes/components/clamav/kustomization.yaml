# The malware scan (connectors design §11): kalla-clamav, clamd on TCP 3310 for kalla-worker, with freshclam updating its
# signatures from database.clamav.net. Needs ../ingestion. Leaving it out turns the scan off only together with
# ClamAv__Mode=off in the overlay's kalla-worker-config (see ../../example and docs/kubernetes.md, Malware scan):
# with the default on and no clamd the worker fails closed and files wait with clamav.unavailable.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - clamav.yaml
  - networkpolicies.yaml
