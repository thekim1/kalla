# rag-clamav: clamd on TCP 3310 for rag-worker (plain TCP: networkpolicies.yaml keeps it to the worker). freshclam
# downloads the signatures from database.clamav.net on first start (several minutes) and 4 times a day after.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-clamav
  labels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-clamav}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # One signature volume (ReadWriteOnce): the old pod releases it before the new one starts.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-clamav}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-clamav}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: rag-clamav
          image: ume-rag/clamav:latest
          ports: [{name: clamd, containerPort: 3310}]
          startupProbe:
            tcpSocket: {port: clamd}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            exec: {command: [clamdscan, --no-summary, /etc/clamav/clamd.conf]}
            periodSeconds: 30
            timeoutSeconds: 30
          livenessProbe:
            tcpSocket: {port: clamd}
            periodSeconds: 30
            failureThreshold: 4
          resources:
            requests: {cpu: 250m, memory: 1200Mi}
            limits: {memory: 1536Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: db, mountPath: /var/lib/clamav}
            - {name: tmp, mountPath: /tmp}
            - {name: run, mountPath: /run/clamav}
      volumes:
        - name: db
          persistentVolumeClaim: {claimName: rag-clamav-db}
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}
        - name: run
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-clamav-db
  labels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-clamav}
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  resources:
    requests: {storage: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: rag-clamav
  labels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-clamav}
spec:
  selector: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-clamav}
  ports: [{name: clamd, port: 3310, targetPort: clamd}]
