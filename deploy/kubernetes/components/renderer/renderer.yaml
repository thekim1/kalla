apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-renderer
  labels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-renderer}
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-renderer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-renderer}
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # Compose's init: true: Chromium's zombie processes are reaped by a shared process namespace's pause process.
      shareProcessNamespace: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        seccompProfile: {type: Localhost, localhostProfile: ume-rag/renderer.json}
      containers:
        - name: rag-renderer
          image: ume-rag/renderer:latest
          ports: [{name: ws, containerPort: 3000}]
          # UME_RAG_RENDER_WS_PATH, from deploy/secrets/renderer.env (create-secrets.sh --renderer).
          envFrom:
            - secretRef: {name: ume-rag-renderer-env}
          startupProbe:
            tcpSocket: {port: ws}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: ws}
            periodSeconds: 15
          livenessProbe:
            tcpSocket: {port: ws}
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: rag-renderer
  labels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-renderer}
spec:
  selector: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-renderer}
  ports: [{name: ws, port: 3000, targetPort: ws}]
