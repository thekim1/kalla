# The renderer for JavaScript-rendered pages (connectors design §8.3): Playwright's launch-server with Chromium, reached
# only by kalla-worker over a WebSocket with a secret path. Needs ../ingestion. Chromium's own sandbox needs user
# namespaces, which the runtime's default seccomp profile blocks, so the pod uses the repository's profile
# (images/renderer/seccomp.json) as a Localhost profile: copy it to every node that may run the pod first, as
# /var/lib/kubelet/seccomp/kalla/renderer.json (docs/kubernetes.md, Renderer). A Localhost profile is allowed by
# the restricted Pod Security Standard.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - renderer.yaml
