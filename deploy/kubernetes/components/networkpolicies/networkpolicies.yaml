# Every policy selects pods by app.kubernetes.io/name: ume-rag plus their component, so other workloads in the
# namespace are left alone. Policies add up: a pod may do what any policy that selects it allows.

# Nothing in or out unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ume-rag-default-deny
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ume-rag}
  policyTypes: [Ingress, Egress]
---
# Name resolution for every pod (cluster DNS or NodeLocal DNSCache, wherever it runs).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ume-rag-dns
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ume-rag}
  policyTypes: [Egress]
  egress:
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
# rag-api: clients through the Ingress controller (Compose: edge); out to Postgres, the gateway and the IdP (llm).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ume-rag-api
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-api}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # change: the namespace (and, if it shares one, the pods) of your Ingress controller.
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: postgres}
      ports: [{protocol: TCP, port: 5432}]
    # The gateway, the OIDC authority, Open WebUI: NetworkPolicy cannot filter by host name, so keep the destinations
    # in your egress firewall or proxy. change: add the gateway's port if not 443 (the gateway's Compose stack
    # publishes 8443), and the OTLP collector's (4317).
    - ports: [{protocol: TCP, port: 443}]
---
# rag-admin: browsers through the Ingress controller; out to Postgres, the gateway (with Gateway__IntegrationApiUrl
# also its Admin API) and the IdP.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ume-rag-admin
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-admin}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        # change: the namespace (and, if it shares one, the pods) of your Ingress controller.
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports: [{protocol: TCP, port: 8443}]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: postgres}
      ports: [{protocol: TCP, port: 5432}]
    # The gateway, its Admin API, the OIDC authority, Open WebUI: NetworkPolicy cannot filter by host name, so keep the
    # destinations in your egress firewall or proxy. change: add the gateway's port if not 443 (the gateway's Compose
    # stack publishes 8443, its Admin API 9443), and the OTLP collector's (4317).
    - ports: [{protocol: TCP, port: 443}]
---
# rag-migrate: Postgres only (Compose: data).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ume-rag-migrate
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-migrate}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: postgres}
      ports: [{protocol: TCP, port: 5432}]
---
# Postgres: the app roles from the apps (Compose: the internal data network). Its pg_hba.conf accepts them from any
# address, so this policy is what keeps other pods away. Egress: none, unless pgBackRest writes to an S3 store
# (change: allow its port then).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ume-rag-postgres
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: postgres}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-api}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-admin}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-worker}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-migrate}
      ports: [{protocol: TCP, port: 5432}]
  egress: []
---
# rag-worker: no inbound; out to Postgres, the parser, clamd, the renderer, the gateway, and the crawl (Compose: crawl,
# filtered by the host firewall to public addresses plus UME_RAG_CRAWL_ALLOW).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ume-rag-worker
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-worker}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: postgres}
      ports: [{protocol: TCP, port: 5432}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-parser}
      ports: [{protocol: TCP, port: 8000}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-clamav}
      ports: [{protocol: TCP, port: 3310}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-renderer}
      ports: [{protocol: TCP, port: 3000}]
    # The gateway and the crawled sites. change: the gateway's port if not 443; the crawler's own guard refuses private
    # addresses outside Crawl:AllowedPrivateRanges, but an ipBlock with "except" for your internal ranges is a second
    # layer.
    - ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 80}]
---
# rag-parser: only from the worker; no egress (Compose: the internal parser network).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ume-rag-parser
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-parser}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-worker}
      ports: [{protocol: TCP, port: 8000}]
  egress: []
---
# rag-clamav: clamd only from the worker; out to database.clamav.net for freshclam (Compose: mirror).
# change: your HTTP proxy's port if freshclam goes through one.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ume-rag-clamav
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-clamav}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-worker}
      ports: [{protocol: TCP, port: 3310}]
  egress:
    - ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 80}]
---
# rag-renderer: only from the worker; no egress at all: every request its Chromium makes goes back to the worker
# over the same WebSocket, which fetches it with the crawler's guard (connectors design §8.3).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ume-rag-renderer
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-renderer}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ume-rag, app.kubernetes.io/component: rag-worker}
      ports: [{protocol: TCP, port: 3000}]
  egress: []
