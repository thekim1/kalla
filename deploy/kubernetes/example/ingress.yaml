# Public entry for kalla-api and the admin UI. The pods speak HTTPS (certificates from create-secrets.sh), so the
# controller must connect to them with TLS. The annotations are for ingress-nginx; for other controllers set the
# equivalent (Traefik: a ServersTransport; Gateway API: an HTTPRoute with a BackendTLSPolicy). Pass the Host header
# through unchanged (the admin UI builds its sign-in redirect from it) and do not buffer: streamed answers must reach
# clients as they are produced. List the controller's pod network under the trusted proxies (admin UI, Settings,
# Network), so kalla-api reads the client address from X-Forwarded-For.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kalla-api
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-body-size: 2m   # the chat route takes up to 2 MB of history
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [rag.example.se]             # change
      secretName: kalla-api-public-tls  # your certificate (or cert-manager's)
  rules:
    - host: rag.example.se                # change
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: kalla-api, port: {name: https}}}
---
# Uploads are up to 60 MB, one file per request, passed straight through (admin design §2.2). Signing in sets large
# cookies (the chunked session cookie and the OpenID Connect ones), more than ingress-nginx's 4k header buffer holds,
# so proxy-buffer-size is raised. The request side is the controller ConfigMap's large-client-header-buffers (default
# "4 8k"); raise it to "4 32k" there if the cookies sent back ever exceed that.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kalla-admin
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-body-size: 60m
    nginx.ingress.kubernetes.io/proxy-buffer-size: 32k   # sign-in response headers; 4k gives 502 after sign-in
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [rag-admin.example.se]       # change
      secretName: kalla-admin-public-tls
  rules:
    - host: rag-admin.example.se          # change
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: kalla-admin, port: {name: https}}}
