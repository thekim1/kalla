# Ume Rag on Kubernetes: rag-api, rag-admin, the rag-migrate Job, the blob volume and the NetworkPolicies of every
# service (default deny). Postgres comes from your platform or from components/datastores; the worker and parser from
# components/ingestion; ClamAV from components/clamav; the renderer from components/renderer; the Ingress controller's
# way in from components/ingress-controller. Do not edit this base: make an overlay (start from ../example) and see
# docs/kubernetes.md.
# Names match the Compose services (rag-api, rag-admin, postgres, ...), so the certificates and connection strings that
# deploy/init-deployment.sh generates work unchanged.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: {app.kubernetes.io/part-of: ume-rag}
resources:
  - blobs.yaml
  - migrations.yaml
  - api.yaml
  - admin.yaml
  - networkpolicies.yaml
configMapGenerator:
  # app-roles.sql is a copy of deploy/postgres/app-roles.sql (deploy/kubernetes/sync-config.sh; CI checks it).
  - name: ume-rag-app-roles
    files: [app-roles.sql]
  # Settings as the apps read them (Section__Key). The overlay merges its own values in; see ../example.
  - name: ume-rag-config
    literals:
      # Traces: a share of the requests that start here (#503); a parent's decision wins.
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=0.1
  - name: ume-rag-api-config
    literals:
      - Rag__Roles=knowledge,chat,mcp
  - name: ume-rag-admin-config
    literals:
      - Oidc__ClientId=ume-rag-admin
      - Oidc__RoleClaim=roles
      - Oidc__DepartmentClaim=departmentCodes
      - Oidc__TeamClaim=teamCodes
      - Oidc__GroupClaim=groups
      - Oidc__ExtraScopes__0=email
      - Oidc__RefuseGuests=true
      # The organisation the admin UI names in its header and sign-in texts; empty names none (#544).
      - Admin__OrganisationName=Umeå kommun
  # Used only with ../components/ingestion; generated here because an overlay merges its values before components apply.
  - name: ume-rag-worker-config
    literals:
      - Parser__BaseUrl=https://rag-parser:8000
      # The malware scan, with ../components/clamav; an overlay without that component sets off.
      - ClamAv__Mode=on
      - ClamAv__Host=rag-clamav
      - ClamAv__Port=3310
