# Ume Rag on Kubernetes: kalla-api, kalla-admin, the kalla-migrate Job, the blob volume and the NetworkPolicies of every
# service (default deny). Postgres comes from your platform or from components/datastores; the worker and parser from
# components/ingestion; ClamAV from components/clamav; the renderer from components/renderer; the Ingress controller's
# way in from components/ingress-controller. Do not edit this base: make an overlay (start from ../example) and see
# docs/kubernetes.md.
# Names match the Compose services (kalla-api, kalla-admin, postgres, ...), so the certificates and connection strings that
# deploy/init-deployment.sh generates work unchanged.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs: {app.kubernetes.io/part-of: kalla}
resources:
  - blobs.yaml
  - migrations.yaml
  - api.yaml
  - admin.yaml
  - networkpolicies.yaml
configMapGenerator:
  # app-roles.sql is a copy of deploy/postgres/app-roles.sql (deploy/kubernetes/sync-config.sh; CI checks it).
  - name: kalla-app-roles
    files: [app-roles.sql]
  # Settings as the apps read them (Section__Key). The overlay merges its own values in; see ../example.
  - name: kalla-config
    literals:
      # Traces: a share of the requests that start here (#503); a parent's decision wins.
      - OTEL_TRACES_SAMPLER=parentbased_traceidratio
      - OTEL_TRACES_SAMPLER_ARG=0.1
  - name: kalla-api-config
    literals:
      - Rag__Roles=knowledge,chat,mcp
  - name: kalla-admin-config
    literals:
      # No Oidc__* here: sign-in is set in the setup wizard, and each Oidc__* an overlay sets is the deployment's value,
      # locked in the wizard (identity design §19; ../example shows both ways).
      # Empty. A new value re-opens the setup wizard once (identity design §19); the setup code's key is the secret file
      # Setup__Secret in kalla-admin-secrets.
      - Setup__Reopen=
  # Used only with ../components/ingestion; generated here because an overlay merges its values before components apply.
  - name: kalla-worker-config
    literals:
      - Parser__BaseUrl=https://kalla-parser:8000
      # The malware scan, with ../components/clamav; an overlay without that component sets off.
      - ClamAv__Mode=on
      - ClamAv__Host=kalla-clamav
      - ClamAv__Port=3310
