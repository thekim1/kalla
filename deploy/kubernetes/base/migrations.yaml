# One-shot schema migration, role grants and the platform embedding profile, with the migrator's credentials only. Run it
# before the new app pods: deploy/kubernetes/deploy.sh does (it deletes the previous Job first, because a Job's pod
# template cannot change).
apiVersion: batch/v1
kind: Job
metadata:
  name: kalla-migrate
  labels: {app.kubernetes.io/name: kalla, app.kubernetes.io/component: kalla-migrate}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels: {app.kubernetes.io/name: kalla, app.kubernetes.io/component: kalla-migrate}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kalla-migrate
          image: kalla/migrations:latest
          env:
            - {name: DOTNET_ENVIRONMENT, value: Production}
            - {name: DOTNET_GCHeapHardLimitPercent, value: "0x4B"}
            - {name: Security__SecretsDirectory, value: /run/app-secrets}
            - {name: DataProtection__CertificatePath, value: /run/certs/data-protection.pfx}
            - {name: Migration__RolesSqlPath, value: /run/config/app-roles.sql}
            - {name: Seed__Enabled, value: "false"}
            - {name: SSL_CERT_FILE, value: /run/certs/ca.pem}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: secrets, mountPath: /run/app-secrets, readOnly: true}
            - {name: certs, mountPath: /run/certs, readOnly: true}
            - {name: roles, mountPath: /run/config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: secrets
          secret: {secretName: kalla-migrations-secrets, defaultMode: 0440}
        - name: certs
          secret: {secretName: kalla-migrations-certs, defaultMode: 0440}
        - name: roles
          configMap: {name: kalla-app-roles}
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 64Mi}
