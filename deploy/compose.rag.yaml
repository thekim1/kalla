# Ume.Rag's services, the one definition of every deployment form (Decisions "One deployment bootstrap"). Docker Compose
# runs this file directly, as the project ume-rag:
#
#   deploy/init-deployment.sh ...                       # deploy/.env: the domain, the gateway, the optional parts
#   docker compose --env-file deploy/.env up -d --wait  # its COMPOSE_FILE names this file and the overlays
#
# The one-shot rag-bootstrap (deploy/portainer/bootstrap.sh) creates the certificates and secrets in the volumes
# rag-certs and rag-secrets on the first start and the static configuration in rag-config on every start; the end of
# its log lists what is still missing and points at the setup wizard (https://<admin host>/setup, with the setup code in
# rag-admin's log). Escrow the keys a restored database needs with deploy/escrow-keys.sh. The overlays, for a Compose
# host only:
#   compose.backup.yaml       WAL archiving and pgBackRest (UME_RAG_BACKUP_TARGET), the upload copy rag-upload-backup
#   compose.hardened.yaml     fixed subnets for the host firewall, the ingestion slice, the restart-unhealthy labels,
#                             the renderer's seccomp profile and the CPU weights (deploy/host/)
#   compose.host-24g.yaml     the 24 GB host's limits
#   compose.clamav-conf.yaml  ClamAV's confs for the 24 GB host and freshclam's proxy
#   compose.rolling.yaml      a second rag-api and rag-admin for updates without downtime (deploy/rolling-update.sh)
#
# deploy/portainer/build-stack.sh merges this file with the gateway's Portainer stack into
# deploy/portainer/compose.portainer.yaml (its header: deploy/portainer/stack-header.txt), and these marks say what
# differs there, as the blocks of deploy/proxy/nginx.portainer.conf.template are marked: a line that exists only in
# the joined stack is a comment "#@joined <line>" (the gateway's bootstrap, migrations, CA and manifest keys), and a
# line that exists only here ends in "#@alone" (the network llm, the host directories, rag-bootstrap's settings for a
# stack without the gateway). Each file: config becomes inline content there. Everything else is the same in both.
#
# Required: UME_DOMAIN (or UME_RAG_API_HOST) and UME_RAG_GATEWAY_URL, the gateway's https URL. The variables are the
# Portainer stack's (deploy/portainer/stack.env.example; init-deployment.sh --help).
name: ume-rag  #@alone

x-rag-certs: &rag-certs-mount
  type: volume
  source: rag-certs
  target: /run/certs
  read_only: true

x-rag-conf: &rag-conf-mount
  type: volume
  source: rag-config
  target: /run/config
  read_only: true

x-rag-secrets: &rag-secrets-mount
  type: volume
  source: rag-secrets
  target: /run/app-secrets
  read_only: true

# The gateway's anchor in the Portainer stack.  #@alone
x-hardened: &hardened  #@alone
  read_only: true  #@alone
  cap_drop: [ALL]  #@alone
  security_opt: [no-new-privileges:true]  #@alone
  tmpfs: [/tmp]  #@alone

services:
  rag-bootstrap:
    image: docker.io/alpine/openssl@sha256:59c5cb51e536d40587667229468b007a2a6cae1705397e59e5f7774c08b74029
    restart: "no"
    entrypoint: [/bin/sh, /config/bootstrap.sh]
    environment:
      # The host names: each UME_RAG_*_HOST, else its default under UME_DOMAIN (rag., rag-admin., chat.). Without the
      # domain the admin's name is empty (bootstrap.sh gives it rag-api's) and so is Open WebUI's. rag-api, rag-admin and
      # rag-openwebui repeat the same expressions below. With neither the domain nor rag-api's name, that name is empty
      # and bootstrap.sh stops with "Set UME_DOMAIN or UME_RAG_API_HOST" (never ":?" inside a default: some Compose
      # versions evaluate it even when the outer variable is set).
      UME_RAG_API_HOST: ${UME_RAG_API_HOST:-${UME_DOMAIN:+rag.}${UME_DOMAIN:-}}
      UME_RAG_ADMIN_HOST: ${UME_RAG_ADMIN_HOST:-${UME_DOMAIN:+rag-admin.}${UME_DOMAIN:-}}
      #@joined # The TLS proxy's host names (profile proxy): the gateway's two, by the expressions of the gateway's own bootstrap.
      #@joined UME_GATEWAY_HOST: ${UME_GATEWAY_HOST:-${UME_DOMAIN:+llm.}${UME_DOMAIN:-}}
      #@joined UME_ADMIN_HOST: ${UME_ADMIN_HOST:-${UME_DOMAIN:+llm-admin.}${UME_DOMAIN:-}}
      # Without the gateway in the stack: its CA is optional (one with a public certificate needs none), and the TLS  #@alone
      # proxy has no blocks for the gateway and its admin.  #@alone
      UME_RAG_BOOTSTRAP_GATEWAY_CA: optional  #@alone
      UME_RAG_BOOTSTRAP_PROXY_GATEWAY: "no"  #@alone
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      # The ports rag-admin and the TLS proxy are published on, for the setup wizard's address in the checklist.
      UME_RAG_ADMIN_PORT: ${UME_RAG_ADMIN_PORT:-9543}
      UME_RAG_PROXY_PORT: ${UME_RAG_PROXY_PORT:-443}
      UME_RAG_API_GATEWAY_KEY: ${UME_RAG_API_GATEWAY_KEY:-}
      UME_RAG_ADMIN_GATEWAY_KEY: ${UME_RAG_ADMIN_GATEWAY_KEY:-}
      UME_RAG_WORKER_GATEWAY_KEY: ${UME_RAG_WORKER_GATEWAY_KEY:-}
      UME_RAG_OIDC_CLIENT_SECRET: ${UME_RAG_OIDC_CLIENT_SECRET:-}
      UME_RAG_OIDC_REFUSE_GUESTS: ${UME_RAG_OIDC_REFUSE_GUESTS:-}
      # For the checklist of what is still missing, which rag-bootstrap prints at the end of its log; the authority as
      # rag-admin gets it, to say whether the stack declares the sign-in.
      UME_RAG_OIDC_AUTHORITY: ${UME_RAG_OIDC_AUTHORITY:-${UME_OIDC_AUTHORITY:-}}
      UME_RAG_API_PUBLIC_URL: ${UME_RAG_API_PUBLIC_URL:-}
      UME_DOMAIN: ${UME_DOMAIN:-}
      UME_RAG_OPENWEBUI_HOST: ${UME_RAG_OPENWEBUI_HOST:-${UME_DOMAIN:+chat.}${UME_DOMAIN:-}}
      UME_RAG_OPENWEBUI_OIDC_CLIENT_SECRET: ${UME_RAG_OPENWEBUI_OIDC_CLIENT_SECRET:-}
      # The retired variables this stack still sets (Decisions "Deployment values across releases"): each name whose
      # variable has a value, for rag-bootstrap's checklist and Home's notice in the admin UI. No service reads their
      # values. A variable that is no longer read is added here and to bootstrap.sh's retired list in the same change.
      UME_RAG_RETIRED_SET: >-
        ${UME_RAG_ORG_SYNC_KEY:+UME_RAG_ORG_SYNC_KEY} ${UME_RAG_ORG_SYNC_URL:+UME_RAG_ORG_SYNC_URL}
        ${UME_RAG_OPENWEBUI_API_KEY:+UME_RAG_OPENWEBUI_API_KEY} ${UME_RAG_OPENWEBUI_CLIENT_ID:+UME_RAG_OPENWEBUI_CLIENT_ID}
        ${UME_RAG_OPENWEBUI_ADMIN_API_KEY:+UME_RAG_OPENWEBUI_ADMIN_API_KEY} ${UME_RAG_OPENWEBUI_PASSWORD_AUTH:+UME_RAG_OPENWEBUI_PASSWORD_AUTH}
        ${UME_RAG_OPENWEBUI_BASE_URL:+UME_RAG_OPENWEBUI_BASE_URL} ${UME_RAG_CLAMAV_MODE:+UME_RAG_CLAMAV_MODE}
        ${UME_RAG_EMBEDDING_MODEL:+UME_RAG_EMBEDDING_MODEL} ${UME_RAG_EMBEDDING_DIMENSIONS:+UME_RAG_EMBEDDING_DIMENSIONS}
        ${UME_RAG_EMBEDDING_REQUEST_DIMENSIONS:+UME_RAG_EMBEDDING_REQUEST_DIMENSIONS} ${UME_RAG_EMBEDDING_MAX_INPUT_TOKENS:+UME_RAG_EMBEDDING_MAX_INPUT_TOKENS}
        ${UME_RAG_EMBEDDING_MAX_RESIDENCY:+UME_RAG_EMBEDDING_MAX_RESIDENCY} ${UME_RAG_GATEWAY_MAX_RESIDENCY:+UME_RAG_GATEWAY_MAX_RESIDENCY}
        ${UME_RAG_OIDC_GROUPS_DEPARTMENT_ADMIN:+UME_RAG_OIDC_GROUPS_DEPARTMENT_ADMIN} ${UME_RAG_OIDC_GROUPS_PIPELINE_EDITOR:+UME_RAG_OIDC_GROUPS_PIPELINE_EDITOR}
        ${UME_RAG_OIDC_GROUPS_REVIEWER:+UME_RAG_OIDC_GROUPS_REVIEWER} ${UME_RAG_OIDC_GROUPS_VIEWER:+UME_RAG_OIDC_GROUPS_VIEWER}
        ${UME_ORGANISATION_NAME:+UME_ORGANISATION_NAME} ${UME_RAG_GATEWAY_INTEGRATION_API_URL:+UME_RAG_GATEWAY_INTEGRATION_API_URL}
    configs:
      - {source: rag-bootstrap-script, target: /config/bootstrap.sh}
      - {source: rag-postgres-init, target: /config/postgres-init.sql}
      - {source: rag-postgres-hba, target: /config/pg_hba.conf}
      - {source: rag-postgres-conf, target: /config/postgresql.conf}
      - {source: rag-app-roles, target: /config/app-roles.sql}
      - {source: rag-proxy-conf-template, target: /config/nginx-proxy.conf.template}
      - {source: rag-openwebui-setup-script, target: /config/feedback-key-setup.py}
      - {source: rag-openwebui-start-script, target: /config/start-with-sign-in.py}
    volumes:
      - rag-certs:/certs
      - rag-secrets:/secrets
      - rag-config:/conf
      - rag-blobs:/blobs
      - rag-openwebui-data:/openwebui-data
      #@joined - {type: volume, source: ume-certs, target: /gateway-certs, read_only: true}
      #@joined # The credential keys the gateway's migrations created from UME_INTEGRATION_MANIFEST (M-17 C7).
      #@joined - {type: volume, source: integration-secrets, target: /integration-secrets, read_only: true}
      # Host directories, each deploy/empty while unset: the gateway's CA (its ca.pem), the credential keys a gateway  #@alone
      # on this host wrote from Ume.Rag's manifest (Ume.Rag/rag-<service>), more CAs to trust (*.pem: a sign-in  #@alone
      # provider's or a database's) and your own certificates for rag-api and rag-admin (api.crt and api.key,  #@alone
      # admin.crt and admin.key), used instead of the internal CA's.  #@alone
      - {type: bind, source: "${UME_RAG_GATEWAY_CA_DIR:-./empty}", target: /gateway-certs, read_only: true, bind: {create_host_path: false}}  #@alone
      - {type: bind, source: "${UME_RAG_GATEWAY_SECRETS_DIR:-./empty}", target: /integration-secrets, read_only: true, bind: {create_host_path: false}}  #@alone
      - {type: bind, source: "${UME_RAG_TRUST_DIR:-./empty}", target: /trust, read_only: true, bind: {create_host_path: false}}  #@alone
      - {type: bind, source: "${UME_RAG_PKI_DIR:-./empty}", target: /pki, read_only: true, bind: {create_host_path: false}}  #@alone
    #@joined depends_on:
    #@joined   bootstrap: {condition: service_completed_successfully}
    #@joined   # The gateway's migrations write the manifest's keys before rag-bootstrap copies them.
    #@joined   migrations: {condition: service_completed_successfully}
    network_mode: none

  rag-postgres:
    <<: *hardened
    image: ${RAG_POSTGRES_IMAGE:-ghcr.io/thekim1/ume-rag/postgres:0.8.0@sha256:0aefe84f00b300ff677a4c33432dd01c368bb5e574540547b6c43b4538bec252}
    user: "999:999"
    restart: unless-stopped
    stop_grace_period: 60s
    tmpfs: [/tmp, "/var/run/postgresql:uid=999,gid=999,mode=0700"]
    shm_size: 1g
    cpus: 2.0
    mem_reservation: 2g
    mem_limit: 3g
    pids_limit: 512
    environment:
      POSTGRES_PASSWORD_FILE: /run/postgres-secrets/bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
    # deploy/postgres/postgresql.conf (16 GB profile), without WAL archiving: this stack has no pgBackRest repository.
    command: [postgres, -c, config_file=/run/config/postgresql.conf, -c, archive_mode=off]
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
      - {<<: *rag-conf-mount, target: /docker-entrypoint-initdb.d, volume: {subpath: postgres-init}}
      - {<<: *rag-conf-mount, volume: {subpath: postgres}}
      - {<<: *rag-certs-mount, volume: {subpath: postgres}}
      - {<<: *rag-secrets-mount, target: /run/postgres-secrets, volume: {subpath: postgres}}
    depends_on:
      rag-bootstrap: {condition: service_completed_successfully}
    networks: [rag-data]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, ragdb]
      interval: 10s
      timeout: 5s
      retries: 12

  rag-migrate:
    <<: *hardened
    image: ${RAG_MIGRATIONS_IMAGE:-ghcr.io/thekim1/ume-rag/migrations:0.8.0@sha256:1592d00a6e6dfae7ea30dbfc5c34fea0adc26c508ea49f450a51c6725b378a45}
    user: "1654:1654"
    restart: "no"
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    environment:
      DOTNET_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Migration__RolesSqlPath: /run/config/app-roles.sql
      Seed__Enabled: "false"
      SSL_CERT_FILE: /run/certs/ca.pem
    volumes:
      - {<<: *rag-conf-mount, volume: {subpath: migrations}}
      - {<<: *rag-certs-mount, volume: {subpath: migrations}}
      - {<<: *rag-secrets-mount, volume: {subpath: migrations}}
    depends_on:
      rag-postgres: {condition: service_healthy}
    networks: [rag-data]

  rag-api:
    <<: *hardened
    image: ${RAG_API_IMAGE:-ghcr.io/thekim1/ume-rag/api:0.8.0@sha256:89ff9d7746c44746c9e52cfba5e19b85bf6f66b52a6bc8b8b86fee79e174e86b}
    user: "1654:1654"
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: 2.0
    mem_reservation: 384m
    mem_limit: 1g
    pids_limit: 512
    ports: ["${UME_RAG_API_BIND:-0.0.0.0}:${UME_RAG_API_PORT:-8543}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      # The Open WebUI feedback key, minted by rag-openwebui-setup into a directory of its own (M-17 C6).
      Security__ExtraSecretsDirectory: /run/openwebui-feedback
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/api.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/api.key
      Rag__Roles: knowledge,chat,mcp
      BlobStore__Root: /data/blobs/rag
      #@joined Gateway__BaseUrl: ${UME_RAG_GATEWAY_URL:-https://gateway:8443}
      Gateway__BaseUrl: ${UME_RAG_GATEWAY_URL:?Set UME_RAG_GATEWAY_URL in deploy/.env}  #@alone
      # Citation links are absolute: the public host over HTTPS unless a URL is given (a port, a path).
      Knowledge__PublicBaseUrl: ${UME_RAG_API_PUBLIC_URL:-https://${UME_RAG_API_HOST:-${UME_DOMAIN:+rag.}${UME_DOMAIN:-}}}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UME_OTEL_ENDPOINT:-}
      # Traces: a share of the requests that start here (#503); a parent's decision wins.
      OTEL_TRACES_SAMPLER: ${UME_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${UME_OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_SERVICE_NAME: rag-api
      SSL_CERT_FILE: /run/certs/ca.pem
      DOTNET_SHUTDOWNTIMEOUTSECONDS: "50"
      # Open WebUI (profile openwebui): its users are trusted for the deployment's own Open WebUI client, which rag-migrate
      # registers (identity §5.2); the feedback import from it (chat §13.3) runs every 15 minutes. rag-bootstrap writes the
      # secret file OpenWebUi__BaseUrl (the stack's rag-openwebui, while the profile is on) and rag-openwebui-setup
      # OpenWebUi__AdminApiKey; without both there is no import.
      # Open WebUI's sign-in settings, which rag-api serves to its start (identity design §19): the deployment's values when
      # set (empty is unset; the client secret is the secret file OpenWebUi__Oidc__ClientSecret from rag-bootstrap), else
      # the setup wizard's. The provider defaults to rag-admin's authority, so rag-api gets that authority too.
      Oidc__Authority: ${UME_RAG_OIDC_AUTHORITY:-${UME_OIDC_AUTHORITY:-}}
      OpenWebUi__Oidc__ProviderUrl: ${UME_RAG_OPENWEBUI_OIDC_PROVIDER_URL:-}
      OpenWebUi__Oidc__ClientId: ${UME_RAG_OPENWEBUI_OIDC_CLIENT_ID:-}
      OpenWebUi__Oidc__ProviderName: ${UME_RAG_OPENWEBUI_OIDC_PROVIDER_NAME:-}
    volumes:
      - {<<: *rag-certs-mount, volume: {subpath: api}}
      - {<<: *rag-secrets-mount, volume: {subpath: api}}
      - {<<: *rag-secrets-mount, target: /run/openwebui-feedback, volume: {subpath: openwebui-feedback}}
      - {<<: *rag-secrets-mount, target: /run/keys, volume: {subpath: keys}}
      - {type: volume, source: rag-blobs, target: /data/blobs, read_only: true}
    depends_on:
      rag-postgres: {condition: service_healthy}
      rag-migrate: {condition: service_completed_successfully}
      #@joined gateway: {condition: service_started}
    networks:
      rag-edge: {}
      rag-data: {}
      llm: {gw_priority: 1}
    healthcheck:
      test: [CMD, dotnet, Ume.Rag.Api.dll, --health-check]
      interval: 30s        # a .NET process start each (~80 ms CPU, B-27 / #504)
      timeout: 10s
      start_period: 30s
      start_interval: 5s   # while starting, so up --wait and rolling updates don't wait 30 s
      retries: 3

  rag-admin:
    <<: *hardened
    image: ${RAG_ADMIN_IMAGE:-ghcr.io/thekim1/ume-rag/admin:0.8.0@sha256:d849f1028f57993cb71f4ed49fbed332438a8c8f19f7d4748a2a871ab040e532}
    user: "1654:1654"
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: 1.0
    mem_reservation: 256m
    mem_limit: 512m
    pids_limit: 256
    ports: ["${UME_RAG_ADMIN_BIND:-0.0.0.0}:${UME_RAG_ADMIN_PORT:-9543}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/admin.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/admin.key
      # Sign-in (identity design §19): each value set here is the deployment's and locks its field in the setup wizard;
      # an empty one is unset, so the wizard's value applies, else the code's default (client ume-rag-admin, the claims
      # roles, departmentCodes, teamCodes and groups, guests refused). The provider is the gateway's by default, with RAG's
      # own client (never the gateway's). With an authority and a client secret (the secret file Oidc__ClientSecret from
      # UME_RAG_OIDC_CLIENT_SECRET) the deployment declares its sign-in and the wizard never opens. UME_RAG_OIDC_REFUSE_GUESTS
      # is the secret file Oidc__RefuseGuests (rag-bootstrap), since an empty boolean here would stop rag-admin.
      Oidc__Authority: ${UME_RAG_OIDC_AUTHORITY:-${UME_OIDC_AUTHORITY:-}}
      Oidc__ClientId: ${UME_RAG_OIDC_CLIENT_ID:-}
      Oidc__RoleClaim: ${UME_RAG_OIDC_ROLE_CLAIM:-}
      Oidc__DepartmentClaim: ${UME_RAG_OIDC_DEPARTMENT_CLAIM:-}
      Oidc__TeamClaim: ${UME_RAG_OIDC_TEAM_CLAIM:-}
      Oidc__GroupClaim: ${UME_RAG_OIDC_GROUP_CLAIM:-}
      Oidc__ExtraScopes__0: ${UME_RAG_OIDC_EXTRA_SCOPE:-}
      Oidc__RoleGroups__rag-platform-admin: ${UME_RAG_OIDC_GROUPS_PLATFORM_ADMIN:-}
      Oidc__TenantId: ${UME_RAG_OIDC_TENANT_ID:-}
      # A new value re-opens the setup wizard once (identity design §19); the setup secret is a file in rag-secrets.
      Setup__Reopen: ${UME_RAG_SETUP_REOPEN:-}
      # Open WebUI's sign-in settings as rag-api has them (a deployment value locks the wizard's field; the client secret is
      # the secret file OpenWebUi__Oidc__ClientSecret), and its address for the redirect URI the wizard names. Whether it
      # runs is the secret file OpenWebUi__Enabled, which rag-bootstrap writes from the openwebui profile.
      OpenWebUi__Oidc__ProviderUrl: ${UME_RAG_OPENWEBUI_OIDC_PROVIDER_URL:-}
      OpenWebUi__Oidc__ClientId: ${UME_RAG_OPENWEBUI_OIDC_CLIENT_ID:-}
      OpenWebUi__Oidc__ProviderName: ${UME_RAG_OPENWEBUI_OIDC_PROVIDER_NAME:-}
      OpenWebUi__PublicUrl: https://${UME_RAG_OPENWEBUI_HOST:-${UME_DOMAIN:+chat.}${UME_DOMAIN:-localhost}}
      BlobStore__Root: /data/blobs/rag
      #@joined Gateway__BaseUrl: ${UME_RAG_GATEWAY_URL:-https://gateway:8443}
      Gateway__BaseUrl: ${UME_RAG_GATEWAY_URL:?Set UME_RAG_GATEWAY_URL in deploy/.env}  #@alone
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UME_OTEL_ENDPOINT:-}
      # Traces: a share of the requests that start here (#503); a parent's decision wins.
      OTEL_TRACES_SAMPLER: ${UME_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${UME_OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_SERVICE_NAME: rag-admin
      # rag-api's public address, shown to a platform admin who connects an app ("How to connect", admin design §5.9.1).
      Admin__ApiPublicUrl: ${UME_RAG_API_PUBLIC_URL:-https://${UME_RAG_API_HOST:-${UME_DOMAIN:+rag.}${UME_DOMAIN:-}}}
      # The gateway admin console's address for rag-admin's links to it (the setup wizard's link to the gateway's wizard
      # among them), used while the gateway's context names none (UME_ADMIN_PUBLIC_URL sets it there): its host name on
      # port 443, as behind the TLS proxy. On another port, set UME_ADMIN_PUBLIC_URL. Empty (no links) when the admin has
      # no name of its own: without UME_DOMAIN and UME_ADMIN_HOST it shares the gateway's name on another port.
      Admin__GatewayAdminUrl: ${UME_ADMIN_PUBLIC_URL:-${UME_ADMIN_HOST:+https://}${UME_ADMIN_HOST:-${UME_DOMAIN:+https://llm-admin.}${UME_DOMAIN:-}}}
      SSL_CERT_FILE: /run/certs/ca.pem
      DOTNET_SHUTDOWNTIMEOUTSECONDS: "50"
    volumes:
      - {<<: *rag-certs-mount, volume: {subpath: admin}}
      - {<<: *rag-secrets-mount, volume: {subpath: admin}}
      - {<<: *rag-secrets-mount, target: /run/keys, volume: {subpath: keys}}
      - rag-blobs:/data/blobs
    depends_on:
      rag-postgres: {condition: service_healthy}
      rag-migrate: {condition: service_completed_successfully}
    networks:
      rag-edge: {}
      rag-data: {}
      llm: {gw_priority: 1}
      #@joined # The gateway's adminapi, for its Integration API (https://adminapi:8443/integration/v1, UME_INTEGRATION_API_URL).
      #@joined edge: {}
    healthcheck:
      test: [CMD, dotnet, Ume.Rag.AdminApi.dll, --health-check]
      interval: 30s        # a .NET process start each (~80 ms CPU, B-27 / #504)
      timeout: 10s
      start_period: 30s
      start_interval: 5s   # while starting, so up --wait and rolling updates don't wait 30 s
      retries: 3

  rag-worker:
    <<: *hardened
    image: ${RAG_WORKER_IMAGE:-ghcr.io/thekim1/ume-rag/worker:0.8.0@sha256:10afeb408745fd24ffc87334b095626148efcbefc05cc422f0f7bbeef3531c06}
    user: "1654:1654"
    restart: unless-stopped
    stop_grace_period: 120s
    cpus: 1.5
    mem_reservation: 512m
    mem_limit: 1.5g
    pids_limit: 512
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/worker.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/worker.key
      Parser__BaseUrl: https://rag-parser:8000
      # ClamAv__Mode is a secret file from rag-bootstrap: on with the clamav profile (rag-clamav runs), else off, which
      # stores files without a malware scan, marked so (#535). The worker reads it at start; the profiles here make a
      # change of them recreate the worker after rag-bootstrap has written the new mode.
      UME_RAG_PROFILES: ${COMPOSE_PROFILES:-}
      ClamAv__Host: rag-clamav
      ClamAv__Port: "3310"
      BlobStore__Root: /data/blobs/rag
      TMPDIR: /data/blobs/spool
      #@joined Gateway__BaseUrl: ${UME_RAG_GATEWAY_URL:-https://gateway:8443}
      Gateway__BaseUrl: ${UME_RAG_GATEWAY_URL:?Set UME_RAG_GATEWAY_URL in deploy/.env}  #@alone
      Crawl__AllowedPrivateRanges: ${UME_RAG_CRAWL_ALLOW:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UME_OTEL_ENDPOINT:-}
      # Traces: a share of the requests that start here (#503); a parent's decision wins.
      OTEL_TRACES_SAMPLER: ${UME_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${UME_OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_SERVICE_NAME: rag-worker
      SSL_CERT_FILE: /run/certs/ca.pem
    volumes:
      - {<<: *rag-certs-mount, volume: {subpath: worker}}
      - {<<: *rag-secrets-mount, volume: {subpath: worker}}
      - {<<: *rag-secrets-mount, target: /run/keys, volume: {subpath: keys}}
      - rag-blobs:/data/blobs
    depends_on:
      rag-postgres: {condition: service_healthy}
      rag-migrate: {condition: service_completed_successfully}
      # Started, not healthy: the parser warms up for minutes and freshclam's first download takes a while.
      rag-parser: {condition: service_started}
      # Only with the clamav profile.
      rag-clamav: {condition: service_started, required: false}
    # rag-crawl holds the default route (the Internet); llm reaches the gateway.
    networks:
      rag-data: {}
      llm: {}
      rag-ingestion: {}
      rag-parser: {}
      rag-render: {}
      rag-crawl: {gw_priority: 1}
    healthcheck:
      test: [CMD, dotnet, Ume.Rag.Worker.dll, --health-check]
      interval: 30s        # a .NET process start each (~80 ms CPU, B-27 / #504)
      timeout: 10s
      start_period: 30s
      start_interval: 5s   # while starting, so up --wait and rolling updates don't wait 30 s
      retries: 3

  rag-parser:
    <<: *hardened
    image: ${RAG_PARSER_IMAGE:-ghcr.io/thekim1/ume-rag/parser:0.8.0@sha256:53c02f8203a729d96b79b463655067391e9d6290608ddbef2968f659de1b5a64}
    user: "10001:10001"
    restart: unless-stopped
    tmpfs: ["/tmp:size=1g"]
    cpus: 2.0
    mem_reservation: 2g
    mem_limit: 3.5g
    pids_limit: 256
    environment:
      PARSER_WORKERS: "1"
      PARSER_THREADS: "2"
      PARSER_SLOT_MAX_RSS_MB: "2200"
      PARSER_TLS_CERT_FILE: /run/certs/parser.crt
      PARSER_TLS_KEY_FILE: /run/certs/parser.key
    volumes:
      - {<<: *rag-certs-mount, volume: {subpath: parser}}
    depends_on:
      rag-bootstrap: {condition: service_completed_successfully}
    # Internal network only: no egress at all (parser design §11).
    networks: [rag-parser]

  # The malware scan. Add clamav to COMPOSE_PROFILES; without it the worker stores files unscanned, marked so.
  rag-clamav:
    <<: *hardened
    profiles: [clamav]
    image: ${RAG_CLAMAV_IMAGE:-ghcr.io/thekim1/ume-rag/clamav:0.8.0@sha256:37c8f54dd2015e52ef04817a84616c0218d376eda5bb203cc1c764bfd731cbce}
    user: "1000:1000"
    restart: unless-stopped
    cpus: 1.0
    mem_reservation: 1.2g
    mem_limit: 1.5g
    pids_limit: 128
    volumes:
      - rag-clamav-db:/var/lib/clamav
    # rag-mirror: freshclam's download; rag-ingestion: the worker's INSTREAM on 3310.
    networks: [rag-ingestion, rag-mirror]

  # Chromium for JavaScript-rendered pages (connectors design §8.3). Off by default: add render to COMPOSE_PROFILES.
  # Chromium's sandbox needs user namespaces, which Docker's default seccomp profile blocks, and Portainer cannot read
  # images/renderer/seccomp.json from a file, so this service runs without Docker's seccomp filter (Chromium's own
  # sandbox stays on). Without it, the worker refuses rendering and indexes the pages' HTML as served.
  # On a Compose host, compose.hardened.yaml gives it that seccomp profile instead.  #@alone
  rag-renderer:
    <<: *hardened
    profiles: [render]
    image: ${RAG_RENDERER_IMAGE:-ghcr.io/thekim1/ume-rag/renderer:0.8.0@sha256:1ed049a4b906e00c7aa044e397804bdfaaccac2b53a73ba85ee22e7e70675f99}
    user: "10002:10002"
    restart: unless-stopped
    security_opt: [no-new-privileges:true, seccomp=unconfined]
    init: true
    tmpfs: ["/tmp:size=512m"]
    cpus: 2.0
    mem_reservation: 256m
    mem_limit: 2g
    pids_limit: 512
    # The image reads its secret path only from the environment: read it from the volume, then start as the image does.
    entrypoint: [/bin/sh, -c, 'UME_RAG_RENDER_WS_PATH="$$(cat /run/render/ws-path)" exec /srv/renderer/start.sh']
    volumes:
      - {type: volume, source: rag-secrets, target: /run/render, read_only: true, volume: {subpath: renderer}}
    depends_on:
      rag-bootstrap: {condition: service_completed_successfully}
    networks: [rag-render]

  rag-openwebui:
    # Open WebUI as the users' chat (chat design §14), with the profile
    # openwebui. Plain HTTP for a TLS proxy in front; it calls rag-api inside the stack, trusting RAG's CA through
    # openwebui/ca.pem (the public CAs, RAG's and the gateway's, from rag-bootstrap).
    <<: *hardened
    profiles: [openwebui]
    # The pin also binds rag-openwebui-setup, which forges an Open WebUI session token from its internals (the user and auth
    # tables, session_stamp, utils/auth.py's claims; M-17 C6): before the digest moves, deploy/tests/portainer-boot.sh must
    # pass with the new image (it checks the minted feedback key).
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded}
    user: "1000:1000"
    restart: unless-stopped
    tmpfs: [/tmp]
    cpus: 1.0
    cpu_shares: 512
    mem_reservation: 512m
    mem_limit: 1.5g
    pids_limit: 256
    ports: ["${UME_RAG_OPENWEBUI_BIND:-127.0.0.1}:${UME_RAG_OPENWEBUI_PORT:-3000}:8080"]
    # Open WebUI takes the user-JWT secret, the service account's password, its key for rag-api and its OIDC settings only
    # from its environment. The start wrapper (deploy/openwebui/start-with-sign-in.py, from rag-config) reads the three
    # files from the volume, asks rag-api for the sign-in settings (identity design §19), starts Open WebUI as the image
    # does (bash start.sh in /app/backend) and exits when the settings change, so this restart policy starts it anew.
    entrypoint: [python3, -I, /config/start-with-sign-in.py, --secrets-dir, /run/owui-secrets, --, bash, start.sh]
    environment:
      UME_RAG_SIGN_IN_URL: https://rag-api:8443/internal/openwebui/sign-in
      HOME: /tmp
      DATA_DIR: /data
      SSL_CERT_FILE: /run/owui-secrets/ca.pem
      REQUESTS_CA_BUNDLE: /run/owui-secrets/ca.pem
      WEBUI_SECRET_KEY_FILE: /run/owui-secrets/webui_secret_key
      WEBUI_URL: https://${UME_RAG_OPENWEBUI_HOST:-${UME_DOMAIN:+chat.}${UME_DOMAIN:-localhost}}
      WEBUI_SESSION_COOKIE_SECURE: "true"
      WEBUI_AUTH_COOKIE_SECURE: "true"
      OFFLINE_MODE: "true"
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: https://rag-api:8443/v1
      OPENAI_API_CONFIGS: '{"0":{"headers":{"X-Rag-Owui-Message-Id":"{{MESSAGE_ID}}","X-Rag-Owui-User-Message-Id":"{{USER_MESSAGE_ID}}"}}}'
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      ENABLE_DIRECT_CONNECTIONS: "false"
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_CONTEXT_COMPACTION: "false"
      BYPASS_EMBEDDING_AND_RETRIEVAL: "true"
      DEFAULT_MODEL_METADATA: '{"capabilities":{"builtin_tools":false}}'
      ENABLE_WEB_SEARCH: "false"
      ENABLE_CODE_EXECUTION: "false"
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_IMAGE_GENERATION: "false"
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: "false"
      USER_PERMISSIONS_FEATURES_CODE_INTERPRETER: "false"
      USER_PERMISSIONS_FEATURES_IMAGE_GENERATION: "false"
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: "false"
      USER_PERMISSIONS_CHAT_WEB_UPLOAD: "false"
      USER_PERMISSIONS_CHAT_SYSTEM_PROMPT: "false"
      USER_PERMISSIONS_CHAT_PARAMS: "false"
      ENABLE_ADMIN_CHAT_ACCESS: "false"
      ENABLE_ADMIN_EXPORT: "false"
      WEBUI_BANNERS: '[{"id":"ume-rag-input","type":"warning","content":"Skriv inte in sekretessbelagda uppgifter eller känsliga personuppgifter.","dismissible":false,"timestamp":1793318400}]'
      ENABLE_API_KEYS: "true"
      ENABLE_API_KEYS_ENDPOINT_RESTRICTIONS: "true"
      API_KEYS_ALLOWED_ENDPOINTS: /api/v1/evaluations/feedbacks/list,/api/v1/evaluations/feedback
      USER_PERMISSIONS_FEATURES_API_KEYS: "false"
      # The feedback service account (Open WebUI's first user, never a person); its password comes from the volume.
      WEBUI_ADMIN_EMAIL: feedback-import@localhost
      WEBUI_ADMIN_NAME: Feedback import
      ENABLE_LOGIN_FORM: "false"
      ENABLE_PASSWORD_AUTH: "false"
      DEFAULT_USER_ROLE: user
      ENABLE_SIGNUP: "false"
      # ENABLE_OAUTH_SIGNUP, OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET, OPENID_PROVIDER_URL and OAUTH_PROVIDER_NAME come from the
      # start wrapper (rag-api's sign-in settings), never from here.
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "false"
      OPENID_REDIRECT_URI: https://${UME_RAG_OPENWEBUI_HOST:-${UME_DOMAIN:+chat.}${UME_DOMAIN:-localhost}}/oauth/oidc/login/callback
    volumes:
      - rag-openwebui-data:/data
      - {type: volume, source: rag-secrets, target: /run/owui-secrets, read_only: true, volume: {subpath: openwebui}}
      # Its start wrapper, which rag-bootstrap copies into rag-config: an inline config can't be read by a read-only container's user.
      - {type: volume, source: rag-config, target: /config, read_only: true, volume: {subpath: openwebui}}
    depends_on:
      rag-bootstrap: {condition: service_completed_successfully}
      rag-api: {condition: service_started}
    networks: [rag-edge]

  rag-proxy:
    # Profile proxy (M-17 C8, Decisions "Deploy configuration" D9): TLS for the five host names with the operator's
    # certificate, re-encrypting to the services and verifying them against the internal CAs. rag-bootstrap writes its
    # nginx.conf (deploy/proxy/nginx.portainer.conf.template) and the two CA certificates into rag-config/proxy.
    <<: *hardened
    profiles: [proxy]
    # nginx 1.31.6, as the browser tests' fixture site (src/Ume.Rag.AppHost); the index digest.
    image: ${RAG_PROXY_IMAGE:-docker.io/nginxinc/nginx-unprivileged:1.31.6-alpine@sha256:884e0b7f42f303641b0f4e78755aea647521dca0b89ca3be7992ad78b5c07434}
    user: "101:101"
    restart: unless-stopped
    command: [nginx, -c, /etc/nginx/ume/nginx.conf, -g, "daemon off;"]
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 128
    ports: ["${UME_RAG_PROXY_BIND:-0.0.0.0}:${UME_RAG_PROXY_PORT:-443}:8443"]
    volumes:
      - {type: volume, source: rag-config, target: /etc/nginx/ume, read_only: true, volume: {subpath: proxy}}
      # The operator's certificate: a host directory, not created when missing (the container then does not start).
      - type: bind
        source: ${UME_RAG_PROXY_CERTS_DIR:-/etc/ume-rag/proxy-certs}
        target: /run/proxy-certs
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      rag-bootstrap: {condition: service_completed_successfully}
      #@joined gateway: {condition: service_started}
      #@joined adminapi: {condition: service_started}
      rag-api: {condition: service_started}
      rag-admin: {condition: service_started}
    #@joined networks: [edge, rag-edge]
    networks: [rag-edge]  #@alone

  rag-openwebui-setup:
    # One-shot, profile openwebui (M-17 C6): the feedback service account's API key for rag-api's import, minted with a
    # short session token signed with Open WebUI's secret key, since password sign-in is off (deploy/openwebui/
    # feedback-key-setup.py). It runs Open WebUI's own image as Open WebUI's user, reads the account from its store and
    # writes only rag-secrets/openwebui-feedback, which rag-api reads; a key that still works is kept.
    <<: *hardened
    profiles: [openwebui]
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded}
    user: "1000:1000"
    restart: "no"
    entrypoint: [python3, -I, /config/feedback-key-setup.py]
    environment:
      OWUI_URL: http://rag-openwebui:8080
      WEBUI_ADMIN_EMAIL: feedback-import@localhost
    volumes:
      # Its script, which rag-bootstrap copies into rag-config: an inline config can't be written into a read-only container.
      - {type: volume, source: rag-config, target: /config, read_only: true, volume: {subpath: openwebui-setup}}
      # The store's WAL needs its directory writable even for a read-only connection.
      - rag-openwebui-data:/data
      - {type: volume, source: rag-secrets, target: /run/owui-secrets, read_only: true, volume: {subpath: openwebui}}
      - {type: volume, source: rag-secrets, target: /run/feedback, volume: {subpath: openwebui-feedback}}
    depends_on:
      rag-openwebui: {condition: service_started}
    networks: [rag-edge]

configs:
  rag-bootstrap-script:
    file: ./portainer/bootstrap.sh
  rag-postgres-init:
    file: ./postgres/init.sql
  rag-postgres-hba:
    file: ./postgres/pg_hba.conf
  rag-postgres-conf:
    file: ./postgres/postgresql.conf
  rag-app-roles:
    file: ./postgres/app-roles.sql
  rag-openwebui-setup-script:
    file: ./openwebui/feedback-key-setup.py
  rag-openwebui-start-script:
    file: ./openwebui/start-with-sign-in.py
  rag-proxy-conf-template:
    file: ./proxy/nginx.portainer.conf.template

networks:
  rag-edge: {driver: bridge}
  rag-data: {driver: bridge, internal: true}
  rag-ingestion: {driver: bridge, internal: true}
  rag-parser: {driver: bridge, internal: true}
  rag-render: {driver: bridge, internal: true}
  rag-crawl: {driver: bridge}
  rag-mirror: {driver: bridge}
  # The gateway's network in the Portainer stack; here Ume.Rag's own, which holds the default route of rag-api and  #@alone
  # rag-admin: they reach the gateway (UME_RAG_GATEWAY_URL) and the sign-in provider through it.  #@alone
  llm: {driver: bridge}  #@alone

volumes:
  rag-postgres-data:
  rag-openwebui-data:
  rag-certs:
  rag-secrets:
  rag-config:
  rag-blobs:
  rag-clamav-db:
