# Overlay for a Compose host with backups (repo-and-deployment §7.4): WAL archiving with pgBackRest inside kalla-postgres,
# and the upload copy rag-upload-backup, which deploy/backup-uploads.sh runs from rag-upload-backup.timer
# (deploy/host/). init-deployment.sh --backup-target adds it to COMPOSE_FILE. kalla-bootstrap writes the repository's
# settings to kalla-secrets/pgbackrest/repo.conf from KALLA_BACKUP_TARGET, generating the passphrase once (escrow it:
# deploy/escrow-keys.sh). Once per new database or repository, then WAL archiving works:
#
#   docker compose --env-file /etc/kalla/.env exec -T kalla-postgres pgbackrest --stanza=ragdb stanza-create
#
# KALLA_BACKUP_TARGET: s3://ENDPOINT/BUCKET[/PATH] (with KALLA_BACKUP_S3_KEY and KALLA_BACKUP_S3_KEY_SECRET; the
# upload copy to S3 is not built yet), or a posix repository: KALLA_BACKUP_DIR, a directory on the backup share, and
# KALLA_UPLOAD_BACKUP_DIR for the upload copy; without them two Docker volumes (test hosts only: not off the host).

services:
  kalla-bootstrap:
    environment:
      KALLA_BACKUP_TARGET: ${KALLA_BACKUP_TARGET:?Set KALLA_BACKUP_TARGET in /etc/kalla/.env, or leave out compose.backup.yaml}
      KALLA_BACKUP_S3_KEY: ${KALLA_BACKUP_S3_KEY:-}
      KALLA_BACKUP_S3_KEY_SECRET: ${KALLA_BACKUP_S3_KEY_SECRET:-}
      KALLA_BACKUP_S3_REGION: ${KALLA_BACKUP_S3_REGION:-}
    # kalla-bootstrap gives the repository to Postgres and the upload copy to the services' uid.
    volumes:
      - ${KALLA_BACKUP_DIR:-kalla-pgbackrest-repo}:/backup/pgbackrest
      - ${KALLA_UPLOAD_BACKUP_DIR:-kalla-upload-copy}:/backup/uploads

  kalla-postgres:
    # postgresql.conf as it is: archive_mode on, archive_command pgbackrest archive-push.
    command: !override [postgres, -c, config_file=/run/config/postgresql.conf]
    volumes:
      # The repository settings and passphrase, which pgBackRest appends to the image's /etc/pgbackrest/pgbackrest.conf.
      - {type: volume, source: kalla-secrets, target: /etc/pgbackrest/conf.d, read_only: true, volume: {subpath: pgbackrest}}
      # A posix repository; unused with S3.
      - ${KALLA_BACKUP_DIR:-kalla-pgbackrest-repo}:/var/lib/pgbackrest
    # backup: archive-push and the timer's backups reach the backup target (the host firewall allows only that).
    networks: [backup]

  # The upload copy (§7.4): new files below uploads/ to the copy, never overwriting one (blob keys are write-once). The
  # profile keeps `up` from starting it; kalla-bootstrap's image is used for its shell and coreutils only.
  rag-upload-backup:
    image: docker.io/alpine/openssl@sha256:59c5cb51e536d40587667229468b007a2a6cae1705397e59e5f7774c08b74029
    profiles: [backup]
    user: "1654:1654"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    restart: "no"
    entrypoint: [/bin/sh]
    cpus: 0.5
    cpu_shares: 128
    mem_limit: 256m
    pids_limit: 64
    volumes:
      - {type: volume, source: kalla-blobs, target: /data/blobs, read_only: true}
      - ${KALLA_UPLOAD_BACKUP_DIR:-kalla-upload-copy}:/backup
    # No network: the copy is a host directory or a volume.
    network_mode: none

networks:
  backup: {driver: bridge}

volumes:
  kalla-pgbackrest-repo:
  kalla-upload-copy:
