# GENERATED FILE: deploy/portainer/build-stack.sh of the RAG repository (thekim1/ume-rag-platform) writes it
# from the gateway's deploy/compose.portainer.yaml (below, unchanged)
# and deploy/portainer/compose.rag.template.yaml.
# Do not edit it by hand; the gateway's own note below refers to the gateway's part.
#
# GENERATED FILE: edit compose.portainer.template.yaml (and the files it includes), then run
# deploy/build-portainer-stack.sh. Do not edit compose.portainer.yaml by hand.
#
# Environment-driven production stack for Portainer (or any host where you cannot run scripts).
# Paste this file into a Portainer stack (Web editor) or deploy it from the Git repository, and
# set the variables below under "Environment variables". Nothing else is needed: the one-shot
# `bootstrap` service creates the certificates and secrets inside Docker volumes on first start.
# The containers still read secrets and certificates from read-only files, never from
# environment variables. Requires Docker 28+ / a recent Compose (configs content, volume subpath).
#
# Required variables
#   GATEWAY_IMAGE, ADMINAPI_IMAGE, MIGRATIONS_IMAGE   images pushed to a registry the host can pull
#   UME_OIDC_AUTHORITY        https URL of your OIDC provider (Keycloak realm, AD FS, Entra ID)
#   UME_GATEWAY_HOST          public hostname of the gateway API (for example llm.example.se)
#   UME_GATEWAY_PUBLIC_URL    its public URL (https://llm.example.se, add :port if not 443)
# Optional variables
#   UME_ADMIN_HOST            public hostname of the admin UI (defaults to UME_GATEWAY_HOST)
#   UME_OIDC_CLIENT_ID (ume-admin), UME_OIDC_CLIENT_SECRET (confidential clients only)
#   UME_GATEWAY_BIND / UME_ADMIN_BIND (0.0.0.0), UME_GATEWAY_PORT (8443), UME_ADMIN_PORT (9443)
#   UME_OIDC_ROLE_CLAIM, UME_OIDC_DEPARTMENT_CLAIM, UME_OIDC_TEAM_CLAIM, UME_OIDC_GROUP_CLAIM, UME_OIDC_EXTRA_SCOPE,
#   UME_OIDC_GROUPS_GATEWAY_ADMIN / _DEPARTMENT_ADMIN / _VIEWER / _TEAM_ADMIN  (see docs/runbook.md, "Identity provider")
#   UME_OTEL_ENDPOINT         OTLP collector for logs, traces and security events (off when empty)
#   UME_SOURCE_ADDRESS        client address kept for refused keys: Truncated (default), Full or None
#   (behind a reverse proxy, list it under Settings > Trusted proxies in the admin UI; UME_FORWARDED_HEADERS is gone)
#   COMPOSE_PROFILES=data     also start the read-only Data API (DATAAPI_IMAGE, UME_DATA_PORT 10443, UME_DATA_HOST,
#                             UME_DATA_AUTHORITY defaults to UME_OIDC_AUTHORITY; see docs/data-access.md)
#   UME_DATA_PUBLIC_URL       the Data API's public URL, shown with new Data API keys in the admin UI
#   UME_ADMIN_PUBLIC_URL      the admin console's address, handed to integrations (docs/integrations.md)
#   UME_INTEGRATION_API_URL   the Integration API's address as integrations reach it (for example
#                             https://adminapi:8443/integration/v1 when they share a network with adminapi)
#   UME_INTEGRATION_MANIFEST  an integration manifest (JSON) to provision on every deploy; each new credential key's
#                             secret is written to the <stack>_integration-secrets volume (docs/integrations.md)
#
# The data lives in the volumes <stack>_postgres-data, <stack>_ume-certs and <stack>_ume-secrets
# (<stack>_ume-config holds static configuration and is rewritten on every start).
# Do not delete them: a restored database is unusable without the key pepper and the Data
# Protection certificate (back up ume-secrets/.pepper and ume-certs/data-protection.pfx).
# Ports: inside the containers the apps listen on 8443 and the health probe checks that; only
# the host side of the mapping is configurable (see compose.prod.yaml for details).
#
# ---- Ume Rag (added by the RAG repository's deploy/portainer/build-stack.sh) ------------------------------------------
# The same stack also runs Ume Rag: rag-postgres, rag-migrate, rag-api (8543), rag-admin (9543), rag-worker,
# rag-parser and, with their profiles in COMPOSE_PROFILES, rag-clamav (clamav) and rag-renderer (render). Its one-shot
# rag-bootstrap creates RAG's certificates and secrets in the volumes <stack>_rag-certs and <stack>_rag-secrets on first
# start. Keep the stack name: the gateway's volumes are found by it.
#
# Start from deploy/portainer/stack.env.example (Portainer: "Load variables from .env file"); after each deploy the end
# of rag-bootstrap's log lists what is still missing. The gateway's image variables above are not needed: this file pins
# them (built from a gateway release). Steps: docs/portainer.md.
#
# Required variables (besides the gateway's above)
#   UME_RAG_API_HOST          public hostname of rag-api (for example rag.example.se)
#   UME_INTEGRATION_MANIFEST  (the gateway's) the integration Ume.Rag with its three credential keys, as in
#                             stack.env.example: the gateway's migrations create what is missing (never change what
#                             exists) and write each new key to the volume <stack>_integration-secrets, from which
#                             rag-bootstrap gives each service its key (M-17 C7). Without it, or for a key issued by hand:
#   UME_RAG_API_GATEWAY_KEY, UME_RAG_ADMIN_GATEWAY_KEY, UME_RAG_WORKER_GATEWAY_KEY
#                             each service's credential key of the gateway integration Ume.Rag; set, it wins over the
#                             manifest's. Without a key the stack starts but that service's model calls are refused. To
#                             rotate one: rotate it in the gateway's admin, then set the variable (or delete its file in
#                             <stack>_integration-secrets) and update the stack: picked up within seconds, no restart.
#   UME_INTEGRATION_API_URL   (the gateway's) https://adminapi:8443/integration/v1: the Integration API's address the
#                             gateway hands rag-admin in its context, for the cost and budget read-back (rag-admin
#                             joins the gateway's edge network to reach adminapi)
# Recommended
#   COMPOSE_PROFILES=clamav   rag-clamav, the malware scan: the worker scans with it while the profile is on, and
#                             without it stores files unscanned and marked so (rag-bootstrap sets ClamAv__Mode)
#   UME_RAG_OIDC_CLIENT_SECRET  RAG admin's own OIDC client (UME_RAG_OIDC_CLIENT_ID, ume-rag-admin) at the gateway's
#                             UME_OIDC_AUTHORITY (UME_RAG_OIDC_AUTHORITY to use another); redirect URIs
#                             https://<UME_RAG_ADMIN_HOST>:<port>/signin-oidc and /signout-callback-oidc
# Optional
#   UME_RAG_API_PUBLIC_URL    rag-api's public URL when it is not https://<UME_RAG_API_HOST> (a port:
#                             https://rag.example.se:8543); citation links are absolute
#   UME_RAG_OIDC_GROUPS_PLATFORM_ADMIN  the break-glass group(s) for the first platform admin (';'-separated), for an
#                             identity provider whose tokens carry groups instead of the role rag-platform-admin in the
#                             roles claim; the other roles' groups are set in RAG's admin (Settings, Role groups)
#   UME_RAG_ADMIN_HOST (UME_RAG_API_HOST), UME_RAG_API_PORT (8543), UME_RAG_ADMIN_PORT (9543), UME_RAG_*_BIND (0.0.0.0)
#   UME_RAG_CRAWL_ALLOW (private CIDRs the crawler may fetch). The residency ceiling is each credential key's own
#                             residencies in the gateway (register M2: OnPrem and Eu)
#   UME_RAG_GATEWAY_INTEGRATION_API_URL  the gateway's cost and budget read-back in RAG's admin UI: the gateway admin
#                             API's URL as rag-admin reaches it, https://<UME_ADMIN_HOST>:<UME_ADMIN_PORT, 9443> (adminapi
#                             is not on llm); UME_RAG_ADMIN_GATEWAY_KEY needs the scope usage.read. Unset: no read-back
#   COMPOSE_PROFILES=clamav,render  also the renderer for JavaScript-rendered pages (see rag-renderer)
#   COMPOSE_PROFILES=clamav,openwebui  also rag-openwebui, Open WebUI as the chat for users, on plain HTTP at
#                             UME_RAG_OPENWEBUI_BIND (127.0.0.1):UME_RAG_OPENWEBUI_PORT (3000) for a TLS proxy in front
#                             (it sets Secure cookies, so users reach it over HTTPS only). It calls rag-api inside the
#                             stack. Set with it:
#     UME_RAG_OPENWEBUI_HOST      its public hostname (chat.example.se)
#     UME_RAG_OPENWEBUI_OIDC_CLIENT_ID, UME_RAG_OPENWEBUI_OIDC_CLIENT_SECRET  its OIDC client; redirect URI
#                             https://<UME_RAG_OPENWEBUI_HOST>/oauth/oidc/login/callback. The provider is
#                             UME_RAG_OPENWEBUI_OIDC_PROVIDER_URL, default <UME_OIDC_AUTHORITY>/.well-known/openid-configuration
#                             Open WebUI's key for rag-api is generated by rag-bootstrap, and rag-migrate registers it as
#                             the deployment's own Open WebUI client in RAG's admin (Apps and keys); nothing to paste
#                             The feedback import needs nothing either: Open WebUI's first user is the service account
#                             feedback-import@localhost, and the one-shot rag-openwebui-setup mints its API key after
#                             Open WebUI starts (password sign-in stays off) and keeps it while it works. A new key: delete
#                             <stack>_rag-secrets/openwebui-feedback/OpenWebUi__AdminApiKey and update the stack
#   RAG_*_IMAGE               other RAG images (default: the latest release's, from ghcr.io/thekim1, pinned by digest;
#                             a release's compose.portainer.yaml asset pins its own; add ghcr.io as a registry in
#                             Portainer if the packages are private)
#   COMPOSE_PROFILES=proxy    rag-proxy, nginx with your certificate in front of all five host names (M-17 C8): the
#                             gateway (UME_GATEWAY_HOST), its admin (UME_ADMIN_HOST), rag-api (UME_RAG_API_HOST),
#                             rag-admin (UME_RAG_ADMIN_HOST) and Open WebUI (UME_RAG_OPENWEBUI_HOST), each a name of its
#                             own, on UME_RAG_PROXY_BIND:UME_RAG_PROXY_PORT (0.0.0.0:443). UME_RAG_PROXY_CERTS_DIR
#                             (/etc/ume-rag/proxy-certs) is a host directory with tls.crt (full chain) and tls.key for
#                             every name (SAN or wildcard), readable by uid 101; renewing it: replace both files and
#                             restart rag-proxy. Then bind the other published ports to 127.0.0.1 (the *_BIND
#                             variables) and list the proxy as a trusted proxy in both admins (docs/portainer.md)
# Back up rag-secrets/.pepper, rag-secrets/keys/rag-blob-internal and rag-certs/data-protection.pfx with the database:
# without them a restored RAG database is unusable. This stack has no WAL archiving (pgBackRest): back up rag-postgres
# with pg_dump or volume snapshots.

name: ume-gateway

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

x-certs: &certs-mount
  type: volume
  source: ume-certs
  target: /run/certs
  read_only: true

x-conf: &conf-mount
  type: volume
  source: ume-config
  target: /run/config
  read_only: true

x-secrets: &secrets-mount
  type: volume
  source: ume-secrets
  read_only: true

x-rag-certs: &rag-certs-mount
  type: volume
  source: rag-certs
  target: /run/certs
  read_only: true

x-rag-conf: &rag-conf-mount
  type: volume
  source: rag-config
  target: /run/config
  read_only: true

x-rag-secrets: &rag-secrets-mount
  type: volume
  source: rag-secrets
  target: /run/app-secrets
  read_only: true

services:
  bootstrap:
    image: docker.io/alpine/openssl@sha256:59c5cb51e536d40587667229468b007a2a6cae1705397e59e5f7774c08b74029
    restart: "no"
    entrypoint: [/bin/sh, /config/bootstrap.sh]
    environment:
      UME_GATEWAY_HOST: ${UME_GATEWAY_HOST:?Set UME_GATEWAY_HOST}
      UME_ADMIN_HOST: ${UME_ADMIN_HOST:-}
      UME_DATA_HOST: ${UME_DATA_HOST:-}
      UME_OIDC_CLIENT_SECRET: ${UME_OIDC_CLIENT_SECRET:-}
      UME_INTEGRATION_MANIFEST: ${UME_INTEGRATION_MANIFEST:-}
    configs:
      - {source: bootstrap-script, target: /config/bootstrap.sh}
      - {source: redis-acl-template, target: /config/users.acl.example}
      - {source: redis-conf, target: /config/redis.conf}
      - {source: postgres-init, target: /config/postgres-init.sql}
      - {source: postgres-hba, target: /config/pg_hba.conf}
      - {source: app-roles, target: /config/app-roles.sql}
    volumes:
      - ume-certs:/certs
      - ume-secrets:/secrets
      - ume-config:/conf
      - integration-secrets:/integration-secrets
    networks: [data]

  postgres:
    <<: *hardened
    image: docker.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    user: "70:70"
    restart: unless-stopped
    tmpfs: [/tmp, "/var/run/postgresql:uid=70,gid=70,mode=0700"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/postgres-secrets/bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/certs/postgres.crt, -c, ssl_key_file=/run/certs/postgres.key, -c, ssl_ca_file=/run/certs/ca.pem, -c, hba_file=/run/config/pg_hba.conf, -c, log_statement=none]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - {<<: *conf-mount, target: /docker-entrypoint-initdb.d, volume: {subpath: postgres-init}}
      - {<<: *conf-mount, volume: {subpath: postgres}}
      - {<<: *certs-mount, volume: {subpath: postgres}}
      - {<<: *secrets-mount, target: /run/postgres-secrets, volume: {subpath: postgres}}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    networks: [data]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, gatewaydb]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    <<: *hardened
    image: docker.io/library/redis:8.6@sha256:2f07354308a997554f9d676888ca927ada1293c7c2154dd01ae77f57dd9c6d5f
    user: "999:999"
    restart: unless-stopped
    entrypoint: [redis-server]
    command: [/run/config/redis.conf]
    volumes:
      - {<<: *conf-mount, volume: {subpath: redis}}
      - {<<: *certs-mount, volume: {subpath: redis}}
      - {<<: *secrets-mount, target: /run/redis-secrets, volume: {subpath: redis}}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "redis-cli --tls --cacert /run/certs/ca.pem -h redis PING | grep -q NOAUTH"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrations:
    <<: *hardened
    image: ${MIGRATIONS_IMAGE:-ghcr.io/thekim1/llmgateway/migrations:0.10.2@sha256:40369c71bddbdc9111d54c04d6ce2099259dc7d827e4cbe643c064549d87e5dd}
    user: "1654:1654"
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: Production
      Security__SecretsDirectory: /run/app-secrets
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Migration__RolesSqlPath: /run/config/app-roles.sql
      Seed__Enabled: "false"
      # UME_INTEGRATION_MANIFEST, written by the bootstrap (docs/integrations.md, "Provisioning from a manifest").
      Provisioning__Manifests: /run/config/integration-manifests
      Provisioning__SecretsPath: /run/integration-secrets
    volumes:
      - {<<: *conf-mount, volume: {subpath: migrations}}
      - {<<: *certs-mount, volume: {subpath: migrations}}
      - {<<: *secrets-mount, target: /run/app-secrets, volume: {subpath: migrations}}
      - integration-secrets:/run/integration-secrets
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data]

  gateway:
    <<: *hardened
    image: ${GATEWAY_IMAGE:-ghcr.io/thekim1/llmgateway/gateway:0.10.2@sha256:cc318dc88c9659f49189c67aa0dee599729a5cae8274c86f117e3b8e91b82314}
    user: "1654:1654"
    restart: unless-stopped
    stop_grace_period: 60s
    ports: ["${UME_GATEWAY_BIND:-0.0.0.0}:${UME_GATEWAY_PORT:-8443}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Security__SecretsDirectory: /run/app-secrets
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/gateway.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/gateway.key
      Gateway__Security__SourceAddress: ${UME_SOURCE_ADDRESS:-Truncated}
      # Integrations (docs/integrations.md): the admin console's address, for links in /v1/ume/context. Empty = none.
      Gateway__AdminUrl: ${UME_ADMIN_PUBLIC_URL:-}
      Gateway__IntegrationApiUrl: ${UME_INTEGRATION_API_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UME_OTEL_ENDPOINT:-}
      OTEL_SERVICE_NAME: gateway
      SSL_CERT_FILE: /run/certs/ca.pem
      DOTNET_SHUTDOWNTIMEOUTSECONDS: "50"
    volumes:
      - {<<: *certs-mount, volume: {subpath: gateway}}
      - {<<: *secrets-mount, target: /run/app-secrets, volume: {subpath: gateway}}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrations: {condition: service_completed_successfully}
    networks: [edge, data, llm]
    healthcheck:
      test: [CMD, dotnet, Ume.LlmGateway.Gateway.dll, --health-check]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  adminapi:
    <<: *hardened
    image: ${ADMINAPI_IMAGE:-ghcr.io/thekim1/llmgateway/adminapi:0.10.2@sha256:e2386b619a065aaca1c048181f1759f15b7a6150c33f9b28cdd12a98d791f3f7}
    user: "1654:1654"
    restart: unless-stopped
    ports: ["${UME_ADMIN_BIND:-0.0.0.0}:${UME_ADMIN_PORT:-9443}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Security__SecretsDirectory: /run/app-secrets
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/adminapi.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/adminapi.key
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UME_OTEL_ENDPOINT:-}
      OTEL_SERVICE_NAME: adminapi
      Oidc__Authority: ${UME_OIDC_AUTHORITY:?Set UME_OIDC_AUTHORITY (https URL)}
      Oidc__ClientId: ${UME_OIDC_CLIENT_ID:-ume-admin}
      Oidc__RoleClaim: ${UME_OIDC_ROLE_CLAIM:-roles}
      Oidc__DepartmentClaim: ${UME_OIDC_DEPARTMENT_CLAIM:-departmentCodes}
      Oidc__TeamClaim: ${UME_OIDC_TEAM_CLAIM:-teamCodes}
      Oidc__GroupClaim: ${UME_OIDC_GROUP_CLAIM:-groups}
      Oidc__ExtraScopes__0: ${UME_OIDC_EXTRA_SCOPE:-email}
      Oidc__RoleGroups__gateway-admin: ${UME_OIDC_GROUPS_GATEWAY_ADMIN:-}
      Oidc__RoleGroups__department-admin: ${UME_OIDC_GROUPS_DEPARTMENT_ADMIN:-}
      Oidc__RoleGroups__viewer: ${UME_OIDC_GROUPS_VIEWER:-}
      Oidc__RoleGroups__team-admin: ${UME_OIDC_GROUPS_TEAM_ADMIN:-}
      Gateway__BaseUrl: ${UME_GATEWAY_PUBLIC_URL:?Set UME_GATEWAY_PUBLIC_URL (https URL)}
      DataApi__PublicUrl: ${UME_DATA_PUBLIC_URL:-}
      Gateway__OperationsUrl: https://gateway:8443
      # Integration API (/integration/v1): requests per minute per credential key.
      Admin__IntegrationRequestsPerMinute: ${UME_INTEGRATION_REQUESTS_PER_MINUTE:-60}
      SSL_CERT_FILE: /run/certs/ca.pem
    volumes:
      - {<<: *certs-mount, volume: {subpath: adminapi}}
      - {<<: *secrets-mount, target: /run/app-secrets, volume: {subpath: adminapi}}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrations: {condition: service_completed_successfully}
    networks: [edge, data]
    healthcheck:
      test: [CMD, dotnet, Ume.LlmGateway.AdminApi.dll, --health-check]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  # Optional read-only Data API for BI, management and security integrations (docs/data-access.md).
  # Started only with the "data" profile: COMPOSE_PROFILES=data (or --profile data).
  dataapi:
    <<: *hardened
    profiles: [data]
    image: ${DATAAPI_IMAGE:-ghcr.io/thekim1/llmgateway/dataapi:0.10.2@sha256:b5a1bea5c933c2e14200c2f11af80ab418327eff7ae5a0f712f8f25caca1d0bd}
    user: "1654:1654"
    restart: unless-stopped
    ports: ["${UME_DATA_BIND:-0.0.0.0}:${UME_DATA_PORT:-10443}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Security__SecretsDirectory: /run/app-secrets
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/dataapi.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/dataapi.key
      DataApi__Authority: ${UME_DATA_AUTHORITY:-${UME_OIDC_AUTHORITY}}
      DataApi__Audience: ${UME_DATA_AUDIENCE:-ume-data-api}
      DataApi__MinimumGroupSize: ${UME_DATA_MINIMUM_GROUP_SIZE:-5}
      DataApi__TimeZone: ${UME_DATA_TIME_ZONE:-Europe/Stockholm}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UME_OTEL_ENDPOINT:-}
      OTEL_SERVICE_NAME: dataapi
      SSL_CERT_FILE: /run/certs/ca.pem
    volumes:
      - {<<: *certs-mount, volume: {subpath: dataapi}}
      - {<<: *secrets-mount, target: /run/app-secrets, volume: {subpath: dataapi}}
    depends_on:
      postgres: {condition: service_healthy}
      migrations: {condition: service_completed_successfully}
    networks: [edge, data]
    healthcheck:
      test: [CMD, dotnet, Ume.LlmGateway.DataApi.dll, --health-check]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  rag-bootstrap:
    image: docker.io/alpine/openssl@sha256:59c5cb51e536d40587667229468b007a2a6cae1705397e59e5f7774c08b74029
    restart: "no"
    entrypoint: [/bin/sh, /config/bootstrap.sh]
    environment:
      UME_RAG_API_HOST: ${UME_RAG_API_HOST:?Set UME_RAG_API_HOST}
      UME_RAG_ADMIN_HOST: ${UME_RAG_ADMIN_HOST:-}
      # The TLS proxy's host names (profile proxy).
      UME_GATEWAY_HOST: ${UME_GATEWAY_HOST:-}
      UME_ADMIN_HOST: ${UME_ADMIN_HOST:-}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      UME_RAG_API_GATEWAY_KEY: ${UME_RAG_API_GATEWAY_KEY:-}
      UME_RAG_ADMIN_GATEWAY_KEY: ${UME_RAG_ADMIN_GATEWAY_KEY:-}
      UME_RAG_WORKER_GATEWAY_KEY: ${UME_RAG_WORKER_GATEWAY_KEY:-}
      UME_RAG_OIDC_CLIENT_SECRET: ${UME_RAG_OIDC_CLIENT_SECRET:-}
      # For the checklist of what is still missing, which rag-bootstrap prints at the end of its log.
      UME_RAG_API_PUBLIC_URL: ${UME_RAG_API_PUBLIC_URL:-}
      UME_RAG_OPENWEBUI_HOST: ${UME_RAG_OPENWEBUI_HOST:-}
      UME_RAG_OPENWEBUI_OIDC_CLIENT_SECRET: ${UME_RAG_OPENWEBUI_OIDC_CLIENT_SECRET:-}
    configs:
      - {source: rag-bootstrap-script, target: /config/bootstrap.sh}
      - {source: rag-postgres-init, target: /config/postgres-init.sql}
      - {source: rag-postgres-hba, target: /config/pg_hba.conf}
      - {source: rag-postgres-conf, target: /config/postgresql.conf}
      - {source: rag-app-roles, target: /config/app-roles.sql}
      - {source: rag-proxy-conf-template, target: /config/nginx-proxy.conf.template}
    volumes:
      - rag-certs:/certs
      - rag-secrets:/secrets
      - rag-config:/conf
      - rag-blobs:/blobs
      - rag-openwebui-data:/openwebui-data
      - {type: volume, source: ume-certs, target: /gateway-certs, read_only: true}
      # The credential keys the gateway's migrations created from UME_INTEGRATION_MANIFEST (M-17 C7).
      - {type: volume, source: integration-secrets, target: /integration-secrets, read_only: true}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      # The gateway's migrations write the manifest's keys before rag-bootstrap copies them.
      migrations: {condition: service_completed_successfully}
    network_mode: none

  rag-postgres:
    <<: *hardened
    image: ${RAG_POSTGRES_IMAGE:-ghcr.io/thekim1/ume-rag/postgres:0.5.1@sha256:0c52bc3d2e89dd8e5106db2a22ecd838776cbd3ebd8b489a4282611d00c8e3df}
    user: "999:999"
    restart: unless-stopped
    stop_grace_period: 60s
    tmpfs: [/tmp, "/var/run/postgresql:uid=999,gid=999,mode=0700"]
    shm_size: 1g
    cpus: 2.0
    mem_reservation: 2g
    mem_limit: 3g
    pids_limit: 512
    environment:
      POSTGRES_PASSWORD_FILE: /run/postgres-secrets/bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
    # deploy/postgres/postgresql.conf (16 GB profile), without WAL archiving: this stack has no pgBackRest repository.
    command: [postgres, -c, config_file=/run/config/postgresql.conf, -c, archive_mode=off]
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
      - {<<: *rag-conf-mount, target: /docker-entrypoint-initdb.d, volume: {subpath: postgres-init}}
      - {<<: *rag-conf-mount, volume: {subpath: postgres}}
      - {<<: *rag-certs-mount, volume: {subpath: postgres}}
      - {<<: *rag-secrets-mount, target: /run/postgres-secrets, volume: {subpath: postgres}}
    depends_on:
      rag-bootstrap: {condition: service_completed_successfully}
    networks: [rag-data]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, ragdb]
      interval: 10s
      timeout: 5s
      retries: 12

  rag-migrate:
    <<: *hardened
    image: ${RAG_MIGRATIONS_IMAGE:-ghcr.io/thekim1/ume-rag/migrations:0.5.1@sha256:72200977c37f52382d6c030305140bd6fe1363a0e4d570c4d824cbde56a930f2}
    user: "1654:1654"
    restart: "no"
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    environment:
      DOTNET_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Migration__RolesSqlPath: /run/config/app-roles.sql
      Seed__Enabled: "false"
      SSL_CERT_FILE: /run/certs/ca.pem
    volumes:
      - {<<: *rag-conf-mount, volume: {subpath: migrations}}
      - {<<: *rag-certs-mount, volume: {subpath: migrations}}
      - {<<: *rag-secrets-mount, volume: {subpath: migrations}}
    depends_on:
      rag-postgres: {condition: service_healthy}
    networks: [rag-data]

  rag-api:
    <<: *hardened
    image: ${RAG_API_IMAGE:-ghcr.io/thekim1/ume-rag/api:0.5.1@sha256:5644aeca02e062b56373f1bb2f149c690d0b996aa689a845ed6c1d70a7ef8afa}
    user: "1654:1654"
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: 2.0
    mem_reservation: 384m
    mem_limit: 1g
    pids_limit: 512
    ports: ["${UME_RAG_API_BIND:-0.0.0.0}:${UME_RAG_API_PORT:-8543}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      # The Open WebUI feedback key, minted by rag-openwebui-setup into a directory of its own (M-17 C6).
      Security__ExtraSecretsDirectory: /run/openwebui-feedback
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/api.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/api.key
      Rag__Roles: knowledge,chat,mcp
      BlobStore__Root: /data/blobs/rag
      Gateway__BaseUrl: ${UME_RAG_GATEWAY_URL:-https://gateway:8443}
      # Citation links are absolute: the public host over HTTPS unless a URL is given (a port, a path).
      Knowledge__PublicBaseUrl: ${UME_RAG_API_PUBLIC_URL:-https://${UME_RAG_API_HOST}}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UME_OTEL_ENDPOINT:-}
      # Traces: a share of the requests that start here (#503); a parent's decision wins.
      OTEL_TRACES_SAMPLER: ${UME_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${UME_OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_SERVICE_NAME: rag-api
      SSL_CERT_FILE: /run/certs/ca.pem
      DOTNET_SHUTDOWNTIMEOUTSECONDS: "50"
      # Open WebUI (profile openwebui): its users are trusted for the deployment's own Open WebUI client, which rag-migrate
      # registers (identity §5.2); the feedback import from it (chat §13.3) runs every 15 minutes. rag-bootstrap writes the
      # secret file OpenWebUi__BaseUrl (the stack's rag-openwebui, while the profile is on) and rag-openwebui-setup
      # OpenWebUi__AdminApiKey; without both there is no import.
    volumes:
      - {<<: *rag-certs-mount, volume: {subpath: api}}
      - {<<: *rag-secrets-mount, volume: {subpath: api}}
      - {<<: *rag-secrets-mount, target: /run/openwebui-feedback, volume: {subpath: openwebui-feedback}}
      - {<<: *rag-secrets-mount, target: /run/keys, volume: {subpath: keys}}
      - {type: volume, source: rag-blobs, target: /data/blobs, read_only: true}
    depends_on:
      rag-postgres: {condition: service_healthy}
      rag-migrate: {condition: service_completed_successfully}
      gateway: {condition: service_started}
    networks:
      rag-edge: {}
      rag-data: {}
      llm: {gw_priority: 1}
    healthcheck:
      test: [CMD, dotnet, Ume.Rag.Api.dll, --health-check]
      interval: 30s        # a .NET process start each (~80 ms CPU, B-27 / #504)
      timeout: 10s
      start_period: 30s
      start_interval: 5s   # while starting, so up --wait and rolling updates don't wait 30 s
      retries: 3

  rag-admin:
    <<: *hardened
    image: ${RAG_ADMIN_IMAGE:-ghcr.io/thekim1/ume-rag/admin:0.5.1@sha256:38c9e6de3a2423e1d2802260ffbe7fac6da44d6aba8300685e357e4b003c7b9f}
    user: "1654:1654"
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: 1.0
    mem_reservation: 256m
    mem_limit: 512m
    pids_limit: 256
    ports: ["${UME_RAG_ADMIN_BIND:-0.0.0.0}:${UME_RAG_ADMIN_PORT:-9543}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/admin.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/admin.key
      # The gateway's identity provider by default, with RAG's own client (never the gateway's).
      Oidc__Authority: ${UME_RAG_OIDC_AUTHORITY:-${UME_OIDC_AUTHORITY}}
      Oidc__ClientId: ${UME_RAG_OIDC_CLIENT_ID:-ume-rag-admin}
      Oidc__RoleClaim: ${UME_RAG_OIDC_ROLE_CLAIM:-roles}
      Oidc__DepartmentClaim: ${UME_RAG_OIDC_DEPARTMENT_CLAIM:-departmentCodes}
      Oidc__TeamClaim: ${UME_RAG_OIDC_TEAM_CLAIM:-teamCodes}
      Oidc__GroupClaim: ${UME_RAG_OIDC_GROUP_CLAIM:-groups}
      Oidc__ExtraScopes__0: ${UME_RAG_OIDC_EXTRA_SCOPE:-email}
      Oidc__RoleGroups__rag-platform-admin: ${UME_RAG_OIDC_GROUPS_PLATFORM_ADMIN:-}
      Oidc__TenantId: ${UME_RAG_OIDC_TENANT_ID:-}
      Oidc__RefuseGuests: ${UME_RAG_OIDC_REFUSE_GUESTS:-true}
      BlobStore__Root: /data/blobs/rag
      Gateway__BaseUrl: ${UME_RAG_GATEWAY_URL:-https://gateway:8443}
      # The gateway admin API's Integration API (/integration/v1), the cost and budget read-back (#580); empty: none.
      Gateway__IntegrationApiUrl: ${UME_RAG_GATEWAY_INTEGRATION_API_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UME_OTEL_ENDPOINT:-}
      # Traces: a share of the requests that start here (#503); a parent's decision wins.
      OTEL_TRACES_SAMPLER: ${UME_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${UME_OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_SERVICE_NAME: rag-admin
      # The organisation the admin UI names in its header and sign-in texts; empty names none (#544).
      Admin__OrganisationName: ${UME_ORGANISATION_NAME-Umeå kommun}
      # rag-api's public address, shown to a platform admin who connects an app ("How to connect", admin design §5.9.1).
      Admin__ApiPublicUrl: ${UME_RAG_API_PUBLIC_URL:-https://${UME_RAG_API_HOST}}
      SSL_CERT_FILE: /run/certs/ca.pem
      DOTNET_SHUTDOWNTIMEOUTSECONDS: "50"
    volumes:
      - {<<: *rag-certs-mount, volume: {subpath: admin}}
      - {<<: *rag-secrets-mount, volume: {subpath: admin}}
      - {<<: *rag-secrets-mount, target: /run/keys, volume: {subpath: keys}}
      - rag-blobs:/data/blobs
    depends_on:
      rag-postgres: {condition: service_healthy}
      rag-migrate: {condition: service_completed_successfully}
    networks:
      rag-edge: {}
      rag-data: {}
      llm: {gw_priority: 1}
      # The gateway's adminapi, for its Integration API (https://adminapi:8443/integration/v1, UME_INTEGRATION_API_URL).
      edge: {}
    healthcheck:
      test: [CMD, dotnet, Ume.Rag.AdminApi.dll, --health-check]
      interval: 30s        # a .NET process start each (~80 ms CPU, B-27 / #504)
      timeout: 10s
      start_period: 30s
      start_interval: 5s   # while starting, so up --wait and rolling updates don't wait 30 s
      retries: 3

  rag-worker:
    <<: *hardened
    image: ${RAG_WORKER_IMAGE:-ghcr.io/thekim1/ume-rag/worker:0.5.1@sha256:38ff11c71d98d390e8e523eb1ce4723468c7ee4bb714c0383d8ce47961afc596}
    user: "1654:1654"
    restart: unless-stopped
    stop_grace_period: 120s
    cpus: 1.5
    mem_reservation: 512m
    mem_limit: 1.5g
    pids_limit: 512
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/worker.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/worker.key
      Parser__BaseUrl: https://rag-parser:8000
      # ClamAv__Mode is a secret file from rag-bootstrap: on with the clamav profile (rag-clamav runs), else off, which
      # stores files without a malware scan, marked so (#535). The worker reads it at start; the profiles here make a
      # change of them recreate the worker after rag-bootstrap has written the new mode.
      UME_RAG_PROFILES: ${COMPOSE_PROFILES:-}
      ClamAv__Host: rag-clamav
      ClamAv__Port: "3310"
      BlobStore__Root: /data/blobs/rag
      TMPDIR: /data/blobs/spool
      Gateway__BaseUrl: ${UME_RAG_GATEWAY_URL:-https://gateway:8443}
      Crawl__AllowedPrivateRanges: ${UME_RAG_CRAWL_ALLOW:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UME_OTEL_ENDPOINT:-}
      # Traces: a share of the requests that start here (#503); a parent's decision wins.
      OTEL_TRACES_SAMPLER: ${UME_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${UME_OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_SERVICE_NAME: rag-worker
      SSL_CERT_FILE: /run/certs/ca.pem
    volumes:
      - {<<: *rag-certs-mount, volume: {subpath: worker}}
      - {<<: *rag-secrets-mount, volume: {subpath: worker}}
      - {<<: *rag-secrets-mount, target: /run/keys, volume: {subpath: keys}}
      - rag-blobs:/data/blobs
    depends_on:
      rag-postgres: {condition: service_healthy}
      rag-migrate: {condition: service_completed_successfully}
      # Started, not healthy: the parser warms up for minutes and freshclam's first download takes a while.
      rag-parser: {condition: service_started}
      # Only with the clamav profile.
      rag-clamav: {condition: service_started, required: false}
    # rag-crawl holds the default route (the Internet); llm reaches the gateway.
    networks:
      rag-data: {}
      llm: {}
      rag-ingestion: {}
      rag-parser: {}
      rag-render: {}
      rag-crawl: {gw_priority: 1}
    healthcheck:
      test: [CMD, dotnet, Ume.Rag.Worker.dll, --health-check]
      interval: 30s        # a .NET process start each (~80 ms CPU, B-27 / #504)
      timeout: 10s
      start_period: 30s
      start_interval: 5s   # while starting, so up --wait and rolling updates don't wait 30 s
      retries: 3

  rag-parser:
    <<: *hardened
    image: ${RAG_PARSER_IMAGE:-ghcr.io/thekim1/ume-rag/parser:0.5.1@sha256:1c7ed8bdcb1faeb75d0dd579fad299aea74d463e427397ef856c22cce98e5b47}
    user: "10001:10001"
    restart: unless-stopped
    tmpfs: ["/tmp:size=1g"]
    cpus: 2.0
    mem_reservation: 2g
    mem_limit: 3.5g
    pids_limit: 256
    environment:
      PARSER_WORKERS: "1"
      PARSER_THREADS: "2"
      PARSER_SLOT_MAX_RSS_MB: "2200"
      PARSER_TLS_CERT_FILE: /run/certs/parser.crt
      PARSER_TLS_KEY_FILE: /run/certs/parser.key
    volumes:
      - {<<: *rag-certs-mount, volume: {subpath: parser}}
    depends_on:
      rag-bootstrap: {condition: service_completed_successfully}
    # Internal network only: no egress at all (parser design §11).
    networks: [rag-parser]

  # The malware scan. Add clamav to COMPOSE_PROFILES; without it the worker stores files unscanned, marked so.
  rag-clamav:
    <<: *hardened
    profiles: [clamav]
    image: ${RAG_CLAMAV_IMAGE:-ghcr.io/thekim1/ume-rag/clamav:0.5.1@sha256:134a3fb0fcbc0ac6d3b7e09329383417fce1c38864e107eb186339700d42be57}
    user: "1000:1000"
    restart: unless-stopped
    cpus: 1.0
    mem_reservation: 1.2g
    mem_limit: 1.5g
    pids_limit: 128
    volumes:
      - rag-clamav-db:/var/lib/clamav
    # rag-mirror: freshclam's download; rag-ingestion: the worker's INSTREAM on 3310.
    networks: [rag-ingestion, rag-mirror]

  # Chromium for JavaScript-rendered pages (connectors design §8.3). Off by default: add render to COMPOSE_PROFILES.
  # Chromium's sandbox needs user namespaces, which Docker's default seccomp profile blocks, and Portainer cannot read
  # images/renderer/seccomp.json from a file, so this service runs without Docker's seccomp filter (Chromium's own
  # sandbox stays on). Without it, the worker refuses rendering and indexes the pages' HTML as served.
  rag-renderer:
    <<: *hardened
    profiles: [render]
    image: ${RAG_RENDERER_IMAGE:-ghcr.io/thekim1/ume-rag/renderer:0.5.1@sha256:c5b3c09c307005654a3fbcf535aeafbc677487354ae853389dfa487b1e4f32b9}
    user: "10002:10002"
    restart: unless-stopped
    security_opt: [no-new-privileges:true, seccomp=unconfined]
    init: true
    tmpfs: ["/tmp:size=512m"]
    cpus: 2.0
    mem_reservation: 256m
    mem_limit: 2g
    pids_limit: 512
    # The image reads its secret path only from the environment: read it from the volume, then start as the image does.
    entrypoint: [/bin/sh, -c, 'UME_RAG_RENDER_WS_PATH="$$(cat /run/render/ws-path)" exec /srv/renderer/start.sh']
    volumes:
      - {type: volume, source: rag-secrets, target: /run/render, read_only: true, volume: {subpath: renderer}}
    depends_on:
      rag-bootstrap: {condition: service_completed_successfully}
    networks: [rag-render]

  rag-openwebui:
    # Open WebUI as the users' chat (compose.openwebui.yaml in a Compose deployment; chat design §14), with the profile
    # openwebui. Plain HTTP for a TLS proxy in front; it calls rag-api inside the stack, trusting RAG's CA through
    # openwebui/ca.pem (the public CAs, RAG's and the gateway's, from rag-bootstrap).
    <<: *hardened
    profiles: [openwebui]
    # The pin also binds rag-openwebui-setup, which forges an Open WebUI session token from its internals (the user and auth
    # tables, session_stamp, utils/auth.py's claims; M-17 C6): before the digest moves, deploy/tests/portainer-boot.sh must
    # pass with the new image (it checks the minted feedback key).
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded}
    user: "1000:1000"
    restart: unless-stopped
    tmpfs: [/tmp]
    cpus: 1.0
    cpu_shares: 512
    mem_reservation: 512m
    mem_limit: 1.5g
    pids_limit: 256
    ports: ["${UME_RAG_OPENWEBUI_BIND:-127.0.0.1}:${UME_RAG_OPENWEBUI_PORT:-3000}:8080"]
    # Open WebUI takes the user-JWT secret, the service account's password and its key for rag-api only from its
    # environment: read them from the volume, then start as the image does (bash start.sh in /app/backend).
    entrypoint: [/bin/bash, -c, 'export FORWARD_USER_INFO_HEADER_JWT_SECRET="$$(cat /run/owui-secrets/jwt-secret)" WEBUI_ADMIN_PASSWORD="$$(cat /run/owui-secrets/admin-password)" OPENAI_API_KEYS="$$(cat /run/owui-secrets/rag-api-key)"; exec bash start.sh']
    environment:
      HOME: /tmp
      DATA_DIR: /data
      SSL_CERT_FILE: /run/owui-secrets/ca.pem
      REQUESTS_CA_BUNDLE: /run/owui-secrets/ca.pem
      WEBUI_SECRET_KEY_FILE: /run/owui-secrets/webui_secret_key
      WEBUI_URL: https://${UME_RAG_OPENWEBUI_HOST:-localhost}
      WEBUI_SESSION_COOKIE_SECURE: "true"
      WEBUI_AUTH_COOKIE_SECURE: "true"
      OFFLINE_MODE: "true"
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: https://rag-api:8443/v1
      OPENAI_API_CONFIGS: '{"0":{"headers":{"X-Rag-Owui-Message-Id":"{{MESSAGE_ID}}","X-Rag-Owui-User-Message-Id":"{{USER_MESSAGE_ID}}"}}}'
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      ENABLE_DIRECT_CONNECTIONS: "false"
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_CONTEXT_COMPACTION: "false"
      BYPASS_EMBEDDING_AND_RETRIEVAL: "true"
      DEFAULT_MODEL_METADATA: '{"capabilities":{"builtin_tools":false}}'
      ENABLE_WEB_SEARCH: "false"
      ENABLE_CODE_EXECUTION: "false"
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_IMAGE_GENERATION: "false"
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: "false"
      USER_PERMISSIONS_FEATURES_CODE_INTERPRETER: "false"
      USER_PERMISSIONS_FEATURES_IMAGE_GENERATION: "false"
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: "false"
      USER_PERMISSIONS_CHAT_WEB_UPLOAD: "false"
      USER_PERMISSIONS_CHAT_SYSTEM_PROMPT: "false"
      USER_PERMISSIONS_CHAT_PARAMS: "false"
      ENABLE_ADMIN_CHAT_ACCESS: "false"
      ENABLE_ADMIN_EXPORT: "false"
      WEBUI_BANNERS: '[{"id":"ume-rag-input","type":"warning","content":"Skriv inte in sekretessbelagda uppgifter eller känsliga personuppgifter.","dismissible":false,"timestamp":1793318400}]'
      ENABLE_API_KEYS: "true"
      ENABLE_API_KEYS_ENDPOINT_RESTRICTIONS: "true"
      API_KEYS_ALLOWED_ENDPOINTS: /api/v1/evaluations/feedbacks/list,/api/v1/evaluations/feedback
      USER_PERMISSIONS_FEATURES_API_KEYS: "false"
      # The feedback service account (Open WebUI's first user, never a person); its password comes from the volume.
      WEBUI_ADMIN_EMAIL: feedback-import@localhost
      WEBUI_ADMIN_NAME: Feedback import
      ENABLE_LOGIN_FORM: "false"
      ENABLE_PASSWORD_AUTH: "false"
      DEFAULT_USER_ROLE: user
      ENABLE_SIGNUP: "false"
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "false"
      OAUTH_PROVIDER_NAME: ${UME_RAG_OPENWEBUI_OIDC_PROVIDER_NAME:-Umeå kommun}
      OAUTH_CLIENT_ID: ${UME_RAG_OPENWEBUI_OIDC_CLIENT_ID:-open-webui}
      OAUTH_CLIENT_SECRET: ${UME_RAG_OPENWEBUI_OIDC_CLIENT_SECRET:-}
      OPENID_PROVIDER_URL: ${UME_RAG_OPENWEBUI_OIDC_PROVIDER_URL:-${UME_OIDC_AUTHORITY:-https://keycloak.invalid/realms/ume}/.well-known/openid-configuration}
      OPENID_REDIRECT_URI: https://${UME_RAG_OPENWEBUI_HOST:-localhost}/oauth/oidc/login/callback
    volumes:
      - rag-openwebui-data:/data
      - {type: volume, source: rag-secrets, target: /run/owui-secrets, read_only: true, volume: {subpath: openwebui}}
    depends_on:
      rag-bootstrap: {condition: service_completed_successfully}
      rag-api: {condition: service_started}
    networks: [rag-edge]

  rag-proxy:
    # Profile proxy (M-17 C8, Decisions "Deploy configuration" D9): TLS for the five host names with the operator's
    # certificate, re-encrypting to the services and verifying them against the internal CAs. rag-bootstrap writes its
    # nginx.conf (deploy/proxy/nginx.portainer.conf.template) and the two CA certificates into rag-config/proxy.
    <<: *hardened
    profiles: [proxy]
    # nginx 1.31.6, as the browser tests' fixture site (src/Ume.Rag.AppHost); the index digest.
    image: ${RAG_PROXY_IMAGE:-docker.io/nginxinc/nginx-unprivileged:1.31.6-alpine@sha256:884e0b7f42f303641b0f4e78755aea647521dca0b89ca3be7992ad78b5c07434}
    user: "101:101"
    restart: unless-stopped
    command: [nginx, -c, /etc/nginx/ume/nginx.conf, -g, "daemon off;"]
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 128
    ports: ["${UME_RAG_PROXY_BIND:-0.0.0.0}:${UME_RAG_PROXY_PORT:-443}:8443"]
    volumes:
      - {type: volume, source: rag-config, target: /etc/nginx/ume, read_only: true, volume: {subpath: proxy}}
      # The operator's certificate: a host directory, not created when missing (the container then does not start).
      - type: bind
        source: ${UME_RAG_PROXY_CERTS_DIR:-/etc/ume-rag/proxy-certs}
        target: /run/proxy-certs
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      rag-bootstrap: {condition: service_completed_successfully}
      gateway: {condition: service_started}
      adminapi: {condition: service_started}
      rag-api: {condition: service_started}
      rag-admin: {condition: service_started}
    networks: [edge, rag-edge]

  rag-openwebui-setup:
    # One-shot, profile openwebui (M-17 C6): the feedback service account's API key for rag-api's import, minted with a
    # short session token signed with Open WebUI's secret key, since password sign-in is off (deploy/openwebui/
    # feedback-key-setup.py). It runs Open WebUI's own image as Open WebUI's user, reads the account from its store and
    # writes only rag-secrets/openwebui-feedback, which rag-api reads; a key that still works is kept.
    <<: *hardened
    profiles: [openwebui]
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded}
    user: "1000:1000"
    restart: "no"
    entrypoint: [python3, -I, /config/feedback-key-setup.py]
    environment:
      OWUI_URL: http://rag-openwebui:8080
      WEBUI_ADMIN_EMAIL: feedback-import@localhost
    configs:
      - {source: rag-openwebui-setup-script, target: /config/feedback-key-setup.py}
    volumes:
      # The store's WAL needs its directory writable even for a read-only connection.
      - rag-openwebui-data:/data
      - {type: volume, source: rag-secrets, target: /run/owui-secrets, read_only: true, volume: {subpath: openwebui}}
      - {type: volume, source: rag-secrets, target: /run/feedback, volume: {subpath: openwebui-feedback}}
    depends_on:
      rag-openwebui: {condition: service_started}
    networks: [rag-edge]

configs:
  bootstrap-script:
    content: |
      #!/bin/sh
      # One-shot bootstrap for compose.portainer.yaml: creates the internal CA, service certificates,
      # Data Protection certificate, passwords, key pepper and Redis ACL in the ume-certs / ume-secrets
      # volumes. Idempotent: existing secrets are never overwritten (a new pepper or Data Protection
      # certificate would break existing data); service certificates are re-issued when they expire
      # within 30 days or the hostnames change. Inputs come from environment variables.
      set -eu
      umask 077
      C=/certs
      S=/secrets
      : "$${UME_GATEWAY_HOST:?Set UME_GATEWAY_HOST (public hostname of the gateway API)}"
      ADMIN_HOST="$${UME_ADMIN_HOST:-$$UME_GATEWAY_HOST}"
      DATA_HOST="$${UME_DATA_HOST:-$$UME_GATEWAY_HOST}"
      for d in postgres redis gateway adminapi dataapi migrations; do mkdir -p "$$C/$$d" "$$S/$$d"; done
      rand() { openssl rand -hex 32; }
      quiet() { "$$@" >/dev/null 2>&1; }

      # A CA from an earlier version has no keyUsage, which strict clients (Python 3.13, newer Go and Java) refuse: it is
      # replaced, and every certificate it issued is re-issued below because it no longer verifies.
      if [ -f "$$C/ca.pem" ] && ! openssl x509 -noout -text -in "$$C/ca.pem" | grep -q "X509v3 Key Usage"; then
        echo "bootstrap: replacing the internal CA (no keyUsage)"
        mv "$$C/ca.pem" "$$C/ca.pem.old"; rm -f "$$C/ca.key"
      fi
      if [ ! -f "$$C/ca.pem" ]; then
        quiet openssl req -x509 -newkey rsa:3072 -nodes -keyout "$$C/ca.key" -out "$$C/ca.pem" -days 3650 -subj /CN=ume-gateway-internal-ca \
          -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
      fi

      # issue SERVICE SAN-LIST: (re)issue unless a valid certificate for exactly these names, from the current CA, exists
      issue() {
        svc="$$1"; san="$$2"; dir="$$C/$$svc"
        if [ -f "$$dir/$$svc.crt" ] && [ "$$(cat "$$dir/.san" 2>/dev/null)" = "$$san" ] &&
           quiet openssl x509 -checkend 2592000 -noout -in "$$dir/$$svc.crt" && quiet openssl verify -CAfile "$$C/ca.pem" "$$dir/$$svc.crt"; then
          return
        fi
        echo "bootstrap: issuing certificate for $$svc ($$san)"
        quiet openssl req -newkey rsa:3072 -nodes -keyout "$$dir/$$svc.key" -out "/tmp/$$svc.csr" -subj "/CN=$$svc"
        printf 'subjectAltName=%s\nextendedKeyUsage=serverAuth\nkeyUsage=critical,digitalSignature,keyEncipherment\nsubjectKeyIdentifier=hash\nauthorityKeyIdentifier=keyid\n' \
          "$$san" > "/tmp/$$svc.ext"
        quiet openssl x509 -req -in "/tmp/$$svc.csr" -CA "$$C/ca.pem" -CAkey "$$C/ca.key" -CAcreateserial -CAserial /tmp/ca.srl \
          -out "$$dir/$$svc.crt" -days 825 -extfile "/tmp/$$svc.ext"
        printf '%s' "$$san" > "$$dir/.san"
      }
      issue postgres "DNS:postgres,DNS:localhost"
      issue redis "DNS:redis,DNS:localhost"
      issue gateway "DNS:gateway,DNS:localhost,DNS:$$UME_GATEWAY_HOST"
      issue adminapi "DNS:adminapi,DNS:localhost,DNS:$$ADMIN_HOST"
      issue dataapi "DNS:dataapi,DNS:localhost,DNS:$$DATA_HOST"

      if [ ! -f "$$C/data-protection.pfx" ]; then
        quiet openssl req -x509 -newkey rsa:3072 -nodes -keyout /tmp/dp.key -out /tmp/dp.crt -days 3650 -subj /CN=ume-gateway-data-protection
        quiet openssl pkcs12 -export -inkey /tmp/dp.key -in /tmp/dp.crt -out "$$C/data-protection.pfx" -passout pass:
      fi
      for d in gateway adminapi migrations; do cp "$$C/data-protection.pfx" "$$C/$$d/data-protection.pfx"; done
      for d in postgres redis gateway adminapi dataapi migrations; do cp "$$C/ca.pem" "$$C/$$d/ca.pem"; done

      for role in bootstrap migrator gateway admin data; do
        [ -f "$$S/postgres/$${role}_password" ] || rand > "$$S/postgres/$${role}_password"
      done
      [ -f "$$S/redis/redis_password" ] || rand > "$$S/redis/redis_password"
      # The ACL is derived (password hash + the template's command list), so it is rewritten on every start: an upgrade that
      # allows the gateway a new Redis command reaches existing deployments with a redeploy.
      hash="$$(tr -d '\n' < "$$S/redis/redis_password" | openssl dgst -sha256 | awk '{print $$NF}')"
      sed "s/REPLACE_WITH_SHA256_PASSWORD_HASH/$$hash/" /config/users.acl.example > "$$S/redis/users.acl"
      [ -f "$$S/.pepper" ] || openssl rand -hex 48 > "$$S/.pepper"
      for svc in gateway adminapi migrations; do
        role="$$svc"; case "$$svc" in adminapi) role=admin;; migrations) role=migrator;; esac
        printf '%s' "$$(cat "$$S/.pepper")" > "$$S/$$svc/Security__KeyPepper"
        printf 'Host=postgres;Database=gatewaydb;Username=ume_%s;Password=%s;SSL Mode=VerifyFull;Root Certificate=/run/certs/ca.pem;GSS Encryption Mode=Disable' \
          "$$role" "$$(cat "$$S/postgres/$${role}_password")" > "$$S/$$svc/ConnectionStrings__gatewaydb"
        if [ "$$svc" != migrations ]; then
          printf 'redis:6379,user=gateway,password=%s,ssl=true,sslHost=redis,abortConnect=false' \
            "$$(cat "$$S/redis/redis_password")" > "$$S/$$svc/ConnectionStrings__redis"
        fi
      done
      # Data API (optional, profile "data"): read-only role, no pepper, no Redis.
      printf 'Host=postgres;Database=gatewaydb;Username=ume_data;Password=%s;SSL Mode=VerifyFull;Root Certificate=/run/certs/ca.pem;GSS Encryption Mode=Disable' \
        "$$(cat "$$S/postgres/data_password")" > "$$S/dataapi/ConnectionStrings__gatewaydb"
      # Confidential OIDC client (optional); the file follows the variable, so removing it clears the secret.
      if [ -n "$${UME_OIDC_CLIENT_SECRET:-}" ]; then
        printf '%s' "$$UME_OIDC_CLIENT_SECRET" > "$$S/adminapi/Oidc__ClientSecret"
      else
        rm -f "$$S/adminapi/Oidc__ClientSecret"
      fi

      # Static configuration files (services run read-only, so they get them from a volume).
      F=/conf
      mkdir -p "$$F/postgres-init" "$$F/postgres" "$$F/redis" "$$F/migrations" "$$F/migrations/integration-manifests"
      # Integration manifest (optional): rewritten from the variable on every start, so removing it provisions nothing more.
      rm -f "$$F/migrations/integration-manifests/"*.json
      if [ -n "$${UME_INTEGRATION_MANIFEST:-}" ]; then
        printf '%s' "$$UME_INTEGRATION_MANIFEST" > "$$F/migrations/integration-manifests/manifest.json"
      fi
      cp /config/postgres-init.sql "$$F/postgres-init/10-roles.sql"
      cp /config/pg_hba.conf "$$F/postgres/pg_hba.conf"
      cp /config/redis.conf "$$F/redis/redis.conf"
      cp /config/app-roles.sql "$$F/migrations/app-roles.sql"
      chmod -R a+rX "$$F"

      chown -R 70:70 "$$C/postgres" "$$S/postgres"
      chown -R 999:999 "$$C/redis" "$$S/redis"
      chown -R 1654:1654 "$$C/gateway" "$$C/adminapi" "$$C/dataapi" "$$C/migrations" "$$S/gateway" "$$S/adminapi" "$$S/dataapi" "$$S/migrations"
      chmod 755 "$$C" "$$S"
      # Secrets of credential keys created from the manifest: the migration service writes them, a platform's bootstrap reads them.
      chown 1654:1654 /integration-secrets && chmod 700 /integration-secrets
      echo "bootstrap: certificates and secrets ready"
  redis-acl-template:
    content: |
      user default off
      user gateway on #REPLACE_WITH_SHA256_PASSWORD_HASH ~ume:* &ume:invalidate -@all +auth +hello +ping +echo +quit +client|setname +client|setinfo +client|id +info +get +mget +set +setex +psetex +incr +incrby +decr +decrby +expire +pexpire +del +zadd +zrem +zcard +zremrangebyscore +zrangebyscore +eval +evalsha +script|load +publish +subscribe +unsubscribe
  redis-conf:
    content: |
      bind 0.0.0.0
      protected-mode yes
      port 0
      tls-port 6379
      tls-cert-file /run/certs/redis.crt
      tls-key-file /run/certs/redis.key
      tls-ca-cert-file /run/certs/ca.pem
      tls-auth-clients no
      aclfile /run/redis-secrets/users.acl
      save ""
      appendonly no
      loglevel warning
  postgres-init:
    content: |
      SET log_statement = 'none';
      DO $$$$
      BEGIN
        EXECUTE format('CREATE ROLE ume_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
          btrim(pg_read_file('/run/postgres-secrets/migrator_password'), E'\r\n '));
        EXECUTE format('CREATE ROLE ume_gateway LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
          btrim(pg_read_file('/run/postgres-secrets/gateway_password'), E'\r\n '));
        EXECUTE format('CREATE ROLE ume_admin LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
          btrim(pg_read_file('/run/postgres-secrets/admin_password'), E'\r\n '));
        -- Read-only role for the optional Data API (docs/data-access.md); only when a password was provisioned.
        -- Test one field: a record IS NOT NULL only when every field is, and some are always null on Linux.
        IF (pg_stat_file('/run/postgres-secrets/data_password', true)).size IS NOT NULL THEN
          EXECUTE format('CREATE ROLE ume_data LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
            btrim(pg_read_file('/run/postgres-secrets/data_password'), E'\r\n '));
        END IF;
        -- Optional Keycloak (deploy/keycloak, docs/keycloak.md): its own role and database, only when provisioned.
        IF (pg_stat_file('/run/postgres-secrets/keycloak_password', true)).size IS NOT NULL THEN
          EXECUTE format('CREATE ROLE ume_keycloak LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
            btrim(pg_read_file('/run/postgres-secrets/keycloak_password'), E'\r\n '));
        END IF;
      END $$$$;
      SELECT 'CREATE DATABASE keycloak OWNER ume_keycloak' WHERE EXISTS (SELECT FROM pg_roles WHERE rolname = 'ume_keycloak')\gexec
      CREATE DATABASE gatewaydb OWNER ume_migrator;
      REVOKE ALL ON DATABASE gatewaydb FROM PUBLIC;
      GRANT CONNECT ON DATABASE gatewaydb TO ume_gateway, ume_admin;
      \connect gatewaydb
      REVOKE ALL ON SCHEMA public FROM PUBLIC;
      ALTER SCHEMA public OWNER TO ume_migrator;
      GRANT USAGE ON SCHEMA public TO ume_gateway, ume_admin;
      DO $$$$
      BEGIN
        IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'ume_data') THEN
          GRANT CONNECT ON DATABASE gatewaydb TO ume_data;
          GRANT USAGE ON SCHEMA public TO ume_data;
        END IF;
      END $$$$;
  postgres-hba:
    content: |
      local all all scram-sha-256
      hostnossl all all all reject
      hostssl gatewaydb ume_migrator,ume_gateway,ume_admin,ume_data all scram-sha-256
      # Optional Keycloak (deploy/keycloak): its own database only.
      hostssl keycloak ume_keycloak all scram-sha-256
  app-roles:
    content: |
      -- Applied by the migration service on every start. The service roles' table privileges are revoked and granted again in
      -- one transaction, so each role holds exactly what this file lists (a privilege removed here is removed from existing
      -- installations too) and running services see either the old or the new grants, never none. Tables are named one by
      -- one: a new table is readable by no service until it is added here (DatabaseRoleTests checks the effective grants).
      -- No curly braces: the migration service runs this file with EF Core's ExecuteSqlRaw, which reads them as placeholders.
      BEGIN;
      REVOKE ALL ON ALL TABLES IN SCHEMA public FROM ume_gateway, ume_admin;
      REVOKE ALL ON ALL SEQUENCES IN SCHEMA public FROM ume_gateway, ume_admin;
      GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO ume_gateway, ume_admin;

      -- The settings row exists before any service runs, so the admin role needs no INSERT on it (an insert could set
      -- UsageRetainedFrom, which only the retention function may move).
      INSERT INTO "GatewaySettings" ("Id", "TrustedProxies", "AuditRetentionDays") VALUES (1, ARRAY[]::text[], 365) ON CONFLICT ("Id") DO NOTHING;
      -- The same for the admin console's branding (organisation name and logo; the name's default is the column default).
      INSERT INTO "Branding" ("Id") VALUES (1) ON CONFLICT ("Id") DO NOTHING;

      -- Gateway (faces the clients): what it authenticates, routes and accounts with. Not the audit log or Data API keys. It reads
      -- the Data Protection key ring but does not add keys (it only decrypts; the admin API creates and rotates them).
      GRANT SELECT ON "Departments", "Teams", "VirtualKeys", "Integrations", "ProviderAccounts", "ModelDeployments", "ModelPrices",
        "RouteAliases", "RouteTargets", "RoutingRules", "RoutingRuleTargets", "Budgets", "GatewaySettings",
        "UsageRecords", "UsageMonthlyTotals", "AlertEvents", "AuthFailures", "DataProtectionKeys" TO ume_gateway;
      GRANT INSERT ON "UsageRecords", "AlertEvents", "AuthFailures" TO ume_gateway;
      GRANT UPDATE ("LastUsedAt") ON "VirtualKeys" TO ume_gateway;
      -- The organisation's name for integrations' context; never the logo.
      GRANT SELECT ("OrganisationName") ON "Branding" TO ume_gateway;

      -- Admin API: reads everything it shows (and the schema version for Operations); changes configuration, appends audit
      -- entries, creates Data Protection keys. Settings column by column, without UsageRetainedFrom.
      GRANT SELECT ON "Departments", "Teams", "VirtualKeys", "Integrations", "DataApiKeys", "ProviderAccounts", "ModelDeployments", "ModelPrices",
        "RouteAliases", "RouteTargets", "RoutingRules", "RoutingRuleTargets", "Budgets", "GatewaySettings",
        "UsageRecords", "UsageMonthlyTotals", "AuditLog", "AlertEvents", "AuthFailures", "DataProtectionKeys",
        "Branding", "__EFMigrationsHistory" TO ume_admin;
      GRANT INSERT, UPDATE, DELETE ON "Departments", "Teams", "VirtualKeys", "Integrations", "ProviderAccounts",
        "ModelDeployments", "ModelPrices", "RouteAliases", "RouteTargets", "RoutingRules", "RoutingRuleTargets",
        "Budgets", "DataApiKeys" TO ume_admin;
      GRANT UPDATE ("TrustedProxies", "LogAllRequests", "LogAllRequestsUntil", "UpdatedAt", "UsageRetentionDays", "AuditRetentionDays",
        "RetentionLastRunAt", "RetentionLastRunDeleted", "RetentionLastRunError") ON "GatewaySettings" TO ume_admin;
      GRANT UPDATE ("OrganisationName", "Logo", "LogoContentType", "UpdatedAt") ON "Branding" TO ume_admin;
      GRANT INSERT ON "AuditLog", "DataProtectionKeys" TO ume_admin;
      GRANT UPDATE ("Acknowledged") ON "AlertEvents" TO ume_admin;
      -- Data retention: old rows are removed only through this function (owner's rights, minimum 90 days); the admin role
      -- has no DELETE on usage, refused-credential, alert or audit rows.
      GRANT EXECUTE ON FUNCTION ume_retention_step(integer) TO ume_admin;
      -- Data API (optional): read-only, and column by column where a table holds secrets, so the role cannot
      -- read key hashes, encrypted key secrets or provider credentials even through a bug. Skipped while the
      -- role does not exist (it is created by init.sql on new installs; see docs/upgrade-guide.md for existing ones).
      DO $$$$
      BEGIN
        IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'ume_data') THEN
          GRANT CONNECT ON DATABASE gatewaydb TO ume_data;
          GRANT USAGE ON SCHEMA public TO ume_data;
          GRANT SELECT ON "UsageRecords", "AuthFailures", "AuditLog", "Departments", "Teams", "ModelDeployments",
            "ModelPrices", "Budgets", "UsageMonthlyTotals" TO ume_data;
          GRANT SELECT ("UsageRetainedFrom") ON "GatewaySettings" TO ume_data;
          GRANT SELECT ("Id", "TeamId", "Name", "Description", "Prefix", "IsEnabled", "CreatedAt", "CreatedBy", "ExpiresAt",
            "RevokedAt", "GraceUntil", "RotatedToKeyId", "LastUsedAt", "AllowedModels", "AllowedResidencies", "AllowedProviders",
            "AllowedIpRanges", "PiiPolicy", "AttachmentPolicy", "RequestsPerMinute", "TokensPerMinute", "AllowProviderTools",
            "AllowProviderStorage", "MaxConcurrentRequests", "IntegrationId", "IntegrationRole") ON "VirtualKeys" TO ume_data;
          GRANT SELECT ("Id", "Name", "DisplayName", "Type", "Residency", "IsEnabled") ON "ProviderAccounts" TO ume_data;
          -- Its own credentials: the key hash (SHA-256 of a 256-bit random key) to authenticate Data API keys, and the
          -- only column it may write, the approximate last use.
          GRANT SELECT ("Id", "Name", "Prefix", "KeyHash", "Permissions", "ExpiresAt", "RevokedAt", "LastUsedAt") ON "DataApiKeys" TO ume_data;
          GRANT UPDATE ("LastUsedAt") ON "DataApiKeys" TO ume_data;
        END IF;
      END $$$$;
      COMMIT;
  rag-bootstrap-script:
    content: |
      #!/bin/sh
      # One-shot bootstrap of the RAG part of compose.portainer.yaml (the gateway's stack plus RAG, one Portainer stack).
      # The Portainer counterpart of deploy/init-deployment.sh, after the gateway's deploy/portainer/bootstrap.sh: creates
      # RAG's internal CA, its service certificates, the Data Protection certificate, the database passwords, the key pepper,
      # the api's keys, the worker's crawl key pepper, the renderer's WebSocket path and the blob master key in the rag-certs
      # and rag-secrets volumes, and copies the static configuration into rag-config. Idempotent: existing secrets are never
      # overwritten (a new pepper, key or Data Protection certificate would break existing data); service certificates are
      # re-issued when they expire within 30 days or their host names change (the checklist at the end names the services to
      # restart, and every certificate that expires within 60 days). Files that follow a variable (the gateway credential
      # keys, also taken from the gateway's manifest secrets; the OIDC client secret) are written again on every start, and
      # removed when the variable is empty.
      #
      # Trust: the services that call out (rag-api, rag-admin, rag-worker) trust RAG's CA plus the gateway's (its ume-certs
      # volume, mounted at /gateway-certs), so https://gateway:8443 verifies.
      set -eu
      umask 077
      C=/certs
      S=/secrets
      F=/conf
      : "$${UME_RAG_API_HOST:?Set UME_RAG_API_HOST (public hostname of rag-api)}"
      ADMIN_HOST="$${UME_RAG_ADMIN_HOST:-$$UME_RAG_API_HOST}"
      for d in postgres api admin worker parser migrations; do mkdir -p "$$C/$$d"; done
      for d in postgres api admin worker migrations keys renderer openwebui openwebui-feedback; do mkdir -p "$$S/$$d"; done
      rand() { openssl rand -hex 32; }
      quiet() { "$$@" >/dev/null 2>&1; }

      if [ ! -f "$$C/ca.pem" ]; then
        quiet openssl req -x509 -newkey rsa:3072 -nodes -keyout "$$C/ca.key" -out "$$C/ca.pem" -days 3650 -subj /CN=ume-rag-internal-ca \
          -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
      fi

      # issue DIR SAN-LIST: (re)issue unless a valid certificate for exactly these names, from the current CA, exists. A
      # re-issued certificate (not a first one) is listed in $$reissued, for the checklist.
      reissued=""
      issue() {
        svc="$$1"; san="$$2"; dir="$$C/$$svc"
        if [ -f "$$dir/$$svc.crt" ] && [ "$$(cat "$$dir/.san" 2>/dev/null)" = "$$san" ] &&
           quiet openssl x509 -checkend 2592000 -noout -in "$$dir/$$svc.crt" && quiet openssl verify -CAfile "$$C/ca.pem" "$$dir/$$svc.crt"; then
          return
        fi
        [ ! -f "$$dir/$$svc.crt" ] || reissued="$$reissued $$svc"
        echo "rag-bootstrap: issuing certificate for $$svc ($$san)"
        quiet openssl req -newkey rsa:3072 -nodes -keyout "$$dir/$$svc.key" -out "/tmp/$$svc.csr" -subj "/CN=$$svc"
        printf 'subjectAltName=%s\nextendedKeyUsage=serverAuth\nkeyUsage=critical,digitalSignature,keyEncipherment\nsubjectKeyIdentifier=hash\nauthorityKeyIdentifier=keyid\n' \
          "$$san" > "/tmp/$$svc.ext"
        quiet openssl x509 -req -in "/tmp/$$svc.csr" -CA "$$C/ca.pem" -CAkey "$$C/ca.key" -CAcreateserial -CAserial /tmp/ca.srl \
          -out "$$dir/$$svc.crt" -days 825 -extfile "/tmp/$$svc.ext"
        printf '%s' "$$san" > "$$dir/.san"
      }
      issue postgres "DNS:rag-postgres,DNS:localhost"
      issue api "DNS:rag-api,DNS:localhost,DNS:$$UME_RAG_API_HOST"
      issue admin "DNS:rag-admin,DNS:localhost,DNS:$$ADMIN_HOST"
      issue worker "DNS:rag-worker,DNS:localhost"
      issue parser "DNS:rag-parser,DNS:localhost"

      if [ ! -f "$$C/data-protection.pfx" ]; then
        quiet openssl req -x509 -newkey rsa:3072 -nodes -keyout /tmp/dp.key -out /tmp/dp.crt -days 3650 -subj /CN=ume-rag-data-protection
        quiet openssl pkcs12 -export -inkey /tmp/dp.key -in /tmp/dp.crt -out "$$C/data-protection.pfx" -passout pass:
      fi
      for d in api admin migrations; do cp "$$C/data-protection.pfx" "$$C/$$d/data-protection.pfx"; done
      for d in postgres parser migrations; do cp "$$C/ca.pem" "$$C/$$d/ca.pem"; done
      [ -f /gateway-certs/ca.pem ] || { echo "rag-bootstrap: the gateway's CA (/gateway-certs/ca.pem) is missing" >&2; exit 1; }
      for d in api admin worker; do cat "$$C/ca.pem" /gateway-certs/ca.pem > "$$C/$$d/ca.pem"; done

      # --- Database (connection pools per instance, data-model §1.1: api 12, admin 5, worker 10, migrator 2) ---------------
      for role in bootstrap migrator api admin worker; do
        [ -f "$$S/postgres/$${role}_password" ] || rand > "$$S/postgres/$${role}_password"
      done
      connection() {
        printf 'Host=rag-postgres;Database=ragdb;Username=ume_rag_%s;Password=%s;SSL Mode=VerifyFull;Root Certificate=/run/certs/ca.pem;GSS Encryption Mode=Disable;Maximum Pool Size=%s' \
          "$$1" "$$(tr -d '\r\n' < "$$S/postgres/$${1}_password")" "$$2"
      }
      connection migrator 2 > "$$S/migrations/ConnectionStrings__ragdb"
      connection api 12 > "$$S/api/ConnectionStrings__ragdb"
      connection admin 5 > "$$S/admin/ConnectionStrings__ragdb"
      connection worker 10 > "$$S/worker/ConnectionStrings__ragdb"
      [ -f "$$S/.pepper" ] || openssl rand -hex 48 > "$$S/.pepper"
      for d in migrations api admin; do tr -d '\n' < "$$S/.pepper" > "$$S/$$d/Security__KeyPepper"; done

      # --- The api's and the worker's own keys --------------------------------------------------------------------------
      [ -f "$$S/api/Security__DownloadGrantKeys__k1" ] || rand > "$$S/api/Security__DownloadGrantKeys__k1"
      [ -f "$$S/api/Security__CacheKeyPepper" ] || rand > "$$S/api/Security__CacheKeyPepper"
      [ -f "$$S/api/Security__ConversationIdKeys__k1" ] || rand > "$$S/api/Security__ConversationIdKeys__k1"
      # Open WebUI's user JWT secret: unused without Open WebUI, but rag-api expects the file (identity design §5.2).
      [ -f "$$S/.openwebui-jwt-secret" ] || rand > "$$S/.openwebui-jwt-secret"
      tr -d '\n' < "$$S/.openwebui-jwt-secret" > "$$S/api/OpenWebUi__JwtSecret"
      # Open WebUI's own files (profile openwebui; harmless without it): the same user-JWT secret, its session key, the
      # feedback service account's password, and a CA bundle with the public CAs (its OIDC provider), RAG's (rag-api) and the
      # gateway's.
      tr -d '\n' < "$$S/.openwebui-jwt-secret" > "$$S/openwebui/jwt-secret"
      [ -f "$$S/openwebui/webui_secret_key" ] || rand > "$$S/openwebui/webui_secret_key"
      [ -f "$$S/openwebui/admin-password" ] || rand | tr -d '\n' > "$$S/openwebui/admin-password"
      cat /etc/ssl/certs/ca-certificates.crt "$$C/ca.pem" /gateway-certs/ca.pem > "$$S/openwebui/ca.pem"
      [ -f "$$S/worker/Security__CrawlKeyPepper" ] || rand | tr -d '\n' > "$$S/worker/Security__CrawlKeyPepper"
      # The renderer's secret WebSocket path (connectors design §8.3): the worker gets the endpoint only while the render
      # profile is on, so without the renderer it refuses rendering instead of waiting for a browser that never starts.
      [ -f "$$S/.render-ws-path" ] || rand > "$$S/.render-ws-path"
      printf '/%s' "$$(tr -d '\r\n' < "$$S/.render-ws-path")" > "$$S/renderer/ws-path"
      case ",$${COMPOSE_PROFILES:-}," in
        *,render,*) printf 'ws://rag-renderer:3000/%s' "$$(tr -d '\r\n' < "$$S/.render-ws-path")" > "$$S/worker/Render__Endpoint" ;;
        *) rm -f "$$S/worker/Render__Endpoint" ;;
      esac
      # The malware scan follows the clamav profile (M-17 C3): on while rag-clamav runs; off without it, so files are stored
      # unscanned and marked so (#535) instead of waiting for a scanner that never starts.
      case ",$${COMPOSE_PROFILES:-}," in
        *,clamav,*) printf on > "$$S/worker/ClamAv__Mode" ;;
        *) printf off > "$$S/worker/ClamAv__Mode" ;;
      esac
      # Open WebUI's address for rag-api's feedback import (M-17 C2): the stack's own rag-openwebui while the openwebui
      # profile is on. The import also needs the feedback key, which rag-openwebui-setup mints (openwebui-feedback, below).
      # Open WebUI's key for rag-api (M-17 C4, identity design §5.2): generated once; Open WebUI's start-up wrapper exports it
      # as OPENAI_API_KEYS, and rag-migrate registers it as the deployment's own Open WebUI client while the profile is on. A
      # new key: delete .openwebui-rag-api-key in the volume and update the stack (rag-migrate revokes the old one).
      [ -f "$$S/.openwebui-rag-api-key" ] || printf 'ume-rag-sk-%s' "$$(openssl rand -base64 96 | tr -dc 'A-Za-z0-9' | head -c 43)" > "$$S/.openwebui-rag-api-key"
      cp "$$S/.openwebui-rag-api-key" "$$S/openwebui/rag-api-key"
      case ",$${COMPOSE_PROFILES:-}," in
        *,openwebui,*)
          printf 'http://rag-openwebui:8080' > "$$S/api/OpenWebUi__BaseUrl"
          cp "$$S/.openwebui-rag-api-key" "$$S/migrations/OpenWebUi__ApiKey" ;;
        *) rm -f "$$S/api/OpenWebUi__BaseUrl" "$$S/migrations/OpenWebUi__ApiKey" ;;
      esac
      # Blob master key of the file key provider (plan §8a): without it the `internal` blobs cannot be read. Back it up.
      if [ ! -f "$$S/keys/rag-blob-internal" ]; then
        openssl rand -base64 32 > "$$S/keys/rag-blob-internal"
        chmod 0400 "$$S/keys/rag-blob-internal"
      fi

      # --- Files that follow a variable ------------------------------------------------------------------------------
      # put SERVICE NAME VALUE: the secret file NAME of SERVICE holds VALUE; an empty VALUE removes it.
      put() {
        if [ -n "$$3" ]; then printf '%s' "$$3" > "$$S/$$1/$$2"; else rm -f "$$S/$$1/$$2"; fi
      }
      # Each service's credential key of the gateway integration Ume.Rag (identity design §4.7). From the gateway's
      # manifest (M-17 C7): the gateway's migrations provision the integration from UME_INTEGRATION_MANIFEST and write each
      # new key's secret to the integration-secrets volume as Ume.Rag/rag-<service>; that volume is mounted read-only at
      # /integration-secrets. UME_RAG_API_GATEWAY_KEY, UME_RAG_ADMIN_GATEWAY_KEY and UME_RAG_WORKER_GATEWAY_KEY, when set,
      # win over the files (keys issued by hand, or a gateway elsewhere). The per-level keys they replace are revoked at the
      # gateway and read by no service, so none is left in the volume.
      I=/integration-secrets/Ume.Rag
      for svc in api admin worker; do
        up="$$(echo "$$svc" | tr '[:lower:]' '[:upper:]')"
        key="$$(printenv "UME_RAG_$${up}_GATEWAY_KEY" || true)"
        if [ -z "$$key" ] && [ -s "$$I/rag-$$svc" ]; then key="$$(cat "$$I/rag-$$svc")"; fi
        put "$$svc" Gateway__Key "$$key"
        rm -f "$$S/$$svc"/Gateway__Keys__*
      done
      put admin Oidc__ClientSecret "$${UME_RAG_OIDC_CLIENT_SECRET:-}"
      # The feedback service account's Open WebUI key (chat design §13.3) is minted by rag-openwebui-setup into
      # openwebui-feedback (M-17 C6); the hand-made key of UME_RAG_OPENWEBUI_ADMIN_API_KEY that rag-api read before goes.
      if [ -e "$$S/api/OpenWebUi__AdminApiKey" ]; then
        rm -f "$$S/api/OpenWebUi__AdminApiKey"
        echo "rag-bootstrap: deleted api/OpenWebUi__AdminApiKey; rag-openwebui-setup mints the feedback key now"
      fi
      # The Data API key of the admin's former org sync: the admin syncs with its credential key now.
      if [ -e "$$S/admin/OrgSync__DataApiKey" ]; then
        rm -f "$$S/admin/OrgSync__DataApiKey"
        echo "rag-bootstrap: deleted admin/OrgSync__DataApiKey; ask the gateway admin to revoke that Data API key"
      fi

      # --- Static configuration (the services run read-only, so they get it from a volume) -----------------------------
      mkdir -p "$$F/postgres-init" "$$F/postgres" "$$F/migrations"
      cp /config/postgres-init.sql "$$F/postgres-init/10-roles.sql"
      cp /config/pg_hba.conf "$$F/postgres/pg_hba.conf"
      cp /config/postgresql.conf "$$F/postgres/postgresql.conf"
      cp /config/app-roles.sql "$$F/migrations/app-roles.sql"
      # The TLS proxy's nginx.conf (profile proxy, M-17 C8): the template with the stack's host names. A host without a name
      # of its own (the gateway's admin on the gateway's name, rag-admin on rag-api's) gets no block, nor Open WebUI without
      # its profile; the checklist at the end says so.
      proxy_todo=""
      mkdir -p "$$F/proxy"
      case ",$${COMPOSE_PROFILES:-}," in
        *,proxy,*)
          hostname_ok() { printf '%s' "$$1" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$$'; }
          gw="$${UME_GATEWAY_HOST:-}"; gw_admin="$${UME_ADMIN_HOST:-}"; rag_admin="$${UME_RAG_ADMIN_HOST:-}"
          owui_host="$${UME_RAG_OPENWEBUI_HOST:-}"
          hostname_ok "$$gw" || proxy_todo="$$proxy_todo|UME_GATEWAY_HOST is not a host name, so the proxy has no gateway block"
          hostname_ok "$$UME_RAG_API_HOST" || proxy_todo="$$proxy_todo|UME_RAG_API_HOST is not a host name"
          enable="-e /^#gwadmin/d"
          if hostname_ok "$$gw_admin" && [ "$$gw_admin" != "$$gw" ]; then enable="-e s/^#gwadmin//"
          else proxy_todo="$$proxy_todo|UME_ADMIN_HOST: the proxy serves the gateway's admin only on a host name of its own"; fi
          if hostname_ok "$$rag_admin" && [ "$$rag_admin" != "$$UME_RAG_API_HOST" ]; then enable="$$enable -e s/^#ragadmin//"
          else enable="$$enable -e /^#ragadmin/d"
            proxy_todo="$$proxy_todo|UME_RAG_ADMIN_HOST: the proxy serves Ume.Rag's admin only on a host name of its own"; fi
          case ",$${COMPOSE_PROFILES:-}," in
            *,openwebui,*)
              if hostname_ok "$$owui_host"; then enable="$$enable -e s/^#owui//"
              else enable="$$enable -e /^#owui/d"; proxy_todo="$$proxy_todo|UME_RAG_OPENWEBUI_HOST: the proxy has no Open WebUI block"; fi ;;
            *) enable="$$enable -e /^#owui/d" ;;
          esac
          # shellcheck disable=SC2086 # $$enable is a list of sed expressions
          sed $$enable -e "s/@GATEWAY_HOST@/$$gw/g" -e "s/@ADMIN_HOST@/$$gw_admin/g" -e "s/@API_HOST@/$$UME_RAG_API_HOST/g" \
            -e "s/@RAG_ADMIN_HOST@/$$rag_admin/g" -e "s/@OPENWEBUI_HOST@/$$owui_host/g" /config/nginx-proxy.conf.template > "$$F/proxy/nginx.conf"
          # The internal CAs it verifies the upstreams against (public certificates only; ume-certs also holds private keys).
          cp "$$C/ca.pem" "$$F/proxy/rag-ca.pem"
          cp /gateway-certs/ca.pem "$$F/proxy/gateway-ca.pem"
          echo "rag-bootstrap: wrote the TLS proxy's nginx.conf" ;;
        *) rm -f "$$F/proxy/nginx.conf" "$$F/proxy/rag-ca.pem" "$$F/proxy/gateway-ca.pem" ;;
      esac
      chmod -R a+rX "$$F"

      # --- Blob container (issue #41): rag/ and the worker's spool, owned by the services' uid ----------------------------
      mkdir -p /blobs/rag /blobs/spool
      chown 1654:1654 /blobs/rag /blobs/spool
      chmod 0750 /blobs/rag /blobs/spool

      chown -R 999:999 "$$C/postgres" "$$S/postgres"
      chown -R 10001:10001 "$$C/parser"
      chown -R 10002:10002 "$$S/renderer"
      chown -R 1000:1000 "$$S/openwebui" /openwebui-data
      chmod 0700 "$$S/openwebui"
      # Written by rag-openwebui-setup (Open WebUI's uid 1000), read by rag-api (group 1654; setgid keeps the group).
      chown 1000:1654 "$$S/openwebui-feedback"
      chmod 2750 "$$S/openwebui-feedback"
      chown -R 1654:1654 "$$C/api" "$$C/admin" "$$C/worker" "$$C/migrations" "$$S/api" "$$S/admin" "$$S/worker" "$$S/migrations" "$$S/keys"
      chmod 755 "$$C" "$$S"
      echo "rag-bootstrap: certificates and secrets ready"

      # --- What is still missing: a checklist at the end of the log (never fatal: the stack starts and waits) ------------
      todo=""
      note() { todo="$$todo
        - $$1"; }
      example() { case "$$1" in ""|*example.se*|*CHANGE*) return 0 ;; esac; return 1; }
      for svc in api admin worker; do
        up="$$(echo "$$svc" | tr '[:lower:]' '[:upper:]')"
        [ -e "$$S/$$svc/Gateway__Key" ] || note "UME_RAG_$${up}_GATEWAY_KEY: no key for rag-$$svc. Set UME_INTEGRATION_MANIFEST (stack.env.example) so the gateway creates it, or issue it in the gateway's admin (integration Ume.Rag) and set the variable; then update the stack, no restart needed"
      done
      example "$$UME_RAG_API_HOST" && note "UME_RAG_API_HOST is still an example value"
      # Optional: unset, rag-api's public URL is https://<UME_RAG_API_HOST>.
      case "$${UME_RAG_API_PUBLIC_URL:-}" in "") ;;
        https://*example.se*|https://*CHANGE*) note "UME_RAG_API_PUBLIC_URL is still an example value" ;;
        https://*) ;; *) note "UME_RAG_API_PUBLIC_URL must be the https URL users reach rag-api at (citation links use it)" ;; esac
      example "$${UME_RAG_OIDC_CLIENT_SECRET:-}" && note "UME_RAG_OIDC_CLIENT_SECRET: sign-in to Ume.Rag's admin fails without it (restart rag-admin after setting it)"
      # Certificates (#705): rag-postgres and rag-parser read theirs only at start, and a stack update recreates neither when
      # its configuration is unchanged (Kestrel watches rag-api's, rag-admin's and rag-worker's files). Each certificate that expires within
      # 60 days is named on every run; the service certificates are re-issued below 30 days, the CA never.
      restart=""
      for svc in $$reissued; do case "$$svc" in postgres|parser) restart="$$restart rag-$$svc" ;; esac; done
      [ -z "$$restart" ] || note "restart$$restart (Containers, select, Restart): a re-issued certificate takes effect there only after a restart"
      for crt in "$$C/ca.pem" "$$C"/*/*.crt; do
        quiet openssl x509 -checkend 5184000 -noout -in "$$crt" && continue
        end="$$(openssl x509 -enddate -noout -in "$$crt" | cut -d= -f2)"
        case "$$crt" in
          "$$C/ca.pem") note "RAG's internal CA expires $$end, within 60 days: replace it (docs/portainer.md, Internal certificates)" ;;
          *) note "the certificate of rag-$$(basename "$$(dirname "$$crt")") expires $$end, within 60 days: update the stack once fewer than 30 days remain, and rag-bootstrap re-issues it" ;;
        esac
      done
      # The TLS proxy's host names (collected while its nginx.conf was written, above).
      old_ifs="$$IFS"; IFS='|'
      for item in $$proxy_todo; do [ -z "$$item" ] || note "$$item"; done
      IFS="$$old_ifs"
      case ",$${COMPOSE_PROFILES:-}," in
        *,openwebui,*)
          example "$${UME_RAG_OPENWEBUI_HOST:-}" && note "UME_RAG_OPENWEBUI_HOST: the chat's public host name"
          example "$${UME_RAG_OPENWEBUI_OIDC_CLIENT_SECRET:-}" && note "UME_RAG_OPENWEBUI_OIDC_CLIENT_SECRET: users can't sign in to Open WebUI" ;;
      esac
      if [ -n "$$todo" ]; then
        echo "rag-bootstrap: still to do (docs/portainer.md):$$todo"
      else
        echo "rag-bootstrap: every setting it checks is in place"
      fi
      # Not a setting to check here: who is a platform admin comes from the sign-in token.
      echo "rag-bootstrap: the first platform admin needs the role rag-platform-admin in the token's roles claim (Keycloak: give the user that realm role). Signed in without it, Ume.Rag's admin says you have no role: then give the role, or name a group of the token's in UME_RAG_OIDC_GROUPS_PLATFORM_ADMIN"
  rag-postgres-init:
    content: |
      -- Bootstrap, run once by the image entrypoint as the bootstrap superuser (mounted as
      -- /docker-entrypoint-initdb.d/10-roles.sql; repo-and-deployment §5.2). Creates the login roles from secret files, the
      -- database ragdb owned by the DDL role, the vector extension (not a trusted extension) and the role caps and defaults of
      -- data-model §1.1. Schemas, tables and grants come from the migration service (migrations, then app-roles.sql).
      SET log_statement = 'none';
      DO $$$$
      BEGIN
        EXECUTE format('CREATE ROLE ume_rag_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
          btrim(pg_read_file('/run/postgres-secrets/migrator_password'), E'\r\n '));
        EXECUTE format('CREATE ROLE ume_rag_api LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
          btrim(pg_read_file('/run/postgres-secrets/api_password'), E'\r\n '));
        EXECUTE format('CREATE ROLE ume_rag_admin LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
          btrim(pg_read_file('/run/postgres-secrets/admin_password'), E'\r\n '));
        EXECUTE format('CREATE ROLE ume_rag_worker LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
          btrim(pg_read_file('/run/postgres-secrets/worker_password'), E'\r\n '));
      END $$$$;
      CREATE DATABASE ragdb OWNER ume_rag_migrator;
      REVOKE ALL ON DATABASE ragdb FROM PUBLIC;
      GRANT CONNECT ON DATABASE ragdb TO ume_rag_api, ume_rag_admin, ume_rag_worker;

      -- Caps and timeouts (data-model §1.1). Pool sizes per instance: api 12, admin 5, worker 10, migrator 2, each + 1 LISTEN
      -- connection; the limits leave room for a second api and admin instance and the worker's stop-then-start.
      ALTER ROLE ume_rag_migrator CONNECTION LIMIT 3;
      ALTER ROLE ume_rag_migrator IN DATABASE ragdb SET lock_timeout = '10s';
      ALTER ROLE ume_rag_migrator IN DATABASE ragdb SET maintenance_work_mem = '1GB';   -- HNSW builds
      ALTER ROLE ume_rag_api CONNECTION LIMIT 26;
      ALTER ROLE ume_rag_api IN DATABASE ragdb SET statement_timeout = '5s';
      ALTER ROLE ume_rag_api IN DATABASE ragdb SET lock_timeout = '1s';
      ALTER ROLE ume_rag_api IN DATABASE ragdb SET idle_in_transaction_session_timeout = '10s';
      ALTER ROLE ume_rag_admin CONNECTION LIMIT 12;
      ALTER ROLE ume_rag_admin IN DATABASE ragdb SET statement_timeout = '30s';
      ALTER ROLE ume_rag_admin IN DATABASE ragdb SET lock_timeout = '5s';
      ALTER ROLE ume_rag_admin IN DATABASE ragdb SET idle_in_transaction_session_timeout = '60s';
      ALTER ROLE ume_rag_worker CONNECTION LIMIT 12;
      ALTER ROLE ume_rag_worker IN DATABASE ragdb SET statement_timeout = '60s';
      ALTER ROLE ume_rag_worker IN DATABASE ragdb SET lock_timeout = '5s';
      ALTER ROLE ume_rag_worker IN DATABASE ragdb SET idle_in_transaction_session_timeout = '60s';

      -- Retrieval defaults (knowledge design §6.4): no retrieval statement runs SET LOCAL. The api searches, the worker runs
      -- the retrieval evaluator, the admin runs the test panel.
      ALTER ROLE ume_rag_api IN DATABASE ragdb SET hnsw.ef_search = 100;
      ALTER ROLE ume_rag_api IN DATABASE ragdb SET hnsw.iterative_scan = relaxed_order;
      ALTER ROLE ume_rag_api IN DATABASE ragdb SET hnsw.max_scan_tuples = 100000;
      ALTER ROLE ume_rag_worker IN DATABASE ragdb SET hnsw.ef_search = 100;
      ALTER ROLE ume_rag_worker IN DATABASE ragdb SET hnsw.iterative_scan = relaxed_order;
      ALTER ROLE ume_rag_worker IN DATABASE ragdb SET hnsw.max_scan_tuples = 100000;
      ALTER ROLE ume_rag_admin IN DATABASE ragdb SET hnsw.ef_search = 100;
      ALTER ROLE ume_rag_admin IN DATABASE ragdb SET hnsw.iterative_scan = relaxed_order;
      ALTER ROLE ume_rag_admin IN DATABASE ragdb SET hnsw.max_scan_tuples = 100000;

      \connect ragdb
      -- The public schema keeps only the extension (data-model §1).
      CREATE EXTENSION vector;
      REVOKE ALL ON SCHEMA public FROM PUBLIC;
      ALTER SCHEMA public OWNER TO ume_rag_migrator;
      GRANT USAGE ON SCHEMA public TO ume_rag_api, ume_rag_admin, ume_rag_worker;
  rag-postgres-hba:
    content: |
      # Client authentication for ume-rag/postgres (data-model §1.1), mounted as /run/config/pg_hba.conf. The first matching
      # line wins. pgBackRest runs inside the container as the postgres OS user and connects over the Unix socket by peer
      # (repo-and-deployment §7.4); every other local login needs a password. Over the network only TLS, only to ragdb and
      # only for the four service roles; the bootstrap superuser never logs in over the network.
      local   all     postgres                                                        peer
      local   all     all                                                             scram-sha-256
      hostnossl all   all     all                                                     reject
      hostssl ragdb   ume_rag_migrator,ume_rag_admin,ume_rag_api,ume_rag_worker  all  scram-sha-256
  rag-postgres-conf:
    content: |
      # PostgreSQL settings for ume-rag/postgres on the pilot host (repo-and-deployment §6.2). Mounted read-only and passed
      # with `postgres -c config_file=/etc/postgresql/postgresql.conf`; the data directory still comes from PGDATA. It replaces
      # the postgresql.conf that initdb writes, so every setting not listed here is the PostgreSQL built-in default.
      # Values are the 16 GB host profile; the 24 GB values are in the comments. The P2 multi-host profile is §6.2 too.

      # Connections. The initdb file sets listen_addresses = '*'; the built-in default would be localhost only.
      listen_addresses = '*'
      max_connections = 100                   # data-model §1.1 (role limits sum to 56)
      superuser_reserved_connections = 3      # data-model §1.1 budget rule (the built-in default)

      # TLS with the internal CA; paths as in the gateway's compose.prod.yaml (mounted from $${UME_RAG_CERTS_DIR}/postgres).
      ssl = on
      ssl_cert_file = '/run/certs/postgres.crt'
      ssl_key_file = '/run/certs/postgres.key'
      ssl_ca_file = '/run/certs/ca.pem'
      hba_file = '/run/config/pg_hba.conf'    # deploy/postgres/pg_hba.conf, mounted as in the gateway

      # Memory
      shared_buffers = 768MB                  # 24 GB: 1536MB
      effective_cache_size = 2GB              # 24 GB: 3500MB
      work_mem = 8MB
      maintenance_work_mem = 512MB            # 24 GB: 1GB (HNSW builds)
      max_parallel_maintenance_workers = 2
      max_worker_processes = 8

      # Planner and I/O for SSD storage and short queries (#500; performance pass P-52). JIT compiles a statement whose
      # estimated cost passes jit_above_cost, which K and V over a large scope can, for tens of ms per run that a 100 ms
      # search can't afford. The built-in page cost (4) and I/O concurrency (1 in PostgreSQL 17) are for spinning disks.
      jit = off
      random_page_cost = 1.1
      effective_io_concurrency = 200

      # WAL and continuous archiving with pgBackRest inside this container (§7.4): synchronous archive-push, no spool, and a
      # segment switch at least every 60 s so the archive lags by at most a minute (RPO ≤ 5 min).
      wal_level = replica
      wal_compression = lz4
      archive_mode = on
      archive_command = 'pgbackrest --stanza=ragdb archive-push %p'
      archive_timeout = 60

      # Statistics and logging
      shared_preload_libraries = 'pg_stat_statements'   # capacity metrics (§9)
      log_statement = 'none'                            # as the gateway
  rag-app-roles:
    content: |
      -- Applied by the migration service after every migration run (data-model §1.2, as the gateway's file). The service
      -- roles' privileges are revoked and granted again in one transaction, so each role holds exactly what this file lists
      -- (a privilege removed here is removed from existing installations too) and running services see either the old or the
      -- new grants, never none. Tables are named one by one: a new table is readable by no service until it is added here
      -- (DatabaseRoleTests checks the effective grants). Partitioned tables are granted on the parent only.
      -- No curly braces: the migration service runs this file with EF Core's ExecuteSqlRaw, which reads them as placeholders.
      BEGIN;
      REVOKE ALL ON ALL TABLES IN SCHEMA config, content, chat, audit FROM ume_rag_api, ume_rag_admin, ume_rag_worker;
      REVOKE ALL ON ALL SEQUENCES IN SCHEMA config, content, chat, audit FROM ume_rag_api, ume_rag_admin, ume_rag_worker;
      REVOKE ALL ON SCHEMA config, content, chat, audit FROM ume_rag_api, ume_rag_admin, ume_rag_worker;

      GRANT USAGE ON SCHEMA config, content, audit TO ume_rag_api, ume_rag_admin, ume_rag_worker;
      GRANT USAGE ON SCHEMA chat TO ume_rag_api, ume_rag_admin;

      -- Sequences in the schemas each role writes.
      GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA config, content, audit TO ume_rag_admin;
      GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA config, chat, audit TO ume_rag_api;
      GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA content, audit TO ume_rag_worker;

      -- config: the version row and the outbox are written only by the trigger function (owner's rights). The admin's
      -- UPDATE on ConfigVersion exists only for the FOR UPDATE lock that serialises config writes (data-model §5).
      GRANT SELECT ON config."ConfigVersion", config."ConfigOutbox" TO ume_rag_api, ume_rag_admin, ume_rag_worker;
      GRANT UPDATE ON config."ConfigVersion" TO ume_rag_admin;
      -- The admin creates and rotates the Data Protection keys; the others only decrypt.
      GRANT SELECT ON config."DataProtectionKeys" TO ume_rag_api, ume_rag_admin, ume_rag_worker;
      GRANT INSERT ON config."DataProtectionKeys" TO ume_rag_admin;
      GRANT SELECT ON config."__EFMigrationsHistory" TO ume_rag_admin;
      -- The gateway mirror (departments, teams): written by the admin's org sync, read by every service (scopes, audiences).
      GRANT SELECT, INSERT, UPDATE, DELETE ON config."Departments", config."Teams" TO ume_rag_admin;
      GRANT SELECT ON config."Departments", config."Teams" TO ume_rag_api, ume_rag_worker;
      -- The assigned gateway keys' mirror (data-model §1.2, §2.1): the admin's sync writes it; the api reads an assistant's key
      -- status and output cap before a call (chat §4.1, §6.3); the worker never needs it.
      GRANT SELECT, INSERT, UPDATE, DELETE ON config."GatewayKeys" TO ume_rag_admin;
      GRANT SELECT ON config."GatewayKeys" TO ume_rag_api;
      -- Clients and keys: the admin manages them, the api authenticates with them; key use goes to KeyLastUse (api), so it
      -- never bumps the config version. The worker holds no keys.
      GRANT SELECT, INSERT, UPDATE, DELETE ON config."Clients", config."Keys" TO ume_rag_admin;
      GRANT SELECT ON config."Clients", config."Keys" TO ume_rag_api;
      GRANT SELECT ON config."KeyLastUse" TO ume_rag_admin;
      GRANT SELECT, INSERT, UPDATE ON config."KeyLastUse" TO ume_rag_api;
      -- Admin BFF sessions: only the admin reads and writes them (data-model §2.1).
      GRANT SELECT, INSERT, UPDATE, DELETE ON config."AdminSessions" TO ume_rag_admin;
      -- Ingestion config (data-model §1.2): the admin manages it; the worker reads all of it; the api reads what retrieval
      -- needs. The api reads only the listed columns of Sources (knowledge design §6.3, §6.5), never Settings jsonb or
      -- schedules, and no pipelines.
      GRANT SELECT, INSERT, UPDATE, DELETE ON config."Settings", config."DataProtectionPolicies", config."EmbeddingProfiles",
        config."Collections", config."Sources", config."Pipelines", config."PipelineVersions" TO ume_rag_admin;
      GRANT SELECT ON config."Settings", config."DataProtectionPolicies", config."EmbeddingProfiles", config."Collections",
        config."Sources", config."Pipelines", config."PipelineVersions" TO ume_rag_worker;
      GRANT SELECT ON config."Settings", config."DataProtectionPolicies", config."EmbeddingProfiles", config."Collections" TO ume_rag_api;
      GRANT SELECT ("Id", "CollectionId", "Type", "Classification", "State", "DeletedAt", "ContainsThirdPartyText", "DemoteRules")
        ON config."Sources" TO ume_rag_api;
      -- Collection shares (data-model §1.2, admin design §3.2): the admin manages them; the api reads who may link a
      -- collection; the worker never needs them.
      GRANT SELECT, INSERT, UPDATE, DELETE ON config."CollectionShares" TO ume_rag_admin;
      GRANT SELECT ON config."CollectionShares" TO ume_rag_api;
      -- Assistants and the gateway model mirror (data-model §1.2): the admin manages them; the api reads assistants,
      -- audiences and models, and versions only through the view of published versions, never AssistantVersions itself, so a
      -- draft cannot reach chat. The worker reads the model mirror (the evaluation's residency checks, #130) and, for the
      -- index-health check, only which collections and topics active assistants' published versions link (knowledge design
      -- §6.4; Decisions "M-2 open design calls": every HNSW-searched scope an assistant link uses is sampled).
      GRANT SELECT, INSERT, UPDATE, DELETE ON config."Assistants", config."AssistantVersions", config."AssistantAudiences",
        config."GatewayModels" TO ume_rag_admin;
      -- Explain access (identity design 4.9) builds the api's policy snapshot in rag-admin, which reads the published view too.
      GRANT SELECT ON config."PublishedAssistantVersions" TO ume_rag_admin;
      GRANT SELECT ON config."Assistants", config."AssistantAudiences", config."PublishedAssistantVersions",
        config."GatewayModels" TO ume_rag_api;
      GRANT SELECT ON config."GatewayModels" TO ume_rag_worker;
      GRANT SELECT ("AssistantId", "CollectionLinks") ON config."PublishedAssistantVersions" TO ume_rag_worker;
      GRANT SELECT ("Id", "State") ON config."Assistants" TO ume_rag_worker;

      -- content: the worker owns it; the admin reads it and enqueues jobs (decisions are command jobs, data-model §12.2).
      GRANT SELECT, INSERT, UPDATE, DELETE ON content."Jobs", content."WorkerInstances", content."RunItems" TO ume_rag_worker;
      GRANT SELECT ON content."Jobs", content."WorkerInstances", content."RunItems" TO ume_rag_admin;
      GRANT INSERT ON content."Jobs" TO ume_rag_admin;
      -- Ingestion content (data-model §1.2, §2.2): the worker writes it all, the admin reads it all (incl. the test panel).
      GRANT SELECT, INSERT, UPDATE, DELETE ON content."NodeManifest", content."WorkerNodeSupport", content."CrawlHosts",
        content."SiteProfiles", content."SiteProfileVersions", content."CrawlFrontier", content."CrawlRuns",
        content."ConnectorCheckpoints", content."Uploads", content."DeletionProposals", content."QuarantinedFiles",
        content."Documents", content."NodeOutputs", content."ChunkSets", content."Chunks", content."EmbeddingCache",
        content."Runs", content."ParseObservations", content."ParseProfiles", content."BlobTombstones" TO ume_rag_worker;
      GRANT SELECT ON content."NodeManifest", content."WorkerNodeSupport", content."CrawlHosts", content."SiteProfiles",
        content."SiteProfileVersions", content."CrawlFrontier", content."CrawlRuns", content."ConnectorCheckpoints",
        content."Uploads", content."DeletionProposals", content."QuarantinedFiles", content."Documents", content."NodeOutputs",
        content."ChunkSets", content."Chunks", content."EmbeddingCache", content."Runs", content."ParseObservations",
        content."ParseProfiles", content."BlobTombstones" TO ume_rag_admin;
      -- The admin tombstones the upload blobs it replaces or deletes, in the transaction of its own change (issue #34).
      GRANT INSERT ON content."BlobTombstones" TO ume_rag_admin;
      -- The api searches chunks and reads the documents' citation columns only (knowledge design §3.5); "Language" and
      -- "FetchedAt" for statement D and the citation fields (knowledge design §6.3, §10.1); "CanonicalIdentity" (the upload
      -- slot) and "ContentHash" for the blob key and ETag of the document content route (knowledge design §3.5).
      GRANT SELECT ON content."ChunkSets", content."Chunks" TO ume_rag_api;
      -- The keyword stop list's statistics (knowledge design 6.2, #499): the worker keeps them, rag-api and the admin read them.
      GRANT SELECT, INSERT, UPDATE, DELETE ON content."KeywordStatistics" TO ume_rag_worker;
      GRANT SELECT ON content."KeywordStatistics" TO ume_rag_api, ume_rag_admin;
      GRANT SELECT ("Id", "SourceId", "Classification", "IdentityKind", "IdentityHash", "Title", "Url", "MediaType",
        "DisplayName", "SourceModifiedAt", "PageCount", "LiveChunkSetId", "DeletedAt", "Language", "FetchedAt",
        "CanonicalIdentity", "ContentHash")
        ON content."Documents" TO ume_rag_api;
      -- Evaluation and retrieval counters (data-model §1.2, §12.2, §12.3): the worker writes them; the admin reads them and
      -- writes runs and results itself for the answer-level runs it executes (P2 kinds); the api counts retrievals only
      -- through content.rag_count_retrievals.
      GRANT SELECT, INSERT, UPDATE, DELETE ON content."EvaluationSets", content."EvaluationQuestions", content."EvaluationRuns",
        content."EvaluationResults", content."RetrievalStats" TO ume_rag_worker;
      GRANT SELECT ON content."EvaluationSets", content."EvaluationQuestions", content."EvaluationRuns", content."EvaluationResults",
        content."RetrievalStats" TO ume_rag_admin;
      GRANT INSERT, UPDATE ON content."EvaluationRuns", content."EvaluationResults" TO ume_rag_admin;
      -- Tokens and cost of the worker's model calls per knowledge base and step (data-model §2.2; cost-attribution §5 C3): the
      -- worker writes them, the admin reads them for its cost report.
      GRANT SELECT, INSERT, UPDATE, DELETE ON content."CollectionDailyUsage" TO ume_rag_worker;
      GRANT SELECT ON content."CollectionDailyUsage" TO ume_rag_admin;

      -- chat (data-model §1.2, §2.3): the api owns it; the admin reads it and marks feedback reviewed (admin design §8.1); the
      -- worker has no access to the schema. P1 writes metadata and ratings only (weakness review §4).
      GRANT SELECT, INSERT, UPDATE, DELETE ON chat."Conversations", chat."DataKeys", chat."Messages", chat."MessageSources",
        chat."Feedback", chat."ToolCalls", chat."AssistantDailyTotals", chat."FeedbackImportState" TO ume_rag_api;
      GRANT SELECT ON chat."Conversations", chat."DataKeys", chat."Messages", chat."MessageSources", chat."Feedback",
        chat."ToolCalls", chat."AssistantDailyTotals", chat."FeedbackImportState" TO ume_rag_admin;
      GRANT UPDATE ("ReviewState") ON chat."Feedback" TO ume_rag_admin;
      -- Tokens and cost of every model call per assistant, client and step (data-model §2.3; chat design §8.3, §12.2): the api's
      -- conversation writer upserts them; the admin upserts the test panel's calls too (admin design §4.9).
      GRANT SELECT, INSERT, UPDATE, DELETE ON chat."AssistantDailyUsage" TO ume_rag_api;
      GRANT SELECT, INSERT, UPDATE ON chat."AssistantDailyUsage" TO ume_rag_admin;

      -- audit: every service appends, only the admin reads; no role deletes (retention runs through step functions).
      GRANT INSERT ON audit."AuditLog" TO ume_rag_api, ume_rag_admin, ume_rag_worker;
      -- The HNSW index-health rebuild (knowledge design §6.4): REINDEX INDEX CONCURRENTLY needs MAINTAIN (Postgres 17).
      GRANT MAINTAIN ON content."Chunks" TO ume_rag_worker;
      GRANT SELECT ON audit."AuditLog" TO ume_rag_admin;

      -- Functions (data-model §1.2). The keyword query function calls the aggregate with the caller's rights.
      REVOKE ALL ON ALL FUNCTIONS IN SCHEMA config, content, chat, audit FROM ume_rag_api, ume_rag_admin, ume_rag_worker;
      GRANT EXECUTE ON FUNCTION content.rag_or_query(tsvector), content.rag_tsquery_or_agg(tsquery)
        TO ume_rag_api, ume_rag_admin, ume_rag_worker;
      GRANT EXECUTE ON FUNCTION content.rag_partition_maintain(), content.rag_ensure_profile_index(uuid, integer) TO ume_rag_worker;
      -- The worker's nightly content retention (data-model §8): the ages and minimums live in the function.
      GRANT EXECUTE ON FUNCTION content.rag_retention_content_step(integer) TO ume_rag_worker;
      -- Editable embedding profiles (admin design 4.5): the admin resets an unused profile's cache and index after a change;
      -- the worker inserts a chunk set only while the profile still has the values it embedded with (row held FOR SHARE).
      GRANT EXECUTE ON FUNCTION content.rag_reset_profile(uuid) TO ume_rag_admin;
      GRANT EXECUTE ON FUNCTION content.rag_lock_profile_if_unchanged(uuid, text, integer, boolean) TO ume_rag_worker;
      GRANT EXECUTE ON FUNCTION config.rag_retention_config_step(integer) TO ume_rag_admin;
      GRANT EXECUTE ON FUNCTION chat.rag_retention_chat_step(integer) TO ume_rag_admin;
      GRANT EXECUTE ON FUNCTION content.rag_count_retrievals(date, uuid[], bytea[], uuid[], character varying[], integer[], integer[])
        TO ume_rag_api;
      COMMIT;
  rag-openwebui-setup-script:
    content: |
      #!/usr/bin/env python3
      """The feedback service account's Open WebUI API key, minted without password sign-in (M-17 C6).

      rag-api's feedback import (chat design §13.3) reads Open WebUI's feedback list with this key. Open WebUI's password
      sign-in stays off, so this one-shot job, run in Open WebUI's own image after it starts, mints the key the way Open WebUI's
      own session does it:

        1. the service account's id and session stamp from Open WebUI's SQLite store, read-only (by WEBUI_ADMIN_EMAIL);
        2. a 5-minute session JWT (HS256, {id, session_stamp, typ: session}) signed with Open WebUI's WEBUI_SECRET_KEY;
        3. POST /api/v1/auths/api_key with it, which mints the account's `sk-` key (a new one replaces the old);
        4. the key is checked on the feedback list (API_KEYS_ALLOWED_ENDPOINTS limits it to the feedback routes) and written
           as OpenWebUi__AdminApiKey into the directory rag-api reads it from (mode 0640; rag-api reloads it).

      A key that still works is kept, so the job runs on every deploy. A new key: delete the file and deploy again.
      Checked against Open WebUI v0.12.5 (the spike on #667): the claims and tables are Open WebUI's internals, so an Open WebUI
      upgrade re-runs the boot test (deploy/tests/portainer-boot.sh) before its pin moves.

      Environment:
        WEBUI_ADMIN_EMAIL         the service account (Open WebUI creates it on an empty store from the same variable)
        OWUI_URL                  where this job reaches Open WebUI       [http://rag-openwebui:8080]
        OWUI_DB                   Open WebUI's SQLite store                [/data/webui.db]
        OWUI_SECRET_KEY_FILE      Open WebUI's WEBUI_SECRET_KEY            [/run/owui-secrets/webui_secret_key]
        FEEDBACK_KEY_FILE         where the key goes                       [/run/feedback/OpenWebUi__AdminApiKey]
        OWUI_WAIT_SECONDS         how long to wait for Open WebUI to start [600]
      """

      import base64
      import hashlib
      import hmac
      import json
      import os
      import sqlite3
      import sys
      import time
      import urllib.error
      import urllib.request
      import uuid

      URL = os.environ.get("OWUI_URL", "http://rag-openwebui:8080").rstrip("/")
      DB = os.environ.get("OWUI_DB", "/data/webui.db")
      SECRET_FILE = os.environ.get("OWUI_SECRET_KEY_FILE", "/run/owui-secrets/webui_secret_key")
      KEY_FILE = os.environ.get("FEEDBACK_KEY_FILE", "/run/feedback/OpenWebUi__AdminApiKey")
      WAIT = int(os.environ.get("OWUI_WAIT_SECONDS", "600"))
      FEEDBACK_LIST = "/api/v1/evaluations/feedbacks/list"


      def log(message):
          print(f"rag-openwebui-setup: {message}", flush=True)


      def fail(message):
          log(f"error: {message}")
          sys.exit(1)


      def request(method, path, token):
          """The HTTP status and body of one call to Open WebUI with a bearer token."""
          req = urllib.request.Request(URL + path, method=method, headers={"Authorization": f"Bearer {token}"})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.status, response.read()
          except urllib.error.HTTPError as error:
              return error.code, error.read()


      def works(key):
          return request("GET", FEEDBACK_LIST, key)[0] == 200


      def b64(data):
          return base64.urlsafe_b64encode(data).rstrip(b"=")


      def session_token(user_id, stamp, secret):
          """An HS256 session JWT as Open WebUI's create_token writes it (utils/auth.py), valid for 5 minutes."""
          now = int(time.time())
          header = b64(json.dumps({"alg": "HS256", "typ": "JWT"}, separators=(",", ":")).encode())
          claims = {"id": user_id, "session_stamp": stamp, "typ": "session", "auth_method": "password", "iat": now,
                    "exp": now + 300, "jti": str(uuid.uuid4())}
          payload = b64(json.dumps(claims, separators=(",", ":")).encode())
          signature = b64(hmac.new(secret.encode(), header + b"." + payload, hashlib.sha256).digest())
          return (header + b"." + payload + b"." + signature).decode()


      def wait_for_open_webui():
          deadline = time.monotonic() + WAIT
          while True:
              try:
                  with urllib.request.urlopen(URL + "/health", timeout=10) as response:
                      if response.status == 200:
                          return
              except (urllib.error.URLError, OSError):
                  pass
              if time.monotonic() > deadline:
                  fail(f"Open WebUI did not answer {URL}/health within {WAIT} s")
              time.sleep(5)


      def account(email):
          """The service account's id and session stamp, read-only; the store's WAL needs a writable directory, not a write."""
          with sqlite3.connect(f"file:{DB}?mode=ro", uri=True, timeout=30) as db:
              row = db.execute(
                  'SELECT u.id, u.role, a.session_stamp FROM "user" u JOIN auth a ON a.id = u.id WHERE lower(u.email) = lower(?)',
                  (email,),
              ).fetchone()
          if row is None:
              fail(f"no Open WebUI account {email}: Open WebUI creates it from WEBUI_ADMIN_EMAIL only on an empty store")
          if row[1] != "admin":
              fail(f"the Open WebUI account {email} has the role {row[1]}, not admin")
          return row[0], row[2]


      def write_key(key):
          directory = os.path.dirname(KEY_FILE)
          # KeyPerFile skips the "ignore." prefix, so rag-api never reads the half-written file.
          temporary = os.path.join(directory, f"ignore.{os.path.basename(KEY_FILE)}.tmp")
          fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o640)
          with os.fdopen(fd, "w") as file:
              file.write(key)
          os.chmod(temporary, 0o640)
          os.replace(temporary, KEY_FILE)


      def main():
          email = os.environ.get("WEBUI_ADMIN_EMAIL", "").strip()
          if not email:
              fail("WEBUI_ADMIN_EMAIL is not set")
          wait_for_open_webui()
          if os.path.exists(KEY_FILE):
              with open(KEY_FILE) as file:
                  current = file.read().strip()
              if current and works(current):
                  log("the feedback key works; kept")
                  return
              log("the feedback key is refused; minting a new one")
          with open(SECRET_FILE) as file:
              secret = file.read().strip()
          if not secret:
              fail(f"{SECRET_FILE} is empty")
          user_id, stamp = account(email)
          status, body = request("POST", "/api/v1/auths/api_key", session_token(user_id, stamp, secret))
          if status != 200:
              fail(f"Open WebUI refused to mint the key (HTTP {status}): {body[:200].decode(errors='replace')}")
          key = json.loads(body).get("api_key") or ""
          if not key.startswith("sk-"):
              fail("Open WebUI answered without an sk- key")
          if not works(key):
              fail("the new key is refused on the feedback list: check API_KEYS_ALLOWED_ENDPOINTS")
          write_key(key)
          log(f"minted the feedback key for {email}; rag-api reads it within seconds")


      if __name__ == "__main__":
          main()
  rag-proxy-conf-template:
    content: |
      # The Portainer stack's TLS proxy (profile proxy; M-17 C8, Decisions "Deploy configuration" D9): nginx in front of the
      # gateway, its admin, rag-api, rag-admin and Open WebUI, with the operator's certificate. rag-bootstrap fills in the
      # @placeholders@ from the stack's host names and writes rag-config/proxy/nginx.conf; it drops the blocks marked
      # #gwadmin, #ragadmin or #owui when that host has no name of its own (or the openwebui profile is off). Routes and body
      # sizes as the gateway's and Ume.Rag's nginx.conf.example; every upstream but Open WebUI (plain HTTP inside the stack)
      # is re-encrypted and verified against its internal CA.
      worker_processes auto;
      pid /tmp/nginx.pid;
      error_log /dev/stderr warn;

      events {
          worker_connections 1024;
      }

      http {
          access_log /dev/stdout;
          client_body_temp_path /tmp/client_temp;
          proxy_temp_path /tmp/proxy_temp;
          fastcgi_temp_path /tmp/fastcgi_temp;
          uwsgi_temp_path /tmp/uwsgi_temp;
          scgi_temp_path /tmp/scgi_temp;
          server_tokens off;

          # One certificate for every name (a SAN or wildcard certificate): UME_RAG_PROXY_CERTS_DIR/tls.crt and tls.key.
          ssl_certificate /run/proxy-certs/tls.crt;
          ssl_certificate_key /run/proxy-certs/tls.key;
          ssl_protocols TLSv1.2 TLSv1.3;

          # WebSocket upgrade (the gateway's live audio, Open WebUI's live connection); other requests keep the pooled
          # keep-alive connection.
          map $$http_upgrade $$ume_connection { default upgrade; '' ''; }

          # Docker's embedded DNS, asked again every 10 s: a stack update recreates a service with a new address on its network
          # while this proxy keeps running, and a name resolved only at start would then answer 502 until a restart. With
          # "resolve" (nginx 1.27.3 and later) each upstream follows its service's current address, and a service that isn't up
          # yet (rag-openwebui, which depends_on can't name across profiles) doesn't stop nginx from starting.
          resolver 127.0.0.11 valid=10s ipv6=off;
          resolver_timeout 5s;

          upstream ume_gateway { zone ume_gateway 64k; server gateway:8443 resolve; keepalive 32; }
          upstream ume_admin { zone ume_admin 64k; server adminapi:8443 resolve; }
          upstream ume_rag_api { zone ume_rag_api 64k; server rag-api:8443 resolve; keepalive 32; }
          upstream ume_rag_admin { zone ume_rag_admin 64k; server rag-admin:8443 resolve; }
      #owui    upstream ume_rag_openwebui { zone ume_rag_openwebui 64k; server rag-openwebui:8080 resolve; }

          # A name this proxy doesn't serve gets no answer.
          server {
              listen 8443 ssl default_server;
              http2 on;
              return 444;
          }

          # The gateway (its deploy/proxy/nginx.conf.example).
          server {
              listen 8443 ssl;
              http2 on;
              server_name @GATEWAY_HOST@;
              client_max_body_size 52m;          # image edits (gateway default 50 MB), audio uploads (26 MB), documents
              location / {
                  proxy_pass https://ume_gateway;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $$http_upgrade;
                  proxy_set_header Connection $$ume_connection;
                  proxy_set_header Host $$host;
                  # List this proxy under the gateway admin's Settings > Trusted proxies, or the gateway ignores the header.
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_buffering off;           # stream tokens as they arrive (SSE)
                  proxy_request_buffering off;   # uploads straight through: no recordings in proxy temp files
                  proxy_read_timeout 600s;
                  proxy_send_timeout 600s;
                  proxy_connect_timeout 5s;
                  proxy_ssl_verify on;
                  proxy_ssl_trusted_certificate /etc/nginx/ume/gateway-ca.pem;
                  proxy_ssl_name gateway;
                  proxy_ssl_server_name on;
              }
          }

          # The gateway's admin UI and API.
      #gwadmin    server {
      #gwadmin        listen 8443 ssl;
      #gwadmin        http2 on;
      #gwadmin        server_name @ADMIN_HOST@;
      #gwadmin        location / {
      #gwadmin            proxy_pass https://ume_admin;
      #gwadmin            proxy_http_version 1.1;
      #gwadmin            proxy_set_header Host $$host;
      #gwadmin            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
      #gwadmin            proxy_connect_timeout 5s;
      #gwadmin            proxy_ssl_verify on;
      #gwadmin            proxy_ssl_trusted_certificate /etc/nginx/ume/gateway-ca.pem;
      #gwadmin            proxy_ssl_name adminapi;
      #gwadmin            proxy_ssl_server_name on;
      #gwadmin        }
      #gwadmin    }

          # rag-api: chat completions (streamed), knowledge, MCP, the OpenAI-compatible model list.
          server {
              listen 8443 ssl;
              http2 on;
              server_name @API_HOST@;
              client_max_body_size 2m;           # questions and chat history (rag-api's chat route takes up to 2 MB)
              location / {
                  proxy_pass https://ume_rag_api;
                  proxy_http_version 1.1;
                  proxy_set_header Connection '';
                  proxy_set_header Host $$host;
                  # List this proxy under Ume.Rag's Settings > Network (trusted proxies), or rag-api ignores the header.
                  proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                  proxy_buffering off;           # stream answer tokens as they arrive (SSE)
                  proxy_read_timeout 600s;
                  proxy_send_timeout 600s;
                  proxy_connect_timeout 5s;
                  proxy_ssl_verify on;
                  proxy_ssl_trusted_certificate /etc/nginx/ume/rag-ca.pem;
                  proxy_ssl_name rag-api;
                  proxy_ssl_server_name on;
              }
          }

          # rag-admin: the admin UI and its API (BFF).
      #ragadmin    server {
      #ragadmin        listen 8443 ssl;
      #ragadmin        http2 on;
      #ragadmin        server_name @RAG_ADMIN_HOST@;
      #ragadmin        client_max_body_size 1m;
      #ragadmin        location / {
      #ragadmin            proxy_pass https://ume_rag_admin;
      #ragadmin            proxy_http_version 1.1;
      #ragadmin            proxy_set_header Host $$host;
      #ragadmin            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
      #ragadmin            proxy_connect_timeout 5s;
      #ragadmin            proxy_ssl_verify on;
      #ragadmin            proxy_ssl_trusted_certificate /etc/nginx/ume/rag-ca.pem;
      #ragadmin            proxy_ssl_name rag-admin;
      #ragadmin            proxy_ssl_server_name on;
      #ragadmin        }
      #ragadmin        # Uploads (admin design §2.2): one file per request, up to 60 MB, passed straight through.
      #ragadmin        location ~ ^/api/upload-batches/[0-9a-fA-F-]+/files/[0-9]+$$ {
      #ragadmin            client_max_body_size 60m;
      #ragadmin            proxy_request_buffering off;
      #ragadmin            proxy_pass https://ume_rag_admin;
      #ragadmin            proxy_http_version 1.1;
      #ragadmin            proxy_set_header Host $$host;
      #ragadmin            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
      #ragadmin            proxy_read_timeout 300s;
      #ragadmin            proxy_send_timeout 300s;
      #ragadmin            proxy_connect_timeout 5s;
      #ragadmin            proxy_ssl_verify on;
      #ragadmin            proxy_ssl_trusted_certificate /etc/nginx/ume/rag-ca.pem;
      #ragadmin            proxy_ssl_name rag-admin;
      #ragadmin            proxy_ssl_server_name on;
      #ragadmin        }
      #ragadmin    }

          # Open WebUI (profile openwebui): plain HTTP inside the stack; this proxy terminates TLS.
      #owui    server {
      #owui        listen 8443 ssl;
      #owui        http2 on;
      #owui        server_name @OPENWEBUI_HOST@;
      #owui        client_max_body_size 2m;       # the whole conversation goes to rag-api (2 MB); file uploads are off
      #owui        location / {
      #owui            proxy_pass http://ume_rag_openwebui;
      #owui            proxy_http_version 1.1;
      #owui            proxy_set_header Upgrade $$http_upgrade;
      #owui            proxy_set_header Connection $$ume_connection;
      #owui            proxy_set_header Host $$host;
      #owui            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
      #owui            proxy_set_header X-Forwarded-Proto https;
      #owui            proxy_buffering off;       # stream answers
      #owui            proxy_read_timeout 600s;
      #owui            proxy_send_timeout 600s;
      #owui            proxy_connect_timeout 5s;
      #owui        }
      #owui    }
      }

