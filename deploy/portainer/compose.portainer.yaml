# GENERATED FILE: deploy/portainer/build-stack.sh of the RAG repository (thekim1/kalla) writes it
# from the gateway's deploy/compose.portainer.yaml (below, unchanged but for the default of
# FORS_INTEGRATION_MANIFEST and of FORS_INTEGRATION_API_URL)
# and deploy/compose.rag.yaml, with deploy/portainer/stack-header.txt.
# Do not edit it by hand; the gateway's own note below refers to the gateway's part.
#
# GENERATED FILE: edit compose.portainer.template.yaml (and the files it includes), then run
# deploy/build-portainer-stack.sh. Do not edit compose.portainer.yaml by hand.
#
# Environment-driven production stack for Portainer (or any host where you cannot run scripts).
# Paste this file into a Portainer stack (Web editor) or deploy it from the Git repository, and
# set the variables below under "Environment variables". Nothing else is needed: the one-shot
# `bootstrap` service creates the certificates and secrets inside Docker volumes on first start.
# The containers still read secrets and certificates from read-only files, never from
# environment variables. Requires Docker 28+ / a recent Compose (configs content, volume subpath).
#
# Required variables
#   FORS_DOMAIN                your domain (for example example.se): the host names default to llm.<domain> (the
#                             gateway API) and llm-admin.<domain> (the admin UI). Or set FORS_GATEWAY_HOST instead.
#   GATEWAY_IMAGE, ADMINAPI_IMAGE, MIGRATIONS_IMAGE   images pushed to a registry the host can pull. The
#                             compose.portainer.yaml attached to a GitHub release already pins that release's images by
#                             digest, so with it only FORS_DOMAIN is required.
# Sign-in to the admin console, one of two ways (docs/runbook.md, "Portainer and other hosts without shell access"):
#   - the setup wizard: set nothing. At its first start the admin API prints a setup code in the adminapi container's
#     log; open https://<admin host>[:FORS_ADMIN_PORT]/setup, enter it, and the wizard takes the provider, client and
#     secret and tests a sign-in before saving. The end of the bootstrap container's log names the address;
#   - declared: FORS_OIDC_AUTHORITY, the https URL of your OIDC provider (Keycloak realm, AD FS, Entra ID), with
#     FORS_OIDC_CLIENT_ID and FORS_OIDC_CLIENT_SECRET as needed. A set authority keeps the wizard closed for good; every
#     FORS_OIDC_* that is set is the deployment's value and locks its field in the wizard. FORS_OIDC_CLIENT_SECRET is used
#     only together with FORS_OIDC_AUTHORITY.
# Optional variables
#   FORS_GATEWAY_HOST          public hostname of the gateway API, to override llm.<domain> (required without
#                             FORS_DOMAIN)
#   FORS_GATEWAY_PUBLIC_URL    its public URL when it is not https://<gateway host> (add :port if not 443)
#   FORS_ADMIN_HOST            public hostname of the admin UI, to override llm-admin.<domain> (without FORS_DOMAIN it
#                             defaults to FORS_GATEWAY_HOST)
#   FORS_SETUP_REOPEN          empty. Any new value (for example today's date), then Update the stack, opens the setup
#                             wizard once more, for an hour, with a new code in the adminapi log; empty it before
#                             restoring a database
#   FORS_OIDC_AUTHORITY, FORS_OIDC_CLIENT_ID (code default fors-admin), FORS_OIDC_CLIENT_SECRET (confidential clients)
#   FORS_GATEWAY_BIND / FORS_ADMIN_BIND (0.0.0.0), FORS_GATEWAY_PORT (8443), FORS_ADMIN_PORT (9443)
#   FORS_OIDC_ROLE_CLAIM, FORS_OIDC_DEPARTMENT_CLAIM, FORS_OIDC_TEAM_CLAIM, FORS_OIDC_GROUP_CLAIM, FORS_OIDC_EXTRA_SCOPE
#                             (unset: the wizard's value, else the code's default: roles, departmentCodes, teamCodes,
#                             groups and no extra scope; openid, profile and email are always requested)
#   FORS_OIDC_GROUPS_GATEWAY_ADMIN / _DEPARTMENT_ADMIN / _VIEWER / _TEAM_ADMIN  (see docs/runbook.md, "Identity provider")
#   FORS_OTEL_ENDPOINT         OTLP collector for logs, traces and security events (off when empty)
#   FORS_SOURCE_ADDRESS        client address kept for refused keys: Truncated (default), Full or None
#   (behind a reverse proxy, list it under Settings > Trusted proxies in the admin UI; FORS_FORWARDED_HEADERS is gone)
#   COMPOSE_PROFILES=data     also start the read-only Data API (DATAAPI_IMAGE, FORS_DATA_PORT 10443, FORS_DATA_HOST,
#                             FORS_DATA_AUTHORITY defaults to FORS_OIDC_AUTHORITY; see docs/data-access.md). It does not
#                             follow the wizard: with sign-in set there, set FORS_DATA_AUTHORITY for access tokens, or the
#                             Data API accepts only Data API keys
#   FORS_DATA_PUBLIC_URL       the Data API's public URL, shown with new Data API keys in the admin UI
#   FORS_ADMIN_PUBLIC_URL      the admin console's address, handed to integrations (docs/integrations.md)
#   FORS_INTEGRATION_API_URL   the Integration API's address as integrations reach it (for example
#                             https://adminapi:8443/integration/v1 when they share a network with adminapi)
#   FORS_INTEGRATION_MANIFEST  an integration manifest (JSON) to provision on every deploy; each new credential key's
#                             secret is written to the <stack>_integration-secrets volume (docs/integrations.md)
#
# The data lives in the volumes <stack>_postgres-data, <stack>_fors-certs and <stack>_fors-secrets
# (<stack>_fors-config holds static configuration and is rewritten on every start). A stack from before the rename to
# Fors (0.11 or earlier) had <stack>_ume-certs and <stack>_ume-secrets: the bootstrap copies them once into the new
# volumes (docs/upgrade-guide.md, "0.12.0"); remove them when the stack runs. In a new stack they stay empty.
# Do not delete them: a restored database is unusable without the key pepper and the Data
# Protection certificate (back up fors-secrets/.pepper and fors-certs/data-protection.pfx). A client secret saved in the
# setup wizard is encrypted with that certificate too.
# Ports: inside the containers the apps listen on 8443 and the health probe checks that; only
# the host side of the mapping is configurable (see compose.prod.yaml for details).
#
# ---- Källa (added by the RAG repository's deploy/portainer/build-stack.sh) ------------------------------------------
# The same stack also runs Källa: kalla-postgres, kalla-migrate, kalla-api (8543), kalla-admin (9543), kalla-worker,
# kalla-parser and, with their profiles in COMPOSE_PROFILES, kalla-clamav (clamav) and kalla-renderer (render). Its one-shot
# kalla-bootstrap creates RAG's certificates and secrets in the volumes <stack>_kalla-certs and <stack>_kalla-secrets on first
# start. Keep the stack name: the gateway's volumes are found by it.
#
# Start from deploy/portainer/stack.env.example (Portainer: "Load variables from .env file"); after each deploy the end
# of kalla-bootstrap's log lists what is still missing. The gateway's image variables above are not needed: this file pins
# them (built from a gateway release). Steps: docs/portainer.md.
#
# Required variable: one, the gateway's too
#   FORS_DOMAIN                the base domain (for example example.se): the host names default to llm.<domain> and
#                             llm-admin.<domain> (the gateway's), rag.<domain> (kalla-api), rag-admin.<domain>
#                             (kalla-admin) and, with the openwebui profile, chat.<domain>. Each KALLA_*_HOST (Optional, below)
#                             overrides its name; without FORS_DOMAIN, FORS_GATEWAY_HOST and KALLA_API_HOST are
#                             required instead
# Set by the stack file or stack.env.example, nothing to type
#   FORS_INTEGRATION_MANIFEST  (the gateway's) unset, this file's default: the integration Kalla with its three
#                             credential keys (deploy/portainer/integration-manifest.json), in a team and department of
#                             its own (kalla) that a gateway admin can move. The gateway's migrations create what is
#                             missing (never change what exists) and write each new key to the volume
#                             <stack>_integration-secrets, from which kalla-bootstrap gives each service its key (M-17
#                             C7). Set it to your own manifest (with an "owner") to place the integration in an existing
#                             team at once; set it empty to create nothing. Then, or for a key issued by hand:
#   KALLA_API_GATEWAY_KEY, KALLA_ADMIN_GATEWAY_KEY, KALLA_WORKER_GATEWAY_KEY
#                             each service's credential key of the gateway integration Kalla; set, it wins over the
#                             manifest's. Without a key the stack starts but that service's model calls are refused. To
#                             rotate one: rotate it in the gateway's admin, then set the variable (or delete its file in
#                             <stack>_integration-secrets) and update the stack: picked up within seconds, no restart.
#   FORS_INTEGRATION_API_URL   (the gateway's) https://adminapi:8443/integration/v1: the Integration API's address the
#                             gateway hands kalla-admin in its context, for the cost and budget read-back (kalla-admin
#                             joins the gateway's edge network to reach adminapi)
# Recommended
#   COMPOSE_PROFILES=clamav   kalla-clamav, the malware scan: the worker scans with it while the profile is on, and
#                             without it stores files unscanned and marked so (kalla-bootstrap sets ClamAv__Mode)
# Sign-in is set in two setup wizards, the gateway's first: https://<FORS_ADMIN_HOST>/setup with the setup code from
# adminapi's log (the gateway's part above), then https://<KALLA_ADMIN_HOST>/setup with the setup code from
# kalla-admin's log. Each shows the redirect URIs to register, takes its client secret and tests a sign-in. kalla-admin's
# wizard suggests the provider saved in the gateway's. A stack that sets FORS_OIDC_AUTHORITY declares the provider for
# both instead (locked in both wizards; KALLA_OIDC_AUTHORITY gives kalla-admin another).
# Optional
#   KALLA_OIDC_CLIENT_SECRET  declares RAG admin's own OIDC client's secret instead of the wizard (client
#                             KALLA_OIDC_CLIENT_ID, default kalla-admin): with the authority, the wizard never opens.
#                             The token's shape, each optional and the wizard's otherwise: KALLA_OIDC_ROLE_CLAIM,
#                             _DEPARTMENT_CLAIM, _TEAM_CLAIM, _GROUP_CLAIM, _EXTRA_SCOPE, _TENANT_ID (Entra ID) and
#                             _REFUSE_GUESTS (true or false); a variable set locks its field in the wizard
#   KALLA_API_PUBLIC_URL    kalla-api's public URL when it is not https://<KALLA_API_HOST> (a port:
#                             https://rag.example.se:8543); citation links are absolute
#   KALLA_OIDC_GROUPS_PLATFORM_ADMIN  the break-glass group(s) for the first platform admin (';'-separated), for an
#                             identity provider whose tokens carry groups instead of the role rag-platform-admin in the
#                             roles claim; the other roles' groups are set in RAG's admin (Settings, Role groups)
#   KALLA_API_HOST (rag.<domain>), KALLA_ADMIN_HOST (rag-admin.<domain>; without FORS_DOMAIN, kalla-api's name)
#   KALLA_API_PORT (8543), KALLA_ADMIN_PORT (9543), KALLA_*_BIND (0.0.0.0)
#   KALLA_CRAWL_ALLOW (private CIDRs the crawler may fetch). The residency ceiling is each credential key's own
#                             residencies in the gateway (register M2: OnPrem and Eu)
#   COMPOSE_PROFILES=clamav,render  also the renderer for JavaScript-rendered pages (see kalla-renderer)
#   Open WebUI is optional: without the openwebui profile nothing of it is created (no secrets, no client in RAG's
#                             admin, no chat host name in the proxy), and Källa serves its API to your applications.
#   COMPOSE_PROFILES=clamav,openwebui  also kalla-openwebui, Open WebUI as the chat for users, on plain HTTP at
#                             KALLA_OPENWEBUI_BIND (127.0.0.1):KALLA_OPENWEBUI_PORT (3000) for a TLS proxy in front
#                             (it sets Secure cookies, so users reach it over HTTPS only). It calls kalla-api inside the
#                             stack. Set with it:
#     KALLA_OPENWEBUI_HOST      its public hostname (default chat.<domain>)
#     Its sign-in is the setup wizard's Open WebUI step (redirect URI
#                             https://<KALLA_OPENWEBUI_HOST>/oauth/oidc/login/callback; until the admin UI has that
#                             step, declare a confidential client's secret). To declare it instead:
#                             KALLA_OPENWEBUI_OIDC_CLIENT_ID (open-webui), KALLA_OPENWEBUI_OIDC_CLIENT_SECRET,
#                             KALLA_OPENWEBUI_OIDC_PROVIDER_URL (default kalla-admin's authority's
#                             /.well-known/openid-configuration) and the button's label
#                             KALLA_OPENWEBUI_OIDC_PROVIDER_NAME (Umeå kommun); each one set wins and locks its field.
#                             kalla-api serves them to Open WebUI's start (deploy/openwebui/start-with-sign-in.py), which
#                             restarts Open WebUI within a minute of a change; without a provider, Open WebUI starts
#                             without sign-in
#                             Open WebUI's key for kalla-api is generated by kalla-bootstrap, and kalla-migrate registers it as
#                             the deployment's own Open WebUI client in RAG's admin (Apps and keys); nothing to paste
#                             The feedback import needs nothing either: Open WebUI's first user is the service account
#                             feedback-import@localhost, and the one-shot kalla-openwebui-setup mints its API key after
#                             Open WebUI starts (password sign-in stays off) and keeps it while it works. A new key: delete
#                             <stack>_kalla-secrets/openwebui-feedback/OpenWebUi__AdminApiKey and update the stack
#   KALLA_SETUP_REOPEN      empty; any new value (for example today's date) opens the setup wizard once, for an hour,
#                             with a new setup code in kalla-admin's log (remove it before restoring a database)
#   KALLA_*_IMAGE               other RAG images (default: the latest release's, from ghcr.io/thekim1, pinned by digest;
#                             a release's compose.portainer.yaml asset pins its own; add ghcr.io as a registry in
#                             Portainer if the packages are private)
#   COMPOSE_PROFILES=proxy    kalla-proxy, nginx with your certificate in front of all five host names (M-17 C8): the
#                             gateway (FORS_GATEWAY_HOST), its admin (FORS_ADMIN_HOST), kalla-api (KALLA_API_HOST),
#                             kalla-admin (KALLA_ADMIN_HOST) and Open WebUI (KALLA_OPENWEBUI_HOST), each a name of its
#                             own, on KALLA_PROXY_BIND:KALLA_PROXY_PORT (0.0.0.0:443). KALLA_PROXY_CERTS_DIR
#                             (/etc/kalla/proxy-certs) is a host directory with tls.crt (full chain) and tls.key for
#                             every name (SAN or wildcard), readable by uid 101; renewing it: replace both files and
#                             restart kalla-proxy. Then bind the other published ports to 127.0.0.1 (the *_BIND
#                             variables) and list the proxy as a trusted proxy in both admins (docs/portainer.md)
# Escrow the keys a restored RAG database needs with deploy/escrow-keys.sh --project <stack> from the release bundle
# (docs/portainer.md): without them it is unusable. This stack has no WAL archiving (pgBackRest): back up kalla-postgres
# with pg_dump or volume snapshots.

name: fors-gateway

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

x-certs: &certs-mount
  type: volume
  source: fors-certs
  target: /run/certs
  read_only: true

x-conf: &conf-mount
  type: volume
  source: fors-config
  target: /run/config
  read_only: true

x-secrets: &secrets-mount
  type: volume
  source: fors-secrets
  read_only: true

x-rag-certs: &kalla-certs-mount
  type: volume
  source: kalla-certs
  target: /run/certs
  read_only: true

x-rag-conf: &kalla-conf-mount
  type: volume
  source: kalla-config
  target: /run/config
  read_only: true

x-rag-secrets: &kalla-secrets-mount
  type: volume
  source: kalla-secrets
  target: /run/app-secrets
  read_only: true

services:
  bootstrap:
    image: docker.io/alpine/openssl@sha256:59c5cb51e536d40587667229468b007a2a6cae1705397e59e5f7774c08b74029
    restart: "no"
    entrypoint: [/bin/sh, /config/bootstrap.sh]
    environment:
      # Each host name, else its default under FORS_DOMAIN (llm., llm-admin.). Without the domain the admin's name stays
      # empty, which the script reads as "the gateway's name" (as before FORS_DOMAIN); with neither the domain nor the
      # gateway's name, that name is empty too and the script stops with "Set FORS_DOMAIN or FORS_GATEWAY_HOST". Never a
      # ":?" inside a default here: some Compose versions evaluate it even when the outer variable is set.
      FORS_GATEWAY_HOST: ${FORS_GATEWAY_HOST:-${FORS_DOMAIN:+llm.}${FORS_DOMAIN:-}}
      FORS_ADMIN_HOST: ${FORS_ADMIN_HOST:-${FORS_DOMAIN:+llm-admin.}${FORS_DOMAIN:-}}
      FORS_ADMIN_PORT: ${FORS_ADMIN_PORT:-9443}
      FORS_DATA_HOST: ${FORS_DATA_HOST:-}
      # Sign-in: the client secret file follows the variable, and only with the authority; the rest only shapes the
      # closing lines of the log (the wizard's address, the Data API's authority).
      FORS_OIDC_AUTHORITY: ${FORS_OIDC_AUTHORITY:-}
      FORS_OIDC_CLIENT_SECRET: ${FORS_OIDC_CLIENT_SECRET:-}
      FORS_DATA_AUTHORITY: ${FORS_DATA_AUTHORITY:-}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      # Rewritten by the RAG repository's build-stack.sh: the integration Kalla and its three credential keys as the
      # default (deploy/portainer/integration-manifest.json), used only while the variable is unset. Set, the variable
      # wins; set and empty, nothing is provisioned.
      FORS_INTEGRATION_MANIFEST: '${FORS_INTEGRATION_MANIFEST-{"schemaVersion":1,"integration":{"name":"Kalla","description":"K\u00e4lla retrieval platform"},"credentialKeys":[{"name":"rag-api","allowedResidencies":["OnPrem","Eu"],"requireMaxResidency":true,"piiPolicy":"Off","allowedIpRanges":[]},{"name":"rag-admin","integrationScopes":["organisation.read","usage.read"],"allowedResidencies":["OnPrem","Eu"],"requireMaxResidency":true,"piiPolicy":"Off","allowedIpRanges":[]},{"name":"rag-worker","allowedResidencies":["OnPrem","Eu"],"requireMaxResidency":true,"piiPolicy":"Off","allowedIpRanges":[]}]}}'
    configs:
      - {source: bootstrap-script, target: /config/bootstrap.sh}
      - {source: redis-acl-template, target: /config/users.acl.example}
      - {source: redis-conf, target: /config/redis.conf}
      - {source: postgres-init, target: /config/postgres-init.sql}
      - {source: postgres-hba, target: /config/pg_hba.conf}
      - {source: app-roles, target: /config/app-roles.sql}
    volumes:
      - fors-certs:/certs
      - fors-secrets:/secrets
      - fors-config:/conf
      - integration-secrets:/integration-secrets
      # The volumes from before the rename to Fors, read once by the bootstrap (until 0.13).
      - ume-certs:/legacy-certs:ro
      - ume-secrets:/legacy-secrets:ro
    networks: [data]

  postgres:
    <<: *hardened
    image: docker.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    user: "70:70"
    restart: unless-stopped
    tmpfs: [/tmp, "/var/run/postgresql:uid=70,gid=70,mode=0700"]
    environment:
      POSTGRES_PASSWORD_FILE: /run/postgres-secrets/bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    command: [postgres, -c, ssl=on, -c, ssl_cert_file=/run/certs/postgres.crt, -c, ssl_key_file=/run/certs/postgres.key, -c, ssl_ca_file=/run/certs/ca.pem, -c, hba_file=/run/config/pg_hba.conf, -c, log_statement=none]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - {<<: *conf-mount, target: /docker-entrypoint-initdb.d, volume: {subpath: postgres-init}}
      - {<<: *conf-mount, volume: {subpath: postgres}}
      - {<<: *certs-mount, volume: {subpath: postgres}}
      - {<<: *secrets-mount, target: /run/postgres-secrets, volume: {subpath: postgres}}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    networks: [data]
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, gatewaydb]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    <<: *hardened
    image: docker.io/library/redis:8.6@sha256:2f07354308a997554f9d676888ca927ada1293c7c2154dd01ae77f57dd9c6d5f
    user: "999:999"
    restart: unless-stopped
    entrypoint: [redis-server]
    command: [/run/config/redis.conf]
    volumes:
      - {<<: *conf-mount, volume: {subpath: redis}}
      - {<<: *certs-mount, volume: {subpath: redis}}
      - {<<: *secrets-mount, target: /run/redis-secrets, volume: {subpath: redis}}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, "redis-cli --tls --cacert /run/certs/ca.pem -h redis PING | grep -q NOAUTH"]
      interval: 10s
      timeout: 5s
      retries: 12

  migrations:
    <<: *hardened
    image: ${MIGRATIONS_IMAGE:-ghcr.io/thekim1/fors/migrations:0.12.1@sha256:2dd0329f7f7a040be9935bd6fb7d3666a28bbca073a66879b2d70f9f8e75d55e}
    user: "1654:1654"
    restart: "no"
    environment:
      DOTNET_ENVIRONMENT: Production
      Security__SecretsDirectory: /run/app-secrets
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Migration__RolesSqlPath: /run/config/app-roles.sql
      Seed__Enabled: "false"
      # FORS_INTEGRATION_MANIFEST, written by the bootstrap (docs/integrations.md, "Provisioning from a manifest").
      Provisioning__Manifests: /run/config/integration-manifests
      Provisioning__SecretsPath: /run/integration-secrets
    volumes:
      - {<<: *conf-mount, volume: {subpath: migrations}}
      - {<<: *certs-mount, volume: {subpath: migrations}}
      - {<<: *secrets-mount, target: /run/app-secrets, volume: {subpath: migrations}}
      - integration-secrets:/run/integration-secrets
    depends_on:
      postgres: {condition: service_healthy}
    networks: [data]

  gateway:
    <<: *hardened
    image: ${GATEWAY_IMAGE:-ghcr.io/thekim1/fors/gateway:0.12.1@sha256:5c38967a7235471a97df940e9a8bf3b2e086f4658dd3ef4403b814c32c8b488d}
    user: "1654:1654"
    restart: unless-stopped
    stop_grace_period: 60s
    ports: ["${FORS_GATEWAY_BIND:-0.0.0.0}:${FORS_GATEWAY_PORT:-8443}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Security__SecretsDirectory: /run/app-secrets
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/gateway.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/gateway.key
      Gateway__Security__SourceAddress: ${FORS_SOURCE_ADDRESS:-Truncated}
      # Integrations (docs/integrations.md): the admin console's address, for links in /v1/fors/context. Empty = none.
      Gateway__AdminUrl: ${FORS_ADMIN_PUBLIC_URL:-}
      # Rewritten by the RAG repository's build-stack.sh: adminapi's own address in this stack as the default, used
      # only while the variable is unset. Set and empty, the gateway announces no Integration API.
      Gateway__IntegrationApiUrl: ${FORS_INTEGRATION_API_URL-https://adminapi:8443/integration/v1}
      # The admin console's sign-in provider, handed to integrations on /v1/fors/context (docs/integrations.md). Empty
      # hands out the authority saved in the setup wizard.
      Gateway__OidcAuthority: ${FORS_OIDC_AUTHORITY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${FORS_OTEL_ENDPOINT:-}
      OTEL_SERVICE_NAME: gateway
      SSL_CERT_FILE: /run/certs/ca.pem
      DOTNET_SHUTDOWNTIMEOUTSECONDS: "50"
    volumes:
      - {<<: *certs-mount, volume: {subpath: gateway}}
      - {<<: *secrets-mount, target: /run/app-secrets, volume: {subpath: gateway}}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrations: {condition: service_completed_successfully}
    networks: [edge, data, llm]
    healthcheck:
      test: [CMD, dotnet, Fors.Gateway.dll, --health-check]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  adminapi:
    <<: *hardened
    image: ${ADMINAPI_IMAGE:-ghcr.io/thekim1/fors/adminapi:0.12.1@sha256:dd45f46b0ac3968fc80d25b7f9a0cf90f0d0cb72ad3388f488c59bc00b684581}
    user: "1654:1654"
    restart: unless-stopped
    ports: ["${FORS_ADMIN_BIND:-0.0.0.0}:${FORS_ADMIN_PORT:-9443}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Security__SecretsDirectory: /run/app-secrets
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/adminapi.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/adminapi.key
      OTEL_EXPORTER_OTLP_ENDPOINT: ${FORS_OTEL_ENDPOINT:-}
      OTEL_SERVICE_NAME: adminapi
      # Sign-in (docs/identity-and-roles.md, "Setup mode"): an empty value is unset, so the setup wizard's value applies,
      # else the code's default (client fors-admin, claims roles, departmentCodes, teamCodes, groups, no extra scope). A
      # set authority declares the sign-in and keeps the wizard closed.
      Oidc__Authority: ${FORS_OIDC_AUTHORITY:-}
      Oidc__ClientId: ${FORS_OIDC_CLIENT_ID:-}
      Oidc__RoleClaim: ${FORS_OIDC_ROLE_CLAIM:-}
      Oidc__DepartmentClaim: ${FORS_OIDC_DEPARTMENT_CLAIM:-}
      Oidc__TeamClaim: ${FORS_OIDC_TEAM_CLAIM:-}
      Oidc__GroupClaim: ${FORS_OIDC_GROUP_CLAIM:-}
      Oidc__ExtraScopes__0: ${FORS_OIDC_EXTRA_SCOPE:-}
      Oidc__RoleGroups__gateway-admin: ${FORS_OIDC_GROUPS_GATEWAY_ADMIN:-}
      Oidc__RoleGroups__department-admin: ${FORS_OIDC_GROUPS_DEPARTMENT_ADMIN:-}
      Oidc__RoleGroups__viewer: ${FORS_OIDC_GROUPS_VIEWER:-}
      Oidc__RoleGroups__team-admin: ${FORS_OIDC_GROUPS_TEAM_ADMIN:-}
      # A new value opens the setup wizard once more (the setup code's key is the file Setup__Secret the bootstrap writes).
      Setup__Reopen: ${FORS_SETUP_REOPEN:-}
      Gateway__BaseUrl: ${FORS_GATEWAY_PUBLIC_URL:-https://${FORS_GATEWAY_HOST:-${FORS_DOMAIN:+llm.}${FORS_DOMAIN:-}}}
      DataApi__PublicUrl: ${FORS_DATA_PUBLIC_URL:-}
      Gateway__OperationsUrl: https://gateway:8443
      # Integration API (/integration/v1): requests per minute per credential key.
      Admin__IntegrationRequestsPerMinute: ${FORS_INTEGRATION_REQUESTS_PER_MINUTE:-60}
      SSL_CERT_FILE: /run/certs/ca.pem
    volumes:
      - {<<: *certs-mount, volume: {subpath: adminapi}}
      - {<<: *secrets-mount, target: /run/app-secrets, volume: {subpath: adminapi}}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrations: {condition: service_completed_successfully}
    networks: [edge, data]
    healthcheck:
      test: [CMD, dotnet, Fors.AdminApi.dll, --health-check]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  # Optional read-only Data API for BI, management and security integrations (docs/data-access.md).
  # Started only with the "data" profile: COMPOSE_PROFILES=data (or --profile data).
  dataapi:
    <<: *hardened
    profiles: [data]
    image: ${DATAAPI_IMAGE:-ghcr.io/thekim1/fors/dataapi:0.12.1@sha256:7a46c610cf01ebaa43245d2c05837366f598fc0408449afecbe7961e6a427d05}
    user: "1654:1654"
    restart: unless-stopped
    ports: ["${FORS_DATA_BIND:-0.0.0.0}:${FORS_DATA_PORT:-10443}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Security__SecretsDirectory: /run/app-secrets
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/dataapi.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/dataapi.key
      # Not the setup wizard's authority: without either variable the Data API accepts only Data API keys.
      DataApi__Authority: ${FORS_DATA_AUTHORITY:-${FORS_OIDC_AUTHORITY:-}}
      DataApi__Audience: ${FORS_DATA_AUDIENCE:-fors-data-api}
      DataApi__MinimumGroupSize: ${FORS_DATA_MINIMUM_GROUP_SIZE:-5}
      DataApi__TimeZone: ${FORS_DATA_TIME_ZONE:-Europe/Stockholm}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${FORS_OTEL_ENDPOINT:-}
      OTEL_SERVICE_NAME: dataapi
      SSL_CERT_FILE: /run/certs/ca.pem
    volumes:
      - {<<: *certs-mount, volume: {subpath: dataapi}}
      - {<<: *secrets-mount, target: /run/app-secrets, volume: {subpath: dataapi}}
    depends_on:
      postgres: {condition: service_healthy}
      migrations: {condition: service_completed_successfully}
    networks: [edge, data]
    healthcheck:
      test: [CMD, dotnet, Fors.DataApi.dll, --health-check]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5

  kalla-bootstrap:
    image: docker.io/alpine/openssl@sha256:59c5cb51e536d40587667229468b007a2a6cae1705397e59e5f7774c08b74029
    restart: "no"
    entrypoint: [/bin/sh, /config/bootstrap.sh]
    environment:
      # The host names: each KALLA_*_HOST, else its default under FORS_DOMAIN (rag., rag-admin., chat.). Without the
      # domain the admin's name is empty (bootstrap.sh gives it kalla-api's) and so is Open WebUI's. kalla-api, kalla-admin and
      # kalla-openwebui repeat the same expressions below. With neither the domain nor kalla-api's name, that name is empty
      # and bootstrap.sh stops with "Set FORS_DOMAIN or KALLA_API_HOST" (never ":?" inside a default: some Compose
      # versions evaluate it even when the outer variable is set).
      KALLA_API_HOST: ${KALLA_API_HOST:-${FORS_DOMAIN:+rag.}${FORS_DOMAIN:-}}
      KALLA_ADMIN_HOST: ${KALLA_ADMIN_HOST:-${FORS_DOMAIN:+rag-admin.}${FORS_DOMAIN:-}}
      # The TLS proxy's host names (profile proxy): the gateway's two, by the expressions of the gateway's own bootstrap.
      FORS_GATEWAY_HOST: ${FORS_GATEWAY_HOST:-${FORS_DOMAIN:+llm.}${FORS_DOMAIN:-}}
      FORS_ADMIN_HOST: ${FORS_ADMIN_HOST:-${FORS_DOMAIN:+llm-admin.}${FORS_DOMAIN:-}}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      # The ports kalla-admin and the TLS proxy are published on, for the setup wizard's address in the checklist.
      KALLA_ADMIN_PORT: ${KALLA_ADMIN_PORT:-9543}
      KALLA_PROXY_PORT: ${KALLA_PROXY_PORT:-443}
      KALLA_API_GATEWAY_KEY: ${KALLA_API_GATEWAY_KEY:-}
      KALLA_ADMIN_GATEWAY_KEY: ${KALLA_ADMIN_GATEWAY_KEY:-}
      KALLA_WORKER_GATEWAY_KEY: ${KALLA_WORKER_GATEWAY_KEY:-}
      KALLA_OIDC_CLIENT_SECRET: ${KALLA_OIDC_CLIENT_SECRET:-}
      KALLA_OIDC_REFUSE_GUESTS: ${KALLA_OIDC_REFUSE_GUESTS:-}
      # For the checklist of what is still missing, which kalla-bootstrap prints at the end of its log; the authority as
      # kalla-admin gets it, to say whether the stack declares the sign-in.
      KALLA_OIDC_AUTHORITY: ${KALLA_OIDC_AUTHORITY:-${FORS_OIDC_AUTHORITY:-}}
      KALLA_API_PUBLIC_URL: ${KALLA_API_PUBLIC_URL:-}
      FORS_DOMAIN: ${FORS_DOMAIN:-}
      KALLA_OPENWEBUI_HOST: ${KALLA_OPENWEBUI_HOST:-${FORS_DOMAIN:+chat.}${FORS_DOMAIN:-}}
      KALLA_OPENWEBUI_OIDC_CLIENT_SECRET: ${KALLA_OPENWEBUI_OIDC_CLIENT_SECRET:-}
      # The retired variables this stack still sets (Decisions "Deployment values across releases"): each name whose
      # variable has a value, for kalla-bootstrap's checklist and Home's notice in the admin UI. No service reads their
      # values. A variable that is no longer read is added here and to bootstrap.sh's retired list in the same change.
      KALLA_RETIRED_SET: >-
        ${KALLA_ORG_SYNC_KEY:+KALLA_ORG_SYNC_KEY} ${KALLA_ORG_SYNC_URL:+KALLA_ORG_SYNC_URL}
        ${KALLA_OPENWEBUI_API_KEY:+KALLA_OPENWEBUI_API_KEY} ${KALLA_OPENWEBUI_CLIENT_ID:+KALLA_OPENWEBUI_CLIENT_ID}
        ${KALLA_OPENWEBUI_ADMIN_API_KEY:+KALLA_OPENWEBUI_ADMIN_API_KEY} ${KALLA_OPENWEBUI_PASSWORD_AUTH:+KALLA_OPENWEBUI_PASSWORD_AUTH}
        ${KALLA_OPENWEBUI_BASE_URL:+KALLA_OPENWEBUI_BASE_URL} ${KALLA_CLAMAV_MODE:+KALLA_CLAMAV_MODE}
        ${KALLA_EMBEDDING_MODEL:+KALLA_EMBEDDING_MODEL} ${KALLA_EMBEDDING_DIMENSIONS:+KALLA_EMBEDDING_DIMENSIONS}
        ${KALLA_EMBEDDING_REQUEST_DIMENSIONS:+KALLA_EMBEDDING_REQUEST_DIMENSIONS} ${KALLA_EMBEDDING_MAX_INPUT_TOKENS:+KALLA_EMBEDDING_MAX_INPUT_TOKENS}
        ${KALLA_EMBEDDING_MAX_RESIDENCY:+KALLA_EMBEDDING_MAX_RESIDENCY} ${KALLA_GATEWAY_MAX_RESIDENCY:+KALLA_GATEWAY_MAX_RESIDENCY}
        ${KALLA_OIDC_GROUPS_DEPARTMENT_ADMIN:+KALLA_OIDC_GROUPS_DEPARTMENT_ADMIN} ${KALLA_OIDC_GROUPS_PIPELINE_EDITOR:+KALLA_OIDC_GROUPS_PIPELINE_EDITOR}
        ${KALLA_OIDC_GROUPS_REVIEWER:+KALLA_OIDC_GROUPS_REVIEWER} ${KALLA_OIDC_GROUPS_VIEWER:+KALLA_OIDC_GROUPS_VIEWER}
        ${FORS_ORGANISATION_NAME:+FORS_ORGANISATION_NAME} ${KALLA_GATEWAY_INTEGRATION_API_URL:+KALLA_GATEWAY_INTEGRATION_API_URL}
    configs:
      - {source: kalla-bootstrap-script, target: /config/bootstrap.sh}
      - {source: kalla-postgres-init, target: /config/postgres-init.sql}
      - {source: kalla-postgres-hba, target: /config/pg_hba.conf}
      - {source: kalla-postgres-conf, target: /config/postgresql.conf}
      - {source: kalla-app-roles, target: /config/app-roles.sql}
      - {source: kalla-proxy-conf-template, target: /config/nginx-proxy.conf.template}
      - {source: kalla-openwebui-setup-script, target: /config/feedback-key-setup.py}
      - {source: kalla-openwebui-start-script, target: /config/start-with-sign-in.py}
    volumes:
      - kalla-certs:/certs
      - kalla-secrets:/secrets
      - kalla-config:/conf
      - kalla-blobs:/blobs
      - kalla-openwebui-data:/openwebui-data
      - {type: volume, source: fors-certs, target: /gateway-certs, read_only: true}
      # A stack from before the rename to Källa (0.8 and earlier): its rag-* volumes, read-only, which kalla-bootstrap
      # copies once into the kalla-* volumes (docs/upgrade-guide.md, "0.9.0"), and the new database volume to copy into.
      - kalla-postgres-data:/postgres-data
      - {type: volume, source: rag-certs, target: /legacy/certs, read_only: true}
      - {type: volume, source: rag-secrets, target: /legacy/secrets, read_only: true}
      - {type: volume, source: rag-blobs, target: /legacy/blobs, read_only: true}
      - {type: volume, source: rag-openwebui-data, target: /legacy/openwebui-data, read_only: true}
      - {type: volume, source: rag-postgres-data, target: /legacy/postgres-data, read_only: true}
      # The credential keys the gateway's migrations created from FORS_INTEGRATION_MANIFEST (M-17 C7).
      - {type: volume, source: integration-secrets, target: /integration-secrets, read_only: true}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      # The gateway's migrations write the manifest's keys before kalla-bootstrap copies them.
      migrations: {condition: service_completed_successfully}
    network_mode: none

  kalla-postgres:
    <<: *hardened
    image: ${KALLA_POSTGRES_IMAGE:-ghcr.io/thekim1/ume-rag/postgres:0.8.0@sha256:0aefe84f00b300ff677a4c33432dd01c368bb5e574540547b6c43b4538bec252}
    user: "999:999"
    restart: unless-stopped
    stop_grace_period: 60s
    tmpfs: [/tmp, "/var/run/postgresql:uid=999,gid=999,mode=0700"]
    shm_size: 1g
    cpus: 2.0
    mem_reservation: 2g
    mem_limit: 3g
    pids_limit: 512
    environment:
      POSTGRES_PASSWORD_FILE: /run/postgres-secrets/bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
    # deploy/postgres/postgresql.conf (16 GB profile), without WAL archiving: this stack has no pgBackRest repository.
    command: [postgres, -c, config_file=/run/config/postgresql.conf, -c, archive_mode=off]
    volumes:
      - kalla-postgres-data:/var/lib/postgresql/data
      - {<<: *kalla-conf-mount, target: /docker-entrypoint-initdb.d, volume: {subpath: postgres-init}}
      - {<<: *kalla-conf-mount, volume: {subpath: postgres}}
      - {<<: *kalla-certs-mount, volume: {subpath: postgres}}
      - {<<: *kalla-secrets-mount, target: /run/postgres-secrets, volume: {subpath: postgres}}
    depends_on:
      kalla-bootstrap: {condition: service_completed_successfully}
    networks: [kalla-data]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, ragdb]
      interval: 10s
      timeout: 5s
      retries: 12

  kalla-migrate:
    <<: *hardened
    image: ${KALLA_MIGRATIONS_IMAGE:-ghcr.io/thekim1/ume-rag/migrations:0.8.0@sha256:1592d00a6e6dfae7ea30dbfc5c34fea0adc26c508ea49f450a51c6725b378a45}
    user: "1654:1654"
    restart: "no"
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    environment:
      DOTNET_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Migration__RolesSqlPath: /run/config/app-roles.sql
      Seed__Enabled: "false"
      SSL_CERT_FILE: /run/certs/ca.pem
    volumes:
      - {<<: *kalla-conf-mount, volume: {subpath: migrations}}
      - {<<: *kalla-certs-mount, volume: {subpath: migrations}}
      - {<<: *kalla-secrets-mount, volume: {subpath: migrations}}
    depends_on:
      kalla-postgres: {condition: service_healthy}
    networks: [kalla-data]

  kalla-api:
    <<: *hardened
    image: ${KALLA_API_IMAGE:-ghcr.io/thekim1/ume-rag/api:0.8.0@sha256:89ff9d7746c44746c9e52cfba5e19b85bf6f66b52a6bc8b8b86fee79e174e86b}
    user: "1654:1654"
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: 2.0
    mem_reservation: 384m
    mem_limit: 1g
    pids_limit: 512
    ports: ["${KALLA_API_BIND:-0.0.0.0}:${KALLA_API_PORT:-8543}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      # The Open WebUI feedback key, minted by kalla-openwebui-setup into a directory of its own (M-17 C6).
      Security__ExtraSecretsDirectory: /run/openwebui-feedback
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/api.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/api.key
      Rag__Roles: knowledge,chat,mcp
      BlobStore__Root: /data/blobs/rag
      Gateway__BaseUrl: ${KALLA_GATEWAY_URL:-https://gateway:8443}
      # Citation links are absolute: the public host over HTTPS unless a URL is given (a port, a path).
      Knowledge__PublicBaseUrl: ${KALLA_API_PUBLIC_URL:-https://${KALLA_API_HOST:-${FORS_DOMAIN:+rag.}${FORS_DOMAIN:-}}}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${FORS_OTEL_ENDPOINT:-}
      # Traces: a share of the requests that start here (#503); a parent's decision wins.
      OTEL_TRACES_SAMPLER: ${FORS_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${FORS_OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_SERVICE_NAME: kalla-api
      SSL_CERT_FILE: /run/certs/ca.pem
      DOTNET_SHUTDOWNTIMEOUTSECONDS: "50"
      # Open WebUI (profile openwebui): its users are trusted for the deployment's own Open WebUI client, which kalla-migrate
      # registers (identity §5.2); the feedback import from it (chat §13.3) runs every 15 minutes. kalla-bootstrap writes the
      # secret file OpenWebUi__BaseUrl (the stack's kalla-openwebui, while the profile is on) and kalla-openwebui-setup
      # OpenWebUi__AdminApiKey; without both there is no import.
      # Open WebUI's sign-in settings, which kalla-api serves to its start (identity design §19): the deployment's values when
      # set (empty is unset; the client secret is the secret file OpenWebUi__Oidc__ClientSecret from kalla-bootstrap), else
      # the setup wizard's. The provider defaults to kalla-admin's authority, so kalla-api gets that authority too.
      Oidc__Authority: ${KALLA_OIDC_AUTHORITY:-${FORS_OIDC_AUTHORITY:-}}
      OpenWebUi__Oidc__ProviderUrl: ${KALLA_OPENWEBUI_OIDC_PROVIDER_URL:-}
      OpenWebUi__Oidc__ClientId: ${KALLA_OPENWEBUI_OIDC_CLIENT_ID:-}
      OpenWebUi__Oidc__ProviderName: ${KALLA_OPENWEBUI_OIDC_PROVIDER_NAME:-}
    volumes:
      - {<<: *kalla-certs-mount, volume: {subpath: api}}
      - {<<: *kalla-secrets-mount, volume: {subpath: api}}
      - {<<: *kalla-secrets-mount, target: /run/openwebui-feedback, volume: {subpath: openwebui-feedback}}
      - {<<: *kalla-secrets-mount, target: /run/keys, volume: {subpath: keys}}
      - {type: volume, source: kalla-blobs, target: /data/blobs, read_only: true}
    depends_on:
      kalla-postgres: {condition: service_healthy}
      kalla-migrate: {condition: service_completed_successfully}
      gateway: {condition: service_started}
    networks:
      kalla-edge: {}
      kalla-data: {}
      llm: {gw_priority: 1}
    healthcheck:
      test: [CMD, dotnet, Kalla.Api.dll, --health-check]
      interval: 30s        # a .NET process start each (~80 ms CPU, B-27 / #504)
      timeout: 10s
      start_period: 30s
      start_interval: 5s   # while starting, so up --wait and rolling updates don't wait 30 s
      retries: 3

  kalla-admin:
    <<: *hardened
    image: ${KALLA_ADMIN_IMAGE:-ghcr.io/thekim1/ume-rag/admin:0.8.0@sha256:d849f1028f57993cb71f4ed49fbed332438a8c8f19f7d4748a2a871ab040e532}
    user: "1654:1654"
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: 1.0
    mem_reservation: 256m
    mem_limit: 512m
    pids_limit: 256
    ports: ["${KALLA_ADMIN_BIND:-0.0.0.0}:${KALLA_ADMIN_PORT:-9543}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/admin.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/admin.key
      # Sign-in (identity design §19): each value set here is the deployment's and locks its field in the setup wizard;
      # an empty one is unset, so the wizard's value applies, else the code's default (client kalla-admin, the claims
      # roles, departmentCodes, teamCodes and groups, guests refused). The provider is the gateway's by default, with RAG's
      # own client (never the gateway's). With an authority and a client secret (the secret file Oidc__ClientSecret from
      # KALLA_OIDC_CLIENT_SECRET) the deployment declares its sign-in and the wizard never opens. KALLA_OIDC_REFUSE_GUESTS
      # is the secret file Oidc__RefuseGuests (kalla-bootstrap), since an empty boolean here would stop kalla-admin.
      Oidc__Authority: ${KALLA_OIDC_AUTHORITY:-${FORS_OIDC_AUTHORITY:-}}
      Oidc__ClientId: ${KALLA_OIDC_CLIENT_ID:-}
      Oidc__RoleClaim: ${KALLA_OIDC_ROLE_CLAIM:-}
      Oidc__DepartmentClaim: ${KALLA_OIDC_DEPARTMENT_CLAIM:-}
      Oidc__TeamClaim: ${KALLA_OIDC_TEAM_CLAIM:-}
      Oidc__GroupClaim: ${KALLA_OIDC_GROUP_CLAIM:-}
      Oidc__ExtraScopes__0: ${KALLA_OIDC_EXTRA_SCOPE:-}
      Oidc__RoleGroups__rag-platform-admin: ${KALLA_OIDC_GROUPS_PLATFORM_ADMIN:-}
      Oidc__TenantId: ${KALLA_OIDC_TENANT_ID:-}
      # A new value re-opens the setup wizard once (identity design §19); the setup secret is a file in kalla-secrets.
      Setup__Reopen: ${KALLA_SETUP_REOPEN:-}
      # Open WebUI's sign-in settings as kalla-api has them (a deployment value locks the wizard's field; the client secret is
      # the secret file OpenWebUi__Oidc__ClientSecret), and its address for the redirect URI the wizard names. Whether it
      # runs is the secret file OpenWebUi__Enabled, which kalla-bootstrap writes from the openwebui profile.
      OpenWebUi__Oidc__ProviderUrl: ${KALLA_OPENWEBUI_OIDC_PROVIDER_URL:-}
      OpenWebUi__Oidc__ClientId: ${KALLA_OPENWEBUI_OIDC_CLIENT_ID:-}
      OpenWebUi__Oidc__ProviderName: ${KALLA_OPENWEBUI_OIDC_PROVIDER_NAME:-}
      OpenWebUi__PublicUrl: https://${KALLA_OPENWEBUI_HOST:-${FORS_DOMAIN:+chat.}${FORS_DOMAIN:-localhost}}
      BlobStore__Root: /data/blobs/rag
      Gateway__BaseUrl: ${KALLA_GATEWAY_URL:-https://gateway:8443}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${FORS_OTEL_ENDPOINT:-}
      # Traces: a share of the requests that start here (#503); a parent's decision wins.
      OTEL_TRACES_SAMPLER: ${FORS_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${FORS_OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_SERVICE_NAME: kalla-admin
      # kalla-api's public address, shown to a platform admin who connects an app ("How to connect", admin design §5.9.1).
      Admin__ApiPublicUrl: ${KALLA_API_PUBLIC_URL:-https://${KALLA_API_HOST:-${FORS_DOMAIN:+rag.}${FORS_DOMAIN:-}}}
      # The gateway admin console's address for kalla-admin's links to it (the setup wizard's link to the gateway's wizard
      # among them), used while the gateway's context names none (FORS_ADMIN_PUBLIC_URL sets it there): its host name on
      # port 443, as behind the TLS proxy. On another port, set FORS_ADMIN_PUBLIC_URL. Empty (no links) when the admin has
      # no name of its own: without FORS_DOMAIN and FORS_ADMIN_HOST it shares the gateway's name on another port.
      Admin__GatewayAdminUrl: ${FORS_ADMIN_PUBLIC_URL:-${FORS_ADMIN_HOST:+https://}${FORS_ADMIN_HOST:-${FORS_DOMAIN:+https://llm-admin.}${FORS_DOMAIN:-}}}
      SSL_CERT_FILE: /run/certs/ca.pem
      DOTNET_SHUTDOWNTIMEOUTSECONDS: "50"
    volumes:
      - {<<: *kalla-certs-mount, volume: {subpath: admin}}
      - {<<: *kalla-secrets-mount, volume: {subpath: admin}}
      - {<<: *kalla-secrets-mount, target: /run/keys, volume: {subpath: keys}}
      - kalla-blobs:/data/blobs
    depends_on:
      kalla-postgres: {condition: service_healthy}
      kalla-migrate: {condition: service_completed_successfully}
    networks:
      kalla-edge: {}
      kalla-data: {}
      llm: {gw_priority: 1}
      # The gateway's adminapi, for its Integration API (https://adminapi:8443/integration/v1, FORS_INTEGRATION_API_URL).
      edge: {}
    healthcheck:
      test: [CMD, dotnet, Kalla.AdminApi.dll, --health-check]
      interval: 30s        # a .NET process start each (~80 ms CPU, B-27 / #504)
      timeout: 10s
      start_period: 30s
      start_interval: 5s   # while starting, so up --wait and rolling updates don't wait 30 s
      retries: 3

  kalla-worker:
    <<: *hardened
    image: ${KALLA_WORKER_IMAGE:-ghcr.io/thekim1/ume-rag/worker:0.8.0@sha256:10afeb408745fd24ffc87334b095626148efcbefc05cc422f0f7bbeef3531c06}
    user: "1654:1654"
    restart: unless-stopped
    stop_grace_period: 120s
    cpus: 1.5
    mem_reservation: 512m
    mem_limit: 1.5g
    pids_limit: 512
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/worker.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/worker.key
      Parser__BaseUrl: https://kalla-parser:8000
      # ClamAv__Mode is a secret file from kalla-bootstrap: on with the clamav profile (kalla-clamav runs), else off, which
      # stores files without a malware scan, marked so (#535). The worker reads it at start; the profiles here make a
      # change of them recreate the worker after kalla-bootstrap has written the new mode.
      KALLA_PROFILES: ${COMPOSE_PROFILES:-}
      ClamAv__Host: kalla-clamav
      ClamAv__Port: "3310"
      BlobStore__Root: /data/blobs/rag
      TMPDIR: /data/blobs/spool
      Gateway__BaseUrl: ${KALLA_GATEWAY_URL:-https://gateway:8443}
      Crawl__AllowedPrivateRanges: ${KALLA_CRAWL_ALLOW:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${FORS_OTEL_ENDPOINT:-}
      # Traces: a share of the requests that start here (#503); a parent's decision wins.
      OTEL_TRACES_SAMPLER: ${FORS_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${FORS_OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_SERVICE_NAME: kalla-worker
      SSL_CERT_FILE: /run/certs/ca.pem
    volumes:
      - {<<: *kalla-certs-mount, volume: {subpath: worker}}
      - {<<: *kalla-secrets-mount, volume: {subpath: worker}}
      - {<<: *kalla-secrets-mount, target: /run/keys, volume: {subpath: keys}}
      - kalla-blobs:/data/blobs
    depends_on:
      kalla-postgres: {condition: service_healthy}
      kalla-migrate: {condition: service_completed_successfully}
      # Started, not healthy: the parser warms up for minutes and freshclam's first download takes a while.
      kalla-parser: {condition: service_started}
      # Only with the clamav profile.
      kalla-clamav: {condition: service_started, required: false}
    # kalla-crawl holds the default route (the Internet); llm reaches the gateway.
    networks:
      kalla-data: {}
      llm: {}
      kalla-ingestion: {}
      kalla-parser: {}
      kalla-render: {}
      kalla-crawl: {gw_priority: 1}
    healthcheck:
      test: [CMD, dotnet, Kalla.Worker.dll, --health-check]
      interval: 30s        # a .NET process start each (~80 ms CPU, B-27 / #504)
      timeout: 10s
      start_period: 30s
      start_interval: 5s   # while starting, so up --wait and rolling updates don't wait 30 s
      retries: 3

  kalla-parser:
    <<: *hardened
    image: ${KALLA_PARSER_IMAGE:-ghcr.io/thekim1/ume-rag/parser:0.8.0@sha256:53c02f8203a729d96b79b463655067391e9d6290608ddbef2968f659de1b5a64}
    user: "10001:10001"
    restart: unless-stopped
    tmpfs: ["/tmp:size=1g"]
    cpus: 2.0
    mem_reservation: 2g
    mem_limit: 3.5g
    pids_limit: 256
    environment:
      PARSER_WORKERS: "1"
      PARSER_THREADS: "2"
      PARSER_SLOT_MAX_RSS_MB: "2200"
      PARSER_TLS_CERT_FILE: /run/certs/parser.crt
      PARSER_TLS_KEY_FILE: /run/certs/parser.key
    volumes:
      - {<<: *kalla-certs-mount, volume: {subpath: parser}}
    depends_on:
      kalla-bootstrap: {condition: service_completed_successfully}
    # Internal network only: no egress at all (parser design §11).
    networks: [kalla-parser]

  # The malware scan. Add clamav to COMPOSE_PROFILES; without it the worker stores files unscanned, marked so.
  kalla-clamav:
    <<: *hardened
    profiles: [clamav]
    image: ${KALLA_CLAMAV_IMAGE:-ghcr.io/thekim1/ume-rag/clamav:0.8.0@sha256:37c8f54dd2015e52ef04817a84616c0218d376eda5bb203cc1c764bfd731cbce}
    user: "1000:1000"
    restart: unless-stopped
    cpus: 1.0
    mem_reservation: 1.2g
    mem_limit: 1.5g
    pids_limit: 128
    volumes:
      - kalla-clamav-db:/var/lib/clamav
    # kalla-mirror: freshclam's download; kalla-ingestion: the worker's INSTREAM on 3310.
    networks: [kalla-ingestion, kalla-mirror]

  # Chromium for JavaScript-rendered pages (connectors design §8.3). Off by default: add render to COMPOSE_PROFILES.
  # Chromium's sandbox needs user namespaces, which Docker's default seccomp profile blocks, and Portainer cannot read
  # images/renderer/seccomp.json from a file, so this service runs without Docker's seccomp filter (Chromium's own
  # sandbox stays on). Without it, the worker refuses rendering and indexes the pages' HTML as served.
  kalla-renderer:
    <<: *hardened
    profiles: [render]
    image: ${KALLA_RENDERER_IMAGE:-ghcr.io/thekim1/ume-rag/renderer:0.8.0@sha256:1ed049a4b906e00c7aa044e397804bdfaaccac2b53a73ba85ee22e7e70675f99}
    user: "10002:10002"
    restart: unless-stopped
    security_opt: [no-new-privileges:true, seccomp=unconfined]
    init: true
    tmpfs: ["/tmp:size=512m"]
    cpus: 2.0
    mem_reservation: 256m
    mem_limit: 2g
    pids_limit: 512
    # The image reads its secret path only from the environment: read it from the volume, then start as the image does.
    entrypoint: [/bin/sh, -c, 'KALLA_RENDER_WS_PATH="$$(cat /run/render/ws-path)" exec /srv/renderer/start.sh']
    volumes:
      - {type: volume, source: kalla-secrets, target: /run/render, read_only: true, volume: {subpath: renderer}}
    depends_on:
      kalla-bootstrap: {condition: service_completed_successfully}
    networks: [kalla-render]

  kalla-openwebui:
    # Open WebUI as the users' chat (chat design §14), with the profile
    # openwebui. Plain HTTP for a TLS proxy in front; it calls kalla-api inside the stack, trusting RAG's CA through
    # openwebui/ca.pem (the public CAs, RAG's and the gateway's, from kalla-bootstrap).
    <<: *hardened
    profiles: [openwebui]
    # The pin also binds kalla-openwebui-setup, which forges an Open WebUI session token from its internals (the user and auth
    # tables, session_stamp, utils/auth.py's claims; M-17 C6): before the digest moves, deploy/tests/portainer-boot.sh must
    # pass with the new image (it checks the minted feedback key).
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded}
    user: "1000:1000"
    restart: unless-stopped
    tmpfs: [/tmp]
    cpus: 1.0
    cpu_shares: 512
    mem_reservation: 512m
    mem_limit: 1.5g
    pids_limit: 256
    ports: ["${KALLA_OPENWEBUI_BIND:-127.0.0.1}:${KALLA_OPENWEBUI_PORT:-3000}:8080"]
    # Open WebUI takes the user-JWT secret, the service account's password, its key for kalla-api and its OIDC settings only
    # from its environment. The start wrapper (deploy/openwebui/start-with-sign-in.py, from kalla-config) reads the three
    # files from the volume, asks kalla-api for the sign-in settings (identity design §19), starts Open WebUI as the image
    # does (bash start.sh in /app/backend) and exits when the settings change, so this restart policy starts it anew.
    entrypoint: [python3, -I, /config/start-with-sign-in.py, --secrets-dir, /run/owui-secrets, --, bash, start.sh]
    environment:
      KALLA_SIGN_IN_URL: https://kalla-api:8443/internal/openwebui/sign-in
      HOME: /tmp
      DATA_DIR: /data
      SSL_CERT_FILE: /run/owui-secrets/ca.pem
      REQUESTS_CA_BUNDLE: /run/owui-secrets/ca.pem
      WEBUI_SECRET_KEY_FILE: /run/owui-secrets/webui_secret_key
      WEBUI_URL: https://${KALLA_OPENWEBUI_HOST:-${FORS_DOMAIN:+chat.}${FORS_DOMAIN:-localhost}}
      WEBUI_SESSION_COOKIE_SECURE: "true"
      WEBUI_AUTH_COOKIE_SECURE: "true"
      OFFLINE_MODE: "true"
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: https://kalla-api:8443/v1
      OPENAI_API_CONFIGS: '{"0":{"headers":{"X-Rag-Owui-Message-Id":"{{MESSAGE_ID}}","X-Rag-Owui-User-Message-Id":"{{USER_MESSAGE_ID}}"}}}'
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      ENABLE_DIRECT_CONNECTIONS: "false"
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_CONTEXT_COMPACTION: "false"
      BYPASS_EMBEDDING_AND_RETRIEVAL: "true"
      DEFAULT_MODEL_METADATA: '{"capabilities":{"builtin_tools":false}}'
      ENABLE_WEB_SEARCH: "false"
      ENABLE_CODE_EXECUTION: "false"
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_IMAGE_GENERATION: "false"
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: "false"
      USER_PERMISSIONS_FEATURES_CODE_INTERPRETER: "false"
      USER_PERMISSIONS_FEATURES_IMAGE_GENERATION: "false"
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: "false"
      USER_PERMISSIONS_CHAT_WEB_UPLOAD: "false"
      USER_PERMISSIONS_CHAT_SYSTEM_PROMPT: "false"
      USER_PERMISSIONS_CHAT_PARAMS: "false"
      ENABLE_ADMIN_CHAT_ACCESS: "false"
      ENABLE_ADMIN_EXPORT: "false"
      WEBUI_BANNERS: '[{"id":"kalla-input","type":"warning","content":"Skriv inte in sekretessbelagda uppgifter eller känsliga personuppgifter.","dismissible":false,"timestamp":1793318400}]'
      ENABLE_API_KEYS: "true"
      ENABLE_API_KEYS_ENDPOINT_RESTRICTIONS: "true"
      API_KEYS_ALLOWED_ENDPOINTS: /api/v1/evaluations/feedbacks/list,/api/v1/evaluations/feedback
      USER_PERMISSIONS_FEATURES_API_KEYS: "false"
      # The feedback service account (Open WebUI's first user, never a person); its password comes from the volume.
      WEBUI_ADMIN_EMAIL: feedback-import@localhost
      WEBUI_ADMIN_NAME: Feedback import
      ENABLE_LOGIN_FORM: "false"
      ENABLE_PASSWORD_AUTH: "false"
      DEFAULT_USER_ROLE: user
      ENABLE_SIGNUP: "false"
      # ENABLE_OAUTH_SIGNUP, OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET, OPENID_PROVIDER_URL and OAUTH_PROVIDER_NAME come from the
      # start wrapper (kalla-api's sign-in settings), never from here.
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "false"
      OPENID_REDIRECT_URI: https://${KALLA_OPENWEBUI_HOST:-${FORS_DOMAIN:+chat.}${FORS_DOMAIN:-localhost}}/oauth/oidc/login/callback
    volumes:
      - kalla-openwebui-data:/data
      - {type: volume, source: kalla-secrets, target: /run/owui-secrets, read_only: true, volume: {subpath: openwebui}}
      # Its start wrapper, which kalla-bootstrap copies into kalla-config: an inline config can't be read by a read-only container's user.
      - {type: volume, source: kalla-config, target: /config, read_only: true, volume: {subpath: openwebui}}
    depends_on:
      kalla-bootstrap: {condition: service_completed_successfully}
      kalla-api: {condition: service_started}
    networks: [kalla-edge]

  kalla-proxy:
    # Profile proxy (M-17 C8, Decisions "Deploy configuration" D9): TLS for the five host names with the operator's
    # certificate, re-encrypting to the services and verifying them against the internal CAs. kalla-bootstrap writes its
    # nginx.conf (deploy/proxy/nginx.portainer.conf.template) and the two CA certificates into kalla-config/proxy.
    <<: *hardened
    profiles: [proxy]
    # nginx 1.31.6, as the browser tests' fixture site (src/Kalla.AppHost); the index digest.
    image: ${KALLA_PROXY_IMAGE:-docker.io/nginxinc/nginx-unprivileged:1.31.6-alpine@sha256:884e0b7f42f303641b0f4e78755aea647521dca0b89ca3be7992ad78b5c07434}
    user: "101:101"
    restart: unless-stopped
    command: [nginx, -c, /etc/nginx/kalla/nginx.conf, -g, "daemon off;"]
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 128
    ports: ["${KALLA_PROXY_BIND:-0.0.0.0}:${KALLA_PROXY_PORT:-443}:8443"]
    volumes:
      - {type: volume, source: kalla-config, target: /etc/nginx/kalla, read_only: true, volume: {subpath: proxy}}
      # The operator's certificate: a host directory, not created when missing (the container then does not start).
      - type: bind
        source: ${KALLA_PROXY_CERTS_DIR:-/etc/kalla/proxy-certs}
        target: /run/proxy-certs
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      kalla-bootstrap: {condition: service_completed_successfully}
      gateway: {condition: service_started}
      adminapi: {condition: service_started}
      kalla-api: {condition: service_started}
      kalla-admin: {condition: service_started}
    networks: [edge, kalla-edge]

  kalla-openwebui-setup:
    # One-shot, profile openwebui (M-17 C6): the feedback service account's API key for kalla-api's import, minted with a
    # short session token signed with Open WebUI's secret key, since password sign-in is off (deploy/openwebui/
    # feedback-key-setup.py). It runs Open WebUI's own image as Open WebUI's user, reads the account from its store and
    # writes only kalla-secrets/openwebui-feedback, which kalla-api reads; a key that still works is kept.
    <<: *hardened
    profiles: [openwebui]
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded}
    user: "1000:1000"
    restart: "no"
    entrypoint: [python3, -I, /config/feedback-key-setup.py]
    environment:
      OWUI_URL: http://kalla-openwebui:8080
      WEBUI_ADMIN_EMAIL: feedback-import@localhost
    volumes:
      # Its script, which kalla-bootstrap copies into kalla-config: an inline config can't be written into a read-only container.
      - {type: volume, source: kalla-config, target: /config, read_only: true, volume: {subpath: openwebui-setup}}
      # The store's WAL needs its directory writable even for a read-only connection.
      - kalla-openwebui-data:/data
      - {type: volume, source: kalla-secrets, target: /run/owui-secrets, read_only: true, volume: {subpath: openwebui}}
      - {type: volume, source: kalla-secrets, target: /run/feedback, volume: {subpath: openwebui-feedback}}
    depends_on:
      kalla-openwebui: {condition: service_started}
    networks: [kalla-edge]

configs:
  bootstrap-script:
    content: |
      #!/bin/sh
      # One-shot bootstrap for compose.portainer.yaml: creates the internal CA, service certificates,
      # Data Protection certificate, passwords, key pepper, the admin API's setup secret and Redis ACL in the fors-certs /
      # fors-secrets volumes. Idempotent: existing secrets are never overwritten (a new pepper or Data Protection
      # certificate would break existing data); service certificates are re-issued when they expire
      # within 30 days or the hostnames change. Inputs come from environment variables; the host names arrive resolved from
      # the stack file (FORS_DOMAIN's defaults unless a FORS_*_HOST is set). Its last lines say how sign-in is set up: declared
      # by the stack's FORS_OIDC_AUTHORITY, or in the setup wizard.
      set -eu
      umask 077
      C=/certs
      S=/secrets
      : "$${FORS_GATEWAY_HOST:?Set FORS_DOMAIN or FORS_GATEWAY_HOST (public hostname of the gateway API)}"
      ADMIN_HOST="$${FORS_ADMIN_HOST:-$$FORS_GATEWAY_HOST}"
      DATA_HOST="$${FORS_DATA_HOST:-$$FORS_GATEWAY_HOST}"
      # A stack from before the rename to Fors kept its certificates and secrets in the volumes ume-certs and ume-secrets:
      # they are copied once, before anything is generated, so the key pepper and the Data Protection certificate carry over
      # (a new pepper would invalidate every key). Until 0.13.
      if [ ! -f "$$S/.pepper" ] && [ -f /legacy-secrets/.pepper ]; then
        echo "bootstrap: copying the certificates and secrets from the volumes ume-certs and ume-secrets (upgrade to Fors 0.12)"
        cp -a /legacy-certs/. "$$C/"
        cp -a /legacy-secrets/. "$$S/"
      fi
      for d in postgres redis gateway adminapi dataapi migrations; do mkdir -p "$$C/$$d" "$$S/$$d"; done
      rand() { openssl rand -hex 32; }
      quiet() { "$$@" >/dev/null 2>&1; }

      # A CA from an earlier version has no keyUsage, which strict clients (Python 3.13, newer Go and Java) refuse: it is
      # replaced, and every certificate it issued is re-issued below because it no longer verifies.
      if [ -f "$$C/ca.pem" ] && ! openssl x509 -noout -text -in "$$C/ca.pem" | grep -q "X509v3 Key Usage"; then
        echo "bootstrap: replacing the internal CA (no keyUsage)"
        mv "$$C/ca.pem" "$$C/ca.pem.old"; rm -f "$$C/ca.key"
      fi
      if [ ! -f "$$C/ca.pem" ]; then
        quiet openssl req -x509 -newkey rsa:3072 -nodes -keyout "$$C/ca.key" -out "$$C/ca.pem" -days 3650 -subj /CN=fors-gateway-internal-ca \
          -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
      fi

      # issue SERVICE SAN-LIST: (re)issue unless a valid certificate for exactly these names, from the current CA, exists
      issue() {
        svc="$$1"; san="$$2"; dir="$$C/$$svc"
        if [ -f "$$dir/$$svc.crt" ] && [ "$$(cat "$$dir/.san" 2>/dev/null)" = "$$san" ] &&
           quiet openssl x509 -checkend 2592000 -noout -in "$$dir/$$svc.crt" && quiet openssl verify -CAfile "$$C/ca.pem" "$$dir/$$svc.crt"; then
          return
        fi
        echo "bootstrap: issuing certificate for $$svc ($$san)"
        quiet openssl req -newkey rsa:3072 -nodes -keyout "$$dir/$$svc.key" -out "/tmp/$$svc.csr" -subj "/CN=$$svc"
        printf 'subjectAltName=%s\nextendedKeyUsage=serverAuth\nkeyUsage=critical,digitalSignature,keyEncipherment\nsubjectKeyIdentifier=hash\nauthorityKeyIdentifier=keyid\n' \
          "$$san" > "/tmp/$$svc.ext"
        quiet openssl x509 -req -in "/tmp/$$svc.csr" -CA "$$C/ca.pem" -CAkey "$$C/ca.key" -CAcreateserial -CAserial /tmp/ca.srl \
          -out "$$dir/$$svc.crt" -days 825 -extfile "/tmp/$$svc.ext"
        printf '%s' "$$san" > "$$dir/.san"
      }
      issue postgres "DNS:postgres,DNS:localhost"
      issue redis "DNS:redis,DNS:localhost"
      issue gateway "DNS:gateway,DNS:localhost,DNS:$$FORS_GATEWAY_HOST"
      issue adminapi "DNS:adminapi,DNS:localhost,DNS:$$ADMIN_HOST"
      issue dataapi "DNS:dataapi,DNS:localhost,DNS:$$DATA_HOST"

      if [ ! -f "$$C/data-protection.pfx" ]; then
        quiet openssl req -x509 -newkey rsa:3072 -nodes -keyout /tmp/dp.key -out /tmp/dp.crt -days 3650 -subj /CN=fors-gateway-data-protection
        quiet openssl pkcs12 -export -inkey /tmp/dp.key -in /tmp/dp.crt -out "$$C/data-protection.pfx" -passout pass:
      fi
      for d in gateway adminapi migrations; do cp "$$C/data-protection.pfx" "$$C/$$d/data-protection.pfx"; done
      for d in postgres redis gateway adminapi dataapi migrations; do cp "$$C/ca.pem" "$$C/$$d/ca.pem"; done

      for role in bootstrap migrator gateway admin data; do
        [ -f "$$S/postgres/$${role}_password" ] || rand > "$$S/postgres/$${role}_password"
      done
      [ -f "$$S/redis/redis_password" ] || rand > "$$S/redis/redis_password"
      # The ACL is derived (password hash + the template's command list), so it is rewritten on every start: an upgrade that
      # allows the gateway a new Redis command reaches existing deployments with a redeploy.
      hash="$$(tr -d '\n' < "$$S/redis/redis_password" | openssl dgst -sha256 | awk '{print $$NF}')"
      sed "s/REPLACE_WITH_SHA256_PASSWORD_HASH/$$hash/" /config/users.acl.example > "$$S/redis/users.acl"
      [ -f "$$S/.pepper" ] || openssl rand -hex 48 > "$$S/.pepper"
      for svc in gateway adminapi migrations; do
        role="$$svc"; case "$$svc" in adminapi) role=admin;; migrations) role=migrator;; esac
        printf '%s' "$$(cat "$$S/.pepper")" > "$$S/$$svc/Security__KeyPepper"
        printf 'Host=postgres;Database=gatewaydb;Username=fors_%s;Password=%s;SSL Mode=VerifyFull;Root Certificate=/run/certs/ca.pem;GSS Encryption Mode=Disable' \
          "$$role" "$$(cat "$$S/postgres/$${role}_password")" > "$$S/$$svc/ConnectionStrings__gatewaydb"
        if [ "$$svc" != migrations ]; then
          printf 'redis:6379,user=gateway,password=%s,ssl=true,sslHost=redis,abortConnect=false' \
            "$$(cat "$$S/redis/redis_password")" > "$$S/$$svc/ConnectionStrings__redis"
        fi
      done
      # Data API (optional, profile "data"): read-only role, no pepper, no Redis.
      printf 'Host=postgres;Database=gatewaydb;Username=fors_data;Password=%s;SSL Mode=VerifyFull;Root Certificate=/run/certs/ca.pem;GSS Encryption Mode=Disable' \
        "$$(cat "$$S/postgres/data_password")" > "$$S/dataapi/ConnectionStrings__gatewaydb"
      # The admin API's setup secret: the setup code is derived from it (docs/identity-and-roles.md, "Setup mode"). Kept, but
      # not worth backing up: a new one only changes the setup codes printed from then on.
      [ -f "$$S/adminapi/Setup__Secret" ] || rand | tr -d '\n' > "$$S/adminapi/Setup__Secret"
      # Confidential OIDC client (optional); the file follows the variable, so removing it clears the secret. Only with the
      # stack's authority: a deployment client secret goes only to the deployment's own provider, so without one it would make
      # every test sign-in of the setup wizard fail (deployment_secret_without_authority).
      notes=""
      note() { notes="$$notes
      bootstrap: $$*"; }
      if [ -n "$${FORS_OIDC_CLIENT_SECRET:-}" ] && [ -n "$${FORS_OIDC_AUTHORITY:-}" ]; then
        printf '%s' "$$FORS_OIDC_CLIENT_SECRET" > "$$S/adminapi/Oidc__ClientSecret"
      else
        rm -f "$$S/adminapi/Oidc__ClientSecret"
        [ -z "$${FORS_OIDC_CLIENT_SECRET:-}" ] || note "FORS_OIDC_CLIENT_SECRET is left out: it is used only with FORS_OIDC_AUTHORITY. Set the authority too, or remove the secret and enter it in the setup wizard"
      fi
      # An example value left in a sign-in variable declares a wrong provider or secret, and the wizard stays closed.
      case "$${FORS_OIDC_AUTHORITY:-}" in
        "" | https://*) ;;
        *) note "FORS_OIDC_AUTHORITY must be the https URL of your OIDC provider (the admin API refuses to start with it)" ;;
      esac
      case "$${FORS_OIDC_AUTHORITY:-}$${FORS_OIDC_CLIENT_SECRET:-}" in
        *example.se* | *example.com* | *CHANGE*) note "FORS_OIDC_AUTHORITY or FORS_OIDC_CLIENT_SECRET still holds an example value: set the real one, or remove both for the setup wizard" ;;
      esac

      # Static configuration files (services run read-only, so they get them from a volume).
      F=/conf
      mkdir -p "$$F/postgres-init" "$$F/postgres" "$$F/redis" "$$F/migrations" "$$F/migrations/integration-manifests"
      # Integration manifest (optional): rewritten from the variable on every start, so removing it provisions nothing more.
      rm -f "$$F/migrations/integration-manifests/"*.json
      if [ -n "$${FORS_INTEGRATION_MANIFEST:-}" ]; then
        printf '%s' "$$FORS_INTEGRATION_MANIFEST" > "$$F/migrations/integration-manifests/manifest.json"
      fi
      cp /config/postgres-init.sql "$$F/postgres-init/10-roles.sql"
      cp /config/pg_hba.conf "$$F/postgres/pg_hba.conf"
      cp /config/redis.conf "$$F/redis/redis.conf"
      cp /config/app-roles.sql "$$F/migrations/app-roles.sql"
      chmod -R a+rX "$$F"

      chown -R 70:70 "$$C/postgres" "$$S/postgres"
      chown -R 999:999 "$$C/redis" "$$S/redis"
      chown -R 1654:1654 "$$C/gateway" "$$C/adminapi" "$$C/dataapi" "$$C/migrations" "$$S/gateway" "$$S/adminapi" "$$S/dataapi" "$$S/migrations"
      chmod 755 "$$C" "$$S"
      # Secrets of credential keys created from the manifest: the migration service writes them, a platform's bootstrap reads them.
      chown 1654:1654 /integration-secrets && chmod 700 /integration-secrets
      echo "bootstrap: certificates and secrets ready"
      # How sign-in is set up. The bootstrap has no network and cannot see whether setup was finished, so this is printed on
      # every run.
      if [ -n "$${FORS_OIDC_AUTHORITY:-}" ]; then
        echo "bootstrap: sign-in to the admin console is declared by the stack's variables (FORS_OIDC_AUTHORITY), so the setup wizard stays closed: sign in at https://$$ADMIN_HOST:$${FORS_ADMIN_PORT:-9443}/ (behind a reverse proxy https://$$ADMIN_HOST/)"
      else
        echo "bootstrap: sign-in to the admin console is set in the setup wizard: https://$$ADMIN_HOST:$${FORS_ADMIN_PORT:-9443}/setup (behind a reverse proxy https://$$ADMIN_HOST/setup), with the setup code from the adminapi container's log (printed at its first start, and after a new FORS_SETUP_REOPEN); skip this if you can already sign in"
      fi
      case ",$${COMPOSE_PROFILES:-}," in
        *,data,*) [ -n "$${FORS_DATA_AUTHORITY:-}$${FORS_OIDC_AUTHORITY:-}" ] ||
          note "the Data API has no token issuer (FORS_DATA_AUTHORITY, else FORS_OIDC_AUTHORITY), so it accepts only Data API keys; the setup wizard's provider does not apply to it" ;;
      esac
      [ -z "$$notes" ] || printf '%s\n' "$${notes#?}"
  redis-acl-template:
    content: |
      user default off
      user gateway on #REPLACE_WITH_SHA256_PASSWORD_HASH ~fors:* &fors:invalidate -@all +auth +hello +ping +echo +quit +client|setname +client|setinfo +client|id +info +get +mget +set +setex +psetex +incr +incrby +decr +decrby +expire +pexpire +del +zadd +zrem +zcard +zremrangebyscore +zrangebyscore +eval +evalsha +script|load +publish +subscribe +unsubscribe
  redis-conf:
    content: |
      bind 0.0.0.0
      protected-mode yes
      port 0
      tls-port 6379
      tls-cert-file /run/certs/redis.crt
      tls-key-file /run/certs/redis.key
      tls-ca-cert-file /run/certs/ca.pem
      tls-auth-clients no
      aclfile /run/redis-secrets/users.acl
      save ""
      appendonly no
      loglevel warning
  postgres-init:
    content: |
      SET log_statement = 'none';
      DO $$$$
      BEGIN
        EXECUTE format('CREATE ROLE fors_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
          btrim(pg_read_file('/run/postgres-secrets/migrator_password'), E'\r\n '));
        EXECUTE format('CREATE ROLE fors_gateway LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
          btrim(pg_read_file('/run/postgres-secrets/gateway_password'), E'\r\n '));
        EXECUTE format('CREATE ROLE fors_admin LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
          btrim(pg_read_file('/run/postgres-secrets/admin_password'), E'\r\n '));
        -- Read-only role for the optional Data API (docs/data-access.md); only when a password was provisioned.
        -- Test one field: a record IS NOT NULL only when every field is, and some are always null on Linux.
        IF (pg_stat_file('/run/postgres-secrets/data_password', true)).size IS NOT NULL THEN
          EXECUTE format('CREATE ROLE fors_data LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
            btrim(pg_read_file('/run/postgres-secrets/data_password'), E'\r\n '));
        END IF;
        -- Optional Keycloak (deploy/keycloak, docs/keycloak.md): its own role and database, only when provisioned.
        IF (pg_stat_file('/run/postgres-secrets/keycloak_password', true)).size IS NOT NULL THEN
          EXECUTE format('CREATE ROLE fors_keycloak LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
            btrim(pg_read_file('/run/postgres-secrets/keycloak_password'), E'\r\n '));
        END IF;
      END $$$$;
      SELECT 'CREATE DATABASE keycloak OWNER fors_keycloak' WHERE EXISTS (SELECT FROM pg_roles WHERE rolname = 'fors_keycloak')\gexec
      CREATE DATABASE gatewaydb OWNER fors_migrator;
      REVOKE ALL ON DATABASE gatewaydb FROM PUBLIC;
      GRANT CONNECT ON DATABASE gatewaydb TO fors_gateway, fors_admin;
      \connect gatewaydb
      REVOKE ALL ON SCHEMA public FROM PUBLIC;
      ALTER SCHEMA public OWNER TO fors_migrator;
      GRANT USAGE ON SCHEMA public TO fors_gateway, fors_admin;
      DO $$$$
      BEGIN
        IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'fors_data') THEN
          GRANT CONNECT ON DATABASE gatewaydb TO fors_data;
          GRANT USAGE ON SCHEMA public TO fors_data;
        END IF;
      END $$$$;
  postgres-hba:
    content: |
      local all all scram-sha-256
      hostnossl all all all reject
      hostssl gatewaydb fors_migrator,fors_gateway,fors_admin,fors_data all scram-sha-256
      # Optional Keycloak (deploy/keycloak): its own database only.
      hostssl keycloak fors_keycloak all scram-sha-256
  app-roles:
    content: |
      -- Applied by the migration service on every start. The service roles' table privileges are revoked and granted again in
      -- one transaction, so each role holds exactly what this file lists (a privilege removed here is removed from existing
      -- installations too) and running services see either the old or the new grants, never none. Tables are named one by
      -- one: a new table is readable by no service until it is added here (DatabaseRoleTests checks the effective grants).
      -- No curly braces: the migration service runs this file with EF Core's ExecuteSqlRaw, which reads them as placeholders.
      BEGIN;
      REVOKE ALL ON ALL TABLES IN SCHEMA public FROM fors_gateway, fors_admin;
      REVOKE ALL ON ALL SEQUENCES IN SCHEMA public FROM fors_gateway, fors_admin;
      GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO fors_gateway, fors_admin;

      -- The settings row exists before any service runs, so the admin role needs no INSERT on it (an insert could set
      -- UsageRetainedFrom, which only the retention function may move).
      INSERT INTO "GatewaySettings" ("Id", "TrustedProxies", "AuditRetentionDays") VALUES (1, ARRAY[]::text[], 365) ON CONFLICT ("Id") DO NOTHING;
      -- The same for the admin console's branding (organisation name and logo; the name's default is the column default).
      INSERT INTO "Branding" ("Id") VALUES (1) ON CONFLICT ("Id") DO NOTHING;
      -- And for the admin console's stored sign-in values (all unset until setup mode stores them).
      INSERT INTO "SignInSettings" ("Id", "ExtraScopes") VALUES (1, ARRAY[]::text[]) ON CONFLICT ("Id") DO NOTHING;

      -- Gateway (faces the clients): what it authenticates, routes and accounts with. Not the audit log or Data API keys. It reads
      -- the Data Protection key ring but does not add keys (it only decrypts; the admin API creates and rotates them).
      GRANT SELECT ON "Departments", "Teams", "VirtualKeys", "Integrations", "ProviderAccounts", "ModelDeployments", "ModelPrices",
        "RouteAliases", "RouteTargets", "RoutingRules", "RoutingRuleTargets", "Budgets", "GatewaySettings",
        "UsageRecords", "UsageMonthlyTotals", "AlertEvents", "AuthFailures", "DataProtectionKeys" TO fors_gateway;
      GRANT INSERT ON "UsageRecords", "AlertEvents", "AuthFailures" TO fors_gateway;
      GRANT UPDATE ("LastUsedAt") ON "VirtualKeys" TO fors_gateway;
      -- The organisation's name for integrations' context; never the logo.
      GRANT SELECT ("OrganisationName") ON "Branding" TO fors_gateway;
      -- The sign-in provider's address for integrations' context; never the client id or the encrypted client secret.
      GRANT SELECT ("Authority") ON "SignInSettings" TO fors_gateway;

      -- Admin API: reads everything it shows (and the schema version for Operations); changes configuration, appends audit
      -- entries, creates Data Protection keys. Settings column by column, without UsageRetainedFrom.
      GRANT SELECT ON "Departments", "Teams", "VirtualKeys", "Integrations", "DataApiKeys", "ProviderAccounts", "ModelDeployments", "ModelPrices",
        "RouteAliases", "RouteTargets", "RoutingRules", "RoutingRuleTargets", "Budgets", "GatewaySettings",
        "UsageRecords", "UsageMonthlyTotals", "AuditLog", "AlertEvents", "AuthFailures", "DataProtectionKeys",
        "Branding", "SignInSettings", "SetupSessions", "SetupTests", "__EFMigrationsHistory" TO fors_admin;
      GRANT INSERT, UPDATE, DELETE ON "Departments", "Teams", "VirtualKeys", "Integrations", "ProviderAccounts",
        "ModelDeployments", "ModelPrices", "RouteAliases", "RouteTargets", "RoutingRules", "RoutingRuleTargets",
        "Budgets", "DataApiKeys" TO fors_admin;
      GRANT UPDATE ("TrustedProxies", "LogAllRequests", "LogAllRequestsUntil", "UpdatedAt", "UsageRetentionDays", "AuditRetentionDays",
        "RetentionLastRunAt", "RetentionLastRunDeleted", "RetentionLastRunError") ON "GatewaySettings" TO fors_admin;
      GRANT UPDATE ("OrganisationName", "Logo", "LogoContentType", "UpdatedAt") ON "Branding" TO fors_admin;
      GRANT UPDATE ("Authority", "ClientId", "RoleClaim", "DepartmentClaim", "TeamClaim", "GroupClaim", "ExtraScopes", "EncryptedClientSecret",
        "ClientSecretSetAt", "ClientSecretExpiresOn", "UpdatedAt", "SetupCompletedAt", "SetupNonce", "SetupOpenedAt", "SetupReopenConsumed")
        ON "SignInSettings" TO fors_admin;
      -- Setup mode's short-lived sessions and test sign-ins (deleted when their opening ends).
      GRANT INSERT, UPDATE, DELETE ON "SetupSessions", "SetupTests" TO fors_admin;
      GRANT INSERT ON "AuditLog", "DataProtectionKeys" TO fors_admin;
      GRANT UPDATE ("Acknowledged") ON "AlertEvents" TO fors_admin;
      -- Data retention: old rows are removed only through this function (owner's rights, minimum 90 days); the admin role
      -- has no DELETE on usage, refused-credential, alert or audit rows.
      GRANT EXECUTE ON FUNCTION fors_retention_step(integer) TO fors_admin;
      -- Data API (optional): read-only, and column by column where a table holds secrets, so the role cannot
      -- read key hashes, encrypted key secrets or provider credentials even through a bug. Skipped while the
      -- role does not exist (it is created by init.sql on new installs; see docs/upgrade-guide.md for existing ones).
      DO $$$$
      BEGIN
        IF EXISTS (SELECT FROM pg_roles WHERE rolname = 'fors_data') THEN
          GRANT CONNECT ON DATABASE gatewaydb TO fors_data;
          GRANT USAGE ON SCHEMA public TO fors_data;
          GRANT SELECT ON "UsageRecords", "AuthFailures", "AuditLog", "Departments", "Teams", "ModelDeployments",
            "ModelPrices", "Budgets", "UsageMonthlyTotals" TO fors_data;
          GRANT SELECT ("UsageRetainedFrom") ON "GatewaySettings" TO fors_data;
          GRANT SELECT ("Id", "TeamId", "Name", "Description", "Prefix", "IsEnabled", "CreatedAt", "CreatedBy", "ExpiresAt",
            "RevokedAt", "GraceUntil", "RotatedToKeyId", "LastUsedAt", "AllowedModels", "AllowedResidencies", "AllowedProviders",
            "AllowedIpRanges", "PiiPolicy", "AttachmentPolicy", "RequestsPerMinute", "TokensPerMinute", "AllowProviderTools",
            "AllowProviderStorage", "MaxConcurrentRequests", "IntegrationId", "IntegrationRole") ON "VirtualKeys" TO fors_data;
          GRANT SELECT ("Id", "Name", "DisplayName", "Type", "Residency", "IsEnabled") ON "ProviderAccounts" TO fors_data;
          -- Its own credentials: the key hash (SHA-256 of a 256-bit random key) to authenticate Data API keys, and the
          -- only column it may write, the approximate last use.
          GRANT SELECT ("Id", "Name", "Prefix", "KeyHash", "Permissions", "ExpiresAt", "RevokedAt", "LastUsedAt") ON "DataApiKeys" TO fors_data;
          GRANT UPDATE ("LastUsedAt") ON "DataApiKeys" TO fors_data;
        END IF;
      END $$$$;
      COMMIT;
  kalla-bootstrap-script:
    content: |
      #!/bin/sh
      # One-shot bootstrap of the RAG part of compose.portainer.yaml (the gateway's stack plus RAG, one Portainer stack).
      # The bootstrap of every deployment form (below), after the gateway's deploy/portainer/bootstrap.sh: creates
      # RAG's internal CA, its service certificates, the Data Protection certificate, the database passwords, the key pepper,
      # the api's keys, kalla-admin's setup secret, the worker's crawl key pepper, the renderer's WebSocket path and the blob
      # master key in the kalla-certs and kalla-secrets volumes, and copies the static configuration into kalla-config. Idempotent:
      # existing secrets are never overwritten (a new pepper, key or Data Protection certificate would break existing data);
      # service certificates are re-issued when they expire within 30 days or their host names change (the checklist at the
      # end names the services to restart, and every certificate that expires within 60 days). Files that follow a variable
      # (the gateway credential keys, also taken from the gateway's manifest secrets; the OIDC client secrets and refusing
      # guests, when the stack declares its sign-in instead of the setup wizard; the names of the retired variables the stack
      # still sets) are written again on every start, and removed when the variable is empty.
      #
      # Trust: the services that call out (kalla-api, kalla-admin, kalla-worker) trust RAG's CA plus the gateway's (its fors-certs
      # volume, mounted at /gateway-certs), so https://gateway:8443 verifies, and every *.pem in /trust (an operator's CA
      # for a gateway or a sign-in provider elsewhere).
      #
      # The one bootstrap of every deployment form (Decisions "One deployment bootstrap"): the Portainer stack and Compose
      # run it as the kalla-bootstrap service, and deploy/kubernetes/create-secrets.sh runs it on the operator's machine. What
      # differs between them comes in these variables; unset, each has the stack's value:
      #   KALLA_BOOTSTRAP_CERTS, _SECRETS, _CONF   where it writes (/certs, /secrets, /conf); an empty _CONF writes no
      #                                              static configuration
      #   KALLA_BOOTSTRAP_CONFIG                   where the static configuration is read from (/config)
      #   KALLA_BOOTSTRAP_GATEWAY_CERTS            the directory with the gateway's ca.pem (/gateway-certs);
      #   KALLA_BOOTSTRAP_GATEWAY_CA=optional      a missing one is then no error (a gateway with a public certificate)
      #   KALLA_BOOTSTRAP_TRUST                    more CA certificates to trust, *.pem (/trust); kalla-migrate gets them
      #                                              too (a database with a certificate from another CA)
      #   KALLA_BOOTSTRAP_INTEGRATION_SECRETS      the gateway's manifest keys (/integration-secrets)
      #   KALLA_BOOTSTRAP_PKI                      the operator's own certificates for the public listeners: api.crt and
      #                                              api.key, admin.crt and admin.key (/pki); a pair found there is used
      #                                              instead of one from the internal CA
      #   KALLA_BOOTSTRAP_OWN=no                   leave every file owned by the caller and create no blob directories
      #                                              (Kubernetes: the files become secrets, never mounts)
      #   KALLA_POSTGRES_HOST                      the database's host name in its certificate and the connection strings
      #                                              (kalla-postgres)
      #   KALLA_BACKUP_TARGET                      a pgBackRest repository: s3://ENDPOINT/BUCKET[/PATH] (with
      #                                              KALLA_BACKUP_S3_KEY, KALLA_BACKUP_S3_KEY_SECRET and
      #                                              KALLA_BACKUP_S3_REGION, default us-east-1), or anything else for a
      #                                              posix repository at /var/lib/pgbackrest. Unset (the Portainer stack):
      #                                              no repository settings
      # And what only a Compose host without the gateway in its stack has (deploy/compose.rag.yaml and its overlays); unset,
      # nothing of it happens:
      #   KALLA_BOOTSTRAP_PROXY_GATEWAY=no         the TLS proxy has no blocks for the gateway and its admin
      #   KALLA_HOST_MEMORY=24                     the 24 GB host's Postgres memory settings in kalla-config's
      #                                              postgresql.conf, and ClamAV's 24 GB lines (below)
      #   clamd.conf and freshclam.conf in _CONFIG   the ClamAV image's confs, written to kalla-config/clamav for kalla-clamav,
      #                                              with KALLA_FRESHCLAM_PROXY=HOST:PORT as freshclam's HTTP proxy
      #   /backup/pgbackrest, /backup/uploads        the pgBackRest repository and the upload copy, when mounted: given to
      #                                              Postgres (999) and to the services' uid (1654)
      set -eu
      umask 077
      C="$${KALLA_BOOTSTRAP_CERTS:-/certs}"
      S="$${KALLA_BOOTSTRAP_SECRETS:-/secrets}"
      F="$${KALLA_BOOTSTRAP_CONF-/conf}"
      K="$${KALLA_BOOTSTRAP_CONFIG:-/config}"
      G="$${KALLA_BOOTSTRAP_GATEWAY_CERTS:-/gateway-certs}"
      T="$${KALLA_BOOTSTRAP_TRUST:-/trust}"
      P="$${KALLA_BOOTSTRAP_PKI:-/pki}"
      OWN="$${KALLA_BOOTSTRAP_OWN:-yes}"
      # The words of the checklist at the end follow the form: the Portainer stack (the gateway in it), or a Compose host
      # (KALLA_BOOTSTRAP_PROXY_GATEWAY=no, which compose.rag.yaml sets when it runs alone).
      if [ "$${KALLA_BOOTSTRAP_PROXY_GATEWAY:-yes}" = no ]; then
        guide="docs/production-setup.md"; ca_guide="docs/production-setup.md, Internal TLS"; again="run 'docker compose --env-file deploy/.env up -d' again"
        restart_how="docker compose --env-file deploy/.env restart"
        key_how="Give --gateway-secrets-dir (a gateway on this host that applied Källa's manifest) or --gateway-credential-key-file to deploy/init-deployment.sh, then $$again; no restart needed"
      else
        guide="docs/portainer.md"; ca_guide="docs/portainer.md, Internal certificates"; again="update the stack"; restart_how="Containers, select, Restart"
        key_how="Leave FORS_INTEGRATION_MANIFEST unset (the stack file's default) so the gateway creates it, or issue it in the gateway's admin (integration Kalla) and set the variable; then update the stack, no restart needed"
      fi
      PG="$${KALLA_POSTGRES_HOST:-kalla-postgres}"

      # --- A Portainer stack from before the rename to Källa (0.8 and earlier) ------------------------------------------
      # Its rag-* volumes are mounted read-only under /legacy: copied once into the kalla-* volumes while those are new (no key
      # pepper yet), so the certificates, secrets, uploads, Open WebUI's data and the database carry over (docs/upgrade-guide.md,
      # "0.9.0"). A database that is still open (the old rag-postgres running beside the new stack) is never copied.
      # The pepper is copied last, and the database's PG_VERSION last of its files: each says that its copy finished, so a
      # copy that stopped part-way (a full disk, a restart) is done again by the next run instead of being taken as done.
      L="$${KALLA_BOOTSTRAP_LEGACY:-/legacy}"
      # copy_last FROM TO NAME: FROM's content into TO, the file NAME last.
      copy_last() {
        for f in "$$1"/* "$$1"/.[!.]*; do
          [ -e "$$f" ] || continue
          [ "$${f##*/}" = "$$3" ] || cp -a "$$f" "$$2/"
        done
        cp -a "$$1/$$3" "$$2/$$3"
      }
      if [ ! -f "$$S/.pepper" ] && [ -f "$$L/secrets/.pepper" ]; then
        if [ -f "$$L/postgres-data/postmaster.pid" ]; then
          echo "kalla-bootstrap: the stack's old database (volume rag-postgres-data) is still in use: stop the stack, remove the old rag-* containers (or update with 'Prune services' on) and update the stack again" >&2
          exit 1
        fi
        echo "kalla-bootstrap: copying the volumes rag-certs, rag-secrets, rag-blobs, rag-openwebui-data and rag-postgres-data into the kalla-* volumes (upgrade to Källa 0.9)"
        cp -a "$$L/certs/." "$$C/"
        [ ! -d /blobs ] || cp -a "$$L/blobs/." /blobs/
        [ ! -d /openwebui-data ] || cp -a "$$L/openwebui-data/." /openwebui-data/
        if [ -d /postgres-data ] && [ -f "$$L/postgres-data/PG_VERSION" ] && [ ! -f /postgres-data/PG_VERSION ]; then
          copy_last "$$L/postgres-data" /postgres-data PG_VERSION
          echo "kalla-bootstrap: copied the database; rename its roles before kalla-migrate can sign in (docs/upgrade-guide.md, \"0.9.0\")"
        fi
        copy_last "$$L/secrets" "$$S" .pepper
      fi
      W="$$(mktemp -d)"; trap 'rm -rf "$$W"' EXIT
      # The host names come resolved from the stack file: FORS_DOMAIN's defaults unless a KALLA_*_HOST is set.
      : "$${KALLA_API_HOST:?Set FORS_DOMAIN or KALLA_API_HOST (public hostname of kalla-api)}"
      ADMIN_HOST="$${KALLA_ADMIN_HOST:-$$KALLA_API_HOST}"
      for d in postgres api admin worker parser migrations; do mkdir -p "$$C/$$d"; done
      for d in postgres api admin worker migrations keys renderer openwebui openwebui-feedback; do mkdir -p "$$S/$$d"; done
      rand() { openssl rand -hex 32; }
      quiet() { "$$@" >/dev/null 2>&1; }

      if [ ! -f "$$C/ca.pem" ]; then
        quiet openssl req -x509 -newkey rsa:3072 -nodes -keyout "$$C/ca.key" -out "$$C/ca.pem" -days 3650 -subj /CN=kalla-internal-ca \
          -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign,cRLSign"
      fi

      # issue DIR SAN-LIST: (re)issue unless a valid certificate for exactly these names, from the current CA, exists. A
      # re-issued certificate (not a first one) is listed in $$reissued, for the checklist.
      reissued=""
      issue() {
        svc="$$1"; san="$$2"; dir="$$C/$$svc"
        if [ -f "$$dir/$$svc.crt" ] && [ "$$(cat "$$dir/.san" 2>/dev/null)" = "$$san" ] &&
           quiet openssl x509 -checkend 2592000 -noout -in "$$dir/$$svc.crt" && quiet openssl verify -CAfile "$$C/ca.pem" "$$dir/$$svc.crt"; then
          return
        fi
        [ -f "$$C/ca.key" ] || { echo "kalla-bootstrap: $$C/ca.key is needed to issue the certificate of $$svc: copy it back from where you keep it" >&2; exit 1; }
        [ ! -f "$$dir/$$svc.crt" ] || reissued="$$reissued $$svc"
        echo "kalla-bootstrap: issuing certificate for $$svc ($$san)"
        quiet openssl req -newkey rsa:3072 -nodes -keyout "$$dir/$$svc.key" -out "$$W/$$svc.csr" -subj "/CN=$$svc"
        printf 'subjectAltName=%s\nextendedKeyUsage=serverAuth\nkeyUsage=critical,digitalSignature,keyEncipherment\nsubjectKeyIdentifier=hash\nauthorityKeyIdentifier=keyid\n' \
          "$$san" > "$$W/$$svc.ext"
        quiet openssl x509 -req -in "$$W/$$svc.csr" -CA "$$C/ca.pem" -CAkey "$$C/ca.key" -CAcreateserial -CAserial "$$W/ca.srl" \
          -out "$$dir/$$svc.crt" -days 825 -extfile "$$W/$$svc.ext"
        printf '%s' "$$san" > "$$dir/.san"
      }
      # public SVC SAN-LIST: the operator's own certificate when $$P has the pair (copied on every run, so a renewed one is
      # picked up), else one from the internal CA. Without the pair, a certificate that came from $$P is re-issued.
      public() {
        if [ -f "$$P/$$1.crt" ] && [ -f "$$P/$$1.key" ]; then
          cp "$$P/$$1.crt" "$$C/$$1/$$1.crt"; cp "$$P/$$1.key" "$$C/$$1/$$1.key"; printf 'operator' > "$$C/$$1/.san"
        else
          issue "$$1" "$$2"
        fi
      }
      issue postgres "DNS:$$PG,DNS:localhost"
      public api "DNS:kalla-api,DNS:localhost,DNS:$$KALLA_API_HOST"
      public admin "DNS:kalla-admin,DNS:localhost,DNS:$$ADMIN_HOST"
      issue worker "DNS:kalla-worker,DNS:localhost"
      issue parser "DNS:kalla-parser,DNS:localhost"

      if [ ! -f "$$C/data-protection.pfx" ]; then
        quiet openssl req -x509 -newkey rsa:3072 -nodes -keyout "$$W/dp.key" -out "$$W/dp.crt" -days 3650 -subj /CN=kalla-data-protection
        quiet openssl pkcs12 -export -inkey "$$W/dp.key" -in "$$W/dp.crt" -out "$$C/data-protection.pfx" -passout pass:
      fi
      for d in api admin migrations; do cp "$$C/data-protection.pfx" "$$C/$$d/data-protection.pfx"; done
      for d in postgres parser migrations; do cp "$$C/ca.pem" "$$C/$$d/ca.pem"; done
      # What the services that call out trust besides RAG's CA: the gateway's CA and the operator's (see the header).
      cp "$$C/ca.pem" "$$W/trust.pem"
      if [ -f "$$G/ca.pem" ]; then
        cat "$$G/ca.pem" >> "$$W/trust.pem"
      elif [ "$${KALLA_BOOTSTRAP_GATEWAY_CA:-}" != optional ]; then
        echo "kalla-bootstrap: the gateway's CA ($$G/ca.pem) is missing" >&2; exit 1
      fi
      # kalla-migrate calls only the database: it gets the operator's CAs too, for a database with a certificate of its own.
      for f in "$$T"/*.pem; do
        [ -f "$$f" ] || continue
        cat "$$f" >> "$$W/trust.pem"; cat "$$f" >> "$$C/migrations/ca.pem"
      done
      for d in api admin worker; do cp "$$W/trust.pem" "$$C/$$d/ca.pem"; done

      # --- Database (connection pools per instance, data-model §1.1: api 12, admin 5, worker 10, migrator 2) ---------------
      for role in bootstrap migrator api admin worker; do
        [ -f "$$S/postgres/$${role}_password" ] || rand > "$$S/postgres/$${role}_password"
      done
      connection() {
        printf 'Host=%s;Database=ragdb;Username=kalla_%s;Password=%s;SSL Mode=VerifyFull;Root Certificate=/run/certs/ca.pem;GSS Encryption Mode=Disable;Maximum Pool Size=%s' \
          "$$PG" "$$1" "$$(tr -d '\r\n' < "$$S/postgres/$${1}_password")" "$$2"
      }
      connection migrator 2 > "$$S/migrations/ConnectionStrings__ragdb"
      connection api 12 > "$$S/api/ConnectionStrings__ragdb"
      connection admin 5 > "$$S/admin/ConnectionStrings__ragdb"
      connection worker 10 > "$$S/worker/ConnectionStrings__ragdb"
      [ -f "$$S/.pepper" ] || openssl rand -hex 48 > "$$S/.pepper"
      for d in migrations api admin; do tr -d '\n' < "$$S/.pepper" > "$$S/$$d/Security__KeyPepper"; done

      # --- The api's, kalla-admin's and the worker's own keys -------------------------------------------------------------
      [ -f "$$S/api/Security__DownloadGrantKeys__k1" ] || rand > "$$S/api/Security__DownloadGrantKeys__k1"
      [ -f "$$S/api/Security__CacheKeyPepper" ] || rand > "$$S/api/Security__CacheKeyPepper"
      [ -f "$$S/api/Security__ConversationIdKeys__k1" ] || rand > "$$S/api/Security__ConversationIdKeys__k1"
      # kalla-admin's setup secret (identity design §19): the setup code is derived from it. Kept, but not worth backing up: a
      # new one only changes the setup codes printed from then on.
      [ -f "$$S/admin/Setup__Secret" ] || rand > "$$S/admin/Setup__Secret"
      # Open WebUI's own secrets are generated in its block below, only with the openwebui profile.
      [ -f "$$S/worker/Security__CrawlKeyPepper" ] || rand | tr -d '\n' > "$$S/worker/Security__CrawlKeyPepper"
      # The renderer's secret WebSocket path (connectors design §8.3): the worker gets the endpoint only while the render
      # profile is on, so without the renderer it refuses rendering instead of waiting for a browser that never starts.
      [ -f "$$S/.render-ws-path" ] || rand > "$$S/.render-ws-path"
      printf '/%s' "$$(tr -d '\r\n' < "$$S/.render-ws-path")" > "$$S/renderer/ws-path"
      case ",$${COMPOSE_PROFILES:-}," in
        *,render,*) printf 'ws://kalla-renderer:3000/%s' "$$(tr -d '\r\n' < "$$S/.render-ws-path")" > "$$S/worker/Render__Endpoint" ;;
        *) rm -f "$$S/worker/Render__Endpoint" ;;
      esac
      # The malware scan follows the clamav profile (M-17 C3): on while kalla-clamav runs; off without it, so files are stored
      # unscanned and marked so (#535) instead of waiting for a scanner that never starts.
      case ",$${COMPOSE_PROFILES:-}," in
        *,clamav,*) printf on > "$$S/worker/ClamAv__Mode" ;;
        *) printf off > "$$S/worker/ClamAv__Mode" ;;
      esac
      # Open WebUI, only with the openwebui profile (not every installation has a chat): without it nothing of it is
      # generated and kalla-api, kalla-admin and kalla-migrate get no Open WebUI file, so kalla-api accepts no Open WebUI user, the
      # setup wizard has no Open WebUI step (OpenWebUi__Enabled, identity design §19) and kalla-migrate registers no client.
      # Turning the profile off later keeps what was generated (the same keys when it is turned on again) and removes only
      # the services' files. With it:
      #   - the user-JWT secret Open WebUI signs with and kalla-api checks (identity design §5.2), its session key, the feedback
      #     service account's password, and a CA bundle with the public CAs (its OIDC provider), RAG's and the trusted ones;
      #   - its key for kalla-api (M-17 C4), generated once: its start-up wrapper exports it as OPENAI_API_KEYS and kalla-migrate
      #     registers it as the deployment's own Open WebUI client. A new key: delete .openwebui-rag-api-key in the volume
      #     and update the stack (kalla-migrate revokes the old one);
      #   - its address for kalla-api's feedback import (M-17 C2): the stack's own kalla-openwebui. The import also needs the
      #     feedback key, which kalla-openwebui-setup mints (openwebui-feedback, below).
      case ",$${COMPOSE_PROFILES:-}," in
        *,openwebui,*)
          [ -f "$$S/.openwebui-jwt-secret" ] || rand > "$$S/.openwebui-jwt-secret"
          tr -d '\n' < "$$S/.openwebui-jwt-secret" > "$$S/api/OpenWebUi__JwtSecret"
          tr -d '\n' < "$$S/.openwebui-jwt-secret" > "$$S/openwebui/jwt-secret"
          [ -f "$$S/openwebui/webui_secret_key" ] || rand > "$$S/openwebui/webui_secret_key"
          [ -f "$$S/openwebui/admin-password" ] || rand | tr -d '\n' > "$$S/openwebui/admin-password"
          # (the public CAs are the image's; outside a container the bundle may be elsewhere, and Open WebUI is not run from there)
          { [ ! -r /etc/ssl/certs/ca-certificates.crt ] || cat /etc/ssl/certs/ca-certificates.crt; cat "$$W/trust.pem"; } > "$$S/openwebui/ca.pem"
          [ -f "$$S/.openwebui-rag-api-key" ] || printf 'kalla-sk-%s' "$$(openssl rand -base64 96 | tr -dc 'A-Za-z0-9' | head -c 43)" > "$$S/.openwebui-rag-api-key"
          cp "$$S/.openwebui-rag-api-key" "$$S/openwebui/rag-api-key"
          printf 'http://kalla-openwebui:8080' > "$$S/api/OpenWebUi__BaseUrl"
          printf true > "$$S/admin/OpenWebUi__Enabled"
          cp "$$S/.openwebui-rag-api-key" "$$S/migrations/OpenWebUi__ApiKey" ;;
        *) rm -f "$$S/api/OpenWebUi__JwtSecret" "$$S/api/OpenWebUi__BaseUrl" "$$S/admin/OpenWebUi__Enabled" "$$S/migrations/OpenWebUi__ApiKey" ;;
      esac
      # Blob master key of the file key provider (plan §8a): without it the `internal` blobs cannot be read. Back it up.
      if [ ! -f "$$S/keys/rag-blob-internal" ]; then
        openssl rand -base64 32 > "$$S/keys/rag-blob-internal"
        chmod 0400 "$$S/keys/rag-blob-internal"
      fi

      # --- Files that follow a variable ------------------------------------------------------------------------------
      # put SERVICE NAME VALUE: the secret file NAME of SERVICE holds VALUE; an empty VALUE removes it.
      put() {
        if [ -n "$$3" ]; then printf '%s' "$$3" > "$$S/$$1/$$2"; else rm -f "$$S/$$1/$$2"; fi
      }
      # Each service's credential key of the gateway integration Kalla (identity design §4.7). From the gateway's
      # manifest (M-17 C7): the gateway's migrations provision the integration from FORS_INTEGRATION_MANIFEST and write each
      # new key's secret to the integration-secrets volume as Kalla/rag-<service>; that volume is mounted read-only at
      # /integration-secrets. KALLA_API_GATEWAY_KEY, KALLA_ADMIN_GATEWAY_KEY and KALLA_WORKER_GATEWAY_KEY, when set,
      # win over the files (keys issued by hand, or a gateway elsewhere). The per-level keys they replace are revoked at the
      # gateway and read by no service, so none is left in the volume.
      # The integration is named Kalla from Fors 0.12; a key created before it was renamed (from Ume.Rag) keeps its file under
      # Ume.Rag/, so that directory is read when Kalla/ has no file for the service.
      I="$${KALLA_BOOTSTRAP_INTEGRATION_SECRETS:-/integration-secrets}"
      for svc in api admin worker; do
        up="$$(echo "$$svc" | tr '[:lower:]' '[:upper:]')"
        key="$$(printenv "KALLA_$${up}_GATEWAY_KEY" || true)"
        for dir in Kalla Ume.Rag; do
          if [ -z "$$key" ] && [ -s "$$I/$$dir/rag-$$svc" ]; then key="$$(cat "$$I/$$dir/rag-$$svc")"; fi
        done
        put "$$svc" Gateway__Key "$$key"
        rm -f "$$S/$$svc"/Gateway__Keys__*
      done
      put admin Oidc__ClientSecret "$${KALLA_OIDC_CLIENT_SECRET:-}"
      # Refusing guests as a deployment value (identity design §19): a file, not kalla-admin's environment, where an empty
      # boolean would stop it at start. Unset, the setup wizard's choice applies, else the default (refused). Anything but true
      # or false is left out and named on the checklist.
      case "$${KALLA_OIDC_REFUSE_GUESTS:-}" in
        ""|true|false) put admin Oidc__RefuseGuests "$${KALLA_OIDC_REFUSE_GUESTS:-}" ;;
        *) rm -f "$$S/admin/Oidc__RefuseGuests" ;;
      esac
      # Open WebUI's client secret as a deployment value (identity design §19): kalla-api serves it to Open WebUI's start, kalla-admin
      # shows that it is set. Unset, the setup wizard's stored secret applies.
      put api OpenWebUi__Oidc__ClientSecret "$${KALLA_OPENWEBUI_OIDC_CLIENT_SECRET:-}"
      put admin OpenWebUi__Oidc__ClientSecret "$${KALLA_OPENWEBUI_OIDC_CLIENT_SECRET:-}"
      # Retired variables the stack still sets (Decisions "Deployment values across releases"): the stack file lists their
      # names in KALLA_RETIRED_SET. They are named on the checklist with what replaced each, and kalla-admin gets the names
      # (Deployment:RetiredVariables) for the notice on its Home page. A variable that is no longer read is added here and
      # to KALLA_RETIRED_SET in the stack template in the same change.
      retired_hint() {
        case "$$1" in
          KALLA_ORG_SYNC_*) echo "kalla-admin syncs the organisation with its gateway credential key" ;;
          KALLA_OPENWEBUI_API_KEY|KALLA_OPENWEBUI_CLIENT_ID) echo "the deployment creates Open WebUI's client itself" ;;
          KALLA_OPENWEBUI_ADMIN_API_KEY|KALLA_OPENWEBUI_PASSWORD_AUTH) echo "kalla-openwebui-setup mints the feedback key" ;;
          KALLA_OPENWEBUI_BASE_URL) echo "the feedback address follows the openwebui profile" ;;
          KALLA_CLAMAV_MODE) echo "the malware scan follows the clamav profile" ;;
          KALLA_EMBEDDING_*) echo "the embedding profile is created in the admin UI, under Models" ;;
          KALLA_GATEWAY_MAX_RESIDENCY) echo "the ceiling is each credential key's allowed residencies in the gateway" ;;
          KALLA_OIDC_GROUPS_*) echo "role groups are set in the admin UI, under Settings" ;;
          FORS_ORGANISATION_NAME) echo "the organisation's name comes from the gateway's branding" ;;
          KALLA_GATEWAY_INTEGRATION_API_URL) echo "the address comes from the gateway's FORS_INTEGRATION_API_URL" ;;
          *) echo "see docs/upgrade-guide.md" ;;
        esac
      }
      retired=""
      for name in $${KALLA_RETIRED_SET:-}; do
        case "$$name" in *[!A-Z0-9_]*) continue ;; esac
        retired="$$retired,$$name"
      done
      retired="$${retired#,}"
      put admin Deployment__RetiredVariables "$$retired"
      # The feedback service account's Open WebUI key (chat design §13.3) is minted by kalla-openwebui-setup into
      # openwebui-feedback (M-17 C6); the hand-made key of KALLA_OPENWEBUI_ADMIN_API_KEY that kalla-api read before goes.
      if [ -e "$$S/api/OpenWebUi__AdminApiKey" ]; then
        rm -f "$$S/api/OpenWebUi__AdminApiKey"
        echo "kalla-bootstrap: deleted api/OpenWebUi__AdminApiKey; kalla-openwebui-setup mints the feedback key now"
      fi
      # The Data API key of the admin's former org sync: the admin syncs with its credential key now.
      if [ -e "$$S/admin/OrgSync__DataApiKey" ]; then
        rm -f "$$S/admin/OrgSync__DataApiKey"
        echo "kalla-bootstrap: deleted admin/OrgSync__DataApiKey; ask the gateway admin to revoke that Data API key"
      fi

      # --- pgBackRest repository (repo-and-deployment §7.4), only where the deployment names a backup target ---------------
      # The passphrase is generated once (a new one could not read the existing backups: escrow it); repo.conf is written
      # again from it and the variables on every run.
      if [ -n "$${KALLA_BACKUP_TARGET:-}" ]; then
        mkdir -p "$$S/pgbackrest"
        [ -f "$$S/pgbackrest/cipher-pass" ] || openssl rand -base64 48 | tr -d '\n' > "$$S/pgbackrest/cipher-pass"
        {
          echo "# Written by kalla-bootstrap (repo-and-deployment §7.4); the passphrase is pgbackrest/cipher-pass."
          echo "[global]"
          echo "repo1-cipher-type=aes-256-cbc"
          echo "repo1-cipher-pass=$$(cat "$$S/pgbackrest/cipher-pass")"
          case "$$KALLA_BACKUP_TARGET" in
            s3://*)
              location="$${KALLA_BACKUP_TARGET#s3://}"; endpoint="$${location%%/*}"; bucket_path="$${location#*/}"
              if [ "$$bucket_path" = "$$location" ] || [ -z "$$bucket_path" ]; then
                echo "kalla-bootstrap: KALLA_BACKUP_TARGET is s3://ENDPOINT/BUCKET[/PATH]" >&2; exit 1
              fi
              if [ -z "$${KALLA_BACKUP_S3_KEY:-}" ] || [ -z "$${KALLA_BACKUP_S3_KEY_SECRET:-}" ]; then
                echo "kalla-bootstrap: an s3:// backup target needs KALLA_BACKUP_S3_KEY and KALLA_BACKUP_S3_KEY_SECRET" >&2; exit 1
              fi
              bucket="$${bucket_path%%/*}"; path="$${bucket_path#"$$bucket"}"; path="$${path#/}"; path="$${path%/}"
              echo "repo1-type=s3"
              echo "repo1-path=/$${path:-kalla}"
              echo "repo1-s3-endpoint=$$endpoint"
              echo "repo1-s3-bucket=$$bucket"
              echo "repo1-s3-region=$${KALLA_BACKUP_S3_REGION:-us-east-1}"
              echo "repo1-s3-key=$$KALLA_BACKUP_S3_KEY"
              echo "repo1-s3-key-secret=$$KALLA_BACKUP_S3_KEY_SECRET"
              echo "repo1-s3-uri-style=path" ;;
            *)
              echo "repo1-type=posix"
              echo "repo1-path=/var/lib/pgbackrest" ;;
          esac
        } > "$$S/pgbackrest/repo.conf"
      fi

      # --- Static configuration (the services run read-only, so they get it from a volume) -----------------------------
      proxy_todo=""
      # Whether the TLS proxy below serves kalla-admin's host name, for the setup wizard's address at the end.
      admin_proxied=""
      if [ -n "$$F" ]; then
      mkdir -p "$$F/postgres-init" "$$F/postgres" "$$F/migrations" "$$F/openwebui-setup" "$$F/openwebui"
      # kalla-openwebui-setup's script and kalla-openwebui's start wrapper (profile openwebui): those services are read-only, so they
      # read their scripts from kalla-config.
      cp "$$K"/feedback-key-setup.py "$$F/openwebui-setup/feedback-key-setup.py"
      cp "$$K"/start-with-sign-in.py "$$F/openwebui/start-with-sign-in.py"
      cp "$$K"/postgres-init.sql "$$F/postgres-init/10-roles.sql"
      cp "$$K"/pg_hba.conf "$$F/postgres/pg_hba.conf"
      cp "$$K"/postgresql.conf "$$F/postgres/postgresql.conf"
      # A 24 GB host (repo-and-deployment §6.2): the memory settings postgresql.conf names in its comments.
      if [ "$${KALLA_HOST_MEMORY:-16}" = 24 ]; then
        sed -e 's/^shared_buffers = [0-9A-Za-z]*/shared_buffers = 1536MB/' -e 's/^effective_cache_size = [0-9A-Za-z]*/effective_cache_size = 3500MB/' \
          -e 's/^maintenance_work_mem = [0-9A-Za-z]*/maintenance_work_mem = 1GB/' "$$K/postgresql.conf" > "$$F/postgres/postgresql.conf"
        for s in shared_buffers=1536MB effective_cache_size=3500MB maintenance_work_mem=1GB; do
          grep -q "^$${s%%=*} = $${s#*=}" "$$F/postgres/postgresql.conf" || { echo "kalla-bootstrap: postgresql.conf has no $${s%%=*} line to set for a 24 GB host" >&2; exit 1; }
        done
      fi
      cp "$$K"/app-roles.sql "$$F/migrations/app-roles.sql"
      # ClamAV's confs, only where the deployment gives the image's (repo-and-deployment §5.5): the image's unprivileged
      # entrypoint takes a setting only from a mounted file. A 24 GB host (kalla-clamav's 3g) keeps the old engine during a
      # reload and test-loads updates before using them; a freshclam proxy is for a host whose egress goes through one.
      if [ -f "$$K/clamd.conf" ] && [ -f "$$K/freshclam.conf" ]; then
        mkdir -p "$$F/clamav"
        cp "$$K/clamd.conf" "$$F/clamav/clamd.conf"; cp "$$K/freshclam.conf" "$$F/clamav/freshclam.conf"
        if [ "$${KALLA_HOST_MEMORY:-16}" = 24 ]; then
          sed 's/^ConcurrentDatabaseReload no$$/ConcurrentDatabaseReload yes/' "$$K/clamd.conf" > "$$F/clamav/clamd.conf"
          sed 's/^TestDatabases no$$/TestDatabases yes/' "$$K/freshclam.conf" > "$$F/clamav/freshclam.conf"
          if ! grep -qx 'ConcurrentDatabaseReload yes' "$$F/clamav/clamd.conf" || ! grep -qx 'TestDatabases yes' "$$F/clamav/freshclam.conf"; then
            echo "kalla-bootstrap: the ClamAV confs no longer have the lines a 24 GB host changes" >&2; exit 1
          fi
        fi
        fp="$${KALLA_FRESHCLAM_PROXY:-}"
        if [ -n "$$fp" ]; then
          printf '%s' "$$fp" | grep -Eq '^[A-Za-z0-9.-]+:[0-9]+$$' || { echo "kalla-bootstrap: KALLA_FRESHCLAM_PROXY is HOST:PORT" >&2; exit 1; }
          printf '\n# Egress through a proxy (KALLA_FRESHCLAM_PROXY).\nHTTPProxyServer %s\nHTTPProxyPort %s\n' "$${fp%:*}" "$${fp##*:}" \
            >> "$$F/clamav/freshclam.conf"
        fi
      else
        rm -rf "$$F/clamav"
      fi
      # The TLS proxy's nginx.conf (profile proxy, M-17 C8): the template with the stack's host names. A host without a name
      # of its own (the gateway's admin on the gateway's name, kalla-admin on kalla-api's) gets no block, nor Open WebUI without
      # its profile; the checklist at the end says so.
      mkdir -p "$$F/proxy"
      case ",$${COMPOSE_PROFILES:-}," in
        *,proxy,*)
          hostname_ok() { printf '%s' "$$1" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$$'; }
          gw="$${FORS_GATEWAY_HOST:-}"; gw_admin="$${FORS_ADMIN_HOST:-}"; api="$$KALLA_API_HOST"; rag_admin="$${KALLA_ADMIN_HOST:-}"
          owui_host="$${KALLA_OPENWEBUI_HOST:-}"
          # Every block has a marker and is written only for a valid host name, and only validated names reach sed (#711): a
          # URL or a typo leaves that block out and names it on the checklist instead of stopping kalla-bootstrap.
          # Without the gateway in the stack (KALLA_BOOTSTRAP_PROXY_GATEWAY=no) neither gateway block, and nothing to note.
          with_gateway="$${KALLA_BOOTSTRAP_PROXY_GATEWAY:-yes}"
          if [ "$$with_gateway" = no ]; then gw=""; enable="-e /^#gateway/d"
          elif hostname_ok "$$gw"; then enable="-e s/^#gateway//"
          else gw=""; enable="-e /^#gateway/d"; proxy_todo="$$proxy_todo|FORS_GATEWAY_HOST is not a host name, so the proxy has no gateway block"; fi
          if hostname_ok "$$api"; then enable="$$enable -e s/^#ragapi//"
          else api=""; enable="$$enable -e /^#ragapi/d"; proxy_todo="$$proxy_todo|KALLA_API_HOST is not a host name, so the proxy has no kalla-api block"; fi
          if [ "$$with_gateway" = no ]; then gw_admin=""; enable="$$enable -e /^#gwadmin/d"
          elif hostname_ok "$$gw_admin" && [ "$$gw_admin" != "$$gw" ]; then enable="$$enable -e s/^#gwadmin//"
          else gw_admin=""; enable="$$enable -e /^#gwadmin/d"
            proxy_todo="$$proxy_todo|FORS_ADMIN_HOST: the proxy serves the gateway's admin only on a host name of its own"; fi
          if hostname_ok "$$rag_admin" && [ "$$rag_admin" != "$$api" ]; then enable="$$enable -e s/^#ragadmin//"; admin_proxied=yes
          else rag_admin=""; enable="$$enable -e /^#ragadmin/d"
            proxy_todo="$$proxy_todo|KALLA_ADMIN_HOST: the proxy serves Källa's admin only on a host name of its own"; fi
          case ",$${COMPOSE_PROFILES:-}," in
            *,openwebui,*)
              if hostname_ok "$$owui_host"; then enable="$$enable -e s/^#owui//"
              else owui_host=""; enable="$$enable -e /^#owui/d"; proxy_todo="$$proxy_todo|KALLA_OPENWEBUI_HOST: the proxy has no Open WebUI block"; fi ;;
            *) owui_host=""; enable="$$enable -e /^#owui/d" ;;
          esac
          # shellcheck disable=SC2086 # $$enable is a list of sed expressions
          sed $$enable -e "s/@GATEWAY_HOST@/$$gw/g" -e "s/@ADMIN_HOST@/$$gw_admin/g" -e "s/@API_HOST@/$$api/g" \
            -e "s/@RAG_ADMIN_HOST@/$$rag_admin/g" -e "s/@OPENWEBUI_HOST@/$$owui_host/g" "$$K/nginx-proxy.conf.template" > "$$F/proxy/nginx.conf"
          # The internal CAs it verifies the upstreams against (public certificates only; fors-certs also holds private keys).
          cp "$$C/ca.pem" "$$F/proxy/rag-ca.pem"
          [ ! -f "$$G/ca.pem" ] || cp "$$G/ca.pem" "$$F/proxy/gateway-ca.pem"
          echo "kalla-bootstrap: wrote the TLS proxy's nginx.conf" ;;
        *) rm -f "$$F/proxy/nginx.conf" "$$F/proxy/rag-ca.pem" "$$F/proxy/gateway-ca.pem" ;;
      esac
      chmod -R a+rX "$$F"
      fi

      if [ "$$OWN" != no ]; then
      # --- Blob container (issue #41): rag/ and the worker's spool, owned by the services' uid ----------------------------
      mkdir -p /blobs/rag /blobs/spool
      chown 1654:1654 /blobs/rag /blobs/spool
      chmod 0750 /blobs/rag /blobs/spool

      chown -R 999:999 "$$C/postgres" "$$S/postgres"
      [ ! -d "$$S/pgbackrest" ] || chown -R 999:999 "$$S/pgbackrest"
      chown -R 10001:10001 "$$C/parser"
      chown -R 10002:10002 "$$S/renderer"
      chown -R 1000:1000 "$$S/openwebui" /openwebui-data
      chmod 0700 "$$S/openwebui"
      # Written by kalla-openwebui-setup (Open WebUI's uid 1000), read by kalla-api (group 1654; setgid keeps the group).
      chown 1000:1654 "$$S/openwebui-feedback"
      chmod 2750 "$$S/openwebui-feedback"
      chown -R 1654:1654 "$$C/api" "$$C/admin" "$$C/worker" "$$C/migrations" "$$S/api" "$$S/admin" "$$S/worker" "$$S/migrations" "$$S/keys"
      chmod 755 "$$C" "$$S"
      # The pgBackRest repository and the upload copy where they are mounted (Compose's compose.backup.yaml): the directory
      # itself only, since a repository holds many files. A share that refuses root's chown is named on the checklist.
      for d in pgbackrest:999 uploads:1654; do
        [ -d "/backup/$${d%%:*}" ] || continue
        chown "$${d#*:}:$${d#*:}" "/backup/$${d%%:*}" 2>/dev/null || backup_todo="$${backup_todo:-} /backup/$${d%%:*}"
      done
      fi
      echo "kalla-bootstrap: certificates and secrets ready"

      # --- What is still missing: a checklist at the end of the log (never fatal: the stack starts and waits) ------------
      todo=""
      note() { todo="$$todo
        - $$1"; }
      example() { case "$$1" in ""|*example.se*|*CHANGE*) return 0 ;; esac; return 1; }
      for svc in api admin worker; do
        up="$$(echo "$$svc" | tr '[:lower:]' '[:upper:]')"
        [ -e "$$S/$$svc/Gateway__Key" ] || note "KALLA_$${up}_GATEWAY_KEY: no key for kalla-$$svc. $$key_how"
      done
      # A name under FORS_DOMAIN is named once, as the domain; a name set of its own, as its variable.
      if [ -n "$${FORS_DOMAIN:-}" ] && example "$$FORS_DOMAIN"; then note "FORS_DOMAIN is still an example value (the host names default under it)"; fi
      case "$$KALLA_API_HOST" in "rag.$${FORS_DOMAIN:-}") ;; *) example "$$KALLA_API_HOST" && note "KALLA_API_HOST is still an example value" ;; esac
      # Optional: unset, kalla-api's public URL is https://<KALLA_API_HOST>.
      case "$${KALLA_API_PUBLIC_URL:-}" in "") ;;
        https://*example.se*|https://*CHANGE*) note "KALLA_API_PUBLIC_URL is still an example value" ;;
        https://*) ;; *) note "KALLA_API_PUBLIC_URL must be the https URL users reach kalla-api at (citation links use it)" ;; esac
      # Optional (identity design §19): unset, kalla-admin's client secret is the setup wizard's; only a placeholder is noted,
      # since any value declares the sign-in and keeps the wizard closed.
      case "$${KALLA_OIDC_CLIENT_SECRET:-}" in *example.se*|*CHANGE*)
        note "KALLA_OIDC_CLIENT_SECRET is still an example value: set the real secret, or remove it for the setup wizard" ;; esac
      case "$${KALLA_OIDC_REFUSE_GUESTS:-}" in ""|true|false) ;;
        *) note "KALLA_OIDC_REFUSE_GUESTS must be true or false (or unset for the setup wizard's choice); it is left out" ;; esac
      # Certificates (#705): kalla-postgres and kalla-parser read theirs only at start, and a stack update recreates neither when
      # its configuration is unchanged (Kestrel watches kalla-api's, kalla-admin's and kalla-worker's files). Each certificate that expires within
      # 60 days is named on every run; the service certificates are re-issued below 30 days, the CA never.
      restart=""
      for svc in $$reissued; do case "$$svc" in postgres|parser) restart="$$restart kalla-$$svc" ;; esac; done
      [ -z "$$restart" ] || note "restart$$restart ($$restart_how): a re-issued certificate takes effect there only after a restart"
      for crt in "$$C/ca.pem" "$$C"/*/*.crt; do
        quiet openssl x509 -checkend 5184000 -noout -in "$$crt" && continue
        end="$$(openssl x509 -enddate -noout -in "$$crt" | cut -d= -f2)"
        case "$$crt" in
          "$$C/ca.pem") note "RAG's internal CA expires $$end, within 60 days: replace it ($$ca_guide)" ;;
          *) note "the certificate of kalla-$$(basename "$$(dirname "$$crt")") expires $$end, within 60 days: $$again once fewer than 30 days remain, and kalla-bootstrap re-issues it" ;;
        esac
      done
      # Retired variables (collected above): tidying, nothing depends on it.
      old_ifs="$$IFS"; IFS=','
      for name in $$retired; do note "$$name is set and no longer read ($$(retired_hint "$$name")): remove it from the stack's variables"; done
      IFS="$$old_ifs"
      # The TLS proxy's host names (collected while its nginx.conf was written, above).
      old_ifs="$$IFS"; IFS='|'
      for item in $$proxy_todo; do [ -z "$$item" ] || note "$$item"; done
      IFS="$$old_ifs"
      [ -z "$${backup_todo:-}" ] || note "could not give$${backup_todo} to its user (uid 999 for pgbackrest, 1654 for uploads): chown it on the backup share"
      case ",$${COMPOSE_PROFILES:-}," in
        *,openwebui,*)
          case "$${KALLA_OPENWEBUI_HOST:-}" in "chat.$${FORS_DOMAIN:-}") ;;
            *) example "$${KALLA_OPENWEBUI_HOST:-}" && note "KALLA_OPENWEBUI_HOST: the chat's public host name (or set FORS_DOMAIN)" ;; esac
          # Optional (identity design §19): unset, Open WebUI's client secret is the setup wizard's; only a placeholder is noted.
          case "$${KALLA_OPENWEBUI_OIDC_CLIENT_SECRET:-}" in *example.se*|*CHANGE*)
            note "KALLA_OPENWEBUI_OIDC_CLIENT_SECRET is still an example value: set the real secret, or empty it for the setup wizard" ;; esac ;;
      esac
      if [ -n "$$todo" ]; then
        echo "kalla-bootstrap: still to do ($$guide):$$todo"
      else
        echo "kalla-bootstrap: every setting it checks is in place"
      fi
      # Not settings to check here: kalla-bootstrap has no network and can't see whether setup is done, so the sign-in line is
      # printed on every run; who is a platform admin comes from the sign-in token.
      if [ -n "$${KALLA_OIDC_AUTHORITY:-}" ] && [ -s "$$S/admin/Oidc__ClientSecret" ]; then
        echo "kalla-bootstrap: sign-in to Källa's admin is declared by the stack's variables (the authority and KALLA_OIDC_CLIENT_SECRET), so the setup wizard stays closed"
      else
        # The address that answers (#874): through the TLS proxy when it serves kalla-admin's host name, else kalla-admin's own
        # port. A reverse proxy of the operator's own is out of kalla-bootstrap's sight, so that form is named beside the port.
        if [ -n "$$admin_proxied" ]; then
          proxy_port="$${KALLA_PROXY_PORT:-443}"
          case "$$proxy_port" in 443) setup_url="https://$$ADMIN_HOST/setup" ;; *) setup_url="https://$$ADMIN_HOST:$$proxy_port/setup" ;; esac
        else
          setup_url="https://$$ADMIN_HOST:$${KALLA_ADMIN_PORT:-9543}/setup (or https://$$ADMIN_HOST/setup through a reverse proxy of your own)"
        fi
        echo "kalla-bootstrap: sign-in is set in the setup wizard: $$setup_url, with the setup code in kalla-admin's log (first start, or after KALLA_SETUP_REOPEN); skip this if you can already sign in"
      fi
      echo "kalla-bootstrap: the first platform admin needs the role rag-platform-admin in the token's roles claim, or a group named in KALLA_OIDC_GROUPS_PLATFORM_ADMIN; the setup wizard's test sign-in says whether you have it"
  kalla-postgres-init:
    content: |
      -- Bootstrap, run once by the image entrypoint as the bootstrap superuser (mounted as
      -- /docker-entrypoint-initdb.d/10-roles.sql; repo-and-deployment §5.2). Creates the login roles from secret files, the
      -- database ragdb owned by the DDL role, the vector extension (not a trusted extension) and the role caps and defaults of
      -- data-model §1.1. Schemas, tables and grants come from the migration service (migrations, then app-roles.sql).
      SET log_statement = 'none';
      DO $$$$
      BEGIN
        EXECUTE format('CREATE ROLE kalla_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
          btrim(pg_read_file('/run/postgres-secrets/migrator_password'), E'\r\n '));
        EXECUTE format('CREATE ROLE kalla_api LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
          btrim(pg_read_file('/run/postgres-secrets/api_password'), E'\r\n '));
        EXECUTE format('CREATE ROLE kalla_admin LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
          btrim(pg_read_file('/run/postgres-secrets/admin_password'), E'\r\n '));
        EXECUTE format('CREATE ROLE kalla_worker LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L',
          btrim(pg_read_file('/run/postgres-secrets/worker_password'), E'\r\n '));
      END $$$$;
      CREATE DATABASE ragdb OWNER kalla_migrator;
      REVOKE ALL ON DATABASE ragdb FROM PUBLIC;
      GRANT CONNECT ON DATABASE ragdb TO kalla_api, kalla_admin, kalla_worker;

      -- Caps and timeouts (data-model §1.1). Pool sizes per instance: api 12, admin 5, worker 10, migrator 2, each + 1 LISTEN
      -- connection; the limits leave room for a second api and admin instance and the worker's stop-then-start.
      ALTER ROLE kalla_migrator CONNECTION LIMIT 3;
      ALTER ROLE kalla_migrator IN DATABASE ragdb SET lock_timeout = '10s';
      ALTER ROLE kalla_migrator IN DATABASE ragdb SET maintenance_work_mem = '1GB';   -- HNSW builds
      ALTER ROLE kalla_api CONNECTION LIMIT 26;
      ALTER ROLE kalla_api IN DATABASE ragdb SET statement_timeout = '5s';
      ALTER ROLE kalla_api IN DATABASE ragdb SET lock_timeout = '1s';
      ALTER ROLE kalla_api IN DATABASE ragdb SET idle_in_transaction_session_timeout = '10s';
      ALTER ROLE kalla_admin CONNECTION LIMIT 12;
      ALTER ROLE kalla_admin IN DATABASE ragdb SET statement_timeout = '30s';
      ALTER ROLE kalla_admin IN DATABASE ragdb SET lock_timeout = '5s';
      ALTER ROLE kalla_admin IN DATABASE ragdb SET idle_in_transaction_session_timeout = '60s';
      ALTER ROLE kalla_worker CONNECTION LIMIT 12;
      ALTER ROLE kalla_worker IN DATABASE ragdb SET statement_timeout = '60s';
      ALTER ROLE kalla_worker IN DATABASE ragdb SET lock_timeout = '5s';
      ALTER ROLE kalla_worker IN DATABASE ragdb SET idle_in_transaction_session_timeout = '60s';

      -- Retrieval defaults (knowledge design §6.4): no retrieval statement runs SET LOCAL. The api searches, the worker runs
      -- the retrieval evaluator, the admin runs the test panel.
      ALTER ROLE kalla_api IN DATABASE ragdb SET hnsw.ef_search = 100;
      ALTER ROLE kalla_api IN DATABASE ragdb SET hnsw.iterative_scan = relaxed_order;
      ALTER ROLE kalla_api IN DATABASE ragdb SET hnsw.max_scan_tuples = 100000;
      ALTER ROLE kalla_worker IN DATABASE ragdb SET hnsw.ef_search = 100;
      ALTER ROLE kalla_worker IN DATABASE ragdb SET hnsw.iterative_scan = relaxed_order;
      ALTER ROLE kalla_worker IN DATABASE ragdb SET hnsw.max_scan_tuples = 100000;
      ALTER ROLE kalla_admin IN DATABASE ragdb SET hnsw.ef_search = 100;
      ALTER ROLE kalla_admin IN DATABASE ragdb SET hnsw.iterative_scan = relaxed_order;
      ALTER ROLE kalla_admin IN DATABASE ragdb SET hnsw.max_scan_tuples = 100000;

      \connect ragdb
      -- The public schema keeps only the extension (data-model §1).
      CREATE EXTENSION vector;
      REVOKE ALL ON SCHEMA public FROM PUBLIC;
      ALTER SCHEMA public OWNER TO kalla_migrator;
      GRANT USAGE ON SCHEMA public TO kalla_api, kalla_admin, kalla_worker;
  kalla-postgres-hba:
    content: |
      # Client authentication for kalla/postgres (data-model §1.1), mounted as /run/config/pg_hba.conf. The first matching
      # line wins. pgBackRest runs inside the container as the postgres OS user and connects over the Unix socket by peer
      # (repo-and-deployment §7.4); every other local login needs a password. Over the network only TLS, only to ragdb and
      # only for the four service roles; the bootstrap superuser never logs in over the network.
      local   all     postgres                                                        peer
      local   all     all                                                             scram-sha-256
      hostnossl all   all     all                                                     reject
      hostssl ragdb   kalla_migrator,kalla_admin,kalla_api,kalla_worker  all  scram-sha-256
  kalla-postgres-conf:
    content: |
      # PostgreSQL settings for kalla/postgres on the pilot host (repo-and-deployment §6.2). Mounted read-only and passed
      # with `postgres -c config_file=/etc/postgresql/postgresql.conf`; the data directory still comes from PGDATA. It replaces
      # the postgresql.conf that initdb writes, so every setting not listed here is the PostgreSQL built-in default.
      # Values are the 16 GB host profile; the 24 GB values are in the comments. The P2 multi-host profile is §6.2 too.

      # Connections. The initdb file sets listen_addresses = '*'; the built-in default would be localhost only.
      listen_addresses = '*'
      max_connections = 100                   # data-model §1.1 (role limits sum to 56)
      superuser_reserved_connections = 3      # data-model §1.1 budget rule (the built-in default)

      # TLS with the internal CA; paths as in the gateway's compose.prod.yaml (mounted from $${KALLA_CERTS_DIR}/postgres).
      ssl = on
      ssl_cert_file = '/run/certs/postgres.crt'
      ssl_key_file = '/run/certs/postgres.key'
      ssl_ca_file = '/run/certs/ca.pem'
      hba_file = '/run/config/pg_hba.conf'    # deploy/postgres/pg_hba.conf, mounted as in the gateway

      # Memory
      shared_buffers = 768MB                  # 24 GB: 1536MB
      effective_cache_size = 2GB              # 24 GB: 3500MB
      work_mem = 8MB
      maintenance_work_mem = 512MB            # 24 GB: 1GB (HNSW builds)
      max_parallel_maintenance_workers = 2
      max_worker_processes = 8

      # Planner and I/O for SSD storage and short queries (#500; performance pass P-52). JIT compiles a statement whose
      # estimated cost passes jit_above_cost, which K and V over a large scope can, for tens of ms per run that a 100 ms
      # search can't afford. The built-in page cost (4) and I/O concurrency (1 in PostgreSQL 17) are for spinning disks.
      jit = off
      random_page_cost = 1.1
      effective_io_concurrency = 200

      # WAL and continuous archiving with pgBackRest inside this container (§7.4): synchronous archive-push, no spool, and a
      # segment switch at least every 60 s so the archive lags by at most a minute (RPO ≤ 5 min).
      wal_level = replica
      wal_compression = lz4
      archive_mode = on
      archive_command = 'pgbackrest --stanza=ragdb archive-push %p'
      archive_timeout = 60

      # Statistics and logging
      shared_preload_libraries = 'pg_stat_statements'   # capacity metrics (§9)
      log_statement = 'none'                            # as the gateway
  kalla-app-roles:
    content: |
      -- Applied by the migration service after every migration run (data-model §1.2, as the gateway's file). The service
      -- roles' privileges are revoked and granted again in one transaction, so each role holds exactly what this file lists
      -- (a privilege removed here is removed from existing installations too) and running services see either the old or the
      -- new grants, never none. Tables are named one by one: a new table is readable by no service until it is added here
      -- (DatabaseRoleTests checks the effective grants). Partitioned tables are granted on the parent only.
      -- No curly braces: the migration service runs this file with EF Core's ExecuteSqlRaw, which reads them as placeholders.
      BEGIN;
      REVOKE ALL ON ALL TABLES IN SCHEMA config, content, chat, audit FROM kalla_api, kalla_admin, kalla_worker;
      REVOKE ALL ON ALL SEQUENCES IN SCHEMA config, content, chat, audit FROM kalla_api, kalla_admin, kalla_worker;
      REVOKE ALL ON SCHEMA config, content, chat, audit FROM kalla_api, kalla_admin, kalla_worker;

      GRANT USAGE ON SCHEMA config, content, audit TO kalla_api, kalla_admin, kalla_worker;
      GRANT USAGE ON SCHEMA chat TO kalla_api, kalla_admin;

      -- Sequences in the schemas each role writes.
      GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA config, content, audit TO kalla_admin;
      GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA config, chat, audit TO kalla_api;
      GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA content, audit TO kalla_worker;

      -- config: the version row and the outbox are written only by the trigger function (owner's rights). The admin's
      -- UPDATE on ConfigVersion exists only for the FOR UPDATE lock that serialises config writes (data-model §5).
      GRANT SELECT ON config."ConfigVersion", config."ConfigOutbox" TO kalla_api, kalla_admin, kalla_worker;
      GRANT UPDATE ON config."ConfigVersion" TO kalla_admin;
      -- The admin creates and rotates the Data Protection keys; the others only decrypt.
      GRANT SELECT ON config."DataProtectionKeys" TO kalla_api, kalla_admin, kalla_worker;
      GRANT INSERT ON config."DataProtectionKeys" TO kalla_admin;
      GRANT SELECT ON config."__EFMigrationsHistory" TO kalla_admin;
      -- The gateway mirror (departments, teams): written by the admin's org sync, read by every service (scopes, audiences).
      GRANT SELECT, INSERT, UPDATE, DELETE ON config."Departments", config."Teams" TO kalla_admin;
      GRANT SELECT ON config."Departments", config."Teams" TO kalla_api, kalla_worker;
      -- The assigned gateway keys' mirror (data-model §1.2, §2.1): the admin's sync writes it; the api reads an assistant's key
      -- status and output cap before a call (chat §4.1, §6.3); the worker never needs it.
      GRANT SELECT, INSERT, UPDATE, DELETE ON config."GatewayKeys" TO kalla_admin;
      GRANT SELECT ON config."GatewayKeys" TO kalla_api;
      -- Clients and keys: the admin manages them, the api authenticates with them; key use goes to KeyLastUse (api), so it
      -- never bumps the config version. The worker holds no keys.
      GRANT SELECT, INSERT, UPDATE, DELETE ON config."Clients", config."Keys" TO kalla_admin;
      GRANT SELECT ON config."Clients", config."Keys" TO kalla_api;
      GRANT SELECT ON config."KeyLastUse" TO kalla_admin;
      GRANT SELECT, INSERT, UPDATE ON config."KeyLastUse" TO kalla_api;
      -- Admin BFF sessions: only the admin reads and writes them (data-model §2.1).
      GRANT SELECT, INSERT, UPDATE, DELETE ON config."AdminSessions" TO kalla_admin;
      -- Setup mode (identity design §19): the setup sessions and test sign-ins, only kalla-admin; they hold the candidate values.
      GRANT SELECT, INSERT, UPDATE, DELETE ON config."SetupSessions", config."SetupTests" TO kalla_admin;
      -- Ingestion config (data-model §1.2): the admin manages it; the worker reads all of it; the api reads what retrieval
      -- needs. The api reads only the listed columns of Sources (knowledge design §6.3, §6.5), never Settings jsonb or
      -- schedules, and no pipelines.
      GRANT SELECT, INSERT, UPDATE, DELETE ON config."Settings", config."DataProtectionPolicies", config."EmbeddingProfiles",
        config."Collections", config."Sources", config."Pipelines", config."PipelineVersions" TO kalla_admin;
      GRANT SELECT ON config."Settings", config."DataProtectionPolicies", config."EmbeddingProfiles", config."Collections",
        config."Sources", config."Pipelines", config."PipelineVersions" TO kalla_worker;
      GRANT SELECT ON config."Settings", config."DataProtectionPolicies", config."EmbeddingProfiles", config."Collections" TO kalla_api;
      GRANT SELECT ("Id", "CollectionId", "Type", "Classification", "State", "DeletedAt", "ContainsThirdPartyText", "DemoteRules")
        ON config."Sources" TO kalla_api;
      -- Collection shares (data-model §1.2, admin design §3.2): the admin manages them; the api reads who may link a
      -- collection; the worker never needs them.
      GRANT SELECT, INSERT, UPDATE, DELETE ON config."CollectionShares" TO kalla_admin;
      GRANT SELECT ON config."CollectionShares" TO kalla_api;
      -- Assistants and the gateway model mirror (data-model §1.2): the admin manages them; the api reads assistants,
      -- audiences and models, and versions only through the view of published versions, never AssistantVersions itself, so a
      -- draft cannot reach chat. The worker reads the model mirror (the evaluation's residency checks, #130) and, for the
      -- index-health check, only which collections and topics active assistants' published versions link (knowledge design
      -- §6.4; Decisions "M-2 open design calls": every HNSW-searched scope an assistant link uses is sampled).
      GRANT SELECT, INSERT, UPDATE, DELETE ON config."Assistants", config."AssistantVersions", config."AssistantAudiences",
        config."GatewayModels" TO kalla_admin;
      -- Explain access (identity design 4.9) builds the api's policy snapshot in kalla-admin, which reads the published view too.
      GRANT SELECT ON config."PublishedAssistantVersions" TO kalla_admin;
      GRANT SELECT ON config."Assistants", config."AssistantAudiences", config."PublishedAssistantVersions",
        config."GatewayModels" TO kalla_api;
      GRANT SELECT ON config."GatewayModels" TO kalla_worker;
      GRANT SELECT ("AssistantId", "CollectionLinks") ON config."PublishedAssistantVersions" TO kalla_worker;
      GRANT SELECT ("Id", "State") ON config."Assistants" TO kalla_worker;

      -- content: the worker owns it; the admin reads it and enqueues jobs (decisions are command jobs, data-model §12.2).
      GRANT SELECT, INSERT, UPDATE, DELETE ON content."Jobs", content."WorkerInstances", content."RunItems" TO kalla_worker;
      GRANT SELECT ON content."Jobs", content."WorkerInstances", content."RunItems" TO kalla_admin;
      GRANT INSERT ON content."Jobs" TO kalla_admin;
      -- Ingestion content (data-model §1.2, §2.2): the worker writes it all, the admin reads it all (incl. the test panel).
      GRANT SELECT, INSERT, UPDATE, DELETE ON content."NodeManifest", content."WorkerNodeSupport", content."CrawlHosts",
        content."SiteProfiles", content."SiteProfileVersions", content."CrawlFrontier", content."CrawlRuns",
        content."ConnectorCheckpoints", content."Uploads", content."DeletionProposals", content."QuarantinedFiles",
        content."Documents", content."NodeOutputs", content."ChunkSets", content."Chunks", content."EmbeddingCache",
        content."Runs", content."ParseObservations", content."ParseProfiles", content."BlobTombstones" TO kalla_worker;
      GRANT SELECT ON content."NodeManifest", content."WorkerNodeSupport", content."CrawlHosts", content."SiteProfiles",
        content."SiteProfileVersions", content."CrawlFrontier", content."CrawlRuns", content."ConnectorCheckpoints",
        content."Uploads", content."DeletionProposals", content."QuarantinedFiles", content."Documents", content."NodeOutputs",
        content."ChunkSets", content."Chunks", content."EmbeddingCache", content."Runs", content."ParseObservations",
        content."ParseProfiles", content."BlobTombstones" TO kalla_admin;
      -- The admin tombstones the upload blobs it replaces or deletes, in the transaction of its own change (issue #34).
      GRANT INSERT ON content."BlobTombstones" TO kalla_admin;
      -- The api searches chunks and reads the documents' citation columns only (knowledge design §3.5); "Language" and
      -- "FetchedAt" for statement D and the citation fields (knowledge design §6.3, §10.1); "CanonicalIdentity" (the upload
      -- slot) and "ContentHash" for the blob key and ETag of the document content route (knowledge design §3.5).
      GRANT SELECT ON content."ChunkSets", content."Chunks" TO kalla_api;
      -- The keyword stop list's statistics (knowledge design 6.2, #499): the worker keeps them, kalla-api and the admin read them.
      GRANT SELECT, INSERT, UPDATE, DELETE ON content."KeywordStatistics" TO kalla_worker;
      GRANT SELECT ON content."KeywordStatistics" TO kalla_api, kalla_admin;
      GRANT SELECT ("Id", "SourceId", "Classification", "IdentityKind", "IdentityHash", "Title", "Url", "MediaType",
        "DisplayName", "SourceModifiedAt", "PageCount", "LiveChunkSetId", "DeletedAt", "Language", "FetchedAt",
        "CanonicalIdentity", "ContentHash")
        ON content."Documents" TO kalla_api;
      -- Evaluation and retrieval counters (data-model §1.2, §12.2, §12.3): the worker writes them; the admin reads them and
      -- writes runs and results itself for the answer-level runs it executes (P2 kinds); the api counts retrievals only
      -- through content.rag_count_retrievals.
      GRANT SELECT, INSERT, UPDATE, DELETE ON content."EvaluationSets", content."EvaluationQuestions", content."EvaluationRuns",
        content."EvaluationResults", content."RetrievalStats" TO kalla_worker;
      GRANT SELECT ON content."EvaluationSets", content."EvaluationQuestions", content."EvaluationRuns", content."EvaluationResults",
        content."RetrievalStats" TO kalla_admin;
      GRANT INSERT, UPDATE ON content."EvaluationRuns", content."EvaluationResults" TO kalla_admin;
      -- Tokens and cost of the worker's model calls per knowledge base and step (data-model §2.2; cost-attribution §5 C3): the
      -- worker writes them, the admin reads them for its cost report.
      GRANT SELECT, INSERT, UPDATE, DELETE ON content."CollectionDailyUsage" TO kalla_worker;
      GRANT SELECT ON content."CollectionDailyUsage" TO kalla_admin;

      -- chat (data-model §1.2, §2.3): the api owns it; the admin reads it and marks feedback reviewed (admin design §8.1); the
      -- worker has no access to the schema. P1 writes metadata and ratings only (weakness review §4).
      GRANT SELECT, INSERT, UPDATE, DELETE ON chat."Conversations", chat."DataKeys", chat."Messages", chat."MessageSources",
        chat."Feedback", chat."ToolCalls", chat."AssistantDailyTotals", chat."FeedbackImportState" TO kalla_api;
      GRANT SELECT ON chat."Conversations", chat."DataKeys", chat."Messages", chat."MessageSources", chat."Feedback",
        chat."ToolCalls", chat."AssistantDailyTotals", chat."FeedbackImportState" TO kalla_admin;
      GRANT UPDATE ("ReviewState") ON chat."Feedback" TO kalla_admin;
      -- Tokens and cost of every model call per assistant, client and step (data-model §2.3; chat design §8.3, §12.2): the api's
      -- conversation writer upserts them; the admin upserts the test panel's calls too (admin design §4.9).
      GRANT SELECT, INSERT, UPDATE, DELETE ON chat."AssistantDailyUsage" TO kalla_api;
      GRANT SELECT, INSERT, UPDATE ON chat."AssistantDailyUsage" TO kalla_admin;

      -- audit: every service appends, only the admin reads; no role deletes (retention runs through step functions).
      GRANT INSERT ON audit."AuditLog" TO kalla_api, kalla_admin, kalla_worker;
      -- The HNSW index-health rebuild (knowledge design §6.4): REINDEX INDEX CONCURRENTLY needs MAINTAIN (Postgres 17).
      GRANT MAINTAIN ON content."Chunks" TO kalla_worker;
      GRANT SELECT ON audit."AuditLog" TO kalla_admin;

      -- Functions (data-model §1.2). The keyword query function calls the aggregate with the caller's rights.
      REVOKE ALL ON ALL FUNCTIONS IN SCHEMA config, content, chat, audit FROM kalla_api, kalla_admin, kalla_worker;
      GRANT EXECUTE ON FUNCTION content.rag_or_query(tsvector), content.rag_tsquery_or_agg(tsquery)
        TO kalla_api, kalla_admin, kalla_worker;
      GRANT EXECUTE ON FUNCTION content.rag_partition_maintain(), content.rag_ensure_profile_index(uuid, integer) TO kalla_worker;
      -- The worker's nightly content retention (data-model §8): the ages and minimums live in the function.
      GRANT EXECUTE ON FUNCTION content.rag_retention_content_step(integer) TO kalla_worker;
      -- Editable embedding profiles (admin design 4.5): the admin resets an unused profile's cache and index after a change;
      -- the worker inserts a chunk set only while the profile still has the values it embedded with (row held FOR SHARE).
      GRANT EXECUTE ON FUNCTION content.rag_reset_profile(uuid) TO kalla_admin;
      GRANT EXECUTE ON FUNCTION content.rag_lock_profile_if_unchanged(uuid, text, integer, boolean) TO kalla_worker;
      GRANT EXECUTE ON FUNCTION config.rag_retention_config_step(integer) TO kalla_admin;
      GRANT EXECUTE ON FUNCTION chat.rag_retention_chat_step(integer) TO kalla_admin;
      GRANT EXECUTE ON FUNCTION content.rag_count_retrievals(date, uuid[], bytea[], uuid[], character varying[], integer[], integer[])
        TO kalla_api;
      COMMIT;
  kalla-openwebui-setup-script:
    content: |
      #!/usr/bin/env python3
      """The feedback service account's Open WebUI API key, minted without password sign-in (M-17 C6).

      kalla-api's feedback import (chat design §13.3) reads Open WebUI's feedback list with this key. Open WebUI's password
      sign-in stays off, so this one-shot job, run in Open WebUI's own image after it starts, mints the key the way Open WebUI's
      own session does it:

        1. the service account's id and session stamp from Open WebUI's SQLite store, read-only (by WEBUI_ADMIN_EMAIL);
        2. a 5-minute session JWT (HS256, {id, session_stamp, typ: session}) signed with Open WebUI's WEBUI_SECRET_KEY;
        3. POST /api/v1/auths/api_key with it, which mints the account's `sk-` key (a new one replaces the old);
        4. the key is checked on the feedback list (API_KEYS_ALLOWED_ENDPOINTS limits it to the feedback routes) and written
           as OpenWebUi__AdminApiKey into the directory kalla-api reads it from (mode 0640; kalla-api reloads it).

      A key that still works is kept, so the job runs on every deploy. A new key: delete the file and deploy again.
      Checked against Open WebUI v0.12.5 (the spike on #667): the claims and tables are Open WebUI's internals, so an Open WebUI
      upgrade re-runs the boot test (deploy/tests/portainer-boot.sh) before its pin moves.

      Environment:
        WEBUI_ADMIN_EMAIL         the service account (Open WebUI creates it on an empty store from the same variable)
        OWUI_URL                  where this job reaches Open WebUI       [http://kalla-openwebui:8080]
        OWUI_DB                   Open WebUI's SQLite store                [/data/webui.db]
        OWUI_SECRET_KEY_FILE      Open WebUI's WEBUI_SECRET_KEY            [/run/owui-secrets/webui_secret_key]
        FEEDBACK_KEY_FILE         where the key goes                       [/run/feedback/OpenWebUi__AdminApiKey]
        OWUI_WAIT_SECONDS         how long to wait for Open WebUI to start [600]
      """

      import base64
      import hashlib
      import hmac
      import json
      import os
      import sqlite3
      import sys
      import time
      import urllib.error
      import urllib.request
      import uuid

      URL = os.environ.get("OWUI_URL", "http://kalla-openwebui:8080").rstrip("/")
      DB = os.environ.get("OWUI_DB", "/data/webui.db")
      SECRET_FILE = os.environ.get("OWUI_SECRET_KEY_FILE", "/run/owui-secrets/webui_secret_key")
      KEY_FILE = os.environ.get("FEEDBACK_KEY_FILE", "/run/feedback/OpenWebUi__AdminApiKey")
      WAIT = int(os.environ.get("OWUI_WAIT_SECONDS", "600"))
      FEEDBACK_LIST = "/api/v1/evaluations/feedbacks/list"


      def log(message):
          print(f"kalla-openwebui-setup: {message}", flush=True)


      def fail(message):
          log(f"error: {message}")
          sys.exit(1)


      def request(method, path, token):
          """The HTTP status and body of one call to Open WebUI with a bearer token."""
          req = urllib.request.Request(URL + path, method=method, headers={"Authorization": f"Bearer {token}"})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.status, response.read()
          except urllib.error.HTTPError as error:
              return error.code, error.read()


      def works(key):
          return request("GET", FEEDBACK_LIST, key)[0] == 200


      def b64(data):
          return base64.urlsafe_b64encode(data).rstrip(b"=")


      def session_token(user_id, stamp, secret):
          """An HS256 session JWT as Open WebUI's create_token writes it (utils/auth.py), valid for 5 minutes."""
          now = int(time.time())
          header = b64(json.dumps({"alg": "HS256", "typ": "JWT"}, separators=(",", ":")).encode())
          claims = {"id": user_id, "session_stamp": stamp, "typ": "session", "auth_method": "password", "iat": now,
                    "exp": now + 300, "jti": str(uuid.uuid4())}
          payload = b64(json.dumps(claims, separators=(",", ":")).encode())
          signature = b64(hmac.new(secret.encode(), header + b"." + payload, hashlib.sha256).digest())
          return (header + b"." + payload + b"." + signature).decode()


      def wait_for_open_webui():
          deadline = time.monotonic() + WAIT
          while True:
              try:
                  with urllib.request.urlopen(URL + "/health", timeout=10) as response:
                      if response.status == 200:
                          return
              except (urllib.error.URLError, OSError):
                  pass
              if time.monotonic() > deadline:
                  fail(f"Open WebUI did not answer {URL}/health within {WAIT} s")
              time.sleep(5)


      def account(email):
          """The service account's id and session stamp, read-only; the store's WAL needs a writable directory, not a write."""
          with sqlite3.connect(f"file:{DB}?mode=ro", uri=True, timeout=30) as db:
              row = db.execute(
                  'SELECT u.id, u.role, a.session_stamp FROM "user" u JOIN auth a ON a.id = u.id WHERE lower(u.email) = lower(?)',
                  (email,),
              ).fetchone()
          if row is None:
              fail(f"no Open WebUI account {email}: Open WebUI creates it from WEBUI_ADMIN_EMAIL only on an empty store")
          if row[1] != "admin":
              fail(f"the Open WebUI account {email} has the role {row[1]}, not admin")
          return row[0], row[2]


      def write_key(key):
          directory = os.path.dirname(KEY_FILE)
          # KeyPerFile skips the "ignore." prefix, so kalla-api never reads the half-written file.
          temporary = os.path.join(directory, f"ignore.{os.path.basename(KEY_FILE)}.tmp")
          fd = os.open(temporary, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o640)
          with os.fdopen(fd, "w") as file:
              file.write(key)
          os.chmod(temporary, 0o640)
          os.replace(temporary, KEY_FILE)


      def main():
          email = os.environ.get("WEBUI_ADMIN_EMAIL", "").strip()
          if not email:
              fail("WEBUI_ADMIN_EMAIL is not set")
          wait_for_open_webui()
          if os.path.exists(KEY_FILE):
              with open(KEY_FILE) as file:
                  current = file.read().strip()
              if current and works(current):
                  log("the feedback key works; kept")
                  return
              log("the feedback key is refused; minting a new one")
          with open(SECRET_FILE) as file:
              secret = file.read().strip()
          if not secret:
              fail(f"{SECRET_FILE} is empty")
          user_id, stamp = account(email)
          status, body = request("POST", "/api/v1/auths/api_key", session_token(user_id, stamp, secret))
          if status != 200:
              fail(f"Open WebUI refused to mint the key (HTTP {status}): {body[:200].decode(errors='replace')}")
          key = json.loads(body).get("api_key") or ""
          if not key.startswith("sk-"):
              fail("Open WebUI answered without an sk- key")
          if not works(key):
              fail("the new key is refused on the feedback list: check API_KEYS_ALLOWED_ENDPOINTS")
          write_key(key)
          log(f"minted the feedback key for {email}; kalla-api reads it within seconds")


      if __name__ == "__main__":
          main()
  kalla-openwebui-start-script:
    content: |
      #!/usr/bin/env python3
      """Open WebUI's start with its sign-in settings from kalla-api (identity design §19, "Open WebUI").

      Open WebUI reads its OIDC settings only from its environment, and ENABLE_PERSISTENT_CONFIG=false makes that environment the
      truth on every start. The settings live in kalla-api (the deployment's OpenWebUi:Oidc:*, else the setup wizard's), so this
      wrapper is the container's entrypoint:

        1. with --secrets-dir, the user-JWT secret, the feedback service account's password and the key for kalla-api are read from
           their files into the environment (FORWARD_USER_INFO_HEADER_JWT_SECRET, WEBUI_ADMIN_PASSWORD, OPENAI_API_KEYS); without
           it they are already in the environment (Compose's env file);
        2. GET kalla-api's internal route with that key (TLS verified against SSL_CERT_FILE when set), for up to
           KALLA_SIGN_IN_WAIT seconds while kalla-api starts;
        3. configured: ENABLE_OAUTH_SIGNUP=true, OAUTH_CLIENT_ID, OPENID_PROVIDER_URL, OAUTH_PROVIDER_NAME, and OAUTH_CLIENT_SECRET
           (a public client without one gets OAUTH_CODE_CHALLENGE_METHOD=S256, which Open WebUI v0.12.5 requires instead of a
           secret, config.py load_oauth_providers). Not configured, or no answer: ENABLE_OAUTH_SIGNUP=false and no provider, so
           Open WebUI offers no sign-in (password sign-in stays off) and nobody can sign in. Any of these variables set from
           outside is dropped first;
        4. Open WebUI starts as a child (the command after --, default: bash start.sh); SIGTERM and SIGINT are passed to it, and
           the wrapper exits with its exit code;
        5. every KALLA_SIGN_IN_POLL seconds it asks again. A changed answer stops the child and exits 3, so the container's
           restart policy starts it again with the new values. A failed call changes nothing; a start without an answer
           restarts only when an answer turns out configured.

      Nothing of the answer is ever written to the output: no value, no secret, no response body.

      Environment:
        KALLA_SIGN_IN_URL    kalla-api's route         [https://kalla-api:8443/internal/openwebui/sign-in]
        KALLA_SIGN_IN_WAIT   seconds to wait at start [60]
        KALLA_SIGN_IN_POLL   seconds between calls    [60]
        SSL_CERT_FILE          the CA bundle that verifies kalla-api (in the Portainer stack, RAG's CA among the public ones)
      """

      import json
      import os
      import signal
      import ssl
      import subprocess
      import sys
      import time
      import urllib.error
      import urllib.request

      URL = os.environ.get("KALLA_SIGN_IN_URL", "https://kalla-api:8443/internal/openwebui/sign-in")
      WAIT = int(os.environ.get("KALLA_SIGN_IN_WAIT", "60"))
      POLL = int(os.environ.get("KALLA_SIGN_IN_POLL", "60"))
      SECRET_FILES = {
          "FORWARD_USER_INFO_HEADER_JWT_SECRET": "jwt-secret",
          "WEBUI_ADMIN_PASSWORD": "admin-password",
          "OPENAI_API_KEYS": "rag-api-key",
      }
      SIGN_IN_VARIABLES = ("ENABLE_OAUTH_SIGNUP", "OAUTH_CLIENT_ID", "OAUTH_CLIENT_SECRET", "OAUTH_CODE_CHALLENGE_METHOD",
                           "OPENID_PROVIDER_URL", "OAUTH_PROVIDER_NAME")
      CHANGED_EXIT = 3
      MAX_ANSWER = 64 * 1024


      def log(message):
          print(f"kalla-openwebui: {message}", flush=True)


      class _NoRedirect(urllib.request.HTTPRedirectHandler):
          """A redirect is a failed call: the key is never sent anywhere else."""

          def redirect_request(self, req, fp, code, msg, headers, newurl):
              return None


      def read_secrets(environment, directory):
          """The secret files of --secrets-dir into the environment, as the stack's former shell wrapper read them."""
          for name, file in SECRET_FILES.items():
              with open(os.path.join(directory, file), encoding="utf-8") as handle:
                  environment[name] = handle.read().strip()


      def parse(body):
          """kalla-api's answer, checked; ValueError when it is not one."""
          answer = json.loads(body)
          if not isinstance(answer, dict) or not isinstance(answer.get("configured"), bool):
              raise ValueError("no configured member")
          version = answer.get("version")
          if not isinstance(version, str) or not 0 < len(version) <= 200:
              raise ValueError("no version")
          if answer["configured"]:
              url = answer.get("provider_url")
              if not isinstance(url, str) or not url.startswith(("https://", "http://")):
                  raise ValueError("no provider address")
              for name in ("client_id", "provider_name"):
                  if not isinstance(answer.get(name), str) or not answer[name]:
                      raise ValueError(f"no {name}")
              if answer.get("client_secret") is not None and not isinstance(answer["client_secret"], str):
                  raise ValueError("client_secret is not text")
          return answer


      def fetch(key, context):
          """The parsed answer, or None when kalla-api could not be asked or did not answer well."""
          request = urllib.request.Request(URL, headers={"Authorization": f"Bearer {key}", "Accept": "application/json"})
          opener = urllib.request.build_opener(_NoRedirect(), urllib.request.HTTPSHandler(context=context))
          try:
              with opener.open(request, timeout=10) as response:
                  return parse(response.read(MAX_ANSWER + 1)[:MAX_ANSWER])
          except (urllib.error.URLError, OSError, ValueError):
              return None


      def sign_in_environment(environment, answer):
          """The child's environment: the sign-in variables from the answer, none from outside."""
          child = {k: v for k, v in environment.items() if k not in SIGN_IN_VARIABLES}
          if answer is None or not answer["configured"]:
              child["ENABLE_OAUTH_SIGNUP"] = "false"
              return child
          child.update({
              "ENABLE_OAUTH_SIGNUP": "true",
              "OAUTH_CLIENT_ID": answer["client_id"],
              "OPENID_PROVIDER_URL": answer["provider_url"],
              "OAUTH_PROVIDER_NAME": answer["provider_name"],
          })
          if answer.get("client_secret"):
              child["OAUTH_CLIENT_SECRET"] = answer["client_secret"]
          else:
              child["OAUTH_CODE_CHALLENGE_METHOD"] = "S256"
          return child


      def changed(started, answer):
          """Whether a new answer means a restart: another version, or the first answer after a start without one, if configured."""
          return answer["configured"] if started is None else answer["version"] != started["version"]


      def exit_code(returncode):
          """A child ended by a signal exits as a shell reports it (128 + the signal)."""
          return 128 - returncode if returncode < 0 else returncode


      def self_test():
          """The pure parts, without kalla-api or Open WebUI: --self-test."""
          on = parse(b'{"configured":true,"provider_url":"https://idp/x","client_id":"c","client_secret":"s","provider_name":"N","version":"v1"}')
          public = dict(on, client_secret=None)
          off = parse(b'{"configured":false,"provider_url":null,"client_id":null,"client_secret":null,"provider_name":null,"version":"v0"}')
          outside = {"OAUTH_CLIENT_SECRET": "old", "PATH": "/bin"}
          assert sign_in_environment(outside, on)["OAUTH_CLIENT_SECRET"] == "s"
          assert "OAUTH_CODE_CHALLENGE_METHOD" not in sign_in_environment(outside, on)
          assert sign_in_environment(outside, public)["OAUTH_CODE_CHALLENGE_METHOD"] == "S256"
          assert "OAUTH_CLIENT_SECRET" not in sign_in_environment(outside, public)
          assert sign_in_environment(outside, off) == {"PATH": "/bin", "ENABLE_OAUTH_SIGNUP": "false"}
          assert sign_in_environment(outside, None) == {"PATH": "/bin", "ENABLE_OAUTH_SIGNUP": "false"}
          assert changed(on, dict(on, version="v2")) and not changed(on, on)
          assert changed(None, on) and not changed(None, off)
          for bad in (b"[]", b'{"configured":true,"version":"v"}', b'{"configured":"yes","version":"v"}', b"not json"):
              try:
                  parse(bad)
                  raise AssertionError(bad)
              except ValueError:
                  pass
          assert exit_code(-15) == 143 and exit_code(3) == 3
          log("self-test passed")


      def main(argv):
          if argv[:1] == ["--self-test"]:
              self_test()
              return 0
          environment = dict(os.environ)
          if argv[:1] == ["--secrets-dir"]:
              read_secrets(environment, argv[1])
              argv = argv[2:]
          command = argv[1:] if argv[:1] == ["--"] else ["bash", "start.sh"]
          key = environment.get("OPENAI_API_KEYS", "")
          context = ssl.create_default_context(cafile=os.environ.get("SSL_CERT_FILE") or None)

          deadline = time.monotonic() + WAIT
          started = fetch(key, context)
          while started is None and time.monotonic() < deadline:
              time.sleep(2)
              started = fetch(key, context)
          if started is None:
              log(f"kalla-api did not answer within {WAIT} s: starting without OIDC sign-in; nobody can sign in until it answers")
          elif started["configured"]:
              log("starting with OIDC sign-in from kalla-api's sign-in settings")
          else:
              log("no sign-in settings yet (kalla-admin's setup wizard, or the deployment's KALLA_OPENWEBUI_OIDC_*): starting without OIDC sign-in; nobody can sign in")

          child = subprocess.Popen(command, env=sign_in_environment(environment, started))

          def forward(signum, _frame):
              child.send_signal(signum)

          signal.signal(signal.SIGTERM, forward)
          signal.signal(signal.SIGINT, forward)
          while True:
              try:
                  return exit_code(child.wait(timeout=POLL))
              except subprocess.TimeoutExpired:
                  pass
              answer = fetch(key, context)
              if answer is None:
                  continue
              if changed(started, answer):
                  log("sign-in settings changed; restarting")
                  child.terminate()
                  try:
                      child.wait(timeout=60)
                  except subprocess.TimeoutExpired:
                      child.kill()
                      child.wait()
                  return CHANGED_EXIT
              started = answer if started is None else started


      if __name__ == "__main__":
          sys.exit(main(sys.argv[1:]))
  kalla-proxy-conf-template:
    content: |
      # The Portainer stack's TLS proxy (profile proxy; M-17 C8, Decisions "Deploy configuration" D9): nginx in front of the
      # gateway, its admin, kalla-api, kalla-admin and Open WebUI, with the operator's certificate. kalla-bootstrap fills in the
      # @placeholders@ from the stack's host names and writes kalla-config/proxy/nginx.conf; it drops the blocks marked
      # #gwadmin, #ragadmin or #owui when that host has no name of its own (or the openwebui profile is off). Routes and body
      # sizes as the gateway's and Källa's nginx.conf.example; every upstream but Open WebUI (plain HTTP inside the stack)
      # is re-encrypted and verified against its internal CA.
      worker_processes auto;
      pid /tmp/nginx.pid;
      error_log /dev/stderr warn;

      events {
          worker_connections 1024;
      }

      http {
          access_log /dev/stdout;
          client_body_temp_path /tmp/client_temp;
          proxy_temp_path /tmp/proxy_temp;
          fastcgi_temp_path /tmp/fastcgi_temp;
          uwsgi_temp_path /tmp/uwsgi_temp;
          scgi_temp_path /tmp/scgi_temp;
          server_tokens off;

          # One certificate for every name (a SAN or wildcard certificate): KALLA_PROXY_CERTS_DIR/tls.crt and tls.key.
          ssl_certificate /run/proxy-certs/tls.crt;
          ssl_certificate_key /run/proxy-certs/tls.key;
          ssl_protocols TLSv1.2 TLSv1.3;

          # WebSocket upgrade (the gateway's live audio, Open WebUI's live connection); other requests keep the pooled
          # keep-alive connection.
          map $$http_upgrade $$ume_connection { default upgrade; '' ''; }

          # Docker's embedded DNS, asked again every 10 s: a stack update recreates a service with a new address on its network
          # while this proxy keeps running, and a name resolved only at start would then answer 502 until a restart. With
          # "resolve" (nginx 1.27.3 and later) each upstream follows its service's current address, and a service that isn't up
          # yet (kalla-openwebui, which depends_on can't name across profiles) doesn't stop nginx from starting.
          resolver 127.0.0.11 valid=10s ipv6=off;
          resolver_timeout 5s;

          upstream ume_gateway { zone ume_gateway 64k; server gateway:8443 resolve; keepalive 32; }
          upstream ume_admin { zone ume_admin 64k; server adminapi:8443 resolve; }
          upstream kalla_api { zone kalla_api 64k; server kalla-api:8443 resolve; keepalive 32; }
          upstream kalla_admin { zone kalla_admin 64k; server kalla-admin:8443 resolve; }
      #owui    upstream kalla_openwebui { zone kalla_openwebui 64k; server kalla-openwebui:8080 resolve; }

          # A name this proxy doesn't serve gets no answer.
          server {
              listen 8443 ssl default_server;
              http2 on;
              return 444;
          }

          # The gateway (its deploy/proxy/nginx.conf.example).
      #gateway    server {
      #gateway        listen 8443 ssl;
      #gateway        http2 on;
      #gateway        server_name @GATEWAY_HOST@;
      #gateway        client_max_body_size 52m;          # image edits (gateway default 50 MB), audio uploads (26 MB), documents
      #gateway        location / {
      #gateway            proxy_pass https://ume_gateway;
      #gateway            proxy_http_version 1.1;
      #gateway            proxy_set_header Upgrade $$http_upgrade;
      #gateway            proxy_set_header Connection $$ume_connection;
      #gateway            proxy_set_header Host $$host;
      #gateway            # List this proxy under the gateway admin's Settings > Trusted proxies, or the gateway ignores the header.
      #gateway            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
      #gateway            proxy_buffering off;           # stream tokens as they arrive (SSE)
      #gateway            proxy_request_buffering off;   # uploads straight through: no recordings in proxy temp files
      #gateway            proxy_read_timeout 600s;
      #gateway            proxy_send_timeout 600s;
      #gateway            proxy_connect_timeout 5s;
      #gateway            proxy_ssl_verify on;
      #gateway            proxy_ssl_trusted_certificate /etc/nginx/kalla/gateway-ca.pem;
      #gateway            proxy_ssl_name gateway;
      #gateway            proxy_ssl_server_name on;
      #gateway        }
      #gateway    }

          # The gateway's admin UI and API.
      #gwadmin    server {
      #gwadmin        listen 8443 ssl;
      #gwadmin        http2 on;
      #gwadmin        server_name @ADMIN_HOST@;
      #gwadmin        location / {
      #gwadmin            proxy_pass https://ume_admin;
      #gwadmin            proxy_http_version 1.1;
      #gwadmin            proxy_set_header Host $$host;
      #gwadmin            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
      #gwadmin            proxy_connect_timeout 5s;
      #gwadmin            proxy_ssl_verify on;
      #gwadmin            proxy_ssl_trusted_certificate /etc/nginx/kalla/gateway-ca.pem;
      #gwadmin            proxy_ssl_name adminapi;
      #gwadmin            proxy_ssl_server_name on;
      #gwadmin        }
      #gwadmin    }

          # kalla-api: chat completions (streamed), knowledge, MCP, the OpenAI-compatible model list.
      #ragapi    server {
      #ragapi        listen 8443 ssl;
      #ragapi        http2 on;
      #ragapi        server_name @API_HOST@;
      #ragapi        client_max_body_size 2m;           # questions and chat history (kalla-api's chat route takes up to 2 MB)
      #ragapi        # kalla-api's internal routes (Open WebUI's sign-in settings) are for the stack's own network only.
      #ragapi        location /internal/ { return 404; }
      #ragapi        location / {
      #ragapi            proxy_pass https://kalla_api;
      #ragapi            proxy_http_version 1.1;
      #ragapi            proxy_set_header Connection '';
      #ragapi            proxy_set_header Host $$host;
      #ragapi            # List this proxy under Källa's Settings > Network (trusted proxies), or kalla-api ignores the header.
      #ragapi            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
      #ragapi            proxy_buffering off;           # stream answer tokens as they arrive (SSE)
      #ragapi            proxy_read_timeout 600s;
      #ragapi            proxy_send_timeout 600s;
      #ragapi            proxy_connect_timeout 5s;
      #ragapi            proxy_ssl_verify on;
      #ragapi            proxy_ssl_trusted_certificate /etc/nginx/kalla/rag-ca.pem;
      #ragapi            proxy_ssl_name kalla-api;
      #ragapi            proxy_ssl_server_name on;
      #ragapi        }
      #ragapi    }

          # kalla-admin: the admin UI and its API (BFF).
      #ragadmin    server {
      #ragadmin        listen 8443 ssl;
      #ragadmin        http2 on;
      #ragadmin        server_name @RAG_ADMIN_HOST@;
      #ragadmin        client_max_body_size 1m;
      #ragadmin        location / {
      #ragadmin            proxy_pass https://kalla_admin;
      #ragadmin            proxy_http_version 1.1;
      #ragadmin            proxy_set_header Host $$host;
      #ragadmin            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
      #ragadmin            proxy_connect_timeout 5s;
      #ragadmin            proxy_ssl_verify on;
      #ragadmin            proxy_ssl_trusted_certificate /etc/nginx/kalla/rag-ca.pem;
      #ragadmin            proxy_ssl_name kalla-admin;
      #ragadmin            proxy_ssl_server_name on;
      #ragadmin        }
      #ragadmin        # Uploads (admin design §2.2): one file per request, up to 60 MB, passed straight through.
      #ragadmin        location ~ ^/api/upload-batches/[0-9a-fA-F-]+/files/[0-9]+$$ {
      #ragadmin            client_max_body_size 60m;
      #ragadmin            proxy_request_buffering off;
      #ragadmin            proxy_pass https://kalla_admin;
      #ragadmin            proxy_http_version 1.1;
      #ragadmin            proxy_set_header Host $$host;
      #ragadmin            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
      #ragadmin            proxy_read_timeout 300s;
      #ragadmin            proxy_send_timeout 300s;
      #ragadmin            proxy_connect_timeout 5s;
      #ragadmin            proxy_ssl_verify on;
      #ragadmin            proxy_ssl_trusted_certificate /etc/nginx/kalla/rag-ca.pem;
      #ragadmin            proxy_ssl_name kalla-admin;
      #ragadmin            proxy_ssl_server_name on;
      #ragadmin        }
      #ragadmin    }

          # Open WebUI (profile openwebui): plain HTTP inside the stack; this proxy terminates TLS.
      #owui    server {
      #owui        listen 8443 ssl;
      #owui        http2 on;
      #owui        server_name @OPENWEBUI_HOST@;
      #owui        client_max_body_size 2m;       # the whole conversation goes to kalla-api (2 MB); file uploads are off
      #owui        location / {
      #owui            proxy_pass http://kalla_openwebui;
      #owui            proxy_http_version 1.1;
      #owui            proxy_set_header Upgrade $$http_upgrade;
      #owui            proxy_set_header Connection $$ume_connection;
      #owui            proxy_set_header Host $$host;
      #owui            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
      #owui            proxy_set_header X-Forwarded-Proto https;
      #owui            proxy_buffering off;       # stream answers
      #owui            proxy_read_timeout 600s;
      #owui            proxy_send_timeout 600s;
      #owui            proxy_connect_timeout 5s;
      #owui        }
      #owui    }
      }

networks:
  edge: {driver: bridge}
  data: {driver: bridge, internal: true}
  llm: {driver: bridge}
  kalla-edge: {driver: bridge}
  kalla-data: {driver: bridge, internal: true}
  kalla-ingestion: {driver: bridge, internal: true}
  kalla-parser: {driver: bridge, internal: true}
  kalla-render: {driver: bridge, internal: true}
  kalla-crawl: {driver: bridge}
  kalla-mirror: {driver: bridge}

volumes:
  postgres-data:
  fors-certs:
  fors-secrets:
  fors-config:
  # Before the rename to Fors (0.11 and earlier); copied once into fors-certs and fors-secrets, then unused (until 0.13).
  ume-certs:
  ume-secrets:
  # Credential key secrets from FORS_INTEGRATION_MANIFEST, for a platform's bootstrap in the same stack only.
  integration-secrets:
  kalla-postgres-data:
  kalla-openwebui-data:
  kalla-certs:
  kalla-secrets:
  kalla-config:
  kalla-blobs:
  kalla-clamav-db:
  # Before the rename to Källa (0.8 and earlier): copied once into the kalla-* volumes by kalla-bootstrap, then unused.
  # Remove them once the stack runs (docs/upgrade-guide.md, "0.9.0"); in a new stack they stay empty.
  rag-postgres-data:
  rag-openwebui-data:
  rag-certs:
  rag-secrets:
  rag-blobs:
