# The RAG part of compose.portainer.yaml. deploy/portainer/build-stack.sh adds each section below to the same section of
# the gateway's deploy/compose.portainer.yaml (taken unchanged) and inlines the "@INCLUDE path" lines, so the gateway
# and RAG run as one Portainer stack. Every RAG name starts with rag- (services, networks, volumes, configs): nothing
# of the gateway's is renamed, and its volumes keep their names. rag-api, rag-admin and rag-worker join the gateway's
# llm network to reach https://gateway:8443, trusting the gateway's CA. rag-admin's organisation and model syncs call
# the gateway there too (/v1/ume/context and /v1/models, with its credential key).
#
# Differences from compose.prod.yaml + compose.ingestion.yaml, for a host without deploy/host/ and init-deployment.sh:
# no fixed subnets and no host firewall, no ingestion slice (cgroup_parent), no pgBackRest (archive_mode off: back up
# with pg_dump or volume snapshots), and the renderer behind the render profile (it needs a seccomp profile Portainer
# cannot read from a file; see rag-renderer).

@SECTION header
#
# ---- Ume Rag (added by the RAG repository's deploy/portainer/build-stack.sh) ------------------------------------------
# The same stack also runs Ume Rag: rag-postgres, rag-migrate, rag-api (8543), rag-admin (9543), rag-worker,
# rag-parser and, with their profiles in COMPOSE_PROFILES, rag-clamav (clamav) and rag-renderer (render). Its one-shot
# rag-bootstrap creates RAG's certificates and secrets in the volumes <stack>_rag-certs and <stack>_rag-secrets on first
# start. Keep the stack name: the gateway's volumes are found by it.
#
# Start from deploy/portainer/stack.env.example (Portainer: "Load variables from .env file"); after each deploy the end
# of rag-bootstrap's log lists what is still missing. The gateway's image variables above are not needed: this file pins
# them (built from a gateway release). Steps: docs/portainer.md.
#
# Required variables (besides the gateway's above)
#   UME_RAG_API_HOST          public hostname of rag-api (for example rag.example.se)
#   UME_RAG_API_GATEWAY_KEY, UME_RAG_ADMIN_GATEWAY_KEY, UME_RAG_WORKER_GATEWAY_KEY
#                             each service's credential key of the gateway integration Ume.Rag (a gateway admin issues
#                             them, docs/production-setup.md in the RAG repository, "Gateway credential keys"); without
#                             one the stack starts but that service's model calls are refused. To add or rotate one,
#                             change it and update the stack: the services pick it up within seconds, no restart.
# Recommended
#   COMPOSE_PROFILES=clamav   rag-clamav, the malware scan: the worker scans with it while the profile is on, and
#                             without it stores files unscanned and marked so (rag-bootstrap sets ClamAv__Mode)
#   UME_RAG_OIDC_CLIENT_SECRET  RAG admin's own OIDC client (UME_RAG_OIDC_CLIENT_ID, ume-rag-admin) at the gateway's
#                             UME_OIDC_AUTHORITY (UME_RAG_OIDC_AUTHORITY to use another); redirect URIs
#                             https://<UME_RAG_ADMIN_HOST>:<port>/signin-oidc and /signout-callback-oidc
# Optional
#   UME_RAG_API_PUBLIC_URL    rag-api's public URL when it is not https://<UME_RAG_API_HOST> (a port:
#                             https://rag.example.se:8543); citation links are absolute
#   UME_RAG_OIDC_GROUPS_PLATFORM_ADMIN / _DEPARTMENT_ADMIN / _PIPELINE_EDITOR / _REVIEWER / _VIEWER
#                             groups that grant a RAG role (';'-separated), for an identity provider whose tokens carry
#                             groups instead of the roles (rag-platform-admin, ...) in the roles claim; empty grants
#                             nothing
#   UME_RAG_ADMIN_HOST (UME_RAG_API_HOST), UME_RAG_API_PORT (8543), UME_RAG_ADMIN_PORT (9543), UME_RAG_*_BIND (0.0.0.0)
#   UME_RAG_CRAWL_ALLOW (private CIDRs the crawler may fetch). The residency ceiling is each credential key's own
#                             residencies in the gateway (register M2: OnPrem and Eu)
#   UME_RAG_GATEWAY_INTEGRATION_API_URL  the gateway's cost and budget read-back in RAG's admin UI: the gateway admin
#                             API's URL as rag-admin reaches it, https://<UME_ADMIN_HOST>:<UME_ADMIN_PORT, 9443> (adminapi
#                             is not on llm); UME_RAG_ADMIN_GATEWAY_KEY needs the scope usage.read. Unset: no read-back
#   COMPOSE_PROFILES=clamav,render  also the renderer for JavaScript-rendered pages (see rag-renderer)
#   COMPOSE_PROFILES=clamav,openwebui  also rag-openwebui, Open WebUI as the chat for users, on plain HTTP at
#                             UME_RAG_OPENWEBUI_BIND (127.0.0.1):UME_RAG_OPENWEBUI_PORT (3000) for a TLS proxy in front
#                             (it sets Secure cookies, so users reach it over HTTPS only). It calls rag-api inside the
#                             stack. Set with it:
#     UME_RAG_OPENWEBUI_HOST      its public hostname (chat.example.se)
#     UME_RAG_OPENWEBUI_OIDC_CLIENT_ID, UME_RAG_OPENWEBUI_OIDC_CLIENT_SECRET  its OIDC client; redirect URI
#                             https://<UME_RAG_OPENWEBUI_HOST>/oauth/oidc/login/callback. The provider is
#                             UME_RAG_OPENWEBUI_OIDC_PROVIDER_URL, default <UME_OIDC_AUTHORITY>/.well-known/openid-configuration
#                             Open WebUI's key for rag-api is generated by rag-bootstrap, and rag-migrate registers it as
#                             the deployment's own Open WebUI client in RAG's admin (Apps and keys); nothing to paste
#                             The feedback import needs nothing either: Open WebUI's first user is the service account
#                             feedback-import@localhost, and the one-shot rag-openwebui-setup mints its API key after
#                             Open WebUI starts (password sign-in stays off) and keeps it while it works. A new key: delete
#                             <stack>_rag-secrets/openwebui-feedback/OpenWebUi__AdminApiKey and update the stack
#   RAG_*_IMAGE               other RAG images (default: the latest release's, from ghcr.io/thekim1, pinned by digest;
#                             a release's compose.portainer.yaml asset pins its own; add ghcr.io as a registry in
#                             Portainer if the packages are private)
#   COMPOSE_PROFILES=proxy    rag-proxy, nginx with your certificate in front of all five host names (M-17 C8): the
#                             gateway (UME_GATEWAY_HOST), its admin (UME_ADMIN_HOST), rag-api (UME_RAG_API_HOST),
#                             rag-admin (UME_RAG_ADMIN_HOST) and Open WebUI (UME_RAG_OPENWEBUI_HOST), each a name of its
#                             own, on UME_RAG_PROXY_BIND:UME_RAG_PROXY_PORT (0.0.0.0:443). UME_RAG_PROXY_CERTS_DIR
#                             (/etc/ume-rag/proxy-certs) is a host directory with tls.crt (full chain) and tls.key for
#                             every name (SAN or wildcard), readable by uid 101; renewing it: replace both files and
#                             restart rag-proxy. Then bind the other published ports to 127.0.0.1 (the *_BIND
#                             variables) and list the proxy as a trusted proxy in both admins (docs/portainer.md)
# Back up rag-secrets/.pepper, rag-secrets/keys/rag-blob-internal and rag-certs/data-protection.pfx with the database:
# without them a restored RAG database is unusable. This stack has no WAL archiving (pgBackRest): back up rag-postgres
# with pg_dump or volume snapshots.

@SECTION x
x-rag-certs: &rag-certs-mount
  type: volume
  source: rag-certs
  target: /run/certs
  read_only: true

x-rag-conf: &rag-conf-mount
  type: volume
  source: rag-config
  target: /run/config
  read_only: true

x-rag-secrets: &rag-secrets-mount
  type: volume
  source: rag-secrets
  target: /run/app-secrets
  read_only: true

@SECTION services
  rag-bootstrap:
    image: docker.io/alpine/openssl@sha256:59c5cb51e536d40587667229468b007a2a6cae1705397e59e5f7774c08b74029
    restart: "no"
    entrypoint: [/bin/sh, /config/bootstrap.sh]
    environment:
      UME_RAG_API_HOST: ${UME_RAG_API_HOST:?Set UME_RAG_API_HOST}
      UME_RAG_ADMIN_HOST: ${UME_RAG_ADMIN_HOST:-}
      # The TLS proxy's host names (profile proxy).
      UME_GATEWAY_HOST: ${UME_GATEWAY_HOST:-}
      UME_ADMIN_HOST: ${UME_ADMIN_HOST:-}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
      UME_RAG_API_GATEWAY_KEY: ${UME_RAG_API_GATEWAY_KEY:-}
      UME_RAG_ADMIN_GATEWAY_KEY: ${UME_RAG_ADMIN_GATEWAY_KEY:-}
      UME_RAG_WORKER_GATEWAY_KEY: ${UME_RAG_WORKER_GATEWAY_KEY:-}
      UME_RAG_OIDC_CLIENT_SECRET: ${UME_RAG_OIDC_CLIENT_SECRET:-}
      # For the checklist of what is still missing, which rag-bootstrap prints at the end of its log.
      UME_RAG_API_PUBLIC_URL: ${UME_RAG_API_PUBLIC_URL:-}
      UME_RAG_OPENWEBUI_HOST: ${UME_RAG_OPENWEBUI_HOST:-}
      UME_RAG_OPENWEBUI_OIDC_CLIENT_SECRET: ${UME_RAG_OPENWEBUI_OIDC_CLIENT_SECRET:-}
    configs:
      - {source: rag-bootstrap-script, target: /config/bootstrap.sh}
      - {source: rag-postgres-init, target: /config/postgres-init.sql}
      - {source: rag-postgres-hba, target: /config/pg_hba.conf}
      - {source: rag-postgres-conf, target: /config/postgresql.conf}
      - {source: rag-app-roles, target: /config/app-roles.sql}
      - {source: rag-proxy-conf-template, target: /config/nginx-proxy.conf.template}
    volumes:
      - rag-certs:/certs
      - rag-secrets:/secrets
      - rag-config:/conf
      - rag-blobs:/blobs
      - rag-openwebui-data:/openwebui-data
      - {type: volume, source: ume-certs, target: /gateway-certs, read_only: true}
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    network_mode: none

  rag-postgres:
    <<: *hardened
    image: ${RAG_POSTGRES_IMAGE:-ghcr.io/thekim1/ume-rag/postgres:0.5.1@sha256:0c52bc3d2e89dd8e5106db2a22ecd838776cbd3ebd8b489a4282611d00c8e3df}
    user: "999:999"
    restart: unless-stopped
    stop_grace_period: 60s
    tmpfs: [/tmp, "/var/run/postgresql:uid=999,gid=999,mode=0700"]
    shm_size: 1g
    cpus: 2.0
    mem_reservation: 2g
    mem_limit: 3g
    pids_limit: 512
    environment:
      POSTGRES_PASSWORD_FILE: /run/postgres-secrets/bootstrap_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
    # deploy/postgres/postgresql.conf (16 GB profile), without WAL archiving: this stack has no pgBackRest repository.
    command: [postgres, -c, config_file=/run/config/postgresql.conf, -c, archive_mode=off]
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
      - {<<: *rag-conf-mount, target: /docker-entrypoint-initdb.d, volume: {subpath: postgres-init}}
      - {<<: *rag-conf-mount, volume: {subpath: postgres}}
      - {<<: *rag-certs-mount, volume: {subpath: postgres}}
      - {<<: *rag-secrets-mount, target: /run/postgres-secrets, volume: {subpath: postgres}}
    depends_on:
      rag-bootstrap: {condition: service_completed_successfully}
    networks: [rag-data]
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, ragdb]
      interval: 10s
      timeout: 5s
      retries: 12

  rag-migrate:
    <<: *hardened
    image: ${RAG_MIGRATIONS_IMAGE:-ghcr.io/thekim1/ume-rag/migrations:0.5.1@sha256:72200977c37f52382d6c030305140bd6fe1363a0e4d570c4d824cbde56a930f2}
    user: "1654:1654"
    restart: "no"
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 128
    environment:
      DOTNET_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Migration__RolesSqlPath: /run/config/app-roles.sql
      Seed__Enabled: "false"
      SSL_CERT_FILE: /run/certs/ca.pem
    volumes:
      - {<<: *rag-conf-mount, volume: {subpath: migrations}}
      - {<<: *rag-certs-mount, volume: {subpath: migrations}}
      - {<<: *rag-secrets-mount, volume: {subpath: migrations}}
    depends_on:
      rag-postgres: {condition: service_healthy}
    networks: [rag-data]

  rag-api:
    <<: *hardened
    image: ${RAG_API_IMAGE:-ghcr.io/thekim1/ume-rag/api:0.5.1@sha256:5644aeca02e062b56373f1bb2f149c690d0b996aa689a845ed6c1d70a7ef8afa}
    user: "1654:1654"
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: 2.0
    mem_reservation: 384m
    mem_limit: 1g
    pids_limit: 512
    ports: ["${UME_RAG_API_BIND:-0.0.0.0}:${UME_RAG_API_PORT:-8543}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      # The Open WebUI feedback key, minted by rag-openwebui-setup into a directory of its own (M-17 C6).
      Security__ExtraSecretsDirectory: /run/openwebui-feedback
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/api.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/api.key
      Rag__Roles: knowledge,chat,mcp
      BlobStore__Root: /data/blobs/rag
      Gateway__BaseUrl: ${UME_RAG_GATEWAY_URL:-https://gateway:8443}
      # Citation links are absolute: the public host over HTTPS unless a URL is given (a port, a path).
      Knowledge__PublicBaseUrl: ${UME_RAG_API_PUBLIC_URL:-https://${UME_RAG_API_HOST}}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UME_OTEL_ENDPOINT:-}
      # Traces: a share of the requests that start here (#503); a parent's decision wins.
      OTEL_TRACES_SAMPLER: ${UME_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${UME_OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_SERVICE_NAME: rag-api
      SSL_CERT_FILE: /run/certs/ca.pem
      DOTNET_SHUTDOWNTIMEOUTSECONDS: "50"
      # Open WebUI (profile openwebui): its users are trusted for the deployment's own Open WebUI client, which rag-migrate
      # registers (identity §5.2); the feedback import from it (chat §13.3) runs every 15 minutes. rag-bootstrap writes the
      # secret file OpenWebUi__BaseUrl (the stack's rag-openwebui, while the profile is on) and rag-openwebui-setup
      # OpenWebUi__AdminApiKey; without both there is no import.
    volumes:
      - {<<: *rag-certs-mount, volume: {subpath: api}}
      - {<<: *rag-secrets-mount, volume: {subpath: api}}
      - {<<: *rag-secrets-mount, target: /run/openwebui-feedback, volume: {subpath: openwebui-feedback}}
      - {<<: *rag-secrets-mount, target: /run/keys, volume: {subpath: keys}}
      - {type: volume, source: rag-blobs, target: /data/blobs, read_only: true}
    depends_on:
      rag-postgres: {condition: service_healthy}
      rag-migrate: {condition: service_completed_successfully}
      gateway: {condition: service_started}
    networks:
      rag-edge: {}
      rag-data: {}
      llm: {gw_priority: 1}
    healthcheck:
      test: [CMD, dotnet, Ume.Rag.Api.dll, --health-check]
      interval: 30s        # a .NET process start each (~80 ms CPU, B-27 / #504)
      timeout: 10s
      start_period: 30s
      start_interval: 5s   # while starting, so up --wait and rolling updates don't wait 30 s
      retries: 3

  rag-admin:
    <<: *hardened
    image: ${RAG_ADMIN_IMAGE:-ghcr.io/thekim1/ume-rag/admin:0.5.1@sha256:38c9e6de3a2423e1d2802260ffbe7fac6da44d6aba8300685e357e4b003c7b9f}
    user: "1654:1654"
    restart: unless-stopped
    stop_grace_period: 60s
    cpus: 1.0
    mem_reservation: 256m
    mem_limit: 512m
    pids_limit: 256
    ports: ["${UME_RAG_ADMIN_BIND:-0.0.0.0}:${UME_RAG_ADMIN_PORT:-9543}:8443"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      DataProtection__CertificatePath: /run/certs/data-protection.pfx
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/admin.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/admin.key
      # The gateway's identity provider by default, with RAG's own client (never the gateway's).
      Oidc__Authority: ${UME_RAG_OIDC_AUTHORITY:-${UME_OIDC_AUTHORITY}}
      Oidc__ClientId: ${UME_RAG_OIDC_CLIENT_ID:-ume-rag-admin}
      Oidc__RoleClaim: ${UME_RAG_OIDC_ROLE_CLAIM:-roles}
      Oidc__DepartmentClaim: ${UME_RAG_OIDC_DEPARTMENT_CLAIM:-departmentCodes}
      Oidc__TeamClaim: ${UME_RAG_OIDC_TEAM_CLAIM:-teamCodes}
      Oidc__GroupClaim: ${UME_RAG_OIDC_GROUP_CLAIM:-groups}
      Oidc__ExtraScopes__0: ${UME_RAG_OIDC_EXTRA_SCOPE:-email}
      Oidc__RoleGroups__rag-platform-admin: ${UME_RAG_OIDC_GROUPS_PLATFORM_ADMIN:-}
      Oidc__RoleGroups__rag-department-admin: ${UME_RAG_OIDC_GROUPS_DEPARTMENT_ADMIN:-}
      Oidc__RoleGroups__rag-pipeline-editor: ${UME_RAG_OIDC_GROUPS_PIPELINE_EDITOR:-}
      Oidc__RoleGroups__rag-reviewer: ${UME_RAG_OIDC_GROUPS_REVIEWER:-}
      Oidc__RoleGroups__rag-viewer: ${UME_RAG_OIDC_GROUPS_VIEWER:-}
      Oidc__TenantId: ${UME_RAG_OIDC_TENANT_ID:-}
      Oidc__RefuseGuests: ${UME_RAG_OIDC_REFUSE_GUESTS:-true}
      BlobStore__Root: /data/blobs/rag
      Gateway__BaseUrl: ${UME_RAG_GATEWAY_URL:-https://gateway:8443}
      # The gateway admin API's Integration API (/integration/v1), the cost and budget read-back (#580); empty: none.
      Gateway__IntegrationApiUrl: ${UME_RAG_GATEWAY_INTEGRATION_API_URL:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UME_OTEL_ENDPOINT:-}
      # Traces: a share of the requests that start here (#503); a parent's decision wins.
      OTEL_TRACES_SAMPLER: ${UME_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${UME_OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_SERVICE_NAME: rag-admin
      # The organisation the admin UI names in its header and sign-in texts; empty names none (#544).
      Admin__OrganisationName: ${UME_ORGANISATION_NAME-Umeå kommun}
      # rag-api's public address, shown to a platform admin who connects an app ("How to connect", admin design §5.9.1).
      Admin__ApiPublicUrl: ${UME_RAG_API_PUBLIC_URL:-https://${UME_RAG_API_HOST}}
      SSL_CERT_FILE: /run/certs/ca.pem
      DOTNET_SHUTDOWNTIMEOUTSECONDS: "50"
    volumes:
      - {<<: *rag-certs-mount, volume: {subpath: admin}}
      - {<<: *rag-secrets-mount, volume: {subpath: admin}}
      - {<<: *rag-secrets-mount, target: /run/keys, volume: {subpath: keys}}
      - rag-blobs:/data/blobs
    depends_on:
      rag-postgres: {condition: service_healthy}
      rag-migrate: {condition: service_completed_successfully}
    networks:
      rag-edge: {}
      rag-data: {}
      llm: {gw_priority: 1}
    healthcheck:
      test: [CMD, dotnet, Ume.Rag.AdminApi.dll, --health-check]
      interval: 30s        # a .NET process start each (~80 ms CPU, B-27 / #504)
      timeout: 10s
      start_period: 30s
      start_interval: 5s   # while starting, so up --wait and rolling updates don't wait 30 s
      retries: 3

  rag-worker:
    <<: *hardened
    image: ${RAG_WORKER_IMAGE:-ghcr.io/thekim1/ume-rag/worker:0.5.1@sha256:38ff11c71d98d390e8e523eb1ce4723468c7ee4bb714c0383d8ce47961afc596}
    user: "1654:1654"
    restart: unless-stopped
    stop_grace_period: 120s
    cpus: 1.5
    mem_reservation: 512m
    mem_limit: 1.5g
    pids_limit: 512
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_GCHeapHardLimitPercent: "0x4B"
      Security__SecretsDirectory: /run/app-secrets
      Kestrel__Endpoints__Https__Url: https://+:8443
      Kestrel__Endpoints__Https__Certificate__Path: /run/certs/worker.crt
      Kestrel__Endpoints__Https__Certificate__KeyPath: /run/certs/worker.key
      Parser__BaseUrl: https://rag-parser:8000
      # ClamAv__Mode is a secret file from rag-bootstrap: on with the clamav profile (rag-clamav runs), else off, which
      # stores files without a malware scan, marked so (#535). The worker reads it at start; the profiles here make a
      # change of them recreate the worker after rag-bootstrap has written the new mode.
      UME_RAG_PROFILES: ${COMPOSE_PROFILES:-}
      ClamAv__Host: rag-clamav
      ClamAv__Port: "3310"
      BlobStore__Root: /data/blobs/rag
      TMPDIR: /data/blobs/spool
      Gateway__BaseUrl: ${UME_RAG_GATEWAY_URL:-https://gateway:8443}
      Crawl__AllowedPrivateRanges: ${UME_RAG_CRAWL_ALLOW:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${UME_OTEL_ENDPOINT:-}
      # Traces: a share of the requests that start here (#503); a parent's decision wins.
      OTEL_TRACES_SAMPLER: ${UME_OTEL_TRACES_SAMPLER:-parentbased_traceidratio}
      OTEL_TRACES_SAMPLER_ARG: ${UME_OTEL_TRACES_SAMPLER_ARG:-0.1}
      OTEL_SERVICE_NAME: rag-worker
      SSL_CERT_FILE: /run/certs/ca.pem
    volumes:
      - {<<: *rag-certs-mount, volume: {subpath: worker}}
      - {<<: *rag-secrets-mount, volume: {subpath: worker}}
      - {<<: *rag-secrets-mount, target: /run/keys, volume: {subpath: keys}}
      - rag-blobs:/data/blobs
    depends_on:
      rag-postgres: {condition: service_healthy}
      rag-migrate: {condition: service_completed_successfully}
      # Started, not healthy: the parser warms up for minutes and freshclam's first download takes a while.
      rag-parser: {condition: service_started}
      # Only with the clamav profile.
      rag-clamav: {condition: service_started, required: false}
    # rag-crawl holds the default route (the Internet); llm reaches the gateway.
    networks:
      rag-data: {}
      llm: {}
      rag-ingestion: {}
      rag-parser: {}
      rag-render: {}
      rag-crawl: {gw_priority: 1}
    healthcheck:
      test: [CMD, dotnet, Ume.Rag.Worker.dll, --health-check]
      interval: 30s        # a .NET process start each (~80 ms CPU, B-27 / #504)
      timeout: 10s
      start_period: 30s
      start_interval: 5s   # while starting, so up --wait and rolling updates don't wait 30 s
      retries: 3

  rag-parser:
    <<: *hardened
    image: ${RAG_PARSER_IMAGE:-ghcr.io/thekim1/ume-rag/parser:0.5.1@sha256:1c7ed8bdcb1faeb75d0dd579fad299aea74d463e427397ef856c22cce98e5b47}
    user: "10001:10001"
    restart: unless-stopped
    tmpfs: ["/tmp:size=1g"]
    cpus: 2.0
    mem_reservation: 2g
    mem_limit: 3.5g
    pids_limit: 256
    environment:
      PARSER_WORKERS: "1"
      PARSER_THREADS: "2"
      PARSER_SLOT_MAX_RSS_MB: "2200"
      PARSER_TLS_CERT_FILE: /run/certs/parser.crt
      PARSER_TLS_KEY_FILE: /run/certs/parser.key
    volumes:
      - {<<: *rag-certs-mount, volume: {subpath: parser}}
    depends_on:
      rag-bootstrap: {condition: service_completed_successfully}
    # Internal network only: no egress at all (parser design §11).
    networks: [rag-parser]

  # The malware scan. Add clamav to COMPOSE_PROFILES; without it the worker stores files unscanned, marked so.
  rag-clamav:
    <<: *hardened
    profiles: [clamav]
    image: ${RAG_CLAMAV_IMAGE:-ghcr.io/thekim1/ume-rag/clamav:0.5.1@sha256:134a3fb0fcbc0ac6d3b7e09329383417fce1c38864e107eb186339700d42be57}
    user: "1000:1000"
    restart: unless-stopped
    cpus: 1.0
    mem_reservation: 1.2g
    mem_limit: 1.5g
    pids_limit: 128
    volumes:
      - rag-clamav-db:/var/lib/clamav
    # rag-mirror: freshclam's download; rag-ingestion: the worker's INSTREAM on 3310.
    networks: [rag-ingestion, rag-mirror]

  # Chromium for JavaScript-rendered pages (connectors design §8.3). Off by default: add render to COMPOSE_PROFILES.
  # Chromium's sandbox needs user namespaces, which Docker's default seccomp profile blocks, and Portainer cannot read
  # images/renderer/seccomp.json from a file, so this service runs without Docker's seccomp filter (Chromium's own
  # sandbox stays on). Without it, the worker refuses rendering and indexes the pages' HTML as served.
  rag-renderer:
    <<: *hardened
    profiles: [render]
    image: ${RAG_RENDERER_IMAGE:-ghcr.io/thekim1/ume-rag/renderer:0.5.1@sha256:c5b3c09c307005654a3fbcf535aeafbc677487354ae853389dfa487b1e4f32b9}
    user: "10002:10002"
    restart: unless-stopped
    security_opt: [no-new-privileges:true, seccomp=unconfined]
    init: true
    tmpfs: ["/tmp:size=512m"]
    cpus: 2.0
    mem_reservation: 256m
    mem_limit: 2g
    pids_limit: 512
    # The image reads its secret path only from the environment: read it from the volume, then start as the image does.
    entrypoint: [/bin/sh, -c, 'UME_RAG_RENDER_WS_PATH="$$(cat /run/render/ws-path)" exec /srv/renderer/start.sh']
    volumes:
      - {type: volume, source: rag-secrets, target: /run/render, read_only: true, volume: {subpath: renderer}}
    depends_on:
      rag-bootstrap: {condition: service_completed_successfully}
    networks: [rag-render]

  rag-openwebui:
    # Open WebUI as the users' chat (compose.openwebui.yaml in a Compose deployment; chat design §14), with the profile
    # openwebui. Plain HTTP for a TLS proxy in front; it calls rag-api inside the stack, trusting RAG's CA through
    # openwebui/ca.pem (the public CAs, RAG's and the gateway's, from rag-bootstrap).
    <<: *hardened
    profiles: [openwebui]
    # The pin also binds rag-openwebui-setup, which forges an Open WebUI session token from its internals (the user and auth
    # tables, session_stamp, utils/auth.py's claims; M-17 C6): before the digest moves, deploy/tests/portainer-boot.sh must
    # pass with the new image (it checks the minted feedback key).
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded}
    user: "1000:1000"
    restart: unless-stopped
    tmpfs: [/tmp]
    cpus: 1.0
    cpu_shares: 512
    mem_reservation: 512m
    mem_limit: 1.5g
    pids_limit: 256
    ports: ["${UME_RAG_OPENWEBUI_BIND:-127.0.0.1}:${UME_RAG_OPENWEBUI_PORT:-3000}:8080"]
    # Open WebUI takes the user-JWT secret, the service account's password and its key for rag-api only from its
    # environment: read them from the volume, then start as the image does (bash start.sh in /app/backend).
    entrypoint: [/bin/bash, -c, 'export FORWARD_USER_INFO_HEADER_JWT_SECRET="$$(cat /run/owui-secrets/jwt-secret)" WEBUI_ADMIN_PASSWORD="$$(cat /run/owui-secrets/admin-password)" OPENAI_API_KEYS="$$(cat /run/owui-secrets/rag-api-key)"; exec bash start.sh']
    environment:
      HOME: /tmp
      DATA_DIR: /data
      SSL_CERT_FILE: /run/owui-secrets/ca.pem
      REQUESTS_CA_BUNDLE: /run/owui-secrets/ca.pem
      WEBUI_SECRET_KEY_FILE: /run/owui-secrets/webui_secret_key
      WEBUI_URL: https://${UME_RAG_OPENWEBUI_HOST:-localhost}
      WEBUI_SESSION_COOKIE_SECURE: "true"
      WEBUI_AUTH_COOKIE_SECURE: "true"
      OFFLINE_MODE: "true"
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: https://rag-api:8443/v1
      OPENAI_API_CONFIGS: '{"0":{"headers":{"X-Rag-Owui-Message-Id":"{{MESSAGE_ID}}","X-Rag-Owui-User-Message-Id":"{{USER_MESSAGE_ID}}"}}}'
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      ENABLE_DIRECT_CONNECTIONS: "false"
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_CONTEXT_COMPACTION: "false"
      BYPASS_EMBEDDING_AND_RETRIEVAL: "true"
      DEFAULT_MODEL_METADATA: '{"capabilities":{"builtin_tools":false}}'
      ENABLE_WEB_SEARCH: "false"
      ENABLE_CODE_EXECUTION: "false"
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_IMAGE_GENERATION: "false"
      USER_PERMISSIONS_FEATURES_WEB_SEARCH: "false"
      USER_PERMISSIONS_FEATURES_CODE_INTERPRETER: "false"
      USER_PERMISSIONS_FEATURES_IMAGE_GENERATION: "false"
      USER_PERMISSIONS_CHAT_FILE_UPLOAD: "false"
      USER_PERMISSIONS_CHAT_WEB_UPLOAD: "false"
      USER_PERMISSIONS_CHAT_SYSTEM_PROMPT: "false"
      USER_PERMISSIONS_CHAT_PARAMS: "false"
      ENABLE_ADMIN_CHAT_ACCESS: "false"
      ENABLE_ADMIN_EXPORT: "false"
      WEBUI_BANNERS: '[{"id":"ume-rag-input","type":"warning","content":"Skriv inte in sekretessbelagda uppgifter eller känsliga personuppgifter.","dismissible":false,"timestamp":1793318400}]'
      ENABLE_API_KEYS: "true"
      ENABLE_API_KEYS_ENDPOINT_RESTRICTIONS: "true"
      API_KEYS_ALLOWED_ENDPOINTS: /api/v1/evaluations/feedbacks/list,/api/v1/evaluations/feedback
      USER_PERMISSIONS_FEATURES_API_KEYS: "false"
      # The feedback service account (Open WebUI's first user, never a person); its password comes from the volume.
      WEBUI_ADMIN_EMAIL: feedback-import@localhost
      WEBUI_ADMIN_NAME: Feedback import
      ENABLE_LOGIN_FORM: "false"
      ENABLE_PASSWORD_AUTH: "false"
      DEFAULT_USER_ROLE: user
      ENABLE_SIGNUP: "false"
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "false"
      OAUTH_PROVIDER_NAME: ${UME_RAG_OPENWEBUI_OIDC_PROVIDER_NAME:-Umeå kommun}
      OAUTH_CLIENT_ID: ${UME_RAG_OPENWEBUI_OIDC_CLIENT_ID:-open-webui}
      OAUTH_CLIENT_SECRET: ${UME_RAG_OPENWEBUI_OIDC_CLIENT_SECRET:-}
      OPENID_PROVIDER_URL: ${UME_RAG_OPENWEBUI_OIDC_PROVIDER_URL:-${UME_OIDC_AUTHORITY:-https://keycloak.invalid/realms/ume}/.well-known/openid-configuration}
      OPENID_REDIRECT_URI: https://${UME_RAG_OPENWEBUI_HOST:-localhost}/oauth/oidc/login/callback
    volumes:
      - rag-openwebui-data:/data
      - {type: volume, source: rag-secrets, target: /run/owui-secrets, read_only: true, volume: {subpath: openwebui}}
    depends_on:
      rag-bootstrap: {condition: service_completed_successfully}
      rag-api: {condition: service_started}
    networks: [rag-edge]

  rag-proxy:
    # Profile proxy (M-17 C8, Decisions "Deploy configuration" D9): TLS for the five host names with the operator's
    # certificate, re-encrypting to the services and verifying them against the internal CAs. rag-bootstrap writes its
    # nginx.conf (deploy/proxy/nginx.portainer.conf.template) and the two CA certificates into rag-config/proxy.
    <<: *hardened
    profiles: [proxy]
    # nginx 1.31.6, as the browser tests' fixture site (src/Ume.Rag.AppHost); the index digest.
    image: ${RAG_PROXY_IMAGE:-docker.io/nginxinc/nginx-unprivileged:1.31.6-alpine@sha256:884e0b7f42f303641b0f4e78755aea647521dca0b89ca3be7992ad78b5c07434}
    user: "101:101"
    restart: unless-stopped
    command: [nginx, -c, /etc/nginx/ume/nginx.conf, -g, "daemon off;"]
    cpus: 0.5
    mem_limit: 128m
    pids_limit: 128
    ports: ["${UME_RAG_PROXY_BIND:-0.0.0.0}:${UME_RAG_PROXY_PORT:-443}:8443"]
    volumes:
      - {type: volume, source: rag-config, target: /etc/nginx/ume, read_only: true, volume: {subpath: proxy}}
      # The operator's certificate: a host directory, not created when missing (the container then does not start).
      - type: bind
        source: ${UME_RAG_PROXY_CERTS_DIR:-/etc/ume-rag/proxy-certs}
        target: /run/proxy-certs
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      rag-bootstrap: {condition: service_completed_successfully}
      gateway: {condition: service_started}
      adminapi: {condition: service_started}
      rag-api: {condition: service_started}
      rag-admin: {condition: service_started}
    networks: [edge, rag-edge]

  rag-openwebui-setup:
    # One-shot, profile openwebui (M-17 C6): the feedback service account's API key for rag-api's import, minted with a
    # short session token signed with Open WebUI's secret key, since password sign-in is off (deploy/openwebui/
    # feedback-key-setup.py). It runs Open WebUI's own image as Open WebUI's user, reads the account from its store and
    # writes only rag-secrets/openwebui-feedback, which rag-api reads; a key that still works is kept.
    <<: *hardened
    profiles: [openwebui]
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.12.5@sha256:03443b8de6b617da9d900edd09b4bf1cb0ddbfdcba6afb42c548336a0b821ded}
    user: "1000:1000"
    restart: "no"
    entrypoint: [python3, -I, /config/feedback-key-setup.py]
    environment:
      OWUI_URL: http://rag-openwebui:8080
      WEBUI_ADMIN_EMAIL: feedback-import@localhost
    configs:
      - {source: rag-openwebui-setup-script, target: /config/feedback-key-setup.py}
    volumes:
      # The store's WAL needs its directory writable even for a read-only connection.
      - rag-openwebui-data:/data
      - {type: volume, source: rag-secrets, target: /run/owui-secrets, read_only: true, volume: {subpath: openwebui}}
      - {type: volume, source: rag-secrets, target: /run/feedback, volume: {subpath: openwebui-feedback}}
    depends_on:
      rag-openwebui: {condition: service_started}
    networks: [rag-edge]

@SECTION configs
  rag-bootstrap-script:
    content: |
      @INCLUDE portainer/bootstrap.sh
  rag-postgres-init:
    content: |
      @INCLUDE postgres/init.sql
  rag-postgres-hba:
    content: |
      @INCLUDE postgres/pg_hba.conf
  rag-postgres-conf:
    content: |
      @INCLUDE postgres/postgresql.conf
  rag-app-roles:
    content: |
      @INCLUDE postgres/app-roles.sql
  rag-openwebui-setup-script:
    content: |
      @INCLUDE openwebui/feedback-key-setup.py
  rag-proxy-conf-template:
    content: |
      @INCLUDE proxy/nginx.portainer.conf.template

@SECTION networks
  rag-edge: {driver: bridge}
  rag-data: {driver: bridge, internal: true}
  rag-ingestion: {driver: bridge, internal: true}
  rag-parser: {driver: bridge, internal: true}
  rag-render: {driver: bridge, internal: true}
  rag-crawl: {driver: bridge}
  rag-mirror: {driver: bridge}

@SECTION volumes
  rag-postgres-data:
  rag-openwebui-data:
  rag-certs:
  rag-secrets:
  rag-config:
  rag-blobs:
  rag-clamav-db:
